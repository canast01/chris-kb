-size:16px">Monitor quorum lost</text></g><g class="RQ=="><g class="shape" ><rect x="394" y="0" width="244" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="516" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Slow requests / high latency</text></g><g class="QTE="><g class="shape" ><rect x="69" y="693" width="64" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="731.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">A1</text></g><g class="QTI="><g class="shape" ><rect x="374" y="756" width="284" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="516" y="794.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Replace OSD disk — see OSD Down</text></g><g class="QTM="><g class="shape" ><rect x="304" y="630" width="423" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="515.5" y="668.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Restart OSD daemon and check OOM or network issue</text></g><g class="QjE="><g class="shape" ><rect x="70" y="949" width="62" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="987.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">B1</text></g><g class="QjI="><g class="shape" ><rect x="339" y="1008" width="353" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="515.5" y="1046.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="515.5" dy="0">Bring OSD back up or reweight to 0 — see PG</tspan><tspan x="515.5" dy="18.5">Degraded / Undersized / Stuck</tspan></text></g><g class="QjM="><g class="shape" ><rect x="347" y="882" width="338" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="516" y="920.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Run ceph pg repair and check CRUSH map</text></g><g class="QzE="><g class="shape" ><rect x="69" y="1229" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1267.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">C1</text></g><g class="QzI="><g class="shape" ><rect x="330" y="1292" width="372" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="516" y="1330.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="516" dy="0">Check PG state — may be inactive; resolve OSD</tspan><tspan x="516" dy="18.5">first — see OSD Down</tspan></text></g><g class="QzM="><g class="shape" ><rect x="318" y="1150" width="395" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="515.5" y="1188.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="515.5" dy="0">Run rados stat on object and check for deletion or</tspan><tspan x="515.5" dy="18.5">naming mismatch</tspan></text></g><g class="RDE="><g class="shape" ><rect x="69" y="1509" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1547.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">D1</text></g><g class="RDI="><g class="shape" ><rect x="317" y="1576" width="397" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="515.5" y="1614.5" fill="#0A0F25" class="text-bold fill-N1" s