iddle;font-size:16px"><tspan x="1453.5" dy="0">Step 4: Create distributed device</tspan><tspan x="1453.5" dy="18.5">distributed-device create --geometry raid-1 ...</tspan></text></g><g class="c3RlcDU="><g class="shape" ><rect x="1738" y="0" width="361" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1918.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1918.5" dy="0">Step 5: Create virtual volume</tspan><tspan x="1918.5" dy="18.5">virtual-volume create --distributed-device ...</tspan></text></g><g class="c3RlcDY="><g class="shape" ><rect x="2199" y="0" width="303" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2350.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2350.5" dy="0">Step 6: Add to storage view</tspan><tspan x="2350.5" dy="18.5">storage-view add-virtual-volumes ...</tspan></text></g><g class="c3RlcDc="><g class="shape" ><rect x="2602" y="0" width="220" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2712" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2712" dy="0">Step 7: Host sees volume</tspan><tspan x="2712" dy="18.5">Rescan HBAs on host</tspan></text></g><g class="KHN0ZXAxIC0mZ3Q7IHN0ZXAyKVswXQ=="><marker id="mk-d2-1299818018-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 344 41 C 382 41 402 41 438 41" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1299818018-3488378134)" mask="url(#d2-1299818018)" /></g><g class="KHN0ZXAyIC0mZ3Q7IHN0ZXAzKVswXQ=="><path d