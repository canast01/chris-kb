6667">Do NOT manually remove</tspan><tspan x="1013.5" dy="17.666667">Open Dell support case</tspan></text></g><g class="RQ=="><g class="shape" ><rect x="922" y="30" width="184" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1014" y="68.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1014" dy="0">Write failure</tspan><tspan x="1014" dy="18.5">on quota directory?</tspan></text></g><g class="Rg=="><g class="shape" ><rect x="1226" y="200" width="250" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1351" y="238.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1351" dy="0">isi quota quotas list</tspan><tspan x="1351" dy="18.5">Raise hard limit or free space</tspan></text></g><g class="Rw=="><g class="shape" ><rect x="1261" y="20" width="180" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1351" y="58.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1351" dy="0">SmartConnect DNS</tspan><tspan x="1351" dy="18.5">not resolving?</tspan></text></g><g class="SA=="><g class="shape" ><rect x="1576" y="182" width="254" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1703" y="220.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1703" dy="0">Verify NS delegation</tspan><tspan x="1703" dy="17.666667">isi network pools list</tspan><tspan x="1703" dy="17.666667">nslookup SmartConnect zone</tspan></text></g><g class="SQ=="><g class="shape" ><rect x="1635" y="10" width="136" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1703" y="48.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:m