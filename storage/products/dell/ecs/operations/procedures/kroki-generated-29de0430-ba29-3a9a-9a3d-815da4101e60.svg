 x="406" y="209" width="281" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="546.5" y="247.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="546.5" dy="0">Enable Object Lock at</tspan><tspan x="546.5" dy="18.5">bucket creation (cannot add later</tspan></text></g><g class="VVNS"><g class="shape" ><rect x="826" y="160" width="312" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="982" y="198.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="982" dy="0">Create Object User</tspan><tspan x="982" dy="17.666667">ecscli user create</tspan><tspan x="982" dy="17.666667">--namespace --name svc-&lt;app&gt;-&lt;env&gt;</tspan></text></g><g class="S0VZ"><g class="shape" ><rect x="1246" y="168" width="339" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1415.5" y="206.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1415.5" dy="0">Generate Access Key + Secret Key</tspan><tspan x="1415.5" dy="18.5">(shown once — store in vault immediately</tspan></text></g><g class="UE9M"><g class="shape" ><rect x="1685" y="168" width="257" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1813.5" y="206.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1813.5" dy="0">Apply Bucket Policy</tspan><tspan x="1813.5" dy="18.5">least-privilege s3 actions only</tspan></text></g><g class="TEM="><g class="shape" ><rect x="106" y="338" width="62" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="137" y="376.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">LC</text></g><g class="TENQ"><g class="shape" ><rect x="374" y="371" width="344" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="546" y="409.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="546" dy="0">Add lifecycle policy</tspan><tspan x="546" dy="18.5">NoncurrentVersionExpiration + MPU abort</tspan></text></g><g class="VEVTVA=="><g class="shape" ><rect x="827" y="330" width="311" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="982.5" y="368.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="982.5" dy="0">Functional test:</tspan><tspan x="982.5" dy="18.5">aws s3 ls s3://bucket --endpoint-url ...</tspan></text></g><g class="RE9ORQ=="><g class="shape" ><rect x="1293" y="338" width="245" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1415.5" y="376.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Bucket ready for application</text></g><g class="KFNUQVJUIC0mZ3Q7IE5TKVswXQ=="><marker id="mk-d2-513925701-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 276 49 C 314 49 341.200012 49 406 49" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-513925701-3488378134)" mask="url(#d2-513925701)" /></g><g class="KE5TIC0mZ3Q7IEJLVClbMF0="><path d="M 684 49 C 750.799988 49 778 49 814 49" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-513925701-3488378134)" mask="url(#d2-513925701)" /></g><g class="KExPQ0sgLSZndDsgT0JKKVswXQ=="><path d="M 181.454073 218.413143 C 295.100006 243.197006 340.299988 249.5 401.5 24