/g><text x="346.5" y="322.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="346.5" dy="0">symevent list -type rdf</tspan><tspan x="346.5" dy="18.5">Find interruption event</tspan></text></g><g class="Rg=="><g class="shape" ><rect x="256" y="142" width="181" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="346.5" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="346.5" dy="0">Check RF ports</tspan><tspan x="346.5" dy="18.5">symcfg list -rdfg all</tspan></text></g><g class="Rw=="><g class="shape" ><rect x="556" y="426" width="348" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="730" y="464.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="730" dy="0">ping -c 20 dr-site-ip</tspan><tspan x="730" dy="18.5">Average RTT × 2 = host write latency added</tspan></text></g><g class="SA=="><g class="shape" ><rect x="319" y="647" width="54" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="346" y="685.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">H</text></g><g class="SQ=="><g class="shape" ><rect x="610" y="568" width="240" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="730" y="606.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="730" dy="0">Notify network team</tspan><tspan x="730" dy="18.5">RTT exceeds SRDF/S budget</tspan></text></g><g class="Sg=="><g class="shape" ><rect x="633" y="710" width="195" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="730.5" y="748.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><