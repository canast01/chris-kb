onitor: puredrive list --progress</tspan></text></g><g class="RQ=="><g class="shape" ><rect x="893" y="316" width="137" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="961.5" y="354.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="961.5" dy="0">Second drive</tspan><tspan x="961.5" dy="18.5">also failed?</tspan></text></g><g class="Rg=="><g class="shape" ><rect x="1208" y="387" width="252" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1334" y="425.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1334" dy="0">P1 case immediately</tspan><tspan x="1334" dy="17.666667">Do NOT pull any drive</tspan><tspan x="1334" dy="17.666667">Await Pure Support guidance</tspan></text></g><g class="Rw=="><g class="shape" ><rect x="1206" y="229" width="256" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1334" y="267.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1334" dy="0">Open P2 case</tspan><tspan x="1334" dy="17.666667">Schedule drive replacement</tspan><tspan x="1334" dy="17.666667">Array degraded but protected</tspan></text></g><g class="SA=="><g class="shape" ><rect x="816" y="158" width="290" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="961" y="196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="961" dy="0">Open P2 case — drive may fail soon</tspan><tspan x="961" dy="17.666667">Monitor closely</tspan><tspan x="961" dy="17.666667">Purity may proactively evict</tspan></text></g><g class="SQ=="><g class="shape" ><rect x="818" y="0" width="287" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><t