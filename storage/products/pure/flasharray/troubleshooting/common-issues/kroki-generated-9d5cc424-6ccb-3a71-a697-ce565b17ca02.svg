ore network path</tspan><tspan x="915" dy="18.5">(routing / VLAN / firewall</tspan></text></g><g class="RQ=="><g class="shape" ><rect x="810" y="162" width="211" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="915.5" y="200.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="915.5" dy="0">Check mediator</tspan><tspan x="915.5" dy="18.5">purepod list --mediator</tspan></text></g><g class="Rg=="><g class="shape" ><rect x="1124" y="162" width="122" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1185" y="200.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1185" dy="0">Mediator</tspan><tspan x="1185" dy="18.5">reachable?</tspan></text></g><g class="Rw=="><g class="shape" ><rect x="1346" y="308" width="293" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1492.5" y="346.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1492.5" dy="0">Verify HTTPS outbound port 443</tspan><tspan x="1492.5" dy="17.666667">to mediator IP from both arrays</tspan><tspan x="1492.5" dy="17.666667">Check proxy: purearray list --proxy</tspan></text></g><g class="SA=="><g class="shape" ><rect x="1739" y="308" width="265" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1871.5" y="346.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1871.5" dy="0">Note: replication continues</tspan><tspan x="1871.5" dy="17.666667">without mediator if inter-array</tspan><tspan x="1871.5" dy="17.666667">link is healthy</tspan></text></g><g class="SQ=="><g class="shape" ><rect x="1415" y="83" width="155" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1492.5" y="121.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1492.5" dy="0">Pod paused</tspan><tspan x="1492.5" dy="18.5">on both arrays?</tspan></text></g><g class="Sg=="><g class="shape" ><rect x="1762" y="150" width="219" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1871.5" y="188.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1871.5" dy="0">Do NOT force-promote</tspan><tspan x="1871.5" dy="17.666667">without Pure Support</tspan><tspan x="1871.5" dy="17.666667">Contact Pure Support P1</tspan></text></g><g class="Sw=="><g class="shape" ><rect x="1764" y="8" width="215" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1871.5" y="46.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1871.5" dy="0">Check replica-link state</tspan><tspan x="1871.5" dy="18.5">purepod replica-link list</tspan></text></g><g class="TA=="><g class="shape" ><rect x="2104" y="0" width="277" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2242.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2242.5" dy="0">Resume if manually paused</tspan><tspan x="2242.5" dy="17.666667">purepod replica-link resume</tspan><tspan x="2242.5" dy="17.666667">--remote array --remote-pod pod</tspan></text></g><g class="KEEgLSZndDsgQilbMF0="><marker id="mk-d2-4150071301-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 213 274 C 251 274 271 274 307 274" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-widt