		.d2-1702324253 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Uw=="><g class="shape" ><rect x="0" y="252" width="201" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="290.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">What is the symptom?</text></g><g class="QQ=="><g class="shape" ><rect x="413" y="504" width="210" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="518" y="542.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Host volume not visible</text></g><g class="Qg=="><g class="shape" ><rect x="390" y="378" width="255" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="416.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Drive failure / RAID rebuilding</text></g><g class="Qw=="><g class="shape" ><rect x="401" y="252" width="233" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="290.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Replication session behind</text></g><g class="RA=="><g class="shape" ><rect x="389" y="126" width="257" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="164.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Alert storm from phone-home</text></g><g class="RQ=="><g class="shape" ><rect x="392" y="0" width="252" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="518" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Purity upgrade failed or hung</text></g><g class="QTE="><g class="shape" ><rect x="69" y="697" width="64" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="735.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">A1</text></g><g class="QTI="><g class="shape" ><rect x="325" y="756" width="385" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="794.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="517.5" dy="0">Connect volume to host group — see Volume Not</tspan><tspan x="517.5" dy="18.5">Visible on Host After Provisioning</tspan></text></g><g class="QTM="><g class="shape" ><rect x="315" y="630" width="406" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="518" y="668.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Check initiator registration and rescan HBA on host</text></g><g class="QjE="><g class="shape" ><rect x="70" y="977" width="62" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="1015.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">B1</text></g><g class="QjI="><g class="shape" ><rect x="332" y="1040" width="371" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="1078.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="517.5" dy="0">P1 case immediately — do not pull drives — see</tspan><tspan x="517.5" dy="18.5">Drive Failure and Rebuild</tspan></text></g><g class="QjM="><g class="shape" ><rect x="321" y="898" width="393" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="936.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="517.5" dy="0">Single drive — open P2 case; monitor rebuild with</tspan><tspan x="517.5" dy="18.5">puredrive list</tspan></text></g><g class="QzE="><g class="shape" ><rect x="69" y="1249" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1287.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">C1</text></g><g class="QzI="><g class="shape" ><rect x="314" y="1308" width="407" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="1346.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="517.5" dy="0">Restore network path; pod resyncs automatically —</tspan><tspan x="517.5" dy="18.5">see ActiveCluster Pod Out of Sync</tspan></text></g><g class="QzM="><g class="shape" ><rect x="301" y="1182" width="433" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="1220.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Check mediator reachability and bandwidth saturation</text></g><g class="RDE="><g class="shape" ><rect x="69" y="1529" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1567.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">D1</text></g><g class="RDI="><g class="shape" ><rect x="326" y="1592" width="384" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="518" y="1630.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="518" dy="0">Address hardware or capacity alerts — see Array</tspan><tspan x="518" dy="18.5">Reporting High Latency</tspan></text></g><g class="RDM="><g class="shape" ><rect x="323" y="1450" width="390" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="518" y="1488.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="518" dy="0">Check Pure1 cloud connectivity and phone-home</tspan><tspan x="518" dy="18.5">proxy settings</tspan></text></g><g class="RTE="><g class="shape" ><rect x="70" y="1801" width="61" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1839.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">E1</text></g><g class="RTI="><g class="shape" ><rect x="311" y="1860" width="413" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="1898.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="517.5" dy="0">Run purearray upgrade --check and resolve blockers</tspan><tspan x="517.5" dy="18.5">— see Purity Upgrade Hangs or Fails</tspan></text></g><g class="RTM="><g class="shape" ><rect x="309" y="1734" width="417" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="517.5" y="1772.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Contact Pure Support if no progress after 30 minutes</text></g><g class="KFMgLSZndDsgQSlbMF0="><marker id="mk-d2-1702324253-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" ma