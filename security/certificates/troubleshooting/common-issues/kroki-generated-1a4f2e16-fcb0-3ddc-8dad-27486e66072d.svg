n x="753.5" dy="0">Chain validation</tspan><tspan x="753.5" dy="18.5">fails?</tspan></text></g><g class="Y2hhaW5GaXg="><g class="shape" ><rect x="972" y="367" width="270" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1107" y="405.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1107" dy="0">Intermediate not sent by server</tspan><tspan x="1107" dy="17.666667">Add intermediate to TLS config</tspan><tspan x="1107" dy="17.666667">openssl verify to confirm</tspan></text></g><g class="Y2hlY2tUcnVzdA=="><g class="shape" ><rect x="1030" y="225" width="155" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1107.5" y="263.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1107.5" dy="0">Root CA trusted</tspan><tspan x="1107.5" dy="18.5">by client?</tspan></text></g><g class="YWRkUm9vdA=="><g class="shape" ><rect x="1342" y="296" width="241" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1462.5" y="334.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1462.5" dy="0">Distribute root CA cert</tspan><tspan x="1462.5" dy="18.5">via GPO / system trust store</tspan></text></g><g class="Y2hlY2tSZXZva2U="><g class="shape" ><rect x="1403" y="154" width="120" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1463" y="192.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1463" dy="0">Certificate</tspan><tspan x="1463" dy="18.5">revoked?</tspan></text></g><g class="cmVwbGFjZVJldm9rZWQ="><g class="shape" ><rect x="1683" y="225" width="200" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1783" y="263.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1783" dy="0">Replace with new cert</tspan><tspan x="1783" dy="18.5">Issue on clean host</tspan></text></g><g class="Y2hlY2tTQU4="><g class="shape" ><rect x="1699" y="83" width="169" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1783.5" y="121.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1783.5" dy="0">CN / SAN matches</tspan><tspan x="1783.5" dy="18.5">hostname?</tspan></text></g><g class="bmV3Q2VydA=="><g class="shape" ><rect x="2000" y="158" width="203" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2101.5" y="196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2101.5" dy="0">Request new cert with</tspan><tspan x="2101.5" dy="18.5">correct CN and SANs</tspan></text></g><g class="ZGVlcERpYWc="><g class="shape" ><rect x="1983" y="0" width="237" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2101.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2101.5" dy="0">Further diagnostics:</tspan><tspan x="2101.5" dy="17.666667">openssl s_client full output</tspan><tspan x="2101.5" dy="17.666667">certutil -verify -urlfetch</tspan></text></g><g class="KGlzc3VlIC0mZ3Q7IGNoZWNrRXhwaXJ5KVswXQ=="><marker id="mk-d2-536451798-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 277 412 C 315 412 335 412 371 412" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-536451798-3488378134)" mask="url(#d2-536451798)" /></g>