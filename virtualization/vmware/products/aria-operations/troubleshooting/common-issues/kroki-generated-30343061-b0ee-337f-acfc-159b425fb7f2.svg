acity calculation wrong</text></g><g class="QjU="><g class="shape" ><rect x="344" y="126" width="331" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="509.5" y="164.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">vSAN management pack missing metrics</text></g><g class="QjY="><g class="shape" ><rect x="389" y="0" width="240" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="509" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Node offline or cluster issue</text></g><g class="RDE="><g class="shape" ><rect x="69" y="883" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="921.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">D1</text></g><g class="UjE="><g class="shape" ><rect x="301" y="946" width="416" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="509" y="984.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="509" dy="0">Re-test Adapter Connection · Unlock Service Account</tspan><tspan x="509" dy="18.5">→ Adapter Disconnected</tspan></text></g><g class="UjI="><g class="shape" ><rect x="318" y="804" width="383" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="509.5" y="842.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="509.5" dy="0">Verify Source Reachability · Check Collector Log</tspan><tspan x="509.5" dy="18.5">→ Adapter Disconnected</tspan></text></g><g class="RDI="><g class="shape" ><rect x="69" y="1167" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="120