ext-anchor:middle;font-size:16px">Site pair disconnected</text></g><g class="QjU="><g class="shape" ><rect x="341" y="150" width="275" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="478.5" y="188.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">No datastore available for target</text></g><g class="QjY="><g class="shape" ><rect x="331" y="8" width="295" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="478.5" y="46.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Certificate mismatch between sites</text></g><g class="RDE="><g class="shape" ><rect x="69" y="891" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="929.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">D1</text></g><g class="UjE="><g class="shape" ><rect x="301" y="954" width="354" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="478" y="992.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="478" dy="0">Start HMS/VRMS Services · Check TCP 44046</tspan><tspan x="478" dy="18.5">→ Replication Fails</tspan></text></g><g class="UjI="><g class="shape" ><rect x="319" y="812" width="318" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="478" y="850.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="478" dy="0">Check Cert Thumbprints · Re-pair Sites</tspan><tspan x="478" dy="18.5">→ Replication Fails</tspan></text></g><g class="RDI="><g class="shape" ><rect x="69" y="1175" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y