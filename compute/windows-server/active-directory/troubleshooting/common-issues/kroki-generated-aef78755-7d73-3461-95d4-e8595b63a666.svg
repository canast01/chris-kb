Time skew &gt; 5 min</tspan><tspan x="791" dy="18.5">between client and DC?</tspan></text></g><g class="Zml4VGltZQ=="><g class="shape" ><rect x="1575" y="458" width="272" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1711" y="496.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1711" dy="0">Fix time:</tspan><tspan x="1711" dy="17.666667">w32tm /resync /force</tspan><tspan x="1711" dy="17.666667">Check PDC Emulator NTP source</tspan></text></g><g class="a2VyYkNoZWNr"><g class="shape" ><rect x="996" y="154" width="178" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1085" y="192.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1085" dy="0">Kerberos errors</tspan><tspan x="1085" dy="18.5">4768 / 4769 / 4771?</tspan></text></g><g class="a2VyYlRyaWFnZQ=="><g class="shape" ><rect x="1595" y="300" width="231" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1710.5" y="338.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1710.5" dy="0">Check SPNs: setspn -X -F</tspan><tspan x="1710.5" dy="17.666667">Purge tickets: klist purge</tspan><tspan x="1710.5" dy="17.666667">Verify Kerberos enc policy</tspan></text></g><g class="cmVwbENoZWNr"><g class="shape" ><rect x="1274" y="75" width="197" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1372.5" y="113.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1372.5" dy="0">Replication errors</tspan><tspan x="1372.5" dy="18.5">in dcdiag / repadmin?</tspan></text></g><g class="cmVwbFRyaWFnZQ=="><g class="shape" ><rect x="1593" y="142" width="235" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1710.5" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1710.5" dy="0">repadmin /showrepl</tspan><tspan x="1710.5" dy="17.666667">repadmin /replsummary</tspan><tspan x="1710.5" dy="17.666667">See replication error codes</tspan></text></g><g class="c2VydmljZXNDaGVjaw=="><g class="shape" ><rect x="1571" y="0" width="279" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1710.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1710.5" dy="0">Check DC services:</tspan><tspan x="1710.5" dy="18.5">NTDS / Netlogon / DNS / W32Time</tspan></text></g><g class="dmFsaWRhdGU="><g class="shape" ><rect x="1950" y="316" width="273" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="2086.5" y="354.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Validate — retest authentication</text></g><g class="KHN5bXB0b20gLSZndDsgZG5zQ2hlY2spWzBd"><marker id="mk-d2-1731067470-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 300 357 C 338 357 358 357 394 357" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1731067470-3488378134)" mask="url(#d2-1731067470)" /></g><g class="KGRuc0NoZWNrIC0mZ3Q7IGZpeEROUylbMF0="><path d="M 511.827606 399.820733 C 611 618 667 673 713.5 673 C 760 673 822 673 868.5 673 C 915 673 973.799988 673 1015.5 673 C 1057.199951 673 1112.800049 673 1154.5 673 C 1196.199951 673 1253.699951 673 1298.25 673 C 1342.800049 673 1541.699951 673 1620.5 673" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" m