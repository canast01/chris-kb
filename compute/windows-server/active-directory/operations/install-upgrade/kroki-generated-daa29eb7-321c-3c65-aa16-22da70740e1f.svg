 DFL</tspan></text></g><g class="dmFsaWRhdGU="><g class="shape" ><rect x="2936" y="8" width="340" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="3106" y="46.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="3106" dy="0">Validate:</tspan><tspan x="3106" dy="18.5">dcdiag /test:all + repadmin /replsummary</tspan></text></g><g class="KHN0YXJ0IC0mZ3Q7IGludmVudG9yeURDcylbMF0="><marker id="mk-d2-1201558042-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 291.9999 48.980001 C 330 48.599998 350 48.5 386 48.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1201558042-3488378134)" mask="url(#d2-1201558042)" /></g><g class="KGludmVudG9yeURDcyAtJmd0OyBjaGVja09TKVswXQ=="><path d="M 671 48.5 C 709 48.5 729 48.5 765 48.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1201558042-3488378134)" mask="url(#d2-1201558042)" /></g><g class="KGNoZWNrT1MgLSZndDsgdXBncmFkZU9sZERDcylbMF0="><path d="M 946.915653 74.574696 C 985 86 1005 89 1041 89" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1201558042-3488378134)" mask="url(#d2-1201558042)" /></g><g class="KGNoZWNrT1MgLSZndDsgY2hlY2tTeXN2b2wpWzBd"><path d="M 946.915653 22.425304 C 985 11 1030.699951 8 1084.25 8 C 1137.800049 8 1362 11.4 1398.212909 23.712389" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1201558042-3488378134)" mask="url(#d2-1201558042)" /></g><g class="KHVwZ3JhZGVPbGREQ3MgLSZndDsgY2hlY2tTeXN2b2wpWzBd"><path d="M 1304 89 C 1342 89 1362 85.599998 1398.212909 73.287611" stroke="#0D32B2" fill="none" c