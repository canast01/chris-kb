yle="text-anchor:middle;font-size:16px"><tspan x="504" dy="0">Kerberos AES-256 only</tspan><tspan x="504" dy="18.5">(RC4 disabled via GPO</tspan></text></g><g class="YWRtaW5TREhvbGRlcg=="><g class="shape" ><rect x="376" y="284" width="256" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="504" y="322.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="504" dy="0">AdminSDHolder</tspan><tspan x="504" dy="17.666667">(propagates ACL every 60 min</tspan><tspan x="504" dy="17.666667">to all privileged accounts</tspan></text></g><g class="bWRp"><g class="shape" ><rect x="407" y="142" width="194" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="504" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="504" dy="0">Defender for Identity</tspan><tspan x="504" dy="18.5">(sensor on all DCs</tspan></text></g><g class="cGF3"><g class="shape" ><rect x="355" y="0" width="297" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="503.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="503.5" dy="0">PAW Policy</tspan><tspan x="503.5" dy="18.5">(AppLocker / BitLocker / no internet</tspan></text></g><g class="ZGNzeW5j"><g class="shape" ><rect x="752" y="284" width="303" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="903.5" y="322.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="903.5" dy="0">DCSync attack</tspan><tspan x="903.5" dy="18.5">(Event 4662 — repl directory changes</tspan></text></g><g class="cGFzc0hhc2g="><g class="shape" ><rect x="826" y="142" width="155" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" 