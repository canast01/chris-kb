o</tspan><tspan x="690.5" dy="18.5">work on target?</tspan></text></g><g class="Zml4U3Vkbw=="><g class="shape" ><rect x="880" y="284" width="236" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="998" y="322.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="998" dy="0">Add NOPASSWD to sudoers</tspan><tspan x="998" dy="18.5">or use --ask-become-pass</tspan></text></g><g class="YWRkVmVyYm9zZQ=="><g class="shape" ><rect x="898" y="142" width="200" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="998" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="998" dy="0">Re-run with -vvv</tspan><tspan x="998" dy="18.5">for connection details</tspan></text></g><g class="Y2hlY2tJbnZlbnRvcnk="><g class="shape" ><rect x="1216" y="142" width="165" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1298.5" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1298.5" dy="0">Is the host listed</tspan><tspan x="1298.5" dy="18.5">in the inventory?</tspan></text></g><g class="Zml4SW52ZW50b3J5"><g class="shape" ><rect x="1481" y="213" width="200" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1581" y="251.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1581" dy="0">Add host to inventory</tspan><tspan x="1581" dy="18.5">or fix dynamic source</tspan></text></g><g class="Y2hlY2tWYXVsdA=="><g class="shape" ><rect x="1499" y="71" width="164" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1581" y="109.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1581" d