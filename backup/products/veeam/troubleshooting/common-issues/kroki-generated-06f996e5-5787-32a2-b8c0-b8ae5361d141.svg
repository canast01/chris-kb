		.d2-3586839630 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Uw=="><g class="shape" ><rect x="0" y="189" width="201" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="227.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">What is the symptom?</text></g><g class="QQ=="><g class="shape" ><rect x="335" y="378" width="353" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="416.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Backup job failed — cannot connect to guest</text></g><g class="Qg=="><g class="shape" ><rect x="437" y="252" width="149" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="290.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Repository full</text></g><g class="Qw=="><g class="shape" ><rect x="361" y="126" width="302" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="512" y="164.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Restore fails — no valid restore point</text></g><g class="RA=="><g class="shape" ><rect x="439" y="0" width="146" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="512" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Tape job error</text></g><g class="QTE="><g class="shape" ><rect x="69" y="571" width="64" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="609.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">A1</text></g><g class="QTI="><g class="shape" ><rect x="306" y="630" width="412" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="512" y="668.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="512" dy="0">Check proxy TCP 2500-3300 and VMware Tools — see</tspan><tspan x="512" dy="18.5">Triage Decision Tree</tspan></text></g><g class="QTM="><g class="shape" ><rect x="304" y="504" width="415" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="542.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Check VSS writer state and quiesce settings on guest</text></g><g class="QjE="><g class="shape" ><rect x="70" y="839" width="62" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="877.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">B1</text></g><g class="QjI="><g class="shape" ><rect x="335" y="898" width="353" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="936.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="511.5" dy="0">Trigger capacity tier offload manually — see</tspan><tspan x="511.5" dy="18.5">Repository Out of Space</tspan></text></g><g class="QjM="><g class="shape" ><rect x="315" y="772" width="393" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="810.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Reduce retention or delete orphaned backup files</text></g><g class="QzE="><g class="shape" ><rect x="69" y="1119" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1157.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">C1</text></g><g class="QzI="><g class="shape" ><rect x="312" y="1182" width="400" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="512" y="1220.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="512" dy="0">Check retention policy and catalog — restore point</tspan><tspan x="512" dy="18.5">may be expired</tspan></text></g><g class="QzM="><g class="shape" ><rect x="301" y="1040" width="421" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="1078.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="511.5" dy="0">Check vPower NFS service and mount server access —</tspan><tspan x="511.5" dy="18.5">see Instant VM Recovery</tspan></text></g><g class="RDE="><g class="shape" ><rect x="69" y="1387" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1425.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">D1</text></g><g class="RDI="><g class="shape" ><rect x="307" y="1450" width="410" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="512" y="1488.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Check media manager and tape library connectivity</text></g><g class="RDM="><g class="shape" ><rect x="336" y="1324" width="352" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="512" y="1362.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Check media expiry and tape slot inventory</text></g><g class="RQ=="><g class="shape" ><rect x="75" y="1584" width="52" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="1622.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">E</text></g><g class="RTE="><g class="shape" ><rect x="306" y="1576" width="411" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511.5" y="1614.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="511.5" dy="0">Restart VBR service and check Windows Event Log —</tspan><tspan x="511.5" dy="18.5">see VBR Service Crash / Instability</tspan></text></g><g class="KFMgLSZndDsgQSlbMF0="><marker id="mk-d2-3586839630-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 128.244488 256.565646 C 226.199997 379.799988 267.799988 411 331 411" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3586839630-3488378134)" mask="url(#d2-3586839630)" /></g><g class="KFMgLSZndDsgQilbMF0="><path d="M 180.846154 255.769231 C 236.600006 279 288.200012 285 433 285" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3586839630-3488378134)" mask="url(#d2-3586839630)" /></g><g class="KFMgLSZndDsgQylbMF0="><path d="M 180.846154 188.230769 C 236.600006 165 272.899994 159 356.5 159" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-358683963