		.d2-706520295 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Uw=="><g class="shape" ><rect x="0" y="260" width="201" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="298.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">What is the symptom?</text></g><g class="QQ=="><g class="shape" ><rect x="388" y="512" width="271" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="550.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Backup job stuck — offline client</text></g><g class="Qg=="><g class="shape" ><rect x="427" y="386" width="192" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523" y="424.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Dedup DB corruption</text></g><g class="Qw=="><g class="shape" ><rect x="388" y="260" width="270" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523" y="298.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Restore to different client failed</text></g><g class="RA=="><g class="shape" ><rect x="412" y="134" width="222" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523" y="172.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Media agent unreachable</text></g><g class="RQ=="><g class="shape" ><rect x="417" y="8" width="212" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523" y="46.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Schedule not triggering</text></g><g class="QTE="><g class="shape" ><rect x="69" y="717" width="64" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="755.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">A1</text></g><g class="QTI="><g class="shape" ><rect x="332" y="780" width="383" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="818.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">Check firewall and restart GxCVD on client — see</tspan><tspan x="523.5" dy="18.5">Common Issues Reference</tspan></text></g><g class="QTM="><g class="shape" ><rect x="336" y="638" width="375" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="676.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">Check job phase log for hung pre/post script or</tspan><tspan x="523.5" dy="18.5">VSS error</tspan></text></g><g class="QjE="><g class="shape" ><rect x="70" y="1001" width="62" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="101" y="1039.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">B1</text></g><g class="QjI="><g class="shape" ><rect x="322" y="1064" width="402" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523" y="1102.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523" dy="0">Free DDB disk space and run DDB Verification job —</tspan><tspan x="523" dy="18.5">see Common Issues Reference</tspan></text></g><g class="QjM="><g class="shape" ><rect x="329" y="922" width="389" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="960.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">Run qoperation execscript -sn QS_DDBVerify and</tspan><tspan x="523.5" dy="18.5">escalate if phase 2 fails</tspan></text></g><g class="QzE="><g class="shape" ><rect x="69" y="1285" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1323.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">C1</text></g><g class="QzI="><g class="shape" ><rect x="350" y="1348" width="347" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="1386.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">Grant restore permission to target client in</tspan><tspan x="523.5" dy="18.5">CommCell Console</tspan></text></g><g class="QzM="><g class="shape" ><rect x="345" y="1206" width="357" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="1244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">Check destination client credentials and iDA</tspan><tspan x="523.5" dy="18.5">compatibility</tspan></text></g><g class="RDE="><g class="shape" ><rect x="69" y="1569" width="63" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="100.5" y="1607.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">D1</text></g><g class="RDI="><g class="shape" ><rect x="327" y="1632" width="393" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523.5" y="1670.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">Restart CommVault services on MediaAgent — see</tspan><tspan x="523.5" dy="18.5">Common Issues Reference</tspan></text></g><g class="RDM="><g class="shape" ><rect x="301" y="1490" width="444" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="523" y="1528.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523" dy="0">Check network between CommServe and MediaAgent on</tspan><tspan x="523" dy="18.5">port 8400</tspan></text></g><g class="RTE="><g class="shape" ><rect x="845" y="0" width="393" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1041.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1041.5" dy="0">Verify GxJobMgr service is running and schedule</tspan><tspan x="1041.5" dy="18.5">window is active — see Common Issues Reference</tspan></text></g><g class="KFMgLSZndDsgQSlbMF0="><marker id="mk-d2-706520295-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 121.026685 327.716367 C 224.800003 501.200012 278.299988 545 383.5 545" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-706520295-3488378134)" mask="url(#d2-706520295)" /></g><g class="KFMgLSZndDsgQilbMF0="><path d="M 141.533041 327.28444 C 228.800003 400.399994 286.200012 419 423 419" stroke="#0D32B2" fill=