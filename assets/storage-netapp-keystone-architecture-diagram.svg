<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    NetApp Keystone — Storage as a Service Architecture
  </text>
  
  <rect x="10" y="50" width="390" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Service Model
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OpEx: monthly consumption bill
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Hardware on-prem or cloud
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetApp manages HW lifecycle
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Burst: auto approved up to X%
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Committed + burst billing
  </text>

  <rect x="420" y="50" width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Service Levels
  </text>
  <text x="430" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Extreme: 1ms latency SLA
  </text>
  <text x="430" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Premium: &lt;2ms latency
  </text>
  <text x="430" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Standard: 4ms latency
  </text>
  <text x="430" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CVO: Cloud Volumes ONTAP
  </text>
  <text x="430" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data protection: add-on tier
  </text>

  <line x1="205" y1="170" x2="205" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="170" x2="615" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="210" width="390" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Keystone Collector
  </text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    On-prem VM (or container)
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Polls ONTAP for usage data
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Reports to Keystone cloud
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: cluster metrics
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HTTPS 443: outbound only
  </text>

  <rect x="420" y="210" width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="430" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Keystone Manager Portal
  </text>
  <text x="430" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Subscription overview
  </text>
  <text x="430" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Consumption dashboard
  </text>
  <text x="430" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Burst usage tracking
  </text>
  <text x="430" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Invoice reconciliation
  </text>
  <text x="430" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Service request portal
  </text>

  <text x="10" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetApp AFF/FAS arrays or Cloud Volumes ONTAP; Keystone Collector VM on vSphere;
  </text>
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    internet access for Collector to reach Keystone cloud on TCP 443.
  </text>

  <text x="10" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Keystone = NetApp STaaS subscription offering; hardware + management included
  </text>
  <text x="10" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    STaaS = Storage as a Service; pay-per-use like cloud, but on-prem hardware
  </text>
  <text x="10" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Service level = latency SLA tier (Extreme/Premium/Standard); billed separately
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Committed capacity = minimum subscribed amount; always billed regardless of use
  </text>
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Burst capacity = usage above committed; auto-approved up to 20% over
  </text>
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Keystone Collector = on-prem VM that tracks and reports consumption to NetApp
  </text>
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Keystone Manager = NetApp portal for subscription, usage, and invoice management
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AFF = All Flash FAS; NetApp NVMe-ready all-flash array
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CVO = Cloud Volumes ONTAP; ONTAP on AWS/Azure/GCP as Keystone option
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OpEx model = operational expense; monthly billing replaces CapEx purchase
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data protection tier = add-on: SnapVault/SnapMirror included in the STaaS bill
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ONTAP API = Collector queries cluster-mgmt LIF for capacity metrics
  </text>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Storage Architecture
  </text>
</svg>