<svg xmlns="http://www.w3.org/2000/svg" width="820" height="740" viewBox="0 0 820 740">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    AWS Identity Overview
  </text>
  
  <rect x="10" y="40" width="800" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AWS Identity — IAM, IAM Identity Center, and Permission Management
  </text>
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IAM: every AWS API call is authenticated via IAM; roles preferred over long-lived user keys
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IAM Identity Center: SSO for AWS console and CLI; groups mapped to permission sets in accounts
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Least privilege: customer-managed policies + Permission Boundaries limit blast radius
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Review cycle: Access Analyzer, Access Advisor, Credential Report — quarterly permission review
  </text>

  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM authenticates every API call · Identity Center enables SSO
  </text>

  <line x1="100" y1="160" x2="100" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="360" y1="160" x2="360" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="160" x2="620" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="40" y="180" width="220" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="50" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM
  </text>
  <text x="50" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Roles: EC2, Lambda, X-acct
  </text>
  <text x="50" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Policies: managed+inline
  </text>
  <text x="50" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Trust policy: who assumes
  </text>
  <text x="50" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access keys: rotate/delete
  </text>
  <text x="50" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cross-acct: sts assume
  </text>

  <rect x="300" y="180" width="220" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="310" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM Identity Center
  </text>
  <text x="310" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SSO: browser + CLI login
  </text>
  <text x="310" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Groups → permission sets
  </text>
  <text x="310" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IdP: Azure AD / Okta
  </text>
  <text x="310" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Permission sets: scoped
  </text>
  <text x="310" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Assignment: user+acct+set
  </text>

  <rect x="560" y="180" width="220" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="570" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Access Control
  </text>
  <text x="570" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Permission Boundary
  </text>
  <text x="570" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Resource policies: S3/KMS
  </text>
  <text x="570" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access Analyzer: external
  </text>
  <text x="570" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access Advisor: last used
  </text>
  <text x="570" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Credential Report: audit
  </text>

  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM manages roles and policies · Identity Center enables SSO
  </text>

  <line x1="100" y1="330" x2="100" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="360" y1="330" x2="360" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="330" x2="620" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="40" y="350" width="740" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="50" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM
  </text>
  <text x="120" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM Roles
  </text>
  <text x="220" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IAM Policies
  </text>
  <text x="320" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Access Keys
  </text>
  <text x="420" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cross-Account
  </text>
  <text x="50" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    List users
  </text>
  <text x="120" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Trust policy
  </text>
  <text x="220" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Managed: AWS
  </text>
  <text x="320" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Rotate 90d
  </text>
  <text x="420" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Trust: sts
  </text>
  <text x="50" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Password policy
  </text>
  <text x="120" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EC2 profile
  </text>
  <text x="220" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Managed: custom
  </text>
  <text x="320" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Delete unused
  </text>
  <text x="420" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    assume-role
  </text>
  <text x="50" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MFA: enforce
  </text>
  <text x="120" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    X-acct assume
  </text>
  <text x="220" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inline: tight
  </text>
  <text x="320" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inventory: all
  </text>
  <text x="420" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    External ID
  </text>
  <text x="50" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Credential report
  </text>
  <text x="120" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lambda role
  </text>
  <text x="220" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Boundary: max
  </text>
  <text x="320" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cred report
  </text>
  <text x="420" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Session tags
  </text>

  <text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AWS IAM global service · IAM Identity Center in management account · STS regional endpoints
  </text>

  <text x="20" y="505" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="20" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IAM Role = Identity with trust policy; assumed by services, users, or other accounts for temp
  </text>
  <text x="20" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Trust policy = JSON document on a role defining who can call sts:AssumeRole on it
  </text>
  <text x="20" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Permission Boundary= IAM policy limiting maximum permissions a role or user can have; reduces blast
  </text>
  <text x="20" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IAM Identity Center= AWS SSO; centralises human access to accounts via groups and permission sets
  </text>
  <text x="20" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Permission set = Collection of IAM policies assigned to a user/group for one or more accounts via SSO
  </text>
  <text x="20" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access Analyzer= Identifies resources shared outside the account or org; detects unintended external
  </text>
  <text x="20" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access Advisor = Shows last service access dates per role; helps prune unused permissions
  </text>
  <text x="20" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Credential Report= CSV listing all IAM users, key age, MFA status, and last login per account
  </text>
  <text x="20" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Instance profile= IAM role wrapper for EC2; metadata endpoint exposes temporary credentials to the OS
  </text>
  <text x="20" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cross-account role= Role in account B trusted by account A; enables resource sharing without key
  </text>
  <text x="20" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    STS = Security Token Service; issues temporary credentials for assume-role and federation
  </text>
  <text x="20" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    External ID = Secret added to cross-account trust policy; prevents confused deputy attacks
  </text>

  <rect x="0" y="700" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="720" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: AWS Identity Overview
  </text>
</svg>