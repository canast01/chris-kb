<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Jira — Backup and Restore
  </text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="150" fill="#e3f2fd" stroke="#1565c0" rx="6" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      /var/atlassian/application-data/jira/shared/
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── attachments/
    </text>
    <text x="250" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE (primary data)
    </text>
    <text x="20" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── avatars/
    </text>
    <text x="250" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
    <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── logos/
    </text>
    <text x="250" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
    <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── export/
    </text>
    <text x="250" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← OPTIONAL (regeneratable)
    </text>
    <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── plugins/
    </text>
    <text x="250" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
    <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      └── data/
    </text>
    <text x="250" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
  </g>

  <g transform="translate(10, 220)">
    <rect x="0" y="0" width="800" height="115" fill="#e8eaf6" stroke="#3949ab" rx="6" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      # Per-node (back up once — same on all nodes):
    </text>
    <text x="10" y="45" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      /var/atlassian/application-data/jira/
    </text>
    <text x="20" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── dbconfig.xml
    </text>
    <text x="250" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
    <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ├── cluster.properties
    </text>
    <text x="250" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
    <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      └── jira-config.properties
    </text>
    <text x="250" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ← INCLUDE
    </text>
  </g>

  <rect x="0" y="350" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Backup and Restore Structure
  </text>
</svg>