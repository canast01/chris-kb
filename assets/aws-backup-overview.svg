<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Backup — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Backup Plans · Vaults · Jobs · Restore Testing · Compliance</text>

  <!-- ═ COLUMN 1: Backup Service Core ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Backup Service Core</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Plans · Rules · Resource Assignments</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Backup Plans</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Backup Rules (schedule + lifecycle)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Resource Assignments (by tag)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Supported Resources</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Organization-level Backup Policies</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Backup Windows &amp; Frequency</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Resources: EC2, EBS, RDS, DynamoDB, EFS</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Also: S3, FSx, Aurora, Neptune, DocumentDB</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Tag-based: Backup=true auto-assigns</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Backup rule: cron + retention period</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Org policies: push to all member accounts</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Window default: 8-hour backup window</text>

  <!-- ═ COLUMN 2: Vaults & Storage ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Backup Vaults</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Encryption · Access · Cross-Account Copy</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Default Backup Vault</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Custom Vaults (per env/team)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Vault Lock (WORM)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">KMS Encryption (CMK)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Vault Access Policies</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Cross-Account / Cross-Region Copy</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Vault Lock: immutable retention (compliance)</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">CMK: separate key per vault for isolation</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Cross-region copy for DR strategy</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Cross-account: Log Archive account pattern</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Access policy: deny delete, allow copy</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Recovery points stored in vault by type</text>

  <!-- ═ COLUMN 3: Operations ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Operations &amp; Compliance</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Jobs · Restore Testing · Audit Manager</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Backup Jobs (monitoring)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Restore Jobs</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Restore Testing Plans</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Backup Audit Manager</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Backup Compliance Reports</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SNS Notifications (job events)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Job states: Created, Running, Completed, Failed</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Restore testing: automated, scheduled</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Audit Manager: frameworks per regulation</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Reports: coverage, compliance, jobs</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Alert: SNS → email / PagerDuty on failure</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Dashboard: recovery point age + status</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Backup Plan Tiers</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="330" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Daily</text>
  <text x="530" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Weekly</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Monthly / Annual</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="430" y1="516" x2="430" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Frequency</text>
  <text x="330" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Every 24 hours</text>
  <text x="530" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Every 7 days</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Monthly or yearly</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Retention</text>
  <text x="330" y="587" text-anchor="middle" fill="#546e7a" font-size="9">7–35 days</text>
  <text x="530" y="587" text-anchor="middle" fill="#546e7a" font-size="9">30–90 days</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">1–7 years</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Cold storage transition</text>
  <text x="330" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="530" y="613" text-anchor="middle" fill="#546e7a" font-size="9">After 30 days</text>
  <text x="720" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Typical use case</text>
  <text x="330" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Prod databases, EC2</text>
  <text x="530" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Dev/test workloads</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Compliance archive</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Storage class</text>
  <text x="330" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Warm</text>
  <text x="530" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Warm → Cold</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Cold / Archive</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Cross-region copy</text>
  <text x="330" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="530" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Backup Reference · Backup Plans · Vaults · Vault Lock · Restore Testing · Audit Manager · Compliance</text>
</svg>
