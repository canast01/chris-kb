<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell APEX Storage-as-a-Service — Architecture Overview
  </text>
  
  <rect x="10" y="50" width="400" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="210" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Service Model
  </text>
  <text x="210" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pay per GB/month consumed
  </text>
  <text x="210" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Hardware delivered to DC
  </text>
  <text x="210" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No upfront capital cost
  </text>
  <text x="210" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dell manages HW lifecycle
  </text>
  <text x="210" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Elastic burst: +/- capacity
  </text>
  
  <rect x="420" y="50" width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Underlying Storage Platforms
  </text>
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerStore X: block workloads
  </text>
  <text x="615" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerMax: mission-critical
  </text>
  <text x="615" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerFlex: hyper-converged
  </text>
  <text x="615" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ECS: object storage (S3)
  </text>
  <text x="615" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerScale: scale-out NAS
  </text>
  
  <line x1="210" y1="170" x2="210" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="170" x2="615" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="210" width="400" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="210" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    APEX Console (Management)
  </text>
  <text x="210" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Single portal: all services
  </text>
  <text x="210" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API for automation
  </text>
  <text x="210" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Subscription management
  </text>
  <text x="210" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Consumption dashboards
  </text>
  <text x="210" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Multi-site view: one pane
  </text>
  
  <rect x="420" y="210" width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Operational Model
  </text>
  <text x="615" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dell: HW monitoring + support
  </text>
  <text x="615" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Customer: VM/app workloads
  </text>
  <text x="615" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudIQ: performance insights
  </text>
  <text x="615" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    APEX Observer: on-prem agent
  </text>
  <text x="615" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SLA: 99.9999% availability
  </text>
  
  <text x="410" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dell-supplied arrays in customer rack; dedicated rack power and cooling by customer;
  </text>
  <text x="410" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    network connectivity to APEX Console via internet (TCP 443); APEX Observer VM on-prem.
  </text>
  
  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    APEX = Dell Storage-as-a-Service brand; on-prem hardware, cloud billing
  </text>
  <text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    APEX Console = SaaS management portal for all APEX services; REST API
  </text>
  <text x="410" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OpEx model = operational expenditure; no large upfront hardware purchase
  </text>
  <text x="410" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Commitment period = minimum contract term (1, 3, or 5 years)
  </text>
  <text x="410" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Burst capacity = temporary capacity above committed level; billed at higher rate
  </text>
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    APEX Observer = on-prem VM that reports telemetry to APEX Console
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudIQ = Dell AIOps analytics; integrated with APEX for health scoring
  </text>
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerStore = Dell mid-range AFA; common APEX block storage platform
  </text>
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerMax = Dell high-end AFA; APEX option for mission-critical block
  </text>
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerFlex = Dell hyper-converged / software-defined storage option
  </text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ECS = Elastic Cloud Storage; Dell object storage; S3-compatible
  </text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Elastic scaling = add or reduce committed capacity via APEX Console request
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Architecture Overview
  </text>
</svg>