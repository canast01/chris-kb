<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ONTAP Escalation Process</text>
  
  <rect x="10" y="50" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at mysupport.netapp.com with AutoSupport invoked and event log attached</text>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="110" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — TSE (Technical Support Engineer) acknowledges and reviews AutoSupport data</text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(P1: within 1 hour; P2: within 2 hours)</text>
  
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="190" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress after 2 hours for P1 or 4 hours for P2:</text>
  <text x="30" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to ONTAP Specialist or Escalation Engineer"</text>
  <text x="30" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[node offline / 12 NFS hosts without storage / DR capability lost]"</text>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="290" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Product Specialist or Escalation Engineer is assigned</text>
  <text x="30" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They may request a live WebEx session for cluster access</text>
  <text x="30" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SSH to cluster management LIF and ONTAP System Manager ready</text>
  
  <line x1="410" y1="370" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="390" width="800" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue requires firmware or code-level investigation:</text>
  <text x="30" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Escalation Engineer involves NetApp Engineering</text>
  <text x="30" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide a hotpatch or workaround procedure</text>
  
  <line x1="410" y1="460" x2="410" y2="480" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="480" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For P1 with no resolution after 4 hours:</text>
  <text x="30" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Call +1-888-463-8277 and request escalation to Support Duty Manager</text>
  <text x="30" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact your NetApp Account Manager to engage executive escalation</text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>