<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">High Availability Design — Architecture Overview</text>

  <!-- Column 1: Compute HA -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Compute HA</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">vSphere HA (VM restart)</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">vMotion (live migration)</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">DRS (load balancing)</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Fault Tolerance (lock-step)</text>

  <!-- Column 2: Network HA -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Network HA</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">NIC teaming / LAG</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Dual TOR switches</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">HSRP / VRRP gateway</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Spanning Tree / vPC</text>

  <!-- Column 3: Storage HA -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Storage HA</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">RAID / erasure coding</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Dual controllers (active-active)</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Multipathing (MPIO/DM-MP)</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Synchronous replication</text>

  <!-- Comparison Table -->
  <rect x="20" y="330" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">HA Pattern</text>
  <text x="310" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Recovery</text>
  <text x="510" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RPO</text>
  <text x="701" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Complexity</text>

  <rect x="20" y="360" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">vSphere HA</text>
  <text x="310" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">VM restart on survivor host</text>
  <text x="510" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Near-zero (shared storage)</text>
  <text x="701" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low</text>

  <rect x="20" y="386" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">FT</text>
  <text x="310" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Instant (secondary takes over)</text>
  <text x="510" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero</text>
  <text x="701" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Medium</text>

  <rect x="20" y="412" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Active-Active</text>
  <text x="310" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Transparent (load-balanced)</text>
  <text x="510" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero</text>
  <text x="701" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">High</text>

  <rect x="20" y="438" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Geographic Stretch</text>
  <text x="310" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Site failover (vMotion/SRM)</text>
  <text x="510" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero to near-zero</text>
  <text x="701" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Very high</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
