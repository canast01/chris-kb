<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    FlashBlade NFS Filesystem Provisioning Flow
  </text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Create filesystem (purefb fs create --size)
    </text>
  </g>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 120)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Set NFS export policy (purefb fs setattr --nfs)
    </text>
    <text x="10" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      (allowed client IPs / CIDR, access mode)
    </text>
  </g>
  
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 210)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Mount on client: mount -t nfs &lt;fb_ip&gt;:/&lt;fs&gt; /mnt
    </text>
  </g>
  
  <line x1="410" y1="250" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 280)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Add to snapshot policy (purefb policy ...)
    </text>
  </g>
  
  <rect x="0" y="360" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Procedure Flow
  </text>
</svg>