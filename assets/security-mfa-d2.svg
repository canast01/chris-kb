<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Multi-Factor Authentication (MFA)</text>

  <g>
    <rect x="10" y="50" width="390" height="220" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">TOTP (Time-based OTP)</text>
    <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">User generates 6-digit code</text>
    <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Code derived from shared secret</text>
    <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Valid for 30-second window</text>
    <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Works offline (no network needed)</text>
    <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Phishing-resistant if typed once</text>
    <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Hardware token: highest assurance</text>
  </g>

  <g>
    <rect x="420" y="50" width="390" height="220" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Push Notification</text>
    <text x="430" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">IdP sends push to registered device</text>
    <text x="430" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">User taps Approve / Deny</text>
    <text x="430" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Out-of-band — does not traverse browser</text>
    <text x="430" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Requires network on mobile device</text>
    <text x="430" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Vulnerable to MFA fatigue (auto-accept)</text>
    <text x="430" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Number-matching mitigates fatigue attacks</text>
  </g>

  <rect x="0" y="290" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Security MFA Methods</text>
</svg>