<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    OpenShift Deployment
  </text>
  
  <rect x="10" y="50" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    OpenShift Installation Methods
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IPI: installer manages infrastructure (vSphere, AWS, bare-metal); fully automated
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    UPI: admin provisions infra manually; installer only bootstraps the cluster software
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Air-gap: all images mirrored to internal registry; no internet required during install
  </text>
  <text x="410" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    install-config.yaml: single source of truth for cluster topology and parameters
  </text>
  
  <line x1="205" y1="150" x2="205" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="150" x2="615" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="200" width="390" height="150" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    IPI Install (Automated)
  </text>
  <text x="205" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    openshift-install create cluster
  </text>
  <text x="205" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Installer creates VMs (vSphere)
  </text>
  <text x="205" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Manages load balancers, DNS
  </text>
  <text x="205" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MachineAPI for worker scaling
  </text>
  <text x="205" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Recommended for vSphere/cloud
  </text>
  
  <rect x="420" y="200" width="390" height="150" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    UPI Install (Manual)
  </text>
  <text x="615" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Provision nodes manually
  </text>
  <text x="615" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Generate ignition configs
  </text>
  <text x="615" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Bootstrap node → masters
  </text>
  <text x="615" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Manual worker CSR approval
  </text>
  <text x="615" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Required for bare-metal/custom
  </text>
  
  <text x="10" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Bootstrap  = Temporary node that initializes first master; removed after install
  </text>
  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Ignition   = CoreOS provisioning system; configures RHCOS nodes on first boot
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CSR        = Certificate Signing Request; workers submit CSRs; admin approves
  </text>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: OpenShift Deployment
  </text>
</svg>