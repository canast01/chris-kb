<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell PowerPath — Host Multipathing Architecture
  </text>
  
  <rect x="10" y="50" width="400" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="210" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Function
  </text>
  <text x="210" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Manages multiple SAN paths
  </text>
  <text x="210" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Presents single virtual device
  </text>
  <text x="210" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Balances IO across FC paths
  </text>
  <text x="210" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Fails over on path loss
  </text>
  <text x="210" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Replaces native OS MPIO
  </text>

  <rect x="430" y="50" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="620" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Supported Platforms
  </text>
  <text x="620" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerMax, PowerStore
  </text>
  <text x="620" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Unity, VNX, VMAX legacy
  </text>
  <text x="620" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Windows, Linux, AIX
  </text>
  <text x="620" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Solaris, HP-UX
  </text>
  <text x="620" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC, iSCSI, NVMe-oF
  </text>

  <line x1="210" y1="170" x2="210" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="170" x2="620" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="210" width="400" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="210" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Load Balancing Policies
  </text>
  <text x="210" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Adaptive: queue-depth aware
  </text>
  <text x="210" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Least-Blocks: IO count
  </text>
  <text x="210" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Round-Robin: equal share
  </text>
  <text x="210" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Symm-Optimized: array-aware
  </text>
  <text x="210" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No-Rebalance: manual
  </text>

  <rect x="430" y="210" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="620" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management
  </text>
  <text x="620" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    powermt display: show paths
  </text>
  <text x="620" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    powermt manage: add/remove
  </text>
  <text x="620" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    emcpowervt: path test
  </text>
  <text x="620" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PPMA: multi-host GUI
  </text>
  <text x="620" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API: PPMA automation
  </text>

  <text x="410" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HBA cards in host servers; FC cables to SAN switches; zoned to storage ports;
  </text>
  <text x="410" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    minimum 2 paths per LUN (dual-fabric A+B) required for true redundancy.
  </text>

  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerPath = Dell host multipathing software; manages paths from host to array
  </text>
  <text x="410" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Multipathing = using multiple physical connections to same LUN; HA + load balance
  </text>
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Path = one physical connection: HBA port → FC switch → storage port
  </text>
  <text x="410" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MPIO = Microsoft/OS native multipath; PowerPath replaces this for Dell
  </text>
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Adaptive = default policy; monitors queue depth per path; moves busy load
  </text>
  <text x="410" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    powermt = PowerPath CLI tool; display, save, restore, manage paths
  </text>
  <text x="410" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PPMA = PowerPath Management Appliance; central multi-host management
  </text>
  <text x="410" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Failover = automatic reroute when a path goes down; transparent to host IO
  </text>
  <text x="410" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Trespass = legacy VNX path ownership transfer; PowerPath handles silently
  </text>
  <text x="410" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC path = Fibre Channel path from HBA WWN to storage port WWPN
  </text>
  <text x="410" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    iSCSI path = TCP/IP path from initiator IQN to storage target IQN
  </text>
  <text x="410" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    emcpowervt = PowerPath path verification tool; tests individual paths
  </text>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Host Multipathing Architecture
  </text>
</svg>