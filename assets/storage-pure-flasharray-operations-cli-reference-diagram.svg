<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Purity CLI Hierarchy</text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purity</text>
  </g>
  
  <g transform="translate(40, 90)">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    
    <g transform="translate(20, 0)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purearray</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">array identity, NTP, DNS, upgrade, phonehome</text>
    </g>
    
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purevol</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">volumes: create / resize / connect / snap</text>
    </g>
    
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purehost</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">host entries: WWN/IQN registration</text>
    </g>
    
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purehgroup</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">host groups: cluster-level volume masking</text>
    </g>
    
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purepgroup</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">protection groups: snapshot + replication</text>
    </g>
    
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purepod</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">ActiveCluster pods: sync replication</text>
    </g>
    
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">puredrive</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">drive health and status</text>
    </g>
    
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purehw</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">hardware components (fans, PSU, NVRAM)</text>
    </g>
    
    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">pureport</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">FC and Ethernet port info + WWNs</text>
    </g>
    
    <g transform="translate(20, 360)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purealert</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">alert management</text>
    </g>
    
    <g transform="translate(20, 400)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">pureaudit</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">audit log</text>
    </g>
    
    <g transform="translate(20, 440)">
      <rect x="0" y="0" width="760" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">pureadmin</text>
      <text x="100" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">user accounts, roles, API tokens</text>
    </g>
  </g>
  
  <rect x="0" y="480" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">CLI Reference Diagram</text>
</svg>