  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Datastore: VCSA thin-provisioned OVA</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">VLAN: isolated management segment</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">DNS: static A + PTR records</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">NTP: pool.ntp.org or internal PDC</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Firewall: permit 443, 5480, 902</text>
