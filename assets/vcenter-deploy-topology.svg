  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">rhttpproxy (reverse proxy :443)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">vpxd: core vCenter daemon</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">sso-service: token auth + SAML</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">vPostgres: inventory + events DB</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">VMCA: issue machine SSL certs</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">rhttpproxy: routes /ui, /api, /sdk</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">VAMI: lighttpd on port 5480</text>
