  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SDK / PowerCLI / Python</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">vSphere Client: HTML5 admin UI</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">VAMI: appliance settings only</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">REST API: /api/vcenter namespace</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">SSH: enable only when needed</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">PowerCLI: Connect-VIServer cmdlet</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">MOB: disable in production</text>
