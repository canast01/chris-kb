<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Dell Unity — Mid-Range Unified Storage Architecture
  </text>
  
  <rect x="10" y="50" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Platform
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unity XT: all-flash model
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unity hybrid: SSD+HDD tier
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dual SP (service processor)
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Active-passive SP failover
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FCoE: optional FC over Eth
  </text>
  
  <rect x="410" y="50" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Protocols
  </text>
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FC: block SAN (LUNs)
  </text>
  <text x="420" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    iSCSI: block over Ethernet
  </text>
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS: Linux/Unix file access
  </text>
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMB/CIFS: Windows shares
  </text>
  <text x="420" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FCoE: block over 10GbE
  </text>
  
  <line x1="200" y1="170" x2="200" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="170" x2="600" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="210" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Services
  </text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Thin provisioning: default
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshots: point-in-time
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Async replication: remote DR
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Sync replication: metro
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FAST VP: auto-tiering
  </text>
  
  <rect x="410" y="210" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="420" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unisphere XT: web UI
  </text>
  <text x="420" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    UEMCLI: REST-based CLI
  </text>
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: JSON
  </text>
  <text x="420" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vSphere plugin: VASA/vCenter
  </text>
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NAS server: file tenant unit
  </text>
  
  <text x="10" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unity chassis with two service processors (SP A, SP B); DAE disk shelves for
  </text>
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    expansion; FC or Ethernet switches for host connectivity.
  </text>
  
  <text x="10" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unity          = Dell mid-range unified storage; block + file from shared pools
  </text>
  <text x="10" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unity XT       = all-flash variant; AFA with NVMe-ready design
  </text>
  <text x="10" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SP             = Service Processor; the compute controller inside Unity chassis
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unisphere XT   = Unity web management console; REST-based; no thick client
  </text>
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    UEMCLI         = Unity CLI; runs over REST API; scripting-friendly
  </text>
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FAST VP        = Fully Automated Storage Tiering for Virtual Pools; auto-tier
  </text>
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NAS server     = virtual file server; multiple per Unity; own IP and auth
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VASA           = VMware storage APIs; Unity registers as a VASA provider
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Sync replication= Metro synchronous: write confirmed on both arrays before ack
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DAE            = Disk Array Enclosure; expansion shelf for Unity chassis
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FCoE           = Fibre Channel over Ethernet; consolidates SAN+LAN on 10GbE
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerStore     = Unity successor; migration tool available (Import+Migrate)
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Storage Architecture
  </text>
</svg>