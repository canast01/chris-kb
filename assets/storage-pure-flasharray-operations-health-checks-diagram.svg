<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashArray Health Check Sequence</text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purealert list</text>
    <line x1="300" y1="20" x2="350" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="360" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Any error/warning alerts?</text>
  </g>
  
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">puredrive list</text>
    <line x1="300" y1="20" x2="350" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="360" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">All drives healthy?</text>
  </g>
  
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purearray list --controller</text>
    <line x1="300" y1="20" x2="350" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="360" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Both CT0 + CT1 ok?</text>
  </g>
  
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purepod list</text>
    <line x1="300" y1="20" x2="350" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="360" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ActiveCluster pods stretched + replicating?</text>
  </g>
  
  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purearray list --space</text>
    <line x1="300" y1="20" x2="350" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="360" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Capacity &lt; 80% used?</text>
  </g>
  
  <g transform="translate(20, 300)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purehost list</text>
    <line x1="300" y1="20" x2="350" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="360" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">All hosts connected (no zero-path hosts)?</text>
  </g>
  
  <g transform="translate(20, 350)">
    <text x="0" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">OK — check Pure1 for fleet-level anomalies</text>
  </g>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Health Check Sequence</text>
</svg>