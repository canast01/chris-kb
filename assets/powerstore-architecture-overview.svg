<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">PowerStore — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DUAL-NODE APPLIANCE</text>

  <!-- Column 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Node A — I/O Module (Active)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Node B — I/O Module (Active)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Active-Active NVMe Fabric</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">NVMe SSDs (RAID 5/6)</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">NVDIMM Write Cache (Power-Safe)</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PROTOCOL &amp; FEATURES</text>

  <!-- Column 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">FC / iSCSI / NVMe-oF Block</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">NFS / SMB File (NAS)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">vVols / VASA (vSphere)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Kubernetes CSI Driver</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Inline Dedup + Compression</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">FAMILIES &amp; REPLICATION</text>

  <!-- Column 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="130" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">PowerStore T (500T–9000T)</text>
  <text x="678" y="142" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Scale-Out Up to 4 Appliances</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="170" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">PowerStore X (500X–9000X)</text>
  <text x="678" y="182" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">AppsOn — vSphere VMs on Array</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Metro Volume</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Sync Replication (Zero RPO)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Metro Volume Mediator</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">CloudIQ SaaS Analytics</text>

  <!-- Flow arrows -->
  <line x1="270" y1="200" x2="287" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="537" y1="200" x2="553" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="183" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">POWERSTORE T</text>
  <text x="411" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">POWERSTORE X (APPSON)</text>
  <text x="639" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">METRO VOLUME</text>

  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="183" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Scale-out up to 4 appliances</text>
  <text x="411" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Runs ESXi VMs on array nodes</text>
  <text x="639" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero RPO synchronous</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="183" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Block + File + vVols</text>
  <text x="411" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">No cluster scale-out</text>
  <text x="639" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Requires Mediator VM</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="183" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Same PowerStoreOS (microsvcs)</text>
  <text x="411" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Intel-based nodes</text>
  <text x="639" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">iSCSI jumbo frames required</text>

  <line x1="346" y1="510" x2="346" y2="618" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="573" y1="510" x2="573" y2="618" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
