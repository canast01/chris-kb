<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Virtualization Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">VMware vSphere / VCF · OpenShift Containers · VxRail HCI</text>

  <!-- COLUMN 1: VMware Core -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">VMware Core</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">VCF · vCenter · ESXi · NSX-T · vSAN</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VMware Cloud Foundation (VCF)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vCenter Server (management plane)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">ESXi (Type 1 hypervisor)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NSX-T (software-defined networking)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSAN (HCI / distributed storage)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">VCF = SDDC: vSphere + vSAN + NSX + LCM</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">SDDC Manager: bringup + upgrades</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">HA + DRS: VM availability + load balance</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">vMotion: live VM migration across hosts</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">NSX-T: DFW micro-seg + T0/T1 gateways</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">vSAN: SPBM policies; OSA/ESA architecture</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">PowerCLI: PowerShell automation layer</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">15 products covered in KB</text>

  <!-- COLUMN 2: VMware Product Line -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">VMware Product Line</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Horizon · SRM · Tanzu · Aria Suite</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Horizon (VDI / EUC)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SRM + vSphere Replication (DR)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Tanzu (Kubernetes platform)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Aria Operations (monitoring)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Aria Suite Lifecycle (LCM)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">Horizon: persistent + floating VDI pools</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">SRM: runbook-driven DR failover/failback</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Tanzu: multi-cluster K8s workload domains</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Aria Ops: metrics, capacity, compliance</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Aria Logs: log analytics + alerting</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Aria Networks: network visibility + flow</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Aria Automation: IaC + cloud template</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Scenarios + topics: cross-product runbooks</text>

  <!-- COLUMN 3: OpenShift & VxRail -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">OpenShift &amp; VxRail</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Containers · HCI Appliance</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">OpenShift (RHCP container platform)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">OVN-Kubernetes (CNI)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">ODF / Rook-Ceph (in-cluster storage)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VxRail (Dell HCI appliance)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VxRail Manager (node lifecycle)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">OCP: IPI / UPI / SNO / Hosted CP modes</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">etcd: cluster state; 3-node HA quorum</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">CVO: orchestrates OCP platform upgrades</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">ODF: Ceph (RBD/CephFS) via Rook operator</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">VxRail: Dell hardware + VMware stack</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">VxRail Manager: automated node expansion</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">VxRail 7.x: VCF-integrated deployment</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Tanzu on VxRail: K8s workload domains</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Platform Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="290" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VMware vSphere</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">OpenShift</text>
  <text x="670" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VxRail</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Workload type</text>
  <text x="290" y="562" text-anchor="middle" fill="#546e7a" font-size="9">VMs</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Containers (Pods)</text>
  <text x="670" y="562" text-anchor="middle" fill="#546e7a" font-size="9">VMs (HCI appliance)</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Management plane</text>
  <text x="290" y="587" text-anchor="middle" fill="#546e7a" font-size="9">vCenter</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">OCP Console + etcd</text>
  <text x="670" y="587" text-anchor="middle" fill="#546e7a" font-size="9">VxRail Manager + vCenter</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Networking</text>
  <text x="290" y="614" text-anchor="middle" fill="#546e7a" font-size="9">NSX-T / VDS</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">OVN-Kubernetes</text>
  <text x="670" y="614" text-anchor="middle" fill="#546e7a" font-size="9">NSX-T + VDS</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Storage</text>
  <text x="290" y="639" text-anchor="middle" fill="#546e7a" font-size="9">vSAN / external SAN</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">ODF / CSI</text>
  <text x="670" y="639" text-anchor="middle" fill="#546e7a" font-size="9">vSAN (built-in)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Target use</text>
  <text x="290" y="665" text-anchor="middle" fill="#546e7a" font-size="9">General enterprise infra</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Cloud-native app platform</text>
  <text x="670" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Appliance HCI / VCF</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Virtualization Reference · VMware VCF · vCenter · ESXi · NSX-T · vSAN · OpenShift · VxRail</text>
</svg>
