<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Cisco MDS — Architecture Overview</text>

  <!-- Column 1 header: Core Platform (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CORE PLATFORM</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">NX-OS operating system</text>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">MDS 9000 series FC switches</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">VSAN (Virtual SAN)</text>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">logical fabric isolation on shared HW</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Per-VSAN name server + zone DB</text>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">separate domain IDs per VSAN</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">ISSU (In-Service Software Upgrade)</text>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">zero-downtime NX-OS upgrades</text>

  <rect x="20" y="286" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PLATFORM REFERENCE</text>

  <rect x="20" y="332" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">MDS 9132T — 32× 32G FC (fixed)</text>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">MDS 9148T — 48× 32G FC (fixed)</text>

  <rect x="20" y="372" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">MDS 9396T — 96× 32G FC (fixed)</text>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">high-density edge switch</text>

  <rect x="20" y="412" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">MDS 9706 (384 FC) / 9710 (576 FC)</text>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">director class — modular, ISSU</text>

  <!-- Column 2 header: Dual-Fabric Topology (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DUAL-FABRIC TOPOLOGY</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Host HBA0 → MDS Director A</text>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">Host HBA1 → MDS Director B</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">MDS-9710 Director A (Fabric A)</text>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">independent failure domain</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">MDS-9710 Director B (Fabric B)</text>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">independent failure domain</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">4× 100G ISL between Directors A and B</text>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">cross-fabric ISL for IVR/FCIP</text>

  <rect x="287" y="286" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ADVANCED FEATURES</text>

  <rect x="287" y="332" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="348" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">IVR (Inter-VSAN Routing)</text>
  <text x="412" y="348" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">selective VSAN-to-VSAN access</text>

  <rect x="287" y="372" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">FCIP (FC over IP)</text>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">FC tunnels over WAN / IP network</text>

  <rect x="287" y="412" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Smart Zoning</text>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">auto-limit zone to host + storage pairs</text>

  <!-- Column 3 header: Zoning and Management (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ZONING &amp; MANAGEMENT</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">WWN-based zones (recommended)</text>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">device-portable, VSAN-scoped</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Enhanced Zoning</text>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">atomic zoneset activation</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">DCNM / NDFC management</text>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">GUI and API fabric controller</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">IOA (I/O Accelerator)</text>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">write acceleration for FCIP tunnels</text>

  <rect x="553" y="286" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SECURITY &amp; ANALYTICS</text>

  <rect x="553" y="332" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">FC-SP (FC Security Protocol)</text>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">DH-CHAP port authentication</text>

  <rect x="553" y="372" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Cisco Tetration / Nexus Insights</text>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">streaming telemetry analytics</text>

  <rect x="553" y="412" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">RBAC + AAA (TACACS+ / RADIUS)</text>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">centralised NX-OS auth</text>

  <!-- Comparison table -->
  <rect x="20" y="462" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Model</text>
  <text x="260" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Type</text>
  <text x="430" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Max FC Ports</text>
  <text x="640" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Notes</text>

  <rect x="20" y="492" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">MDS 9132T</text>
  <text x="260" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Fixed</text>
  <text x="430" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">32× 32G FC</text>
  <text x="640" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Entry/mid-range</text>

  <rect x="20" y="518" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">MDS 9396T</text>
  <text x="260" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Fixed</text>
  <text x="430" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">96× 32G FC</text>
  <text x="640" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">High-density fixed</text>

  <rect x="20" y="544" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">MDS 9706</text>
  <text x="260" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Director</text>
  <text x="430" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Up to 384 FC</text>
  <text x="640" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Modular director — ISSU</text>

  <rect x="20" y="570" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">MDS 9710</text>
  <text x="260" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Director</text>
  <text x="430" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Up to 576 FC</text>
  <text x="640" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Large-scale director — ISSU</text>

  <!-- Key notes -->
  <rect x="20" y="608" width="783" height="26" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="410" y="625" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">VSAN is the primary isolation mechanism — each VSAN has its own name server, zone database, and domain ID</text>

  <rect x="20" y="640" width="783" height="26" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="657" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">ISSU allows non-disruptive NX-OS upgrades on director-class switches without dropping fabric traffic</text>

  <rect x="20" y="672" width="783" height="26" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="410" y="689" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">IVR enables selective cross-VSAN routing — only defined initiator-target pairs traverse VSAN boundaries</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
