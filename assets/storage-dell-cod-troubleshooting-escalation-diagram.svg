<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">COD — Escalation</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open SR at support.dell.com with error output and SN comparison</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Specify in Notes which team should handle (Licensing vs TAC vs Account team)</text>
  </g>
  
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 140)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Key rejection / SN mismatch → Dell Licensing team</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Licensing re-generates the key with the correct SID</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SLA: 1 business day; for emergency capacity events, account team can expedite</text>
  </g>
  
  <line x1="410" y1="220" x2="410" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 250)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — Capacity not reflecting after valid key import → Dell TAC</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">TAC checks firmware version requirements and backend license flag state</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">May require a firmware update or a backend unlock on the PowerMax array</text>
  </g>
  
  <line x1="410" y1="330" x2="410" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 360)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Contract or billing dispute → Dell Account team</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Account team connects to Dell Contract Management</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Purchase order number required to locate the key history</text>
  </g>
  
  <line x1="410" y1="420" x2="410" y2="440" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 450)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If unresolved after 1 business day (P3) or 4 hours (P2):</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Add case update: "Requesting escalation — capacity expansion blocked since [date]"</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Contact your Dell account executive to expedite with the Licensing team</text>
  </g>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Diagram Type: Escalation Process</text>
</svg>