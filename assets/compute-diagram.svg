<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Compute Platform Overview
  </text>
  
  <rect x="10" y="40" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Compute Infrastructure
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Physical and virtual x86-64 servers running Linux and Windows Server workloads
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Remote access: SSH port 22 (Linux) · RDP port 3389 / WinRM 5985 (Windows)
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Out-of-band: Dell iDRAC · HP iLO · IPMI — independent of the host OS
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Automation: Bash/Python (Linux) · PowerShell/DSC (Windows) · Ansible across both
  </text>

  <line x1="410" y1="130" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="160" width="390" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="205" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Linux Server
  </text>
  <text x="205" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RHEL · Ubuntu · Debian · Rocky · Alpine
  </text>
  <text x="205" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Kernel: modules, parameters, namespaces
  </text>
  <text x="205" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    systemd: service management and boot
  </text>
  <text x="205" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LVM: flexible logical volume management
  </text>
  <text x="205" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Package mgmt: dnf / apt / rpm / dpkg
  </text>

  <rect x="420" y="160" width="390" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="615" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Windows Server
  </text>
  <text x="615" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Server 2019 · Server 2022 · Core mode
  </text>
  <text x="615" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Hyper-V: built-in Type 1 hypervisor
  </text>
  <text x="615" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Active Directory Domain Services (AD DS)
  </text>
  <text x="615" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NTFS · ReFS: file systems with ACLs
  </text>
  <text x="615" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Group Policy (GPO): central config
  </text>

  <line x1="205" y1="270" x2="205" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="270" x2="615" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="300" width="390" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="205" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Linux Operations
  </text>
  <text x="205" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSH remote access and key management
  </text>
  <text x="205" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Performance: perf/sar/iostat/vmstat
  </text>
  <text x="205" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Security: SELinux/AppArmor · auditd
  </text>
  <text x="205" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Logs: journalctl · rsyslog · logrotate
  </text>
  <text x="205" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Automation: Bash/Python · cron jobs
  </text>

  <rect x="420" y="300" width="390" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="615" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Windows Operations
  </text>
  <text x="615" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RDP and WinRM remote management
  </text>
  <text x="615" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Performance Monitor · Get-Counter
  </text>
  <text x="615" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Defender AV · Audit Policies · LAPS
  </text>
  <text x="615" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Event Viewer: logs and diagnostics
  </text>
  <text x="615" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerShell automation · Task Scheduler
  </text>

  <line x1="205" y1="410" x2="205" y2="430" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="410" x2="615" y2="430" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="440" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    SSH        │       RDP        │       WinRM       │   iDRAC / BMC    │  SNMP / Syslog
  </text>
  <text x="410" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Linux remote   │  Windows remote  │    PS remoting    │   Out-of-band    │    Monitoring
  </text>
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    TCP port 22    │  TCP port 3389   │    TCP 5985/86    │   IPMI / REST    │   UDP 161/162
  </text>
  <text x="410" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Key + cert auth  │  NLA + Kerberos  │   HTTP/S WS-Mgmt  │   DRAC web+CLI   │   MIB + traps
  </text>
  <text x="410" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SCP · SFTP · rsync│ mstsc.exe client │   Invoke-Command  │  Lifecycle Ctrl  │  Nagios/OpenNMS
  </text>

  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    x86-64 rack servers · NIC teaming · FC HBAs · iDRAC / iLO BMC · Power &amp; Cooling
  </text>

  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Key terms:
  </text>

  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    systemd = Linux PID 1; manages service units, timers, mounts, and boot targets
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LVM = Logical Volume Manager; PV → VG → LV abstraction for flexible disk layout
  </text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SELinux = Security-Enhanced Linux; mandatory access control via kernel labels
  </text>
  <text x="410" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AD DS = Active Directory Domain Services; LDAP directory + Kerberos KDC for auth
  </text>
  <text x="410" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GPO = Group Policy Object; settings pushed to computers and users via LDAP
  </text>
  <text x="410" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Hyper-V = Windows built-in Type 1 hypervisor; supports checkpoints and live migration
  </text>
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NTFS = New Technology File System; ACLs, compression, encryption, and quotas
  </text>
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WinRM = Windows Remote Management; WS-Management for PowerShell PSRemoting
  </text>
  <text x="410" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    iDRAC = Dell Integrated Remote Access Controller; out-of-band BMC for server mgmt
  </text>
  <text x="410" y="725" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LAPS = Local Admin Password Solution; rotates local admin passwords stored in AD
  </text>
  <text x="410" y="740" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    auditd = Linux audit daemon; logs syscall events for security compliance/forensics
  </text>
  <text x="410" y="755" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SNMP = Simple Network Management Protocol; polls device metrics and receives traps
  </text>

  <rect x="0" y="760" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="780" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Compute Platform Overview
  </text>
</svg>