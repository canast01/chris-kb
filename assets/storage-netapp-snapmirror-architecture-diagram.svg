<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    NetApp SnapMirror — Replication Architecture
  </text>
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ONTAP replication technology: async for DR, sync for Metro zero-RPO, SMBC for active-active; Cloud SnapMirror tiers to CVO on AWS/Azure/GCP.
  </text>
  <rect x="10" y="70" width="390" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Replication Modes
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Async: low RPO, remote DR
  </text>
  <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Sync: 0 RPO; metro stretch
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMBC: active-active; 0 RPO
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Vault: long-term retention
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unified: data + protection
  </text>
  <rect x="410" y="70" width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Use Cases
  </text>
  <text x="420" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DR: failover to secondary
  </text>
  <text x="420" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Metro: cross-site HA
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cloud: tier or migrate
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup: SnapVault copies
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dev/test: clone from mirror
  </text>
  <text x="10" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SMBC requires ONTAP Mediator for automated failover without manual intervention.
  </text>
  <line x1="200" y1="230" x2="200" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="230" x2="620" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="260" width="390" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Async Architecture
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshots transferred as deltas
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Schedule: hourly/daily/etc
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mirror: secondary read-only
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Failover: manual break-mirror
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lag: RPO = transfer interval
  </text>
  <rect x="410" y="260" width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Sync / SMBC Architecture
  </text>
  <text x="420" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Write completes both sites
  </text>
  <text x="420" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPO: zero (synchronous)
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMBC: both sides serve IO
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mediator: auto failover
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Max distance: 10ms RTT
  </text>
  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Primary ONTAP cluster and secondary ONTAP cluster (or CVO in cloud); intercluster
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LIFs on dedicated ports; WAN or DCI link between sites for replication traffic.
  </text>
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SnapMirror     = ONTAP replication technology; async, sync, or vault modes
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Async          = delta Snapshot transfers on schedule; best for remote DR sites
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Sync SnapMirror= write confirmed on both nodes before ACK; 0 RPO; requires low RTT
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMBC           = SnapMirror Business Continuity; active-active; both serve reads/writes
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SnapVault      = vault mode; secondary keeps more snapshots than primary
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPO            = Recovery Point Objective; how much data you can afford to lose
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Break mirror   = convert secondary from read-only to writable; DR activation step
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mediator       = ONTAP Mediator VM; tiebreaker for SMBC automated failover
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Intercluster LIF= dedicated IP address for cluster-to-cluster replication traffic
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cloud SnapMirror= replicate ONTAP volumes to Cloud Volumes ONTAP (CVO) on cloud
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lag time       = how far behind the secondary is; = RPO in async mode
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CVO            = Cloud Volumes ONTAP; ONTAP on public cloud; SnapMirror target
  </text>
  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: SnapMirror Architecture
  </text>
</svg>