<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Horizon VDI — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Connection Server · Unified Access Gateway · Desktop Pools · User Services</text>

  <!-- ═ COLUMN 1: Connection Server ═ -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="112" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Connection Server</text>
  <text x="112" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Broker · auth · entitlements</text>
  <rect x="30" y="126" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CS Windows Server</text>
  <rect x="30" y="152" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CS Replica (active/active)</text>
  <rect x="30" y="178" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Active Directory (auth)</text>
  <rect x="30" y="204" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Pool entitlements (LDAP)</text>
  <rect x="30" y="230" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VMware Horizon Console (UI)</text>
  <text x="112" y="282" text-anchor="middle" fill="#78909c" font-size="9">Brokers user → desktop assignments</text>
  <text x="112" y="300" text-anchor="middle" fill="#78909c" font-size="9">TCP 443 (HTTPS from clients)</text>
  <text x="112" y="318" text-anchor="middle" fill="#78909c" font-size="9">LDAP DB replicated between CS nodes</text>
  <text x="112" y="336" text-anchor="middle" fill="#78909c" font-size="9">Up to 7 CS replicas per pod</text>
  <text x="112" y="354" text-anchor="middle" fill="#78909c" font-size="9">True SSO: no password re-prompt</text>

  <!-- ═ COLUMN 2: Unified Access Gateway ═ -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#e65100" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#e65100"/>
  <text x="307" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Unified Access Gateway</text>
  <text x="307" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">DMZ · external access · MFA</text>
  <rect x="225" y="126" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="307" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">UAG OVA (DMZ-deployed)</text>
  <rect x="225" y="152" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="307" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Edge Service (Horizon proxy)</text>
  <rect x="225" y="178" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="307" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">RADIUS / RSA MFA</text>
  <rect x="225" y="204" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="307" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Blast tunnel (TCP 8443)</text>
  <rect x="225" y="230" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="307" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SAML IdP integration</text>
  <text x="307" y="282" text-anchor="middle" fill="#78909c" font-size="9">External users hit UAG (not CS)</text>
  <text x="307" y="300" text-anchor="middle" fill="#78909c" font-size="9">UAG proxies sessions to CS</text>
  <text x="307" y="318" text-anchor="middle" fill="#78909c" font-size="9">2 UAGs behind external load balancer</text>
  <text x="307" y="336" text-anchor="middle" fill="#78909c" font-size="9">Blast: UDP 8443 preferred</text>
  <text x="307" y="354" text-anchor="middle" fill="#78909c" font-size="9">Identity bridging for smart card</text>

  <!-- ═ COLUMN 3: Desktop Pools ═ -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#00695c"/>
  <text x="502" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Desktop Pools</text>
  <text x="502" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Instant Clone · Full Clone · RDS</text>
  <rect x="420" y="126" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Instant Clone (IC) Pool</text>
  <rect x="420" y="152" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Full Clone Pool</text>
  <rect x="420" y="178" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">RDS (published apps/desktops)</text>
  <rect x="420" y="204" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Golden Image (template/snapshot)</text>
  <rect x="420" y="230" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSphere / vSAN backend</text>
  <text x="502" y="282" text-anchor="middle" fill="#78909c" font-size="9">IC: clone-in-place, fast provisioning</text>
  <text x="502" y="300" text-anchor="middle" fill="#78909c" font-size="9">IC: parent VM + live clone technique</text>
  <text x="502" y="318" text-anchor="middle" fill="#78909c" font-size="9">Full Clone: independent, slower</text>
  <text x="502" y="336" text-anchor="middle" fill="#78909c" font-size="9">RDS: shared RDSH server sessions</text>
  <text x="502" y="354" text-anchor="middle" fill="#78909c" font-size="9">App Volumes for app delivery</text>

  <!-- ═ COLUMN 4: User Services ═ -->
  <rect x="605" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="185" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="605" y="100" width="185" height="14" fill="#6a1b9a"/>
  <text x="697" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">User Services</text>
  <text x="697" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">App Volumes · DEM · Protocols</text>
  <rect x="615" y="126" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">App Volumes (AppStacks)</text>
  <rect x="615" y="152" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Dynamic Env Manager (DEM)</text>
  <rect x="615" y="178" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Blast Extreme (display protocol)</text>
  <rect x="615" y="204" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">PCoIP protocol (legacy)</text>
  <rect x="615" y="230" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">USB / Clipboard / Drive redirect</text>
  <text x="697" y="282" text-anchor="middle" fill="#78909c" font-size="9">App Volumes: attach VMDK at login</text>
  <text x="697" y="300" text-anchor="middle" fill="#78909c" font-size="9">DEM: user profile + policy mgmt</text>
  <text x="697" y="318" text-anchor="middle" fill="#78909c" font-size="9">Blast: AES-256, H.264/HEVC</text>
  <text x="697" y="336" text-anchor="middle" fill="#78909c" font-size="9">Blast preferred over PCoIP</text>
  <text x="697" y="354" text-anchor="middle" fill="#78909c" font-size="9">Horizon Client: Windows/Mac/iOS/Android</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Pool Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="302" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Instant Clone</text>
  <text x="450" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Full Clone</text>
  <text x="597" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">RDS Published</text>
  <text x="742" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Persistent VDI</text>
  <line x1="220" y1="516" x2="220" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="385" y1="516" x2="385" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="515" y1="516" x2="515" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="680" y1="516" x2="680" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="562" text-anchor="middle" fill="#455a64" font-size="9">User data persists after logoff</text>
  <text x="302" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">Provisioning speed</text>
  <text x="302" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Seconds</text>
  <text x="450" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Minutes</text>
  <text x="597" y="587" text-anchor="middle" fill="#546e7a" font-size="9">N/A</text>
  <text x="742" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Minutes</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="613" text-anchor="middle" fill="#455a64" font-size="9">Storage footprint</text>
  <text x="302" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Low (shared base)</text>
  <text x="450" y="613" text-anchor="middle" fill="#546e7a" font-size="9">High (full VMDK/VM)</text>
  <text x="597" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Low (shared RDSH)</text>
  <text x="742" y="613" text-anchor="middle" fill="#546e7a" font-size="9">High</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">App Volumes support</text>
  <text x="302" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="450" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="302" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Task workers (stateless)</text>
  <text x="450" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Custom config per user</text>
  <text x="597" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Published applications</text>
  <text x="742" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Power users / devs</text>
  <text x="120" y="691" text-anchor="middle" fill="#455a64" font-size="9">Management overhead</text>
  <text x="302" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Low (golden image)</text>
  <text x="450" y="691" text-anchor="middle" fill="#546e7a" font-size="9">High (per-VM)</text>
  <text x="597" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Low</text>
  <text x="742" y="691" text-anchor="middle" fill="#546e7a" font-size="9">High (per-VM)</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware Horizon VDI Reference · Connection Server · UAG · Instant Clone · App Volumes · DEM</text>
</svg>
