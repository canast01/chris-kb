  </text>

  <rect x="0" y="600" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: CloudIQ Architecture
  </text>
</svg>