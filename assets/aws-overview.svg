<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Multi-Account Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Organizations · Management Account · Security Account · Log Archive · Workload Accounts</text>

  <!-- ═ COLUMN 1: Management Account ═ -->
  <rect x="20" y="72" width="180" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="180" height="42" fill="#1e3a8a" rx="6"/>
  <rect x="20" y="100" width="180" height="14" fill="#1e3a8a"/>
  <text x="110" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Management Account</text>
  <text x="110" y="111" text-anchor="middle" fill="#93c5fd" font-size="9">Org root · SCPs · SSO</text>

  <rect x="30" y="126" width="160" height="22" fill="#dbeafe" rx="3" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="141" text-anchor="middle" fill="#1e3a8a" font-size="9" font-weight="700">AWS Organizations (root)</text>
  <rect x="30" y="152" width="160" height="22" fill="#dbeafe" rx="3" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="167" text-anchor="middle" fill="#1e3a8a" font-size="9" font-weight="700">IAM Identity Center (SSO)</text>
  <rect x="30" y="178" width="160" height="22" fill="#dbeafe" rx="3" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="193" text-anchor="middle" fill="#1e3a8a" font-size="9" font-weight="700">Service Control Policies</text>
  <rect x="30" y="204" width="160" height="22" fill="#dbeafe" rx="3" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="219" text-anchor="middle" fill="#1e3a8a" font-size="9" font-weight="700">CloudTrail (org-wide)</text>
  <rect x="30" y="230" width="160" height="22" fill="#dbeafe" rx="3" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="245" text-anchor="middle" fill="#1e3a8a" font-size="9" font-weight="700">AWS Config (aggregator)</text>

  <text x="110" y="278" text-anchor="middle" fill="#78909c" font-size="9">No workloads permitted</text>
  <text x="110" y="296" text-anchor="middle" fill="#78909c" font-size="9">Delegates admin to Security acct</text>
  <text x="110" y="314" text-anchor="middle" fill="#78909c" font-size="9">SCPs applied to all OUs</text>
  <text x="110" y="332" text-anchor="middle" fill="#78909c" font-size="9">Single pane for SSO access</text>
  <text x="110" y="350" text-anchor="middle" fill="#78909c" font-size="9">Consolidated billing</text>
  <text x="110" y="368" text-anchor="middle" fill="#78909c" font-size="9">Billing Conductor / Cost Explorer</text>

  <!-- ═ COLUMN 2: Security Account ═ -->
  <rect x="220" y="72" width="180" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="220" y="72" width="180" height="42" fill="#b45309" rx="6"/>
  <rect x="220" y="100" width="180" height="14" fill="#b45309"/>
  <text x="310" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Security Account</text>
  <text x="310" y="111" text-anchor="middle" fill="#fcd34d" font-size="9">Delegated security admin</text>

  <rect x="230" y="126" width="160" height="22" fill="#fef3c7" rx="3" stroke="#fcd34d" stroke-width="1"/>
  <text x="310" y="141" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">GuardDuty (master)</text>
  <rect x="230" y="152" width="160" height="22" fill="#fef3c7" rx="3" stroke="#fcd34d" stroke-width="1"/>
  <text x="310" y="167" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">Security Hub (master)</text>
  <rect x="230" y="178" width="160" height="22" fill="#fef3c7" rx="3" stroke="#fcd34d" stroke-width="1"/>
  <text x="310" y="193" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">IAM Access Analyzer</text>
  <rect x="230" y="204" width="160" height="22" fill="#fef3c7" rx="3" stroke="#fcd34d" stroke-width="1"/>
  <text x="310" y="219" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">Inspector (delegated)</text>
  <rect x="230" y="230" width="160" height="22" fill="#fef3c7" rx="3" stroke="#fcd34d" stroke-width="1"/>
  <text x="310" y="245" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">Macie</text>

  <text x="310" y="278" text-anchor="middle" fill="#78909c" font-size="9">Aggregates security findings</text>
  <text x="310" y="296" text-anchor="middle" fill="#78909c" font-size="9">No workloads permitted</text>
  <text x="310" y="314" text-anchor="middle" fill="#78909c" font-size="9">Read-only org resource access</text>
  <text x="310" y="332" text-anchor="middle" fill="#78909c" font-size="9">Receives SCPs from org root</text>
  <text x="310" y="350" text-anchor="middle" fill="#78909c" font-size="9">Delegated admin from management</text>
  <text x="310" y="368" text-anchor="middle" fill="#78909c" font-size="9">SIEM / SOAR integration point</text>

  <!-- ═ COLUMN 3: Log Archive Account ═ -->
  <rect x="420" y="72" width="180" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="420" y="72" width="180" height="42" fill="#0f766e" rx="6"/>
  <rect x="420" y="100" width="180" height="14" fill="#0f766e"/>
  <text x="510" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Log Archive Account</text>
  <text x="510" y="111" text-anchor="middle" fill="#5eead4" font-size="9">Centralized immutable log storage</text>

  <rect x="430" y="126" width="160" height="22" fill="#ccfbf1" rx="3" stroke="#5eead4" stroke-width="1"/>
  <text x="510" y="141" text-anchor="middle" fill="#134e4a" font-size="9" font-weight="700">S3 Log Buckets (immutable)</text>
  <rect x="430" y="152" width="160" height="22" fill="#ccfbf1" rx="3" stroke="#5eead4" stroke-width="1"/>
  <text x="510" y="167" text-anchor="middle" fill="#134e4a" font-size="9" font-weight="700">CloudTrail Logs</text>
  <rect x="430" y="178" width="160" height="22" fill="#ccfbf1" rx="3" stroke="#5eead4" stroke-width="1"/>
  <text x="510" y="193" text-anchor="middle" fill="#134e4a" font-size="9" font-weight="700">VPC Flow Logs</text>
  <rect x="430" y="204" width="160" height="22" fill="#ccfbf1" rx="3" stroke="#5eead4" stroke-width="1"/>
  <text x="510" y="219" text-anchor="middle" fill="#134e4a" font-size="9" font-weight="700">AWS Config Snapshots</text>
  <rect x="430" y="230" width="160" height="22" fill="#ccfbf1" rx="3" stroke="#5eead4" stroke-width="1"/>
  <text x="510" y="245" text-anchor="middle" fill="#134e4a" font-size="9" font-weight="700">ALB / WAF Access Logs</text>

  <text x="510" y="278" text-anchor="middle" fill="#78909c" font-size="9">Immutable log retention</text>
  <text x="510" y="296" text-anchor="middle" fill="#78909c" font-size="9">No workloads permitted</text>
  <text x="510" y="314" text-anchor="middle" fill="#78909c" font-size="9">S3 Object Lock enforced</text>
  <text x="510" y="332" text-anchor="middle" fill="#78909c" font-size="9">Read-only for most roles</text>
  <text x="510" y="350" text-anchor="middle" fill="#78909c" font-size="9">Security team access only</text>
  <text x="510" y="368" text-anchor="middle" fill="#78909c" font-size="9">Compliance evidence archive</text>

  <!-- ═ COLUMN 4: Workload Account ═ -->
  <rect x="620" y="72" width="180" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="620" y="72" width="180" height="42" fill="#15803d" rx="6"/>
  <rect x="620" y="100" width="180" height="14" fill="#15803d"/>
  <text x="710" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Workload Account</text>
  <text x="710" y="111" text-anchor="middle" fill="#86efac" font-size="9">Production · Dev · Staging (isolated)</text>

  <rect x="630" y="126" width="160" height="22" fill="#dcfce7" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="710" y="141" text-anchor="middle" fill="#14532d" font-size="9" font-weight="700">VPC (dedicated per account)</text>
  <rect x="630" y="152" width="160" height="22" fill="#dcfce7" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="710" y="167" text-anchor="middle" fill="#14532d" font-size="9" font-weight="700">EC2 / EKS / Lambda</text>
  <rect x="630" y="178" width="160" height="22" fill="#dcfce7" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="710" y="193" text-anchor="middle" fill="#14532d" font-size="9" font-weight="700">RDS / Aurora / DynamoDB</text>
  <rect x="630" y="204" width="160" height="22" fill="#dcfce7" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="710" y="219" text-anchor="middle" fill="#14532d" font-size="9" font-weight="700">S3 / EFS / FSx</text>
  <rect x="630" y="230" width="160" height="22" fill="#dcfce7" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="710" y="245" text-anchor="middle" fill="#14532d" font-size="9" font-weight="700">ALB / CloudFront / Route 53</text>

  <text x="710" y="278" text-anchor="middle" fill="#78909c" font-size="9">Workloads run here</text>
  <text x="710" y="296" text-anchor="middle" fill="#78909c" font-size="9">Isolated per environment / team</text>
  <text x="710" y="314" text-anchor="middle" fill="#78909c" font-size="9">Connects via Transit Gateway</text>
  <text x="710" y="332" text-anchor="middle" fill="#78909c" font-size="9">Inherits SCPs from org root</text>
  <text x="710" y="350" text-anchor="middle" fill="#78909c" font-size="9">Direct Connect / VPN for hybrid</text>
  <text x="710" y="368" text-anchor="middle" fill="#78909c" font-size="9">Separate accounts per environment</text>

  <!-- ═ TRANSIT GATEWAY BAR ═ -->
  <rect x="20" y="475" width="780" height="32" fill="#312e81" rx="4"/>
  <text x="410" y="490" text-anchor="middle" fill="white" font-size="10" font-weight="700">Transit Gateway — Hub-and-Spoke</text>
  <text x="410" y="503" text-anchor="middle" fill="#a5b4fc" font-size="9">Direct Connect · VPN · Inter-Account Routing · Route 53 Private Hosted Zones</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="518" width="780" height="193" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="518" width="780" height="32" fill="#1a2744" rx="6"/>
  <rect x="20" y="538" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="540" text-anchor="middle" fill="white" font-size="13" font-weight="700">Account Capability Comparison</text>

  <!-- Column header row -->
  <rect x="20" y="550" width="780" height="26" fill="#eceff1"/>
  <text x="120" y="567" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Capability</text>
  <text x="292" y="567" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Management</text>
  <text x="437" y="567" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Security</text>
  <text x="582" y="567" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Log Archive</text>
  <text x="727" y="567" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Workload</text>

  <!-- Vertical dividers -->
  <line x1="220" y1="550" x2="220" y2="709" stroke="#dde2ec" stroke-width="1"/>
  <line x1="365" y1="550" x2="365" y2="709" stroke="#dde2ec" stroke-width="1"/>
  <line x1="510" y1="550" x2="510" y2="709" stroke="#dde2ec" stroke-width="1"/>
  <line x1="655" y1="550" x2="655" y2="709" stroke="#dde2ec" stroke-width="1"/>

  <!-- Row 1 (alt): Workloads permitted -->
  <rect x="20" y="576" width="780" height="27" fill="#f7f9fb"/>
  <text x="120" y="593" text-anchor="middle" fill="#455a64" font-size="9">Workloads permitted</text>
  <text x="292" y="594" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="437" y="594" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="582" y="594" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="727" y="594" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>

  <!-- Row 2: SCP enforcement source -->
  <text x="120" y="620" text-anchor="middle" fill="#455a64" font-size="9">SCP enforcement source</text>
  <text x="292" y="621" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="437" y="621" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="582" y="621" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="727" y="621" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>

  <!-- Row 3 (alt): GuardDuty role -->
  <rect x="20" y="630" width="780" height="27" fill="#f7f9fb"/>
  <text x="120" y="647" text-anchor="middle" fill="#455a64" font-size="9">GuardDuty role</text>
  <text x="292" y="647" text-anchor="middle" fill="#546e7a" font-size="9">Delegated admin</text>
  <text x="437" y="647" text-anchor="middle" fill="#546e7a" font-size="9">Master</text>
  <text x="582" y="647" text-anchor="middle" fill="#546e7a" font-size="9">Member</text>
  <text x="727" y="647" text-anchor="middle" fill="#546e7a" font-size="9">Member</text>

  <!-- Row 4: CloudTrail scope -->
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">CloudTrail scope</text>
  <text x="292" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Org-wide</text>
  <text x="437" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Consumer</text>
  <text x="582" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Storage</text>
  <text x="727" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Member trail</text>

  <!-- Row 5 (alt): Direct network access -->
  <rect x="20" y="684" width="780" height="27" fill="#f7f9fb"/>
  <text x="120" y="701" text-anchor="middle" fill="#455a64" font-size="9">Direct network access</text>
  <text x="292" y="702" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="437" y="702" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="582" y="702" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="727" y="702" text-anchor="middle" fill="#546e7a" font-size="9">Via TGW</text>

  <line x1="20" y1="709" x2="800" y2="709" stroke="#dde2ec" stroke-width="1"/>

  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Platform Reference · Organizations · IAM Identity Center · Transit Gateway · Service Control Policies</text>
</svg>
