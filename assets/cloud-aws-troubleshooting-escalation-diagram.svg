<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">AWS Escalation Process</text>

  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Self-service: check AWS Health Dashboard; resolve via AWS documentation or re:Post</text>
  </g>

  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Open support case at console.aws.amazon.com/support with appropriate severity</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Attach CloudTrail export, resource configuration, and timeline</text>
  </g>

  <line x1="410" y1="200" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 230)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — For Urgent cases: use AWS Chat support (Support Center → Chat) simultaneously</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">This reaches the same team faster than waiting for an email response</text>
  </g>

  <line x1="410" y1="290" x2="410" y2="310" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 320)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If no meaningful progress in 2 hours for Urgent / 1 business day for High:</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add a case update: "Requesting escalation — impact: [production revenue / user count affected]"</text>
  </g>

  <line x1="410" y1="380" x2="410" y2="400" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 410)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — Enterprise plan: contact your TAM (Technical Account Manager)</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAM can expedite case routing and engage AWS service teams directly</text>
    <text x="10" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAM contact details are in the AWS Support Console under Enterprise support</text>
  </g>

  <line x1="410" y1="470" x2="410" y2="490" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 500)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For data loss, security incidents, or 24h+ unresolved Urgent:</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request AWS Critical Situation team engagement through your TAM or account team</text>
    <text x="10" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Provide business impact in revenue-per-hour or user-count terms</text>
  </g>

  <rect x="0" y="590" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: AWS Escalation Process</text>
</svg>