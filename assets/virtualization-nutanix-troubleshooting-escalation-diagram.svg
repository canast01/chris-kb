<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Nutanix Escalation Process</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at portal.nutanix.com with NCC output and support bundle attached</text>
  </g>
  
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 130)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Nutanix T1 engineer acknowledges (S1: &lt; 30 min; S2: &lt; 4 hr)</text>
  </g>
  
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 210)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within 30 minutes for S1 or 4 hours for S2:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to Senior Support Engineer"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[CAN_TOLERATE=0 / VM down / Stargate I/O errors / data at risk]"</text>
  </g>
  
  <line x1="410" y1="280" x2="410" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 310)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Nutanix T2 Senior Engineer assigned</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will request Pulse remote access or a screen-share session</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Enable Pulse if not already active; or arrange a Jump Host for air-gapped envs</text>
  </g>
  
  <line x1="410" y1="380" x2="410" y2="400" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 410)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If the issue requires engineering involvement (AOS bug, Stargate regression):</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ T2 escalates to Nutanix Engineering</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide a targeted fix, hotfix build, or specific recovery procedure</text>
  </g>
  
  <line x1="410" y1="480" x2="410" y2="500" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 510)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For S1 with data loss or cluster offline, unresolved after 2 hours:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request Critical Situation (CritSit) escalation via the case</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Your Account Executive or Customer Success Manager can initiate CritSit</text>
  </g>
  
  <rect x="0" y="590" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>