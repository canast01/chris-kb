<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    NetApp SnapCenter — Centralized Backup Architecture
  </text>
  <rect x="10" y="50" width="390" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Architecture
  </text>
  <text x="205" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapCenter Server: Windows
  </text>
  <text x="205" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Plugins: per-app agents
  </text>
  <text x="205" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MySQL: internal metadata DB
  </text>
  <text x="205" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Web UI: browser-based
  </text>
  <text x="205" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API: 4.6+
  </text>
  <rect x="420" y="50" width="390" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Supported Applications
  </text>
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SQL Server: VSS quiesce
  </text>
  <text x="615" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Oracle: RMAN integration
  </text>
  <text x="615" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SAP HANA: Backint API
  </text>
  <text x="615" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VMware: VADP snapshots
  </text>
  <text x="615" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Exchange: VSS-aware
  </text>
  <line x1="205" y1="190" x2="205" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="190" x2="615" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="230" width="390" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Backup Flow
  </text>
  <text x="205" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Plugin quiesces app
  </text>
  <text x="205" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ONTAP Snapshot created
  </text>
  <text x="205" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapVault: vault to secondary
  </text>
  <text x="205" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Catalog: metadata stored
  </text>
  <text x="205" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Retention: policy-based
  </text>
  <rect x="420" y="230" width="390" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Cloning and DR
  </text>
  <text x="615" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Clone from Snapshot: instant
  </text>
  <text x="615" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dev/test: thin clone
  </text>
  <text x="615" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapMirror: DR failover
  </text>
  <text x="615" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Restore: volume or file
  </text>
  <text x="615" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMSQL: SQL-aware failover
  </text>
  <rect x="10" y="380" width="800" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Windows Server VM for SnapCenter; ONTAP primary + secondary HA pairs; management
  </text>
  <text x="410" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    network access from SnapCenter to ONTAP cluster-mgmt LIF on HTTPS.
  </text>
  <rect x="10" y="460" width="800" height="180" rx="6" fill="#ffffff" stroke="#455a64" />
  <text x="410" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapCenter = NetApp centralized backup and clone management server
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Plugin = per-application agent; installed on app server; quiesces app
  </text>
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VSS = Windows Volume Shadow Service; quiescence for SQL and Exchange
  </text>
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Snapshot = instant ONTAP point-in-time copy; no IO impact; basis for backup
  </text>
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapVault = vault-mode replication; keeps long-term backup copies on secondary
  </text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapMirror = DR replication; failover brings secondary ONTAP to primary role
  </text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Clone = writable thin copy from Snapshot; used for dev/test instantly
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Backint API = SAP HANA backup interface; SnapCenter speaks Backint natively
  </text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RMAN = Oracle recovery manager; SnapCenter plugin coordinates with it
  </text>
  <text x="410" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Retention policy = defines how many Snapshot copies to keep and for how long
  </text>
  <text x="410" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Catalog = SnapCenter database of all backups; needed for restore operations
  </text>
  <text x="410" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMSQL = SnapManager for SQL; legacy tool; replaced by SnapCenter plugin
  </text>
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Centralized Backup Architecture
  </text>
</svg>