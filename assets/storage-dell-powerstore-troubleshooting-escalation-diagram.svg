<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PowerStore — Escalation Process</text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Check SupportAssist for auto-opened case; if none, open case at dell.com/support</text>
  </g>
  
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Dell support engineer acknowledges (P1: within 1 hr; P2: within 4 hr)</text>
  </g>
  
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 210)">
    <rect x="0" y="0" width="780" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 1 hour for P1 or 4 hours for P2:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to Senior Engineer / TAM"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[hosts have no storage / Node A down / Metro broken]"</text>
  </g>
  
  <line x1="410" y1="280" x2="410" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 310)">
    <rect x="0" y="0" width="780" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — TAM (Technical Account Manager) assigned for ProSupport Plus contracts</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAM escalates to engineering and can expedite hardware dispatch</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have PSM and REST API access ready for a remote session</text>
  </g>
  
  <line x1="410" y1="380" x2="410" y2="400" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 410)">
    <rect x="0" y="0" width="780" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If hardware is confirmed failed:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Dell initiates hardware dispatch per your ProSupport contract SLA</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ For NBD: next business day; for 4h: parts dispatched within 4 hours</text>
  </g>
  
  <line x1="410" y1="480" x2="410" y2="500" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 510)">
    <rect x="0" y="0" width="780" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For P1 open more than 4 hours with no resolution:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Call Dell support and request escalation to the Duty Manager</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact your Dell Account Executive for executive-level escalation</text>
  </g>
  
  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>