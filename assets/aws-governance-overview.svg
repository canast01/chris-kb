<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Governance — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Organizations · SCPs · Account Structure · Config · Tagging · Compliance</text>

  <!-- ═ COLUMN 1: Account Structure ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Account Structure</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Organizations · OUs · Member Accounts</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">AWS Organizations (root)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Management Account</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Organizational Units (OUs)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Security / Audit Account</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Log Archive Account</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Workload Accounts (per env)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Mgmt account: billing + org policies only</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">OUs: Security, Infrastructure, Workloads</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Audit account: read-only cross-account role</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Log Archive: CloudTrail + Config central</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Separate dev/staging/prod accounts</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Account Factory for new account vending</text>

  <!-- ═ COLUMN 2: Policy & Control ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Policy &amp; Control</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">SCPs · Config Rules · AWS Control Tower</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Service Control Policies (SCPs)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">AWS Config Rules</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Config Conformance Packs</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">AWS Control Tower (guardrails)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Trusted Access (cross-account)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Delegated Administrator</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">SCPs: allowlist or denylist strategy</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Config: detect, alert, auto-remediate</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Conformance pack: CIS, PCI-DSS bundles</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Control Tower: landing zone setup</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Delegated admin: run sec tools centrally</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Preventive (SCPs) vs detective (Config)</text>

  <!-- ═ COLUMN 3: Standards & Audit ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Standards &amp; Audit</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Tagging · Naming · Compliance Review</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Mandatory Tags (Env, Owner, App)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Cost Allocation Tags</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Naming Conventions</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Compliance Review Cadence</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">AWS Artifact (compliance reports)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Security Hub Compliance Standards</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Tag policy enforced via AWS Organizations</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Cost tags: activate in Billing console</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Naming: {env}-{app}-{resource}-{region}</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Artifact: SOC 2, ISO 27001, PCI DSS</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Security Hub: CIS AWS Benchmark score</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Quarterly review: drift + access cleanup</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Preventive vs Detective Controls</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Control Type</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">SCP</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">AWS Config Rule</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Control Tower Guardrail</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Enforcement type</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Preventive (blocks action)</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Detective (flags drift)</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Both (preventive + detective)</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Scope</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">OU or account</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Per account or aggregated</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Landing zone wide</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Auto-remediation</text>
  <text x="340" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Depends on type</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Applies to root account</text>
  <text x="340" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Setup complexity</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Low (JSON policy)</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Low (managed rules)</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">High (landing zone)</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Hard deny guardrails</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Drift detection + reports</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">New org governance setup</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Governance Reference · Organizations · SCPs · Config · Control Tower · Tagging · Compliance</text>
</svg>
