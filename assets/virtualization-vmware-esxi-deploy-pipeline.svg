<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="500" fill="#f4f6f9"/>

  <!-- Title -->
  <rect x="0" y="0" width="820" height="52" fill="#1a2744"/>
  <text x="410" y="29" text-anchor="middle" fill="white" font-size="16" font-weight="700">ESXi Host Deployment — 6-Phase Process</text>
  <text x="410" y="45" text-anchor="middle" fill="#7a8fbb" font-size="10">vSphere 7.x / 8.x · Estimated time: 30–90 min per host</text>

  <!-- ── ROW 1 ── -->

  <!-- Box 1: Before you begin -->
  <rect x="15" y="62" width="188" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="15" y="62" width="188" height="28" fill="#455a64" rx="5"/>
  <rect x="15" y="80" width="188" height="10" fill="#455a64"/>
  <text x="109" y="79" text-anchor="middle" fill="white" font-size="10" font-weight="700">Before You Begin</text>
  <text x="109" y="112" text-anchor="middle" fill="#37474f" font-size="8.5">✔ vCenter admin + SSH access</text>
  <text x="109" y="127" text-anchor="middle" fill="#37474f" font-size="8.5">✔ DNS · NTP · network verified</text>
  <text x="109" y="142" text-anchor="middle" fill="#37474f" font-size="8.5">✔ Change request approved</text>
  <text x="109" y="157" text-anchor="middle" fill="#37474f" font-size="8.5">✔ Maintenance window set</text>
  <text x="109" y="172" text-anchor="middle" fill="#37474f" font-size="8.5">✔ Rollback plan ready</text>
  <text x="109" y="187" text-anchor="middle" fill="#37474f" font-size="8.5">✔ Min 2 hrs available</text>
  <text x="109" y="204" text-anchor="middle" fill="#90a4ae" font-size="7.5">PRE-FLIGHT</text>

  <!-- Arrow → -->
  <line x1="203" y1="138" x2="218" y2="138" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 2: Phase 1 Physical Host -->
  <rect x="220" y="62" width="188" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="220" y="62" width="188" height="28" fill="#1565c0" rx="5"/>
  <rect x="220" y="80" width="188" height="10" fill="#1565c0"/>
  <text x="314" y="76" text-anchor="middle" fill="white" font-size="9" font-weight="700">Phase 1 — Physical Host</text>
  <text x="314" y="88" text-anchor="middle" fill="#90caf9" font-size="8">Readiness</text>
  <text x="314" y="112" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Firmware: BIOS · HBA · NIC</text>
  <text x="314" y="127" text-anchor="middle" fill="#37474f" font-size="8.5">▸ BIOS: VT-x · VT-d · HT on</text>
  <text x="314" y="142" text-anchor="middle" fill="#37474f" font-size="8.5">▸ DNS A + PTR records created</text>
  <text x="314" y="157" text-anchor="middle" fill="#37474f" font-size="8.5">▸ NTP reachability verified</text>
  <text x="314" y="172" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Cabling plan confirmed</text>
  <text x="314" y="187" text-anchor="middle" fill="#37474f" font-size="8.5">▸ HCL compatibility checked</text>
  <text x="314" y="204" text-anchor="middle" fill="#90a4ae" font-size="7.5">HARDWARE</text>

  <!-- Arrow → -->
  <line x1="408" y1="138" x2="423" y2="138" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 3: Phase 2 Installation -->
  <rect x="425" y="62" width="188" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="425" y="62" width="188" height="28" fill="#6a1b9a" rx="5"/>
  <rect x="425" y="80" width="188" height="10" fill="#6a1b9a"/>
  <text x="519" y="76" text-anchor="middle" fill="white" font-size="9" font-weight="700">Phase 2 — ESXi Installation</text>
  <text x="519" y="88" text-anchor="middle" fill="#ce93d8" font-size="8">ISO · PXE · Scripted</text>
  <text x="519" y="112" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Boot from ISO / PXE / USB</text>
  <text x="519" y="127" text-anchor="middle" fill="#37474f" font-size="8.5">▸ License key applied</text>
  <text x="519" y="142" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Root password set</text>
  <text x="519" y="157" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Management IP / mask / GW</text>
  <text x="519" y="172" text-anchor="middle" fill="#37474f" font-size="8.5">▸ VMFS on local disk created</text>
  <text x="519" y="187" text-anchor="middle" fill="#37474f" font-size="8.5">▸ First boot verified</text>
  <text x="519" y="204" text-anchor="middle" fill="#90a4ae" font-size="7.5">INSTALL</text>

  <!-- Arrow → -->
  <line x1="613" y1="138" x2="628" y2="138" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 4: Phase 3 Network -->
  <rect x="630" y="62" width="175" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="630" y="62" width="175" height="28" fill="#e65100" rx="5"/>
  <rect x="630" y="80" width="175" height="10" fill="#e65100"/>
  <text x="717" y="76" text-anchor="middle" fill="white" font-size="9" font-weight="700">Phase 3 — Network</text>
  <text x="717" y="88" text-anchor="middle" fill="#ffcc80" font-size="8">Configuration</text>
  <text x="717" y="112" text-anchor="middle" fill="#37474f" font-size="8.5">▸ vmk0 management IP set</text>
  <text x="717" y="127" text-anchor="middle" fill="#37474f" font-size="8.5">▸ vmk1 vMotion vmknic</text>
  <text x="717" y="142" text-anchor="middle" fill="#37474f" font-size="8.5">▸ vmk2/3 vSAN / iSCSI</text>
  <text x="717" y="157" text-anchor="middle" fill="#37474f" font-size="8.5">▸ dvSwitch / vSwitch uplinks</text>
  <text x="717" y="172" text-anchor="middle" fill="#37474f" font-size="8.5">▸ VLAN tagging configured</text>
  <text x="717" y="187" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Firewall rules applied</text>
  <text x="717" y="204" text-anchor="middle" fill="#90a4ae" font-size="7.5">NETWORKING</text>

  <!-- ── ROW 1 → ROW 2 wrap arrow (right-side down) ── -->
  <line x1="805" y1="170" x2="805" y2="244" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="805" y1="244" x2="15" y2="244" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="15" y1="244" x2="15" y2="258" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 2 ── -->

  <!-- Box 5: Phase 4 Storage -->
  <rect x="15" y="262" width="188" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="15" y="262" width="188" height="28" fill="#00695c" rx="5"/>
  <rect x="15" y="280" width="188" height="10" fill="#00695c"/>
  <text x="109" y="276" text-anchor="middle" fill="white" font-size="9" font-weight="700">Phase 4 — Storage</text>
  <text x="109" y="288" text-anchor="middle" fill="#80cbc4" font-size="8">Configuration</text>
  <text x="109" y="312" text-anchor="middle" fill="#37474f" font-size="8.5">▸ iSCSI / NFS targets added</text>
  <text x="109" y="327" text-anchor="middle" fill="#37474f" font-size="8.5">▸ VMFS datastores mounted</text>
  <text x="109" y="342" text-anchor="middle" fill="#37474f" font-size="8.5">▸ PSP / path policy set</text>
  <text x="109" y="357" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Multipathing verified</text>
  <text x="109" y="372" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Datastore latency checked</text>
  <text x="109" y="387" text-anchor="middle" fill="#37474f" font-size="8.5">▸ vSAN disk groups (if used)</text>
  <text x="109" y="404" text-anchor="middle" fill="#90a4ae" font-size="7.5">STORAGE</text>

  <!-- Arrow → -->
  <line x1="203" y1="338" x2="218" y2="338" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 6: Phase 5 Add to vCenter -->
  <rect x="220" y="262" width="188" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="220" y="262" width="188" height="28" fill="#283593" rx="5"/>
  <rect x="220" y="280" width="188" height="10" fill="#283593"/>
  <text x="314" y="276" text-anchor="middle" fill="white" font-size="9" font-weight="700">Phase 5 — Add to vCenter</text>
  <text x="314" y="288" text-anchor="middle" fill="#9fa8da" font-size="8">Join Cluster</text>
  <text x="314" y="312" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Add Host wizard (FQDN)</text>
  <text x="314" y="327" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Place in target cluster</text>
  <text x="314" y="342" text-anchor="middle" fill="#37474f" font-size="8.5">▸ HA agent installed</text>
  <text x="314" y="357" text-anchor="middle" fill="#37474f" font-size="8.5">▸ DRS configured</text>
  <text x="314" y="372" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Host profile applied</text>
  <text x="314" y="387" text-anchor="middle" fill="#37474f" font-size="8.5">▸ vCenter alarm reviewed</text>
  <text x="314" y="404" text-anchor="middle" fill="#90a4ae" font-size="7.5">CLUSTER JOIN</text>

  <!-- Arrow → -->
  <line x1="408" y1="338" x2="423" y2="338" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 7: Phase 6 Hardening -->
  <rect x="425" y="262" width="188" height="152" fill="#fff" rx="5" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="425" y="262" width="188" height="28" fill="#b71c1c" rx="5"/>
  <rect x="425" y="280" width="188" height="10" fill="#b71c1c"/>
  <text x="519" y="276" text-anchor="middle" fill="white" font-size="9" font-weight="700">Phase 6 — Hardening</text>
  <text x="519" y="288" text-anchor="middle" fill="#ef9a9a" font-size="8">Baseline &amp; Security</text>
  <text x="519" y="312" text-anchor="middle" fill="#37474f" font-size="8.5">▸ SSH timeout set</text>
  <text x="519" y="327" text-anchor="middle" fill="#37474f" font-size="8.5">▸ NTP sync confirmed</text>
  <text x="519" y="342" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Syslog to central server</text>
  <text x="519" y="357" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Firewall profile locked</text>
  <text x="519" y="372" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Lockdown mode configured</text>
  <text x="519" y="387" text-anchor="middle" fill="#37474f" font-size="8.5">▸ Secure Boot re-enabled</text>
  <text x="519" y="404" text-anchor="middle" fill="#90a4ae" font-size="7.5">HARDENING</text>

  <!-- Arrow → -->
  <line x1="613" y1="338" x2="628" y2="338" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 8: Verify -->
  <rect x="630" y="262" width="175" height="152" fill="#e8f5e9" rx="5" stroke="#81c784" stroke-width="1.5"/>
  <rect x="630" y="262" width="175" height="28" fill="#2e7d32" rx="5"/>
  <rect x="630" y="280" width="175" height="10" fill="#2e7d32"/>
  <text x="717" y="279" text-anchor="middle" fill="white" font-size="11" font-weight="700">✓ Verify</text>
  <text x="717" y="312" text-anchor="middle" fill="#1b5e20" font-size="8.5">▸ Host shows Connected</text>
  <text x="717" y="327" text-anchor="middle" fill="#1b5e20" font-size="8.5">▸ Test VM migration passes</text>
  <text x="717" y="342" text-anchor="middle" fill="#1b5e20" font-size="8.5">▸ HA failover test</text>
  <text x="717" y="357" text-anchor="middle" fill="#1b5e20" font-size="8.5">▸ Network throughput OK</text>
  <text x="717" y="372" text-anchor="middle" fill="#1b5e20" font-size="8.5">▸ Backup schedule active</text>
  <text x="717" y="387" text-anchor="middle" fill="#1b5e20" font-size="8.5">▸ Change record closed</text>
  <text x="717" y="404" text-anchor="middle" fill="#388e3c" font-size="7.5">SIGN-OFF</text>

  <!-- Footer -->
  <text x="410" y="482" text-anchor="middle" fill="#90a4ae" font-size="9">VMware ESXi Deployment Reference · vSphere 7.x / 8.x</text>
  <text x="410" y="494" text-anchor="middle" fill="#90a4ae" font-size="8">Change management must be completed before starting Phase 1</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#546e7a"/>
    </marker>
  </defs>
</svg>
