<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Pure FlashArray — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Dual-Controller HA · Purity//FA · ActiveCluster · Protection Groups · NVMe/FC</text>

  <!-- ═ COLUMN 1: Hardware Platform ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Hardware Platform</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">CT0 · CT1 · DirectFlash Modules · NVRAM</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Dual Controllers (CT0 + CT1)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">DirectFlash Modules (DFMs)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NVRAM (write cache + durability)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FlashArray //X (TLC NVMe)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FlashArray //C (QLC NVMe)</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FlashArray //E (QLC high-density)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Active-active: both CTs serve I/O</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">DFMs: NVMe attached directly to OS</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">NVRAM mirrored between CT0 and CT1</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">//X: &lt;500 µs latency, tier-1 block</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">//C: secondary, staging, dev/test</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Shelf expansion: DFM expansion shelves</text>

  <!-- ═ COLUMN 2: Data Services ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Purity Data Services</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">ActiveCluster · ActiveDR · Snapshots</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ActiveCluster (sync stretch)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ActiveDR (async replication)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Protection Groups + Schedules</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Volume Snapshots</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Pods (ActiveCluster namespace)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SafeMode Snapshots (immutable)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">ActiveCluster: RPO=0, RTO=0 stretch HA</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">ActiveDR: async, RPO minutes, per-pod</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Prot. Group: volumes + snapshots + repl</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Mediator: tie-break for ActiveCluster</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">SafeMode: immutable for ransomware</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Inline dedupe + compression always on</text>

  <!-- ═ COLUMN 3: Connectivity ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Host Connectivity</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">FC · NVMe/FC · iSCSI · NVMe/RoCE · Pure1</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Fibre Channel (16 / 32 Gb/s)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">NVMe/FC (32 Gb/s NVMe native)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">iSCSI (10 / 25 GbE)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">NVMe/RoCE (RDMA over Ethernet)</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Pure1 (cloud management + telemetry)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">REST API v2 / CLI (purectl)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Dual fabric A/B recommended for HA</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">NVMe/FC: lowest latency SAN option</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">iSCSI: MPIO required, CHAP optional</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Pure1: predictive analytics, health score</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">vSphere: VMFS, raw device maps, vVols</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Host group: volumes → multiple hosts</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">FlashArray Model Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">FlashArray //X</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">FlashArray //C</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">FlashArray //E</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Flash type</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">TLC NVMe</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">QLC NVMe</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">High-density QLC</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Target workload</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Tier-1 DB, VDI, OLTP</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Secondary, dev/test, staging</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Consolidation, large archive</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Latency profile</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">&lt;500 µs</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Low (higher than //X)</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Moderate</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">ActiveCluster support</text>
  <text x="340" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Check release notes</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">$/TB</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Highest</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Mid-range</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Lowest</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">NVMe protocol</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">NVMe/FC, NVMe/RoCE</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">NVMe/FC</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">FC / iSCSI</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Pure FlashArray Reference · Purity//FA · ActiveCluster · ActiveDR · NVMe/FC · Protection Groups · Pure1</text>
</svg>
