<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Linux Server — Architecture Overview</text>

  <!-- Column 1: Kernel & OS -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Kernel &amp; OS</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Linux Kernel (RHEL / Ubuntu)</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">systemd (service management)</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">SELinux / AppArmor</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PAM Authentication</text>
  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">auditd (audit logging)</text>

  <!-- Column 2: Storage Stack -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Storage Stack</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">LVM2 (logical volumes)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">dm-multipath (SAN paths)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">XFS / ext4 filesystems</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">NFS / CIFS mounts</text>
  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Block Devices (/dev/mapper/)</text>

  <!-- Column 3: Network Stack -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Network Stack</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">NetworkManager</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Bonding / LACP (bond0)</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">firewalld / nftables</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SSH (sshd port 22)</text>
  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">VLAN sub-interfaces</text>

  <!-- Comparison Table -->
  <rect x="20" y="360" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Attribute</text>
  <text x="310" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RHEL 8/9</text>
  <text x="510" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Ubuntu 22.04/24.04</text>
  <text x="701" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SLES 15</text>

  <rect x="20" y="390" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Security Module</text>
  <text x="310" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">SELinux</text>
  <text x="510" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">AppArmor</text>
  <text x="701" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">AppArmor</text>

  <rect x="20" y="416" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Package Mgr</text>
  <text x="310" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">dnf / rpm</text>
  <text x="510" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">apt / dpkg</text>
  <text x="701" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">zypper / rpm</text>

  <rect x="20" y="442" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Support</text>
  <text x="310" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Red Hat (10 yr)</text>
  <text x="510" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Canonical (5/10 yr ESM)</text>
  <text x="701" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">SUSE (10 yr LTSS)</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
