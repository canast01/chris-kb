<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Venafi — Architecture Overview</text>

  <!-- Column 1: Trust Protection Platform (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Trust Protection Platform</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Policy Server (primary)</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">lifecycle mgmt + policy enforcement</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Policy Server (secondary)</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">HA pair behind load balancer</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">SQL Server (shared backend)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Edge Proxy (network segments)</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Log Server (audit events)</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="330" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">VaaS / TLS Protect Cloud</text>
  <text x="145" y="342" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(SaaS alternative to TPP)</text>

  <!-- Column 2: CA Connectors & Discovery (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CA Connectors &amp; Discovery</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">CA Connector — ADCS</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">CA Connector — DigiCert</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">CA Connector — Entrust</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="250" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Discovery Engine</text>
  <text x="412" y="262" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(network scan / agent-based)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Auto-Renewal &amp; Provisioning</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Policy Tree Enforcement</text>

  <!-- Column 3: Integration & Automation (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Automation &amp; Integration</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Venafi REST API / SDK</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">CI/CD Pipeline Integration</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Ansible / Terraform Modules</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SIEM / SNMP Forwarding</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Expiry / Compliance Alerts</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Admin Web Portal (TPP UI)</text>

  <!-- Component table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="145" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="380" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Role</text>
  <text x="640" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Deployment</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Policy Server</text>
  <text x="380" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Lifecycle mgmt, CA integration, policy</text>
  <text x="640" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">On-prem VM (primary + secondary)</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Edge Proxy</text>
  <text x="380" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Certificate discovery across segmented networks</text>
  <text x="640" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Lightweight on-prem agent</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Log Server</text>
  <text x="380" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Audit event aggregation &amp; SIEM forwarding</text>
  <text x="640" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">On-prem VM or syslog target</text>

  <rect x="20" y="498" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CA Connectors</text>
  <text x="380" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Integration adapters for ADCS, DigiCert, Entrust</text>
  <text x="640" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Configured on Policy Server</text>

  <rect x="20" y="524" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Venafi REST API</text>
  <text x="380" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Automation and integration interface</text>
  <text x="640" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Consumed by CI/CD and scripts</text>

  <!-- TPP capabilities -->
  <rect x="20" y="572" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="592" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">TPP Capabilities</text>

  <rect x="20" y="602" width="250" height="26" fill="#f1f5f9"/>
  <text x="145" y="619" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Certificate inventory &amp; visibility</text>
  <rect x="287" y="602" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="619" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Policy-based issuance enforcement</text>
  <rect x="553" y="602" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="619" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Automated cert renewal workflows</text>

  <rect x="20" y="628" width="250" height="26" fill="#ffffff"/>
  <text x="145" y="645" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CA agnostic (multi-CA support)</text>
  <rect x="287" y="628" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="645" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Network-wide certificate discovery</text>
  <rect x="553" y="628" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="645" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Expiry alerting &amp; compliance reporting</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
