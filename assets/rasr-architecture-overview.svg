<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">RASR — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Capture Phase</text>

  <!-- Col 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">RASR Agent</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(Windows service)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Sector-Level Image</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">SMB Recovery Share</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(image destination)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Scheduled Capture</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Boot &amp; Recovery</text>

  <!-- Col 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">iDRAC Virtual Media</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(mounts RASR ISO remotely)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">WinPE Boot Environment</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(Dell hardware drivers)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">PERC + NIC Drivers</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="250" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Map SMB Share</text>
  <text x="412" y="262" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(net use Z: \\nas\rasr)</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Restore Phase</text>

  <!-- Col 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Select Recovery Image</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Write Image to Disk</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Restore Partition Table</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Post-Restore Validation</text>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="160" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RASR</text>
  <text x="420" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Windows Server Backup</text>
  <text x="680" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">WBAdmin</text>

  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="557" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Type</text>
  <text x="160" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Sector-level image (compressed)</text>
  <text x="420" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Volume-level VSS backup</text>
  <text x="680" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">CLI wrapper for Windows Backup</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="583" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Bare-Metal</text>
  <text x="160" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Yes — full disk image restore</text>
  <text x="420" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Yes — with WinPE media</text>
  <text x="680" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Yes — via Windows RE</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="609" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">iDRAC Integration</text>
  <text x="160" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Yes — virtual media mount</text>
  <text x="420" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">No native integration</text>
  <text x="680" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">No native integration</text>

  <rect x="20" y="618" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Image Format</text>
  <text x="160" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Proprietary sector image</text>
  <text x="420" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">VHD / VHDX</text>
  <text x="680" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">VHD / VHDX (CLI)</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
