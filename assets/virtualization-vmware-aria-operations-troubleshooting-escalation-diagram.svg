<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Aria Operations Escalation
  </text>
  
  <rect x="10" y="50" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Step 1 — Collect Data
  </text>
  <text x="200" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Generate support bundle via UI or VAMI
  </text>
  <text x="200" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Capture cluster node status from Admin UI
  </text>
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Note Aria Ops version + cluster size
  </text>
  <text x="200" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Collect adapter error details + timeline
  </text>
  <text x="200" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Write timeline: last good → first failure
  </text>

  <rect x="410" y="50" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Step 2 — Open the SR
  </text>
  <text x="600" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Go to support.broadcom.com → sign in
  </text>
  <text x="600" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Product: VMware Aria Operations
  </text>
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Severity: P1 down / P2 degraded / P3 minor
  </text>
  <text x="600" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Attach support bundle + cluster status
  </text>
  <text x="600" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Include vROps version and node topology
  </text>

  <line x1="410" y1="180" x2="410" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="230" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Step 3 — Escalation Path
  </text>
  <text x="200" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    T1: triage + confirm bundle received
  </text>
  <text x="200" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    T2: Aria Ops SE assigned; deep analysis
  </text>
  <text x="200" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    T3: engineering review for code-level fix
  </text>
  <text x="200" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CritSit: P1 monitoring down &gt; 2 hours
  </text>

  <rect x="410" y="230" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    What NOT to Do
  </text>
  <text x="600" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Do not delete adapters during investigation
  </text>
  <text x="600" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Do not restart all services on all nodes
  </text>
  <text x="600" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Do not reboot cluster nodes without GSS
  </text>
  <text x="600" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Do not apply upgrade mid-incident
  </text>

  <rect x="10" y="370" width="800" height="200" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Adapter = Aria Ops data collection plugin; one adapter per monitored product
  </text>
  <text x="410" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Master node = primary Aria Ops cluster node; hosts the UI and orchestrates collection
  </text>
  <text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Replica node = additional Aria Ops nodes for HA and capacity; collect data in parallel
  </text>
  <text x="410" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Data node = optional remote nodes for geographically distributed collection
  </text>
  <text x="410" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VAMI = Virtual Appliance Management Interface; port 5480; cluster health UI
  </text>
  <text x="410" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PAK file = Aria Ops management pack archive; used to install adapter plugins
  </text>
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    services.sh = Aria Ops cluster service management script
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CaSA = Aria Ops support bundle tool; /usr/lib/vmware-casa/casa-support-bundle.sh
  </text>
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GSS = Global Support Services; Broadcom/VMware support team
  </text>
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CritSit = Critical Situation; Broadcom war room; triggered for prolonged monitoring outage
  </text>

  <rect x="0" y="580" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Escalation Process
  </text>
</svg>