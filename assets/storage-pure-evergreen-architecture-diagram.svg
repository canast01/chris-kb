<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Pure Evergreen — Subscription Upgrade Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Evergreen subscription ensures non-disruptive controller upgrades for life of contract;
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    customer owns/leases hardware; Pure delivers new controllers without downtime.
  </text>

  <rect x="10" y="80" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Subscription Model
  </text>
  <text x="200" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Customer purchases array
  </text>
  <text x="200" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Evergreen: software + support
  </text>
  <text x="200" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Annual: Purity upgrades included
  </text>
  <text x="200" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Term: 3 or 5 year options
  </text>
  <text x="200" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No forklift: ever promised
  </text>

  <rect x="410" y="80" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Upgrade Model
  </text>
  <text x="600" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    New controllers delivered
  </text>
  <text x="600" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Shelf + drives stay in place
  </text>
  <text x="600" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Controller swap: &lt; 30 min
  </text>
  <text x="600" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No migration of data needed
  </text>
  <text x="600" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IO: continues during swap
  </text>

  <text x="10" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Evergreen is the foundation; Evergreen//One adds Pure managing the hardware for you.
  </text>

  <line x1="200" y1="230" x2="200" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="230" x2="600" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="260" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Upgrade Generations
  </text>
  <text x="200" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    //X: NVMe director upgrade
  </text>
  <text x="200" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    //C: capacity NVMe upgrade
  </text>
  <text x="200" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    //XL: extreme performance
  </text>
  <text x="200" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Director modules: hot-swap
  </text>
  <text x="200" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Same shelf across generations
  </text>

  <rect x="410" y="260" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Evergreen vs Evergreen//One
  </text>
  <text x="600" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Evergreen: you own HW
  </text>
  <text x="600" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Evergreen//One: Pure owns HW
  </text>
  <text x="600" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Both: no forklift guarantee
  </text>
  <text x="600" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Both: Pure does controller
  </text>
  <text x="600" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    //One: STaaS billing model
  </text>

  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FlashArray chassis with drive shelves; new controllers arrive in 2U modules;
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pure engineer does the swap on-site; drives and shelves are re-used.
  </text>

  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Evergreen      = Pure subscription model; controller upgrades included in contract
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Forklift       = replacing entire storage array; Evergreen specifically avoids this
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Controller     = FlashArray compute module; upgrades move to new generation
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Director module= FlashArray controller; single or dual per chassis; hot-swap
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Purity//FA     = FlashArray OS; upgrades included in Evergreen subscription
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Non-disruptive = IO continues during controller swap; no maintenance window
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //X series     = NVMe-optimized FlashArray generation (current)
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //C series     = capacity-optimized; QLC NVMe for colder workloads
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //XL series    = extreme performance; enterprise-scale block storage
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Evergreen//One = STaaS variant; Pure manages hardware; customer just consumes
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Shelf reuse    = drive enclosures remain across controller generations
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    3/5-year term  = common contract length; upgrade entitlement during term
  </text>

  <rect x="0" y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Architecture Overview
  </text>
</svg>