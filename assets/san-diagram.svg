<svg xmlns="http://www.w3.org/2000/svg" width="820" height="880" viewBox="0 0 820 880">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    SAN Fabric Overview
  </text>
  
  <g transform="translate(10, 40)">
    <rect width="800" height="75" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      SAN Fabric Management
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Cisco: DCNM / Nexus Dashboard · CLI · NX-OS REST API · SNMP · Syslog
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Brocade: SANnav Portal · Fabric OS CLI · REST API · SNMP trap forwarding
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Both vendors: fabric-wide zoning, ISL monitoring, and performance dashboards
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      REST APIs enable programmable fabric automation and health integration
    </text>
  </g>
  
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Management platforms provide fabric-wide visibility, zoning, and lifecycle control
  </text>
  
  <line x1="410" y1="140" x2="410" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 170)">
    <rect width="390" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Cisco MDS (SAN-OS / NX-OS)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      MDS 9000: 16/32/64G FC switches
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      VSANs: virtual fabric isolation
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Smart Zoning + device aliases
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      IVR: inter-VSAN routing
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DCNM / Nexus Dashboard mgmt
    </text>
  </g>
  
  <g transform="translate(420, 170)">
    <rect width="390" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Brocade (Fabric OS)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Gen 7: 64G FC switching
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Zone aliases + zone configs
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ISL trunking + Port Channels
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      QoS: priority FC traffic
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      SANnav: fabric management
    </text>
  </g>
  
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Both vendors deliver 16/32/64G Fibre Channel with zoning and trunked ISLs
  </text>
  
  <line x1="410" y1="300" x2="410" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 330)">
    <rect width="390" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Cisco Fabric Services
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FLOGI: host login to fabric
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FSPF: fabric shortest path
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      CFS: config fabric sync
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FCNS: fabric name service
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Port modes: F · E · TE · NP
    </text>
  </g>
  
  <g transform="translate(420, 330)">
    <rect width="390" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Brocade Fabric Services
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FLOGI DB: registered ports
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      D-Port: diagnostics port
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      MAPS: monitoring alerts
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Buffer Credits: flow ctrl
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      E-Port: ISL · F-Port: host
    </text>
  </g>
  
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Fabric protocol services register initiators and targets for SCSI data exchange
  </text>
  
  <line x1="410" y1="460" x2="410" y2="480" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 490)">
    <rect width="800" height="75" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      FLOGI       │      FDISC       │       Zoning      │       FSPF       │   ISL / Trunk
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      N_Port login   │    NPIV port     │   Access control  │   Link routing   │   E-port links
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      WWPN register   │   Virtual WWPN   │    pWWN / alias   │  Shortest path   │  TE/trunk port
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FC-ID assign   │  HBA multiplex   │    Hard or soft   │   ECMP spread    │   Load balance
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FCNS register   │  VF_Port serve   │   Zone database   │  Path failover   │    BB credits
    </text>
  </g>
  
  <text x="20" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FC switches · 16G/32G/64G SFPs · OM4 fibre · FC HBAs in hosts · Power &amp; Cooling
  </text>
  
  <text x="20" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Key terms:
  </text>
  <text x="20" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FC       = Fibre Channel; dedicated high-speed block network using optical or copper links
  </text>
  <text x="20" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WWPN     = World Wide Port Name; globally unique 64-bit identifier for each FC HBA port
  </text>
  <text x="20" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WWNN     = World Wide Node Name; 64-bit identifier for the HBA device (node) itself
  </text>
  <text x="20" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FLOGI    = Fabric Login; N-Port registers its WWPN with the fabric to get an FC-ID
  </text>
  <text x="20" y="685" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FSPF     = Fabric Shortest Path First; link-state routing protocol for FC fabric paths
  </text>
  <text x="20" y="700" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Zoning   = Fabric access control; limits which initiators can communicate with targets
  </text>
  <text x="20" y="715" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VSAN     = Virtual SAN (Cisco); logical fabric partition within a shared physical switch
  </text>
  <text x="20" y="730" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ISL      = Inter-Switch Link; E-Port or TE-Port carrying aggregated fabric traffic
  </text>
  <text x="20" y="745" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NPIV     = N-Port ID Virtualisation; one HBA presents multiple virtual WWPNs
  </text>
  <text x="20" y="760" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    D-Port   = Diagnostic Port; Brocade link mode for BER and latency testing
  </text>
  <text x="20" y="775" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MAPS     = Monitoring and Alerting Policy Suite; Brocade threshold-based SAN alerts
  </text>
  <text x="20" y="790" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IVR      = Inter-VSAN Routing; Cisco controlled traffic flow between VSANs
  </text>
  <text x="20" y="805" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SANnav   = Brocade SAN management portal; replaced BSNA with modern REST-based UI
  </text>
  <text x="20" y="820" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DCNM     = Data Center Network Manager; Cisco fabric management (now Nexus Dashboard)
  </text>
  
  <rect x="0" y="840" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="860" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: SAN Fabric Overview
  </text>
</svg>