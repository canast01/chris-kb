<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    PowerShell Architecture — Pipeline and Remoting
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cross-platform .NET shell; parser -&gt; AST -&gt; runspace -&gt; pipeline execution;
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    WinRM (5985/5986) or SSH remoting; PSGallery modules; runspace pools.
  </text>
  
  <rect x="10" y="80" width="380" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Execution Engine
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Parser: tokenise input
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AST: abstract syntax tree
  </text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Runspace: execution context
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pipeline: object streaming
  </text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cmdlets: verb-noun convention
  </text>
  
  <rect x="410" y="80" width="380" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Remoting
  </text>
  <text x="420" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WinRM: port 5985 HTTP
  </text>
  <text x="420" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WinRM HTTPS: port 5986
  </text>
  <text x="420" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SSH: PSRemoting over SSH
  </text>
  <text x="420" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Enter-PSSession: interactive
  </text>
  <text x="420" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Invoke-Command: scriptblock
  </text>
  
  <text x="10" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pipeline passes .NET objects between cmdlets — no text parsing needed.
  </text>
  
  <line x1="200" y1="240" x2="200" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="240" x2="600" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="280" width="380" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Module System
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PSGallery: public registry
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Install-Module: NuGet fetch
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PSModulePath: search dirs
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Private repo: Register-Repo
  </text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Module manifest: .psd1 file
  </text>
  
  <rect x="410" y="280" width="380" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Runspace Pools
  </text>
  <text x="420" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RunspacePool: parallel jobs
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ForEach-Object -Parallel (PS7)
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Thread jobs: Start-ThreadJob
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ThrottleLimit: max concurrent
  </text>
  <text x="420" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    State isolation per runspace
  </text>
  
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="445" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Windows/Linux host running pwsh; WinRM listener enabled on Windows targets;
  </text>
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SSH on Linux targets; PSGallery requires outbound HTTPS to powershellgallery.com.
  </text>
  
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cmdlet        = compiled or script function; verb-noun naming convention
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pipeline      = | operator; passes objects (not strings) between cmdlets
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Runspace      = isolated execution context; each session gets one
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AST           = Abstract Syntax Tree; parsed representation of script
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WinRM         = Windows Remote Management; SOAP over HTTP; 5985/5986
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PSRemoting    = PowerShell remoting framework; works over WinRM or SSH
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Execution Policy= controls script loading; Bypass/Unrestricted for automation
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PSGallery     = public module repository at powershellgallery.com
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RunspacePool  = pre-created runspace set; amortises startup cost
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    -Parallel     = PS7 ForEach-Object parallel; uses thread jobs under the hood
  </text>
  <text x="10" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Start-Job     = background process job; separate process; higher overhead
  </text>
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    psd1          = module manifest; declares version, deps, exported names
  </text>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: PowerShell Architecture
  </text>
</svg>