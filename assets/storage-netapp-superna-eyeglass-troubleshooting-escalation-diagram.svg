<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Superna Eyeglass — Escalation</text>

  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open SR at support.superna.net with support bundle attached</text>
  </g>

  <line x1="410" y1="80" x2="410" y2="100" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 100)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — For S1: call Superna emergency support phone immediately after opening the SR</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(listed on support.superna.net; 24×7 for production-down issues)</text>
  </g>

  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 180)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — Superna T1 reviews bundle and triage begins (typically &lt; 2 hours for S1)</text>
  </g>

  <line x1="410" y1="220" x2="410" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 240)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If no meaningful progress within SLA:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in the ticket: "Requesting escalation to Tier 2 / Senior Engineer"</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State impact: "Production failover is blocked; [n] TB of NAS not replicating since [date]"</text>
  </g>

  <line x1="410" y1="320" x2="410" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 340)">
    <rect x="0" y="0" width="800" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — For licensing issues (appliance shows Unlicensed):</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Use the Superna licensing portal directly at superna.net/support</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Match UUID in Admin UI → About to the UUID in the licensing portal</text>
    <text x="20" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ If UUID mismatch (after OVA redeployment): request license re-issue via the portal</text>
    <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Do NOT open a general support SR for licensing — it routes to the wrong team</text>
  </g>

  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 460)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For account-level escalation (e.g., persistent unresolved critical issue):</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact Superna account manager directly</text>
  </g>

  <rect x="0" y="560" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>