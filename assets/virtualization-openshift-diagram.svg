<svg xmlns="http://www.w3.org/2000/svg" width="820" height="610" viewBox="0 0 820 610">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    OpenShift Container Platform Overview
  </text>
  
  <rect x="10" y="40" width="800" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Red Hat OpenShift Container Platform (OCP)
  </text>
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Enterprise Kubernetes with RHCOS, OLM operators, and integrated security
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Control plane: 3 masters, etcd quorum, API server, controller-manager, scheduler
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Network: OVN-Kubernetes SDN, Routes + Ingress, multi-tenant NetworkPolicy
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Install: IPI (automated) or UPI (manual); air-gap supported via mirror registry
  </text>

  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Control plane and worker nodes separated; platform managed via Cluster Operators (CO)
  </text>

  <line x1="200" y1="170" x2="200" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="170" x2="620" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="200" width="380" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Control Plane
  </text>
  <text x="30" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    3× master (RHCOS)
  </text>
  <text x="30" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    etcd quorum (3 members)
  </text>
  <text x="30" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    API server (TLS :6443)
  </text>
  <text x="30" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OAuth server (auth)
  </text>

  <rect x="420" y="200" width="380" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="430" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Worker Nodes
  </text>
  <text x="430" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Compute workload pods
  </text>
  <text x="430" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MachineSet-managed scaling
  </text>
  <text x="430" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kubelet + CRI-O runtime
  </text>
  <text x="430" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OVN-K pod networking
  </text>

  <line x1="200" y1="310" x2="200" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="310" x2="620" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="340" width="380" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Security
  </text>
  <text x="30" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SCC / PSA enforcement
  </text>
  <text x="30" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RBAC + OAuth/LDAP
  </text>
  <text x="30" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    etcd encryption at rest
  </text>
  <text x="30" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetworkPolicy isolation
  </text>

  <rect x="420" y="340" width="380" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="430" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Storage &amp; Registry
  </text>
  <text x="430" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ODF / persistent storage
  </text>
  <text x="430" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Internal image registry
  </text>
  <text x="430" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Quay (external registry)
  </text>
  <text x="430" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    StorageClass provisioning
  </text>

  <text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RHCOS = Red Hat CoreOS; immutable, managed node OS for control plane and workers
  </text>
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OLM = Operator Lifecycle Manager; installs and updates operators from OperatorHub
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MachineSet = Defines worker node pool; scales nodes via Machine API (IPI only)
  </text>
  <text x="20" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    etcd = Distributed KV store; cluster state; requires 3 nodes for quorum
  </text>
  <text x="20" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OVN-K = OVN-Kubernetes; default SDN since OCP 4.12; replaces OpenShift SDN
  </text>
  <text x="20" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IPI = Installer Provisioned Infrastructure; fully automated install
  </text>

  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: OpenShift Container Platform Overview
  </text>
</svg>