<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Evergreen Health Check — Daily Sequence
  </text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Pure1 portal
    </text>
    <text x="200" y="25" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      All arrays green?
    </text>
  </g>
  
  <line x1="170" y1="90" x2="170" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      purealert list
    </text>
    <text x="200" y="25" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      No error/warning alerts?
    </text>
  </g>
  
  <line x1="170" y1="150" x2="170" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      puredrive list
    </text>
    <text x="200" y="25" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      All drives healthy?
    </text>
  </g>
  
  <line x1="170" y1="210" x2="170" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 230)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      purearray list --controller
    </text>
    <text x="200" y="25" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Both controllers ok?
    </text>
  </g>
  
  <line x1="170" y1="270" x2="170" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      purearray phonehome list
    </text>
    <text x="200" y="25" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Phone-home active?
    </text>
  </g>
  
  <line x1="170" y1="330" x2="170" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 350)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Pure1 → Subscription dashboard
    </text>
    <text x="200" y="25" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Capacity within entitlement?
    </text>
  </g>
  
  <line x1="170" y1="390" x2="170" y2="410" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 410)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="130" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      PASS
    </text>
  </g>
  
  <rect x="0" y="460" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Health Check Sequence
  </text>
</svg>