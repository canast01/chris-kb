  </text>
  <rect x="10" y="140" width="800" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    HCX cold migration
  </text>
  <text x="300" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    100 Mbps per concurrent migration
  </text>
  <rect x="10" y="180" width="800" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
