<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Amazon EVS — Design Standards
  </text>
  <rect x="10" y="50" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Purpose
  </text>
  <text x="300" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Minimum bandwidth
  </text>
  <line x1="10" y1="90" x2="810" y2="90" stroke="#455a64" stroke-width="1.5" />
  <rect x="10" y="100" width="800" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management reachability
  </text>
  <text x="300" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
