  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VxRail</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">vSAN ReadyNode</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VCF on VxRail</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Integrated LCM</text>
  <text x="340" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Bundle upgrade (1-click)</text>
  <text x="340" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">SDDC stack</text>
  <text x="340" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Hardware flexibility</text>
  <text x="340" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Dell-only (certified)</text>
  <text x="540" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Multi-vendor</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Dell-only</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Support model</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Dell + VMware single call</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Separate (HW + SW)</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Dell + Broadcom</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">SMB to enterprise HCI</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Custom HCI build</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Full private cloud SDDC</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Dell VxRail Reference · VxRail Manager · LCM Bundle · vSAN · vSphere · OMIVV · CloudIQ</text>
