<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Dell VxRail — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">HCI Appliance · vSphere · vSAN · VxRail Manager · LCM Bundles</text>

  <!-- ═ COLUMN 1: Hardware Nodes ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Hardware Nodes</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Node Families · CPU · NIC · Storage Tiers</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">P-series (performance — NVMe/SSD)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">E-series (economy — SSD/HDD)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">V-series (dense storage)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">G-series (GPU-accelerated)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Intel Xeon / AMD EPYC CPUs</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">iDRAC OOB management per node</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Minimum cluster: 3 nodes (All-Flash)</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">HCI: CPU + memory + NVMe/SSD/HDD</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">P: 24+ cores, all-NVMe for latency</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">E: mixed SSD/HDD, lower $/TB</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Two-node (RoBo): witness VM required</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">iDRAC: IPMI, Redfish, hardware alerts</text>

  <!-- ═ COLUMN 2: VxRail Manager / LCM ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">VxRail Manager &amp; LCM</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Lifecycle · Bundle Upgrade · Expansion</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">VxRail Manager (VM — lifecycle mgmt)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">LCM Bundle (ESXi + vCenter + vSAN + FW)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Rolling cluster upgrade (node by node)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Node expansion (add to cluster)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Health monitoring (API + UI)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">REST API v3 (automation)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">VxRail Manager: vCenter plugin + API</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Bundle: Dell-tested, single SKU upgrade</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Rolling upgrade: VMs vMotion during</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Expansion: add node → auto-rebalance</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Never mix firmware versions in cluster</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">API: ansible, PowerShell, Terraform</text>

  <!-- ═ COLUMN 3: Platform Integration ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Platform Integration</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">vSphere · vSAN · NSX · Aria · OMIVV</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vCenter Server (embedded or external)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vSAN (distributed storage layer)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">NSX (overlay networking optional)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Aria Operations (monitoring)</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">OMIVV (Dell mgmt vCenter plugin)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">CloudIQ (Dell SaaS health monitoring)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">vCenter: embedded or external VC+PSC</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">vSAN: no external SAN required</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">NSX: optional, for micro-segmentation</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Aria Ops: management pack for VxRail</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">OMIVV: firmware inventory, compliance</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">CloudIQ: AI-driven anomaly detection</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
