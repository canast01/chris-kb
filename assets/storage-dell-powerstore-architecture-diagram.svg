<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Dell PowerStore — Mid-Range AFA Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Mid-range all-flash array; AppsON runs containerized apps on array OS;
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Dynamic Storage Class auto-tiers NVMe→NVMe SCM→SAS; native Kubernetes integration.
  </text>

  <rect x="10" y="80" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Platform
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    T-model: AFA or hybrid
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    X-model: extreme performance
  </text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AppsON: Docker on array OS
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dynamic Storage Class: auto
  </text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Kubernetes CSI: native
  </text>

  <rect x="410" y="80" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Services
  </text>
  <text x="420" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inline dedup + compression
  </text>
  <text x="420" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshots: space-efficient
  </text>
  <text x="420" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Metro volume: active-active
  </text>
  <text x="420" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Async replication: remote
  </text>
  <text x="420" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Thin provisioning: default
  </text>

  <text x="10" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AppsON use cases: PowerStore analytics app, custom metrics, VAAI agent hosting.
  </text>

  <line x1="200" y1="230" x2="200" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="230" x2="600" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="260" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Dynamic Storage Class
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tier 1: NVMe SCM (fastest)
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tier 2: NVMe SSD (standard)
  </text>
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tier 3: SAS HDD (capacity)
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Auto-move: IO heat map
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Adaptive Optimization: policy
  </text>

  <rect x="410" y="260" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="420" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerStore Manager: web UI
  </text>
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerStore CLI: psscli
  </text>
  <text x="420" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: automation
  </text>
  <text x="420" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Ansible/PowerShell modules
  </text>
  <text x="420" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudIQ: AIOps analytics
  </text>

  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PowerStore appliance (rackmount 2U); dual node (active-active internally); FC or
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    iSCSI/NVMe-oF for host connectivity; expansion drawer for capacity growth.
  </text>

  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerStore     = Dell mid-range AFA; block + file; replaces Unity and SC Series
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AppsON         = run Docker containers directly on the PowerStore OS
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dynamic Storage Class= auto-tiering across NVMe SCM, NVMe SSD, and SAS drives
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NVMe SCM       = NVMe Storage Class Memory; highest performance tier (Optane)
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Metro volume   = synchronous active-active stretch between two PowerStore arrays
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Kubernetes CSI = Container Storage Interface; PowerStore as K8s persistent volume
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Adaptive Optimization= tiering policy engine; promotes/demotes by IO heat
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerStore Manager= web-based management console for PowerStore
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    psscli         = PowerStore command-line interface
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API       = PowerStore northbound API; JSON; used by Ansible module
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    T-model        = standard PowerStore; AFA or hybrid configuration
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    X-model        = PowerStore X; extreme performance with NVMe SCM
  </text>

  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Architecture Overview
  </text>
</svg>