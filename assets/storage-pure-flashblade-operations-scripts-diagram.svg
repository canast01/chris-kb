<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Automation Architecture — FlashBlade
  </text>
  
  <rect x="50" y="50" width="220" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="60" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Python / Bash / Ansible
  </text>
  
  <line x1="160" y1="90" x2="160" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="120" width="300" height="160" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="60" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Purity//FB REST API (HTTPS/443)
  </text>
  <text x="70" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /api/2.x/arrays — system info + capacity
  </text>
  <text x="70" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /api/2.x/blades — blade health
  </text>
  <text x="70" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /api/2.x/alerts — active alerts
  </text>
  <text x="70" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /api/2.x/file-systems — filesystem inventory
  </text>
  <text x="70" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /api/2.x/buckets — S3 bucket inventory
  </text>
  
  <line x1="200" y1="280" x2="200" y2="310" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="310" width="300" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="60" y="335" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FlashBlade Fabric Module ──&gt; Blades
  </text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Automation Architecture
  </text>
