<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Pure1 — SaaS Management and AIOps Platform
  </text>
  
  <rect x="10" y="50" width="390" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Platform Architecture
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SaaS: Pure-hosted cloud
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    All arrays: single pane
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Phone-home: telemetry feed
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API v2: management
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-site: cross-DC view
  </text>
  
  <rect x="420" y="50" width="390" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Analytics Capabilities
  </text>
  <text x="430" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1 AI: ML models
  </text>
  <text x="430" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity forecast: 90 days
  </text>
  <text x="430" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Anomaly: vs peer fleet
  </text>
  <text x="430" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workload planning advisor
  </text>
  <text x="430" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Proactive: auto support case
  </text>
  
  <line x1="205" y1="180" x2="205" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="180" x2="615" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="230" width="390" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Telemetry Collection
  </text>
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Array: phone-home over 443
  </text>
  <text x="20" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    No on-prem collector needed
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Logs + metrics + events
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Historical: 1 year+ retention
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Real-time: 30s granularity
  </text>
  
  <rect x="420" y="230" width="390" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="430" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Support Integration
  </text>
  <text x="430" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SR: auto-open by Pure1 AI
  </text>
  <text x="430" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Case: status in Pure1 UI
  </text>
  <text x="430" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Remote assist: TAM view
  </text>
  <text x="430" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    My Pure1: customer login
  </text>
  <text x="430" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Role-based: view or manage
  </text>
  
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1 is fully SaaS; arrays need TCP 443 outbound to pure1.purestorage.com;
  </text>
  <text x="10" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    no on-prem servers or agents required.
  </text>
  
  <text x="10" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1 = Pure Storage SaaS management and analytics portal
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SaaS = Software as a Service; Pure hosts it; no on-prem infra needed
  </text>
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Phone-home = array telemetry sent to Pure cloud; enables Pure1 AI analytics
  </text>
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1 AI = ML-based analytics; trained on Pure fleet; detects anomalies
  </text>
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity forecast = predicts when arrays will hit threshold; 90-day horizon
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Anomaly = Pure1 AI flags unusual performance vs fleet peer comparison
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Proactive SR = Pure1 AI opens support case before you notice a problem
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API v2 = Pure1 northbound API; pull metrics, manage arrays programmatically
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-site = all arrays across all sites visible in one Pure1 login
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TAM = Technical Account Manager; has read-only view of your Pure1
  </text>
  <text x="10" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    My Pure1 = customer-facing login at pure1.purestorage.com
  </text>
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Historical retention = Pure1 keeps 1 year+ of telemetry for trend analysis
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Pure1 Architecture Overview
  </text>
</svg>