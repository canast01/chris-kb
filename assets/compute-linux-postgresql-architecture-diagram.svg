<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    PostgreSQL — Advanced Open-Source RDBMS Architecture
  </text>
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MVCC concurrency; streaming replication + WAL archiving for HA; Patroni for automated failover; pgBouncer for connection pooling; PITR for recovery.
  </text>
  <rect x="10" y="70" width="390" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Core Architecture
  </text>
  <text x="205" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MVCC: concurrent read+write
  </text>
  <text x="205" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WAL: write-ahead log
  </text>
  <text x="205" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PGDATA: data directory
  </text>
  <text x="205" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Shared buffers: memory cache
  </text>
  <text x="205" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Tablespace: disk layout
  </text>
  <rect x="420" y="70" width="390" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Process Model
  </text>
  <text x="615" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Postmaster: main process
  </text>
  <text x="615" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Per-connection: backend fork
  </text>
  <text x="615" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Autovacuum: background GC
  </text>
  <text x="615" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Walwriter: WAL flush
  </text>
  <text x="615" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Checkpointer: dirty flush
  </text>
  <text x="10" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    shared_buffers at 25% of RAM; effective_cache_size at 75% for query planner.
  </text>
  <line x1="205" y1="230" x2="205" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="230" x2="615" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="260" width="390" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    HA and Replication
  </text>
  <text x="205" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Streaming: primary to standby
  </text>
  <text x="205" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WAL shipping: archive-based
  </text>
  <text x="205" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Patroni: auto failover
  </text>
  <text x="205" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    etcd/Consul: DCS leader lock
  </text>
  <text x="205" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PITR: point-in-time restore
  </text>
  <rect x="420" y="260" width="390" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Connection and Pooling
  </text>
  <text x="615" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    pgBouncer: conn pooler
  </text>
  <text x="615" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Transaction: PgBouncer mode
  </text>
  <text x="615" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    pg_hba.conf: access control
  </text>
  <text x="615" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSL: encrypt client conns
  </text>
  <text x="615" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HAProxy: frontend LB
  </text>
  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="435" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Linux VMs; local NVMe for PGDATA (latency-sensitive); separate mount for WAL;
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    etcd cluster (3 nodes) required for Patroni; pgBouncer as separate VM.
  </text>
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PostgreSQL     = advanced open-source RDBMS; supports JSON, extensions, partitioning
  </text>
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MVCC           = Multi-Version Concurrency Control; reads never block writes
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    WAL            = Write-Ahead Log; pg_wal directory; basis of streaming replication
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Patroni        = HA manager for PostgreSQL; uses etcd/Consul for leader election
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    etcd           = distributed KV store; Patroni uses it to hold leader lock
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    pgBouncer      = connection pooler; reduces connection overhead on busy servers
  </text>
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PGDATA         = PostgreSQL data directory; contains base/, pg_wal/, pg_tblspc/
  </text>
  <text x="10" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Streaming replication= primary sends WAL stream to standby in real time
  </text>
  <text x="10" y="615" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PITR           = Point-in-Time Recovery; restore to any moment using WAL archive
  </text>
  <text x="10" y="630" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Autovacuum     = background process; reclaims space from updated/deleted rows
  </text>
  <text x="10" y="645" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    shared_buffers = PostgreSQL memory cache; set to 25% RAM; key tuning parameter
  </text>
  <text x="10" y="660" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DCS            = Distributed Configuration Store; etcd/Consul/ZooKeeper for Patroni
  </text>
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: PostgreSQL Architecture
  </text>
</svg>