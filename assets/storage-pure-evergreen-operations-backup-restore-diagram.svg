<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Evergreen Configuration Backup + Restore
  </text>
  
  <rect x="20" y="50" width="780" height="120" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Configuration export (before controller refresh / migration):
  </text>
  <text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ├── pureconfig list --all
  </text>
  <line x1="250" y1="90" x2="350" y2="90" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    export array config to file
  </text>
  <text x="40" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ├── purepgroup list --schedule
  </text>
  <line x1="250" y1="110" x2="350" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    document PGroup schedules
  </text>
  <text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    └── purehost list + purehgroup list
  </text>
  <line x1="250" y1="130" x2="350" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    host/group inventory
  </text>
  
  <line x1="180" y1="140" x2="180" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="190" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Store offline: CMDB / Git / secure file share
  </text>
  
  <rect x="20" y="210" width="780" height="90" fill="#e8f5e9" stroke="#2e7d32" rx="6" />
  <text x="30" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Post-refresh validation:
  </text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ├── purearray list --controller
  </text>
  <line x1="250" y1="250" x2="350" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    new gen controllers
  </text>
  <text x="40" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ├── purealert list
  </text>
  <line x1="250" y1="270" x2="350" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    no residual alerts
  </text>
  <text x="40" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    └── purehost list --connection
  </text>
  <line x1="250" y1="290" x2="350" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    all host paths restored
  </text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Backup &amp; Restore Operations
  </text>
</svg>