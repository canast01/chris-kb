<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Cisco DCNM Architecture — Last Standalone SAN Manager
  </text>
  
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DCNM 11.x is the last standalone SAN management appliance; superseded by NDFC
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    (Nexus Dashboard Fabric Controller) on Nexus Dashboard 12.0+.
  </text>
  
  <rect x="10" y="100" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DCNM 11.x Architecture
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Standalone Linux appliance (OVA)
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PostgreSQL: config + topology
  </text>
  <text x="20" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Elasticsearch: log search
  </text>
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST/SSH: switch discovery
  </text>
  <text x="20" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SNMP: event ingestion
  </text>
  
  <rect x="410" y="100" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Managed Domains
  </text>
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SAN: Cisco MDS fabrics
  </text>
  <text x="420" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LAN: Nexus switching fabric
  </text>
  <text x="420" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Media: IP LAN for video
  </text>
  <text x="420" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DCNM licences per device
  </text>
  <text x="420" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Web UI: central management
  </text>
  
  <text x="10" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DCNM 11.x end-of-support: migrate to Nexus Dashboard + NDFC for ongoing support.
  </text>
  
  <line x1="200" y1="260" x2="200" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="260" x2="600" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="290" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Migration Path to NDFC
  </text>
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Deploy Nexus Dashboard 3-node
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Install NDFC on ND cluster
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Re-discover switches in NDFC
  </text>
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Export: templates + configs
  </text>
  <text x="20" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cutover: update SNMP targets
  </text>
  
  <rect x="410" y="290" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DCNM vs NDFC Differences
  </text>
  <text x="420" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDFC: app on ND platform
  </text>
  <text x="420" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDFC: multi-tenant ND account
  </text>
  <text x="420" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDFC: REST API v1 compatible
  </text>
  <text x="420" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ND: shared identity + scale
  </text>
  <text x="420" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DCNM: deprecated as of 12.0
  </text>
  
  <text x="10" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DCNM: Linux OVA VM (16 vCPU, 64 GB RAM, 500 GB disk); management network
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    access to all Cisco MDS and Nexus switches on TCP 22 (SSH) and 443.
  </text>
  
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DCNM          = Data Center Network Manager; Cisco SAN/LAN management v11
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDFC          = Nexus Dashboard Fabric Controller; replacement for DCNM
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Nexus Dashboard= app-hosting platform; runs NDFC, NDI, NDO as apps
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OVA           = Open Virtualization Appliance; VMware import format
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EOS           = End of Support; DCNM 11.x reached EOS; migrate to NDFC
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SAN Insights  = DCNM feature; IO latency analytics per initiator-target pair
  </text>
  <text x="10" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LAN discovery = DCNM autodiscovery via CDP/LLDP from seed switch
  </text>
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SNMP          = trap receiver in DCNM for switch alerts
  </text>
  <text x="10" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Template      = DCNM config template; import/export to NDFC
  </text>
  <text x="10" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vRF           = virtual routing and forwarding; DCNM overlay construct
  </text>
  <text x="10" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ND account    = identity in Nexus Dashboard; DCNM → NDFC user migration
  </text>
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Seed switch   = first switch discovered; DCNM expands via CDP
  </text>
  
  <rect x="0" y="690" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Cisco DCNM Architecture
  </text>
</svg>