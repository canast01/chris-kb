<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Architecture — Storage Design
  </text>
  
  <rect x="10" y="50" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Storage design: tier workloads by I/O profile; select protocol; plan redundancy
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Tiers: NVMe (&lt; 0.1ms) → SSD (&lt; 1ms) → SAS/NL-SAS (2-5ms) → archive/cloud
  </text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Protocol: FC (SAN/high perf), iSCSI (SAN/cost), NFS/SMB (file), S3 (object)
  </text>
  
  <line x1="410" y1="110" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="110" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="160" width="320" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="60" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Design Considerations
  </text>
  <text x="60" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workload I/O profile
  </text>
  <text x="60" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity now + 3yr
  </text>
  <text x="60" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Protocol selection
  </text>
  <text x="60" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Thin vs thick prov
  </text>
  <text x="60" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Encryption at rest
  </text>
  
  <rect x="450" y="160" width="320" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="460" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Redundancy
  </text>
  <text x="460" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RAID 5/6 or erasure code
  </text>
  <text x="460" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dual controllers
  </text>
  <text x="460" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multipath (MPIO)
  </text>
  <text x="460" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Replication to DR site
  </text>
  <text x="460" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshot policy
  </text>
  
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NVMe = Non-Volatile Memory Express; PCIe-attached flash; lowest latency storage
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FC = Fibre Channel; dedicated SAN fabric; high performance and reliability
  </text>
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    iSCSI = SCSI over IP; block storage over Ethernet; lower cost than FC
  </text>
  <text x="20" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Erasure code = Striping with parity across drives; space-efficient; used in scale-out arrays
  </text>
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Thin prov = Space allocated on-demand; must monitor actual usage vs overcommit
  </text>
  <text x="20" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MPIO = Multi-Path I/O; multiple paths to array; transparent failover on path loss
  </text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Storage Design
  </text>
</svg>