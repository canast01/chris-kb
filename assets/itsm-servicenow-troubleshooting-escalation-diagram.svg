<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ServiceNow — Escalation</text>

  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open HI portal case with stats.do output and sys_log export</text>
  </g>

  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 110)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — For P1: call ServiceNow support phone immediately after opening the case</text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(number on case confirmation page; 24×7 for P1)</text>
  </g>

  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 180)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — ServiceNow NOC confirms instance state and triage begins (typically &lt; 1 hour for P1)</text>
  </g>

  <line x1="410" y1="230" x2="410" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 250)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If no meaningful progress in 2 hours for P1 / 1 business day for P2:</text>
    <text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add a case update: "Requesting escalation to Senior Support Engineer"</text>
    <text x="20" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State business impact: "[n] users blocked; [process/service] offline since [time]"</text>
  </g>

  <line x1="410" y1="320" x2="410" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 340)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — For a confirmed platform defect (hotfix needed):</text>
    <text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ ServiceNow engineering creates an emergency patch</text>
    <text x="20" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ You will be asked to apply it during a maintenance window</text>
  </g>

  <line x1="410" y1="390" x2="410" y2="410" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 410)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For data integrity or security incidents (accidental data deletion, ACL bypass):</text>
    <text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engage ServiceNow Trust and Reliability team through your account manager</text>
    <text x="20" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ ServiceNow retains backups for 7 days; request restore must go through the account team</text>
  </g>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>