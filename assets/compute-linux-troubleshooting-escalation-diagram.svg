<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Linux Escalation Process</text>
  
  <rect x="20" y="50" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case with sosreport attached (see above)</text>
  
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="120" width="780" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — T1 CEE/TSE acknowledges and reviews sosreport (P1: within 1 hr; P2: within 2 hr)</text>
  
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="190" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 2 hours for Sev1 or 4 hours for Sev2:</text>
  <text x="40" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply: "Requesting escalation to Senior Kernel Engineer"</text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[host panicking continuously / 150 users offline / data at risk]"</text>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="290" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Senior engineer assigned; they may request remote access via approved SSH tunnel</text>
  <text x="40" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have root SSH access to the host and the case number ready</text>
  
  <line x1="410" y1="370" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="390" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue is confirmed as a kernel bug:</text>
  <text x="40" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Vendor engineer opens internal bug and works toward a hotfix kernel errata</text>
  <text x="40" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ You will receive a package update when available</text>
  
  <line x1="410" y1="470" x2="410" y2="490" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="490" width="780" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="515" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For unresolved Sev1 after 4 hours:</text>
  <text x="40" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request escalation to Support Duty Manager (Red Hat) or Escalation Manager (Canonical)</text>
  <text x="40" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ If you have a TAM, contact them directly to engage executive-level support</text>
  
  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>