<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Ceph Security
  </text>
  <rect x="10" y="50" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Ceph Security Controls
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Four sub-sections: Access Control (CephX), Authentication, Encryption, Hardening
  </text>
  <text x="410" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CephX: all clients require a key; granular capabilities per pool/service
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Encryption: dmcrypt at OSD level; msgr2 secure for in-transit encryption
  </text>
  <line x1="410" y1="150" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="50" y="210" width="340" height="180" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="220" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Identity &amp; Access
  </text>
  <text x="220" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CephX shared-secret auth
  </text>
  <text x="220" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Capability per pool/service
  </text>
  <text x="220" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    profile rbd preset
  </text>
  <text x="220" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Key rotation (manual)
  </text>
  <rect x="430" y="210" width="340" height="180" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="600" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Data &amp; Network Security
  </text>
  <text x="600" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OSD dmcrypt encryption
  </text>
  <text x="600" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RBD per-image encryption
  </text>
  <text x="600" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RGW SSE-S3 / SSE-KMS
  </text>
  <text x="600" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    msgr2 secure mode
  </text>
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Ceph Security
  </text>
</svg>