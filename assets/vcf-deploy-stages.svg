  <text x="320" y="683.5" text-anchor="middle" fill="#546e7a" font-size="9">1</text>
  <text x="520" y="683.5" text-anchor="middle" fill="#546e7a" font-size="9">8 vCPU / 28 GB RAM</text>
  <text x="700" y="683.5" text-anchor="middle" fill="#546e7a" font-size="9">Medium sizing on mgmt hosts</text>
