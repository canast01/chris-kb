  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Cloud Builder VM deployed + powered on</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">JSON deployment spec prepared</text>
