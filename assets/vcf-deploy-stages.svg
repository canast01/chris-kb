  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Cloud Builder: OVA on any ESXi host</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">JSON spec: network/password/component</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">DNS: all VCF FQDNs pre-registered</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">NTP: stratum 2 for all components</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Licenses: vSphere + vSAN + NSX + VCF</text>
