  <text x="120" y="553.5" text-anchor="middle" fill="#455a64" font-size="9">Management hosts</text>
  <text x="320" y="553.5" text-anchor="middle" fill="#546e7a" font-size="9">4 (vSAN FTT=1)</text>
  <text x="520" y="553.5" text-anchor="middle" fill="#546e7a" font-size="9">2-socket, 512 GB RAM</text>
  <text x="700" y="553.5" text-anchor="middle" fill="#546e7a" font-size="9">All on HCL</text>
  <text x="120" y="579.5" text-anchor="middle" fill="#455a64" font-size="9">NICs per host</text>
  <text x="320" y="579.5" text-anchor="middle" fill="#546e7a" font-size="9">2 × 25 GbE</text>
  <text x="520" y="579.5" text-anchor="middle" fill="#546e7a" font-size="9">4 ports total</text>
  <text x="700" y="579.5" text-anchor="middle" fill="#546e7a" font-size="9">2 for vSAN, 2 for overlay</text>
  <rect x="20" y="591.5" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="605.5" text-anchor="middle" fill="#455a64" font-size="9">vSAN disks</text>
  <text x="320" y="605.5" text-anchor="middle" fill="#546e7a" font-size="9">1 NVMe cache + 2 capacity</text>
  <text x="520" y="605.5" text-anchor="middle" fill="#546e7a" font-size="9">Per host</text>
  <text x="700" y="605.5" text-anchor="middle" fill="#546e7a" font-size="9">HCL SSD required</text>
  <text x="120" y="631.5" text-anchor="middle" fill="#455a64" font-size="9">SDDC Manager VM</text>
  <text x="320" y="631.5" text-anchor="middle" fill="#546e7a" font-size="9">1</text>
  <text x="520" y="631.5" text-anchor="middle" fill="#546e7a" font-size="9">4 vCPU / 16 GB RAM</text>
  <text x="700" y="631.5" text-anchor="middle" fill="#546e7a" font-size="9">Deployed by Cloud Builder</text>
  <rect x="20" y="643.5" width="780" height="26" fill="#f7f9fb"/>
