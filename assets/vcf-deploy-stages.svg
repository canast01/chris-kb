  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">DNS + NTP + routing in place</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">VCF license keys ready</text>
