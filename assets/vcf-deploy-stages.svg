  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Health: Dashboard → Management Domain</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">NSX cluster: System → Appliances</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">vCenter: all 4 hosts connected</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">WD: Commission hosts → Create WD</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Cloud Builder: power off / retire</text>
