  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">SDDC Mgr: portal + lifecycle engine</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">NSX Mgmt: overlay for mgmt VMs</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">vCenter: manages mgmt domain hosts</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">vSAN: management host local disks</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Bring-up: typically 3–4 hours</text>
