  <text x="320" y="657.5" text-anchor="middle" fill="#546e7a" font-size="9">3 (cluster)</text>
  <text x="520" y="657.5" text-anchor="middle" fill="#546e7a" font-size="9">6 vCPU / 24 GB each</text>
  <text x="700" y="657.5" text-anchor="middle" fill="#546e7a" font-size="9">Medium sizing</text>
