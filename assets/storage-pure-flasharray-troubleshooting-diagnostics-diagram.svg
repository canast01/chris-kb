<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashArray — Diagnostics</text>
  
  <rect x="10" y="50" width="300" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purepod list</text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">note the pod status and which arrays are members</text>
  
  <line x1="160" y1="100" x2="160" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="130" width="300" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Is the inter-array replication link up?</text>
  
  <line x1="310" y1="155" x2="350" y2="155" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="350" y="130" width="450" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="360" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purenetwork list</text>
  <text x="360" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">confirm replication interface IPs are correct</text>
  <text x="360" y="175" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Ping the remote array replication IP from local array</text>
  <text x="360" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(via support tunnel if needed)</text>
  <text x="360" y="205" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Check for network events</text>
  <text x="360" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(routing changes, VLAN misconfiguration, bandwidth saturation)</text>
  
  <line x1="160" y1="180" x2="160" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="230" width="300" height="50" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="255" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Is the mediator reachable?</text>
  
  <line x1="310" y1="255" x2="350" y2="255" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="350" y="230" width="450" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="360" y="245" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purepod list --mediator</text>
  <text x="360" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">check mediator IP and version</text>
  <text x="360" y="275" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Confirm outbound HTTPS (port 443) is reachable</text>
  <text x="360" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">to the mediator IP from both arrays</text>
  <text x="360" y="305" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Note: mediator failure alone does not stop replication</text>
  <text x="360" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">it only affects split-brain resolution</text>
  
  <line x1="160" y1="280" x2="160" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="330" width="790" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">If replication link is down: resolve network issue first</text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">If mediator is unreachable: resolve connectivity; pod continues replicating with full inter-array link</text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">If pod is paused: purepod replica-link resume (for async)</text>
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">or investigate network for sync</text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Troubleshooting Flowchart</text>
</svg>