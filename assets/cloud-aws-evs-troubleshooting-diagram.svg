<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Amazon EVS Troubleshooting
  </text>
  
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    EVS Troubleshooting Overview
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Three sub-sections: Common Issues, Diagnostics (bundles/logs), Escalation
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Host FAILED state: contact AWS support before deleting (preserves diagnostics)
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Joint issues (HCX, NSX-T/VPC): open both AWS and VMware support cases
  </text>
  
  <line x1="150" y1="140" x2="150" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="140" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="140" x2="670" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="40" y="180" width="220" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="150" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Common Issues
  </text>
  <text x="150" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Host FAILED state
  </text>
  <text x="150" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vSAN degraded health
  </text>
  <text x="150" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HCX service mesh down
  </text>
  <text x="150" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX-T routing failure
  </text>
  
  <rect x="300" y="180" width="220" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="410" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Diagnostics
  </text>
  <text x="410" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudTrail EVS events
  </text>
  <text x="410" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC Flow Logs query
  </text>
  <text x="410" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX-T support bundle
  </text>
  <text x="410" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Log locations table
  </text>
  
  <rect x="560" y="180" width="220" height="120" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="670" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Escalation
  </text>
  <text x="670" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS severity levels
  </text>
  <text x="670" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Required case data
  </text>
  <text x="670" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS + VMware joint
  </text>
  <text x="670" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    TAM escalation path
  </text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Amazon EVS Troubleshooting
  </text>
</svg>