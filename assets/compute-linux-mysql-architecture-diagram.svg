<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    MySQL — Relational Database Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Open-source RDBMS; InnoDB storage engine; primary-replica replication; MySQL
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Router for load balancing; InnoDB Cluster (Group Replication) for HA.
  </text>
  
  <rect x="10" y="80" width="390" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Engine Architecture
  </text>
  <text x="205" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    InnoDB: default engine
  </text>
  <text x="205" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MyISAM: read-heavy legacy
  </text>
  <text x="205" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MEMORY: temp tables in RAM
  </text>
  <text x="205" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MVCC: concurrent reads
  </text>
  <text x="205" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ACID: transaction guarantees
  </text>
  
  <rect x="420" y="80" width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    InnoDB Internals
  </text>
  <text x="615" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Buffer pool: main memory cache
  </text>
  <text x="615" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Redo log: crash recovery
  </text>
  <text x="615" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Undo log: MVCC rollback
  </text>
  <text x="615" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Doublewrite: write safety
  </text>
  <text x="615" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Row locking: not table lock
  </text>
  
  <text x="10" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    InnoDB Buffer Pool should be 70-80% of available RAM for optimal performance.
  </text>
  
  <line x1="205" y1="220" x2="205" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="220" x2="615" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="260" width="390" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Replication Topologies
  </text>
  <text x="205" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Primary-Replica: async
  </text>
  <text x="205" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GTID: global tx tracking
  </text>
  <text x="205" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Semi-sync: 1 replica acked
  </text>
  <text x="205" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GTID auto-position: simpler
  </text>
  <text x="205" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Binlog: base of replication
  </text>
  
  <rect x="420" y="260" width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    HA: InnoDB Cluster
  </text>
  <text x="615" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Group Replication: 3+ nodes
  </text>
  <text x="615" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MySQL Router: conn routing
  </text>
  <text x="615" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MySQL Shell: admin interface
  </text>
  <text x="615" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Auto-failover: Router sees
  </text>
  <text x="615" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Paxos: consensus protocol
  </text>
  
  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Linux VMs or bare metal; local NVMe for data directory preferred; NFS for backups;
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    separate disk for binlogs and redo logs; dedicated network for replication.
  </text>
  
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    InnoDB         = default MySQL storage engine; ACID compliant; row locking
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Buffer Pool    = InnoDB memory cache for data and indexes; set to 70-80% RAM
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MVCC           = Multi-Version Concurrency Control; readers do not block writers
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    GTID           = Global Transaction ID; unique per-transaction; simplifies failover
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Binlog         = binary log; records all changes; basis of replication
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Redo log       = InnoDB WAL; ensures crash recovery; innodb_log_files_in_group
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Group Replication= multi-primary or single-primary; Paxos consensus across nodes
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MySQL Router   = connection router; redirects writes to primary, reads to replicas
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MySQL Shell    = admin tool; configureCluster, addInstance, status checks
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Semi-sync      = primary waits for at least 1 replica to ACK before commit
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    InnoDB Cluster = Group Replication + Router + Shell; HA solution for MySQL
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Doublewrite    = InnoDB write-safety buffer; prevents torn page on crash
  </text>
  
  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: MySQL / MariaDB Architecture
  </text>
</svg>