<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Dell Data Domain — Escalation</text>
  
  <rect x="10" y="50" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at dell.com/support with support bundle attached (or autosupport send)</text>
  
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="120" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Dell T1 engineer acknowledges (P1: &lt; 2 hr ProSupport Plus; P2: &lt; 4 hr)</text>
  
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="190" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within 2 hours for P1:</text>
  <text x="40" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to Data Domain Senior Engineer"</text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[filesystem offline / drive failure / replication stopped]"</text>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="290" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Data Domain T2 Senior Engineer assigned</text>
  <text x="40" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will review the support bundle and may request SSH access to the appliance</text>
  <text x="40" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SSH access as sysadmin ready; confirm AutoSupport is sending telemetry</text>
  
  <line x1="410" y1="370" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="390" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue requires hardware replacement (disk, NVRAM, PSU):</text>
  <text x="40" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Dell identifies the failed component from the bundle</text>
  <text x="40" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Dell dispatches a field engineer with the replacement hardware</text>
  <text x="40" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Provide data center access details</text>
  
  <line x1="410" y1="470" x2="410" y2="490" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="490" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For prolonged P1 (filesystem offline &gt; 2 hours with no resolution path):</text>
  <text x="40" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request TAM engagement</text>
  <text x="40" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAM escalates to Data Domain Engineering if needed</text>
  
  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>