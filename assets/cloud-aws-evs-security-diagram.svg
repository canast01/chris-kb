<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Amazon EVS Security
  </text>
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    EVS Security Controls
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Four sub-sections: Access Control (IAM + vSphere RBAC), Auth, Encryption, Hardening
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Two RBAC planes: AWS IAM (host/cluster lifecycle) + vSphere RBAC (VM operations)
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX-T DFW: default deny + explicit allow; VPC SGs restrict management access
  </text>
  <line x1="205" y1="130" x2="205" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="130" x2="615" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="50" y="180" width="310" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Identity &amp; Access
  </text>
  <text x="205" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS IAM scoped policies
  </text>
  <text x="205" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vSphere RBAC roles
  </text>
  <text x="205" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AD/LDAP SSO integration
  </text>
  <text x="205" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MFA for AWS console
  </text>
  <rect x="460" y="180" width="310" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="615" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Data &amp; Network Security
  </text>
  <text x="615" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vSAN encryption (NKP/KMS)
  </text>
  <text x="615" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VM encryption policy
  </text>
  <text x="615" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX-T DFW default deny
  </text>
  <text x="615" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC Flow Logs audit
  </text>
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Amazon EVS Security
  </text>
</svg>