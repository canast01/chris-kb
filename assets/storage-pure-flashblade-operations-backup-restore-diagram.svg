<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    FlashBlade Data Protection Tiers
  </text>
  
  <rect x="10" y="50" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Local Snapshots (filesystem / bucket)
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshot policy schedule ──&gt; point-in-time copies
  </text>

  <line x1="410" y1="110" x2="410" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    async replication
  </text>

  <rect x="10" y="150" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ActiveDR Replication
  </text>
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Filesystem/bucket ──&gt; remote FlashBlade (RPO: minutes)
  </text>

  <line x1="410" y1="210" x2="410" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    backup integration
  </text>

  <rect x="10" y="250" width="800" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Application Backup to FlashBlade (target)
  </text>
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Veeam / Commvault ──&gt; NFS or S3 backup target on FB
  </text>

  <text x="10" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Restore: snapshot → create clone → mount → validate → promote
  </text>

  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Backup &amp; Restore Operations
  </text>
</svg>