<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    CyberArk Escalation Process
  </text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 1 — Open SR at support.cyberark.com with DiagnosticTool bundle attached
    </text>
  </g>
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 110)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 2 — For Sev 1: call CyberArk emergency support phone immediately after opening SR
    </text>
    <text x="10" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      (phone number shown on support portal; available 24×7)
    </text>
  </g>
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 190)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 3 — CyberArk T1 reviews bundle and triages issue (typically 30 min–1 h for Sev 1)
    </text>
  </g>
  <line x1="410" y1="230" x2="410" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 250)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 4 — If no meaningful progress in 2 hours for Sev 1 or 1 business day for Sev 2:
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Reply in the case: "Requesting escalation to Senior Engineer"
    </text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → State: "Impact: [n] users cannot authenticate to PAM; CPM halted"
    </text>
  </g>
  <line x1="410" y1="310" x2="410" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 330)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 5 — For security incidents (suspected unauthorised Vault access, account compromise):
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Simultaneously engage CyberArk Blue Team Services through your account team
    </text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Blue Team provides incident response under a separate engagement contract
    </text>
  </g>
  <line x1="410" y1="390" x2="410" y2="410" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 410)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 6 — For P1 unresolved &gt; 4 hours:
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Request Critical Situation engagement via your CyberArk account manager
    </text>
  </g>
  
  <rect x="0" y="560" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: CyberArk Escalation Process
  </text>
</svg>