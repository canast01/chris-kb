<text x="240.0" y="74.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">SRDF/S</text>
<text x="240.0" y="90.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">Synchronous</text>
<text x="240.0" y="106.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">RPO = 0</text>
<text x="240.0" y="122.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">write ack after R2 confirms</text>
<rect x="351.9" y="50.0" width="140.0" height="88.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="421.9" y="74.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">SRDF/A</text>
<text x="421.9" y="90.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">Asynchronous</text>
<text x="421.9" y="106.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">RPO = cycle time</text>
<text x="421.9" y="122.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">(10–30 sec typical)</text>
<rect x="521.9" y="50.0" width="140.0" height="88.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" />
<text x="591.9" y="74.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">SRDF/Metro</text>
<text x="591.9" y="90.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">Active-Active</text>
<text x="591.9" y="106.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">RPO = 0</text>
<text x="591.9" y="122.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">auto-failover</text>
<rect x="255.0" y="178.0" width="140.0" height="71.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2" />
<text x="325.0" y="201.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">suspend</text>
<text x="325.0" y="217.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">pause replication</text>
<text x="325.0" y="233.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">R1 queues writes</text>
<rect x="425.0" y="178.0" width="140.0" height="71.0" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.2" />
<text x="495.0" y="201.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">failover</text>
<text x="495.0" y="217.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">planned: R2 primary</text>
<text x="495.0" y="233.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">R1 write-disabled</text>
<rect x="255.0" y="289.0" width="140.0" height="71.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2" />
<text x="325.0" y="312.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">resume</text>
<text x="325.0" y="328.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">restart replication</text>
<text x="325.0" y="344.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">resync R1→R2 delta</text>
<rect x="425.0" y="289.0" width="140.0" height="71.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="495.0" y="320.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">swap</text>
<text x="495.0" y="336.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">swap R1↔R2 roles</text>
<rect x="340.0" y="400.0" width="140.0" height="71.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" />
<text x="410.0" y="423.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">restore</text>
<text x="410.0" y="439.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">failback direction</text>
<text x="410.0" y="455.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">R1 resumes primary</text>
<rect x="340.0" y="511.0" width="140.0" height="71.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2" />
<text x="410.0" y="534.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">establish</text>
<text x="410.0" y="550.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">start replication</text>
<text x="410.0" y="566.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">R1→R2 initial sync</text>
<rect x="340.0" y="622.0" width="140.0" height="71.0" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.2" />
<text x="410.0" y="645.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">split</text>
<text x="410.0" y="661.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">R2 becomes R/W</text>
<text x="410.0" y="677.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">(dev/test or DR test)</text>
