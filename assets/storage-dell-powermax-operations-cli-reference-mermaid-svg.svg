<rect x="20.0" y="50.0" width="407.0" height="106.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" />
<text x="223.5" y="66.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">SRDF Modes</text>
<rect x="30.0" y="80.0" width="147.0" height="68.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="103.5" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">SRDF/S</text>
<text x="103.5" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Synchronous</text>
<text x="103.5" y="123.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">RPO = 0</text>
<text x="103.5" y="137.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">write ack after R2 confirms</text>
<rect x="187.0" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="242.0" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">SRDF/A</text>
<text x="242.0" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Asynchronous</text>
<text x="242.0" y="123.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">RPO = cycle time</text>
<text x="242.0" y="137.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">(10–30 sec typical)</text>
<rect x="307.0" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="362.0" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">SRDF/Metro</text>
<text x="362.0" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Active-Active</text>
<text x="362.0" y="123.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">RPO = 0</text>
<text x="362.0" y="137.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">auto-failover</text>
<rect x="457.0" y="50.0" width="856.8" height="106.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2" />
<text x="885.4" y="66.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Key Operations</text>
<rect x="467.0" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="522.0" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">establish</text>
<text x="522.0" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">start replication</text>
<text x="522.0" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">R1→R2 initial sync</text>
<rect x="587.0" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="642.0" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">suspend</text>
<text x="642.0" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">pause replication</text>
<text x="642.0" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">R1 queues writes</text>
<rect x="707.0" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="762.0" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">resume</text>
<text x="762.0" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">restart replication</text>
<text x="762.0" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">resync R1→R2 delta</text>
<rect x="827.0" y="80.0" width="115.4" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="884.7" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">split</text>
<text x="884.7" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">R2 becomes R/W</text>
<text x="884.7" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">(dev/test or DR test)</text>
<rect x="952.4" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="1007.4" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">failover</text>
<text x="1007.4" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">planned: R2 primary</text>
<text x="1007.4" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">R1 write-disabled</text>
<rect x="1072.4" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="1127.4" y="110.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">swap</text>
<text x="1127.4" y="124.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">swap R1↔R2 roles</text>
<rect x="1192.4" y="80.0" width="111.4" height="68.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="1248.1" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">restore</text>
<text x="1248.1" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">failback direction</text>
<text x="1248.1" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">R1 resumes primary</text>
