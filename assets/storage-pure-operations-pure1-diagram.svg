<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Pure1 — Phone-Home to Cloud Analytics</text>
  
  <rect x="10" y="50" width="300" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">FlashArray / FlashBlade</text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Phone-home agent (continuous)</text>
  
  <rect x="510" y="50" width="300" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="520" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Pure1 Cloud</text>
  <text x="520" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Telemetry ingest</text>
  <text x="520" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Health score</text>
  <text x="520" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Capacity trends</text>
  <text x="520" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Performance data</text>
  <text x="520" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ Alert state</text>
  
  <line x1="310" y1="90" x2="510" y2="90" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="400" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">HTTPS 443</text>
  
  <rect x="10" y="150" width="300" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Customer Portal</text>
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Storage → Arrays</text>
  <text x="20" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Analysis →</text>
  <text x="40" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Capacity</text>
  <text x="40" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Performance</text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ Workload</text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Alerts</text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Support → Cases</text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Billing</text>
  
  <line x1="160" y1="150" x2="510" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="330" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">query / view</text>
  
  <rect x="510" y="180" width="300" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="520" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Pure1 AIOps</text>
  <text x="520" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Anomaly detect</text>
  <text x="520" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Predictive failure</text>
  <text x="520" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ Capacity forecast</text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">REST API: GET /arrays, /metrics, /subscriptions</text>
</svg>