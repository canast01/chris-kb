<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Nexus Dashboard — Lifecycle Management
  </text>
  
  <rect x="20" y="50" width="370" height="200" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Deploy
  </text>
  <text x="205" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Bootstrap 3 nodes
  </text>
  <text x="205" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Assign mgmt + data IPs
  </text>
  <text x="205" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Form cluster via UI
  </text>
  <text x="205" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Install apps (NDI etc)
  </text>
  <text x="205" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Onboard fabrics
  </text>
  <text x="205" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Configure ITSM out
  </text>
  
  <rect x="430" y="50" width="370" height="200" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Upgrade
  </text>
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Check release notes
  </text>
  <text x="615" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Backup config first
  </text>
  <text x="615" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    acs upgrade apply
  </text>
  <text x="615" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Rolling node upgrade
  </text>
  <text x="615" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Verify apps post
  </text>
  <text x="615" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Rollback if fail
  </text>
  
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure:
  </text>
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    3 physical or VM nodes · Cisco ISO install · upgrade via acs CLI or ND UI
  </text>
  
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Bootstrap = Initial ND node setup: assign hostname, IPs, NTP, DNS via console
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cluster form = Joining 3 nodes into quorum cluster via ND web UI
  </text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    App install = Installing NDI, NDFC, NDO as apps from ND admin &gt; Apps
  </text>
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Fabric onboard = Adding APIC or NX-OS fabric to ND with credentials
  </text>
  <text x="20" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    acs upgrade = CLI command to apply upgrade image to cluster
  </text>
  <text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Rolling upgrade = Upgrading nodes sequentially to maintain quorum
  </text>
  <text x="20" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup = acs backup create before upgrade; stored externally
  </text>
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Rollback = Restoring from backup if upgrade causes data loss
  </text>
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Release notes = Cisco release notes; check for breaking changes before upgrade
  </text>
  <text x="20" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Verify apps = Post-upgrade check: NDI collecting, NDFC managing, NDO syncing
  </text>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Cisco Nexus Dashboard — Operations Install &amp; Upgrade
  </text>
</svg>