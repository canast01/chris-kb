<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Jira — Project Tracking Platform Architecture
  </text>
  
  <rect x="10" y="50" width="390" height="160" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Data Center Architecture
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    2+ nodes: active-active
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Hazelcast: cluster cache
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Load balancer: sticky session
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: external automation
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tomcat: embedded web server
  </text>

  <rect x="420" y="50" width="390" height="160" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Storage Components
  </text>
  <text x="430" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PostgreSQL: primary DB
  </text>
  <text x="430" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Oracle/SQL Server: also ok
  </text>
  <text x="430" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS: shared home dir
  </text>
  <text x="430" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Attachments on NFS share
  </text>
  <text x="430" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lucene: local search index
  </text>

  <line x1="205" y1="210" x2="205" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="210" x2="615" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="240" width="390" height="160" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key Concepts
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Project: work container
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Issue: individual work item
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workflow: state transitions
  </text>
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Board: sprint/kanban view
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    JQL: Jira Query Language
  </text>

  <rect x="420" y="240" width="390" height="160" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Cloud vs Data Center
  </text>
  <text x="430" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cloud: Atlassian-managed SaaS
  </text>
  <text x="430" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DC: self-hosted on prem
  </text>
  <text x="430" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DC: unlimited customisation
  </text>
  <text x="430" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DC: own DR/backup control
  </text>
  <text x="430" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cloud: auto-upgrades
  </text>

  <rect x="10" y="420" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    2+ Linux VMs (8 vCPU, 32 GB RAM each); NFS server or NAS for shared home;
  </text>
  <text x="20" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PostgreSQL cluster; load balancer (HAProxy or F5); internet access for app store.
  </text>

  <rect x="10" y="510" width="800" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="20" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Jira           = Atlassian project tracking; issues, boards, sprints, workflows
  </text>
  <text x="20" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data Center    = Jira DC; self-hosted clustered edition; license required
  </text>
  <text x="20" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Hazelcast      = distributed in-memory cache used by Jira DC cluster members
  </text>
  <text x="20" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lucene         = search indexing library; Jira uses per-node index replicas
  </text>
  <text x="20" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS home       = shared filesystem; all nodes mount same path for attachments
  </text>
  <text x="20" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    JQL            = Jira Query Language; SQL-like issue search
  </text>
  <text x="20" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workflow       = state machine for issues (To Do → In Progress → Done)
  </text>
  <text x="20" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    App store      = Atlassian Marketplace; plugins extend Jira functionality
  </text>
  <text x="20" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Sticky session = load balancer directs user to same node for session state
  </text>
  <text x="20" y="685" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PostgreSQL     = preferred database; Oracle and SQL Server also supported
  </text>
  <text x="20" y="700" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tomcat         = Java servlet container; Jira runs embedded within Tomcat
  </text>
  <text x="20" y="715" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API       = Jira REST v2/v3; create/update issues, query boards
  </text>

  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Architecture Overview
  </text>
</svg>