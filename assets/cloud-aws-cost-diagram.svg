<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Cost Management</text>

  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">AWS Cost Management — Visibility, Optimisation, and Governance</text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Cost Explorer: historical and forecasted spend by service, account, region, and tag</text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Budgets: threshold alerts via email or SNS; action budgets can auto-apply IAM policies</text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Reserved Instances + Savings Plans: commit to 1 or 3 years for up to 72% discount on EC2/RDS</text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Cost Anomaly Detection: ML-based; detects unexpected spend spikes and notifies immediately</text>

  <text x="410" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Visibility (Explorer/CUR) feeds optimisation (RI/SP) and governance (Budgets/Anomaly/Tags)</text>

  <line x1="200" y1="160" x2="200" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="160" x2="620" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="180" width="240" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="140" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Cost Explorer</text>
  <text x="140" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Service breakdowns: daily</text>
  <text x="140" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Account + region filters</text>
  <text x="140" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Tag-based chargeback</text>
  <text x="140" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Rightsizing: recommendations</text>
  <text x="140" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">CUR: hourly cost detail</text>

  <rect x="290" y="180" width="240" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="410" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Budgets</text>
  <text x="410" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Cost threshold: $+alert</text>
  <text x="410" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Usage budget: unit+alert</text>
  <text x="410" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Action budget: IAM deny</text>
  <text x="410" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Forecast: alert at 80%</text>
  <text x="410" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">SNS: alert notification</text>

  <rect x="560" y="180" width="240" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="680" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Optimisation</text>
  <text x="680" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Reserved Instances: 1/3yr</text>
  <text x="680" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Savings Plans: compute</text>
  <text x="680" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Spot Instances: -90% cost</text>
  <text x="680" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Anomaly Detection: ML</text>
  <text x="680" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Cost alloc tags: billing</text>

  <text x="410" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Cost Explorer provides visibility · Budgets alert on thresholds · Optimisation reduces total spend</text>

  <line x1="200" y1="330" x2="200" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="330" x2="410" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="330" x2="620" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="350" width="780" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Cost Explorer   │     Budgets      │    RI / Savings   │     Anomaly      │       Tags</text>
  <text x="410" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">By service: EC2  │  Monthly limit   │   RI coverage %   │ ML alert: spike  │  Activate tags</text>
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">By account: all  │  Forecast alert  │   SP utilisation  │ Investigate: who │  Cost alloc tag</text>
  <text x="410" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Rightsizing recs │  Action budget   │  RI renewal: when │  Anomaly report  │ Chargeback: team</text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Forecast: 3mo   │    SNS notify    │   Spot: savings   │ Suppress: known  │  Tagging policy</text>

  <text x="410" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Physical Infrastructure (the hardware everything above runs on):</text>
  <text x="410" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">AWS billing infrastructure · CUR data in S3 · Cost Explorer API · Budget notifications via SNS/email</text>

  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Key terms:</text>

  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Cost Explorer   = AWS console and API tool for analysing spend trends by service, account, tag,</text>
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">CUR             = Cost and Usage Report; detailed hourly billing data exported to S3 for FinOps tools</text>
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Budget          = Spend threshold with alert and optional action; types: cost, usage, RI, Savings</text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Action budget   = Budget that auto-applies SCPs or IAM policies when spend threshold is crossed</text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Reserved Instance= 1 or 3-year commitment to EC2/RDS capacity; up to 72% discount vs on-demand</text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Savings Plan    = Flexible commitment to $/hr compute spend; applies to EC2, Fargate, Lambda</text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Spot Instance   = Unused EC2 capacity at up to 90% discount; can be reclaimed with 2-min notice</text>
  <text x="410" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">RI Coverage     = Percentage of eligible usage hours covered by Reserved Instances; target &gt;80%</text>
  <text x="410" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Cost alloc tag  = Resource tag activated in billing console; appears as column in Cost Explorer/CUR</text>
  <text x="410" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Chargeback      = Attributing AWS costs to business units or teams using cost allocation tags</text>
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Anomaly Detection= ML model that learns normal spend patterns and alerts on statistically unexpected</text>
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Rightsizing     = Cost Explorer recommendation to downsize underutilised EC2 or RDS instances</text>

  <rect x="0" y="710" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="730" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">Diagram Type: AWS Cost Management Overview</text>
</svg>