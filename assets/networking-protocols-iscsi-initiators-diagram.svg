<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">iSCSI Initiators</text>
  
  <text x="10" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">iqn.YYYY-MM.reverse-domain:identifier</text>
  <text x="10" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">iqn.2024-01.com.example:server01-hba0</text>
  
  <line x1="20" y1="100" x2="20" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="30" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">iSCSI Qualified Name prefix</text>
  
  <line x1="100" y1="100" x2="100" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="110" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">date company adopted iSCSI</text>
  
  <line x1="180" y1="100" x2="180" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="190" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">domain</text>
  
  <line x1="800" y1="100" x2="800" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="650" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">unique identifier</text>
  
  <rect x="0" y="270" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: iSCSI Initiators</text>
</svg>