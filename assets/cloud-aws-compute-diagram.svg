<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    AWS Compute Overview
  </text>
  
  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Compute — EC2, Auto Scaling, Lambda, and Systems Manager Fleet Management
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EC2: virtual machines in 400+ instance types across general, compute, memory, storage families
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Auto Scaling: launch templates + scaling policies maintain desired capacity across AZs
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Systems Manager: fleet management without SSH — session manager, patch manager, run command
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Lambda: serverless functions; event-driven; up to 15 min timeout; 10 GB RAM; no servers to
  </text>
  
  <text x="410" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Compute spans persistent VMs (EC2), elastic fleets (ASG), and serverless (Lambda) managed by SSM
  </text>
  
  <line x1="150" y1="170" x2="150" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="170" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="170" x2="670" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="200" width="240" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="140" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    EC2
  </text>
  <text x="140" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Instance types: t/m/c/r/x
  </text>
  <text x="140" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AMI: OS + config snapshot
  </text>
  <text x="140" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EBS: root + data volumes
  </text>
  <text x="140" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Instance profile: IAM role
  </text>
  <text x="140" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Metadata: IMDSv2 only
  </text>
  
  <rect x="290" y="200" width="240" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="410" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Auto Scaling
  </text>
  <text x="410" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Launch template: AMI+type
  </text>
  <text x="410" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Min / desired / max count
  </text>
  <text x="410" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Scaling policies: CPU/SQS
  </text>
  <text x="410" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Health check: EC2 or ELB
  </text>
  <text x="410" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Instance refresh: rolling
  </text>
  
  <rect x="560" y="200" width="240" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="680" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Systems Manager
  </text>
  <text x="680" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Session Manager: no SSH
  </text>
  <text x="680" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Patch Manager: baselines
  </text>
  <text x="680" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Run Command: remote exec
  </text>
  <text x="680" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Inventory: installed SW
  </text>
  <text x="680" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Parameter Store: config
  </text>
  
  <text x="410" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    EC2 provides persistent VMs · Auto Scaling elastically manages fleets
  </text>
  
  <line x1="150" y1="360" x2="150" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="360" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="360" x2="670" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="390" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    EC2        │   Auto Scaling   │       Lambda      │ Systems Manager  │  Patch Manager
  </text>
  <text x="410" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Start / stop   │ Desired capacity │ Runtime: py/js/go │ Session: connect │ Baseline: rules
  </text>
  <text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AMI: launch cfg  │   Scale in/out   │  Trigger: events  │   Run command    │ Patch: schedule
  </text>
  <text x="410" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Snapshot: EBS   │ Launch template  │   CW Logs output  │ Inventory: list  │ Compliance: view
  </text>
  <text x="410" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Resize: change typ│ Instance refresh │   X-acct trigger  │ Param Store: get │   Reboot: post
  </text>
  
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS bare-metal hosts · Nitro hypervisor · Availability Zones · VPC network · EBS storage fabric
  </text>
  
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EC2            = Elastic Compute Cloud; virtual machines running on AWS Nitro hypervisor
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AMI            = Amazon Machine Image; snapshot of OS + config used to launch new EC2 instances
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Instance type  = Defines vCPU, RAM, network, and storage; families: t (burstable), m (general), c
  </text>
  <text x="410" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Launch template= Versioned EC2 config (AMI, type, SG, IAM, user-data) used by ASG and manual launches
  </text>
  <text x="410" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Auto Scaling Group= Maintains desired instance count; replaces unhealthy; scales on policies or
  </text>
  <text x="410" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Instance profile= IAM role attached to EC2; grants AWS API permissions to the instance itself
  </text>
  <text x="410" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IMDSv2         = Instance Metadata Service v2; token-based; required; prevents SSRF metadata theft
  </text>
  <text x="410" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Session Manager= SSM feature replacing SSH; browser or CLI access; no inbound ports needed on SG
  </text>
  <text x="410" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Patch Manager  = SSM feature applying OS patches on schedule; records compliance per instance
  </text>
  <text x="410" y="705" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Run Command    = SSM feature executing scripts/commands on fleets without SSH; output to CloudWatch
  </text>
  <text x="410" y="720" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Lambda         = Serverless compute; no servers to manage; billed per invocation and duration (ms)
  </text>
  <text x="410" y="735" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EBS            = Elastic Block Store; persistent block volumes attached to EC2; survives instance
  </text>
  
  <rect x="0" y="750" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="770" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: AWS Compute Overview
  </text>
</svg>