<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Amazon EVS — VCF on AWS Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Bare-Metal EC2 · VPC Integration · NSX-T Overlay · vSAN HCI · Direct Connect</text>

  <!-- COLUMN 1: AWS Infrastructure -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#e65100"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">AWS Infrastructure</text>
  <text x="145" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">i4i.metal · VPC · ENI · IAM</text>
  <rect x="30" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">i4i.metal bare-metal hosts</text>
  <rect x="30" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">VPC + dedicated subnets</text>
  <rect x="30" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">ENI (vmnic uplinks for ESXi)</text>
  <rect x="30" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">IAM service role (EVS permissions)</text>
  <rect x="30" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">AWS Console (EVS cluster provisioning)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Dedicated bare metal; ESXi runs natively</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">No hypervisor layer under ESXi</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">ENIs map to vmnics inside ESXi</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">VPC CIDRs must not overlap workloads</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">AWS Console provisions EVS (not vCenter)</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">i4i.metal: local NVMe for vSAN</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">Minimum 4 hosts per EVS cluster</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">Single AZ per cluster (multi-AZ planned)</text>

  <!-- COLUMN 2: VMware Layer -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">VMware Layer</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">vCenter · ESXi · NSX-T · vSAN</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SDDC Manager (VCF lifecycle)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter Server (cluster management)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ESXi (on bare-metal i4i hosts)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NSX-T Manager + T0 Gateway</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSAN datastore (local NVMe)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">SDDC Manager handles VCF bringup</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">NSX-T T0 BGP peers to VPC router</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Workload CIDRs propagated to TGW</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">vSAN: local NVMe on i4i.metal hosts</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">VCF 5.x; managed like on-premises</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Same vCenter APIs as on-prem VCF</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">LCM: Broadcom patches via SDDC Manager</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Aria Suite optional for operations</text>

  <!-- COLUMN 3: Connectivity -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Connectivity</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">HCX · Direct Connect · Transit Gateway</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">HCX (live VM migration)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">AWS Direct Connect (private link)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Transit Gateway (multi-VPC routing)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VPC Endpoints (AWS native services)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VPN Gateway (backup / fallback path)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">HCX: vMotion-based live migration</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">DX: 1/10/100 Gbps; low-latency private</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">TGW: connects EVS VPC to other VPCs</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">S3/RDS accessed via VPC Endpoints</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">No IGW needed for corp workloads</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">DX recommended; VPN is backup only</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">NSX-T T0 BGP advertises segments to TGW</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Cross-region: use TGW peering</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">On-premises VCF vs Amazon EVS</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Aspect</text>
  <text x="400" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">On-premises VCF</text>
  <text x="650" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Amazon EVS</text>
  <line x1="215" y1="516" x2="215" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="580" y1="516" x2="580" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="562" text-anchor="middle" fill="#455a64" font-size="9">Hardware</text>
  <text x="400" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Self-procured; 3-5 yr refresh cycle</text>
  <text x="650" y="562" text-anchor="middle" fill="#546e7a" font-size="9">AWS-managed bare metal</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">Capacity expansion</text>
  <text x="400" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Manual; procurement lead time</text>
  <text x="650" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Add hosts in minutes</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="614" text-anchor="middle" fill="#455a64" font-size="9">WAN requirement</text>
  <text x="400" y="614" text-anchor="middle" fill="#546e7a" font-size="9">MPLS / Internet VPN</text>
  <text x="650" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Direct Connect (recommended)</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">Billing model</text>
  <text x="400" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Broadcom perpetual / subscription</text>
  <text x="650" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Per-host hourly (AWS)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Cross-site DR</text>
  <text x="400" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Self-managed SRM / vSAN stretched</text>
  <text x="650" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Cross-AZ + HCX migration option</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Amazon EVS Reference · VCF on AWS · Bare-Metal EC2 · NSX-T · vSAN · HCX · Direct Connect</text>
</svg>
