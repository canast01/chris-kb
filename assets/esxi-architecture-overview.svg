<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">ESXi — Cluster Deployment Models</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Standalone · Standard Cluster · vSAN Cluster · Stretched Cluster</text>

  <!-- ═ COLUMN 1: Standalone ═ -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#546e7a" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#546e7a"/>
  <text x="112" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Standalone</text>
  <text x="112" y="111" text-anchor="middle" fill="#cfd8dc" font-size="9">Single host · no vCenter</text>
  <rect x="30" y="126" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">1 ESXi Host</text>
  <rect x="30" y="152" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Local Disks (VMFS)</text>
  <rect x="30" y="178" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Optional: external SAN</text>
  <rect x="30" y="204" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">ESXi Host Client (UI)</text>
  <text x="112" y="258" text-anchor="middle" fill="#78909c" font-size="9">No vCenter required</text>
  <text x="112" y="276" text-anchor="middle" fill="#78909c" font-size="9">No HA or DRS</text>
  <text x="112" y="294" text-anchor="middle" fill="#78909c" font-size="9">No vMotion</text>
  <text x="112" y="312" text-anchor="middle" fill="#78909c" font-size="9">Use: edge sites, dev/test</text>
  <text x="112" y="330" text-anchor="middle" fill="#78909c" font-size="9">Minimal management overhead</text>

  <!-- ═ COLUMN 2: Standard Cluster ═ -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="307" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Standard Cluster</text>
  <text x="307" y="111" text-anchor="middle" fill="#90caf9" font-size="9">3+ hosts · shared SAN or NAS</text>
  <rect x="225" y="126" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">3+ ESXi Hosts</text>
  <rect x="225" y="152" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vCenter Server</text>
  <rect x="225" y="178" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Shared Datastore (VMFS / NFS)</text>
  <rect x="225" y="204" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">HA + DRS + vMotion</text>
  <rect x="225" y="230" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">SAN: FC · iSCSI · NFS</text>
  <text x="307" y="282" text-anchor="middle" fill="#78909c" font-size="9">vCenter required</text>
  <text x="307" y="300" text-anchor="middle" fill="#78909c" font-size="9">HA protects VM availability</text>
  <text x="307" y="318" text-anchor="middle" fill="#78909c" font-size="9">DRS balances CPU/memory load</text>
  <text x="307" y="336" text-anchor="middle" fill="#78909c" font-size="9">External storage array required</text>
  <text x="307" y="354" text-anchor="middle" fill="#78909c" font-size="9">Use: enterprise workloads</text>

  <!-- ═ COLUMN 3: vSAN Cluster ═ -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#00695c"/>
  <text x="502" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">vSAN Cluster</text>
  <text x="502" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">3+ hosts · pooled local storage</text>
  <rect x="420" y="126" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">3+ ESXi Hosts (NVMe / SSD)</text>
  <rect x="420" y="152" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter Server</text>
  <rect x="420" y="178" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSAN Datastore (distributed)</text>
  <rect x="420" y="204" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">HA + DRS + SPBM</text>
  <rect x="420" y="230" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="502" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ESA or OSA architecture</text>
  <text x="502" y="282" text-anchor="middle" fill="#78909c" font-size="9">No external array required</text>
  <text x="502" y="300" text-anchor="middle" fill="#78909c" font-size="9">Storage policies per VM</text>
  <text x="502" y="318" text-anchor="middle" fill="#78909c" font-size="9">RAID-1 / RAID-5 / RAID-6</text>
  <text x="502" y="336" text-anchor="middle" fill="#78909c" font-size="9">Dedupe + compression (ESA)</text>
  <text x="502" y="354" text-anchor="middle" fill="#78909c" font-size="9">Use: HCI / VCF clusters</text>

  <!-- ═ COLUMN 4: Stretched Cluster ═ -->
  <rect x="605" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="185" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="605" y="100" width="185" height="14" fill="#6a1b9a"/>
  <text x="697" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Stretched Cluster</text>
  <text x="697" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">2 sites + witness · metro BC</text>
  <rect x="615" y="126" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Site A: 2+ ESXi Hosts</text>
  <rect x="615" y="152" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Site B: 2+ ESXi Hosts</text>
  <rect x="615" y="178" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Witness Appliance (3rd site)</text>
  <rect x="615" y="204" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">vSAN Stretched Datastore</text>
  <rect x="615" y="230" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">vCenter site-aware HA</text>
  <text x="697" y="282" text-anchor="middle" fill="#78909c" font-size="9">RPO=0 across sites</text>
  <text x="697" y="300" text-anchor="middle" fill="#78909c" font-size="9">≤5ms RTT between sites</text>
  <text x="697" y="318" text-anchor="middle" fill="#78909c" font-size="9">Witness: 3rd site or cloud</text>
  <text x="697" y="336" text-anchor="middle" fill="#78909c" font-size="9">Active-active storage</text>
  <text x="697" y="354" text-anchor="middle" fill="#78909c" font-size="9">Use: metro BC / ROBO</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cluster Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="305" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Standalone</text>
  <text x="455" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Standard</text>
  <text x="600" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">vSAN</text>
  <text x="745" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Stretched</text>
  <line x1="220" y1="516" x2="220" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="385" y1="516" x2="385" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="515" y1="516" x2="515" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="680" y1="516" x2="680" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="561" text-anchor="middle" fill="#455a64" font-size="9">Minimum hosts</text>
  <text x="302" y="562" text-anchor="middle" fill="#546e7a" font-size="9">1</text>
  <text x="450" y="562" text-anchor="middle" fill="#546e7a" font-size="9">3+</text>
  <text x="597" y="562" text-anchor="middle" fill="#546e7a" font-size="9">3+</text>
  <text x="742" y="562" text-anchor="middle" fill="#546e7a" font-size="9">4+ (2/site)</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">HA / DRS</text>
  <text x="302" y="588" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="588" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="588" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="588" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="613" text-anchor="middle" fill="#455a64" font-size="9">External storage array</text>
  <text x="302" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Optional</text>
  <text x="450" y="614" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="614" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="614" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">vCenter required</text>
  <text x="302" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Primary use case</text>
  <text x="302" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Edge / dev</text>
  <text x="450" y="665" text-anchor="middle" fill="#546e7a" font-size="9">SAN/NAS workloads</text>
  <text x="597" y="665" text-anchor="middle" fill="#546e7a" font-size="9">HCI / VCF</text>
  <text x="742" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Metro BC / ROBO</text>
  <text x="120" y="691" text-anchor="middle" fill="#455a64" font-size="9">Cross-site resilience</text>
  <text x="302" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware ESXi Reference · Standalone · Standard Cluster · vSAN · Stretched Cluster</text>
</svg>
