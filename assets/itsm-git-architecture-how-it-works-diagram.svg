<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Git Directory Structure</text>
  
  <rect x="20" y="50" width="780" height="300" fill="#ffffff" stroke="#455a64" stroke-width="1.5" rx="6" />
  
  <text x="40" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">.git/</text>
  
  <line x1="60" y1="90" x2="60" y2="110" stroke="#455a64" stroke-width="1.5" />
  <text x="80" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">HEAD</text>
  <line x1="140" y1="105" x2="200" y2="105" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">ref: refs/heads/main</text>
  
  <line x1="60" y1="120" x2="60" y2="140" stroke="#455a64" stroke-width="1.5" />
  <text x="80" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">refs/</text>
  
  <line x1="100" y1="150" x2="100" y2="170" stroke="#455a64" stroke-width="1.5" />
  <text x="120" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">heads/</text>
  <line x1="180" y1="165" x2="240" y2="165" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="250" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">local branches</text>
  
  <line x1="100" y1="180" x2="100" y2="200" stroke="#455a64" stroke-width="1.5" />
  <text x="120" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">remotes/</text>
  
  <line x1="140" y1="210" x2="140" y2="230" stroke="#455a64" stroke-width="1.5" />
  <text x="160" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">origin/</text>
  
  <line x1="100" y1="240" x2="100" y2="260" stroke="#455a64" stroke-width="1.5" />
  <text x="120" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">tags/</text>
  
  <line x1="60" y1="270" x2="60" y2="290" stroke="#455a64" stroke-width="1.5" />
  <text x="80" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">packed-refs</text>
  <line x1="160" y1="285" x2="220" y2="285" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="230" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">bulk storage for many refs</text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Git Directory Structure</text>
</svg>