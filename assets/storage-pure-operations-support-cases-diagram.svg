<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Pure Support Case Flow</text>
  
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Collect diagnostic info</text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ purecli support info</text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ purealert list</text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ purearray list</text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ log bundle (purediag)</text>
  
  <line x1="410" y1="130" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="160" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Open case via Pure1</text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">pure1.purestorage.com</text>
  <text x="20" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Support → Cases</text>
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Select array</text>
  <text x="20" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Set severity P1–P4</text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ Attach logs</text>
  
  <line x1="410" y1="240" x2="410" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="415" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">P1/P2</text>
  
  <rect x="10" y="270" width="800" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Phone Pure Support 24/7</text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">TAC responds per SLA</text>
  
  <line x1="410" y1="330" x2="410" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="415" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">not progressing</text>
  
  <rect x="10" y="360" width="800" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Escalate via CSM / TAM</text>
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Billing/SLA → CSM direct</text>
  
  <rect x="0" y="560" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Pure Storage Support Cases</text>
</svg>