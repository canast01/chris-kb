<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">NetBackup — Escalation Process</text>

  <rect x="20" y="50" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open support case at my.veritas.com with nbsu bundle attached</text>

  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="120" width="780" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — For S1: call Veritas support phone immediately after opening the portal case</text>
  <text x="30" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(number shown on case confirmation page; varies by region: NA, EMEA, APAC)</text>

  <line x1="410" y1="190" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="210" width="780" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="235" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — Veritas T1 support confirms receipt and reviews nbsu bundle (typically 30 min–2 h)</text>

  <line x1="410" y1="260" x2="410" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="280" width="780" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="305" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If no meaningful progress in 4 hours for S1 or 1 business day for S2:</text>
  <text x="40" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in the case: "Requesting escalation to Senior Support Engineer"</text>
  <text x="40" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State impact: "Production backup window missed since [date]; [n] TB at risk"</text>

  <line x1="410" y1="350" x2="410" y2="370" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="370" width="780" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="395" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — Senior engineer may schedule a remote session (GoTo or Zoom)</text>
  <text x="40" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have root/Administrator access to master and media servers ready</text>
  <text x="40" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have nbsu bundle, bpdbjobs output, and logs accessible</text>

  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="460" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For catalog corruption or data loss risk: request Critical Situation (CritSit) engagement</text>
  <text x="40" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State in the case: "Requesting CritSit — catalog integrity at risk / potential data loss"</text>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>