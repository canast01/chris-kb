<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SQL Server — Common Issues</text>
  
  <rect x="10" y="50" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Query slow?</text>
  
  <line x1="50" y1="90" x2="50" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="120" width="750" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="70" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">EXPLAIN shows Seq Scan on large table → add index</text>
  
  <line x1="50" y1="150" x2="50" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="180" width="750" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="70" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">EXPLAIN shows correct index but slow → stale statistics → ANALYZE</text>
  
  <line x1="50" y1="210" x2="50" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="240" width="750" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="70" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Waiting on lock → find blocker; kill if necessary</text>
  
  <line x1="50" y1="270" x2="50" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="300" width="750" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="70" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">High I/O wait → buffer pool too small → increase shared_buffers / innodb_buffer_pool_size</text>
  
  <line x1="50" y1="330" x2="50" y2="360" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="360" width="750" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="70" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">CPU spiking → too many connections or parallel queries → check pool; tune work_mem</text>
  
  <rect x="0" y="400" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Troubleshooting Flowchart</text>
</svg>