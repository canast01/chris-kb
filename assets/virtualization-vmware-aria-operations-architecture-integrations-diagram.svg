<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Aria Operations — Integrations
  </text>
  
  <rect x="10" y="50" width="800" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Core Platform Integrations
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vCenter: primary data source — inventory, metrics, events, tags, alarms
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NSX: network topology, logical switches, edges, DFW rules, and BGP state
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vSAN: cluster health, capacity, performance, and disk group metrics
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Aria Automation: request lifecycle, deployment state, and cost data
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Aria Logs: log-based alerts forwarded to Aria Ops as notifications
  </text>
  
  <text x="410" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Adapters connect Aria Ops to external systems; each adapter has its own credential and schedule
  </text>
  
  <line x1="410" y1="190" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="220" width="390" height="150" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Infrastructure Adapters
  </text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dell EMC: PowerStore
  </text>
  <text x="20" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure Storage FlashArray
  </text>
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetApp ONTAP adapter
  </text>
  <text x="20" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cisco UCS adapter
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AWS/Azure cloud
  </text>
  
  <rect x="420" y="220" width="390" height="150" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    ITSM / Notification
  </text>
  <text x="430" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ServiceNow: CMDB sync
  </text>
  <text x="430" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMTP: email alerts
  </text>
  <text x="430" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SNMP trap outbound
  </text>
  <text x="430" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Slack/Teams webhook
  </text>
  <text x="430" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PagerDuty REST API
  </text>
  
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure:
  </text>
  <text x="20" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Adapter processes run inside Aria Ops master node · outbound plugins use TCP 443/25/162
  </text>
  
  <text x="20" y="435" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Adapter = PAK-based plugin that collects data from a specific source (storage, cloud, network)
  </text>
  <text x="20" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PAK file = Plugin/adapter package distributed by VMware or partner; installed via Solutions UI
  </text>
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Credential = Stored username/password or token used by adapter to authenticate to source
  </text>
  <text x="20" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Collection interval = Frequency at which adapter queries source; typically 5 minutes
  </text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Outbound plugin = Connector for sending alert notifications (SMTP, SNMP, REST, webhook)
  </text>
  <text x="20" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CMDB sync = Pushing Aria Ops object inventory into ServiceNow CMDB via adapter
  </text>
  <text x="20" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tag propagation = vSphere tags imported by vCenter adapter and applied to Aria Ops objects
  </text>
  <text x="20" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cloud account = AWS/Azure subscription registered in Aria Ops for cross-cloud visibility
  </text>
  <text x="20" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST adapter = Generic HTTP adapter for any REST API source not covered by a PAK
  </text>
  <text x="20" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Webhook = HTTP POST payload sent by outbound plugin when alert fires
  </text>
  <text x="20" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SNMP trap = UDP notification sent to network management system on alert condition
  </text>
  <text x="20" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Alert notification = Outbound message triggered when alert changes state (firing or resolved)
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Integration Architecture
  </text>
</svg>