<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Deployment Procedure</text>
  
  <rect x="10" y="50" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Validation fails?</text>
  
  <line x1="160" y1="90" x2="160" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="130" width="360" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Immediate: service down / error rate &gt; 3×baseline</text>
  
  <line x1="190" y1="170" x2="190" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="210" width="360" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Roll back now; notify stakeholders</text>
  
  <line x1="370" y1="150" x2="370" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="380" y="130" width="360" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="390" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Degraded: latency elevated / some errors</text>
  
  <line x1="560" y1="170" x2="560" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="380" y="210" width="360" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="390" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Investigate for 10 min</text>
  
  <line x1="560" y1="250" x2="560" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="380" y="290" width="180" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="390" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Improving → continue soak</text>
  
  <line x1="740" y1="250" x2="740" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="580" y="290" width="160" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="590" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Not improving → roll back</text>
  
  <rect x="0" y="350" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Deployment Procedure</text>
</svg>