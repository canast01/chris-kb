<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Cisco MDS Architecture — NX-OS FC Switching
  </text>
  
  <g transform="translate(10, 40)">
    <rect width="390" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="195" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      Platform Types
    </text>
    <text x="195" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Fixed: 9132T/9148T/9396T
    </text>
    <text x="195" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Director: 9706/9710/9718
    </text>
    <text x="195" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      ISSU: zero-downtime upgrade
    </text>
    <text x="195" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Dual supervisor (directors)
    </text>
    <text x="195" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Linecard: modular port density
    </text>
  </g>
  
  <g transform="translate(410, 40)">
    <rect width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="195" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      VSAN Architecture
    </text>
    <text x="195" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      VSAN: logical fabric on 1 switch
    </text>
    <text x="195" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Separate NS/zone DB per VSAN
    </text>
    <text x="195" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Port VSAN assignment: per port
    </text>
    <text x="195" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Domain ID: per VSAN unique
    </text>
    <text x="195" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      VSAN 1: default; avoid in prod
    </text>
  </g>
  
  <line x1="205" y1="160" x2="205" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="160" x2="615" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 180)">
    <rect width="390" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="195" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      FC Services
    </text>
    <text x="195" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      FCNS: fabric name server
    </text>
    <text x="195" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      FSPF: fabric shortest path
    </text>
    <text x="195" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      FLOGI: fabric login process
    </text>
    <text x="195" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      FDISC: N-port virtualisation
    </text>
    <text x="195" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      TE port: trunked E port ISL
    </text>
  </g>
  
  <g transform="translate(410, 180)">
    <rect width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="195" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      Management
    </text>
    <text x="195" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DCNM/NDFC: central mgmt
    </text>
    <text x="195" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      CLI: NX-OS SSH access
    </text>
    <text x="195" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      SNMP: v3 for monitoring
    </text>
    <text x="195" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      NTP: clock sync required
    </text>
    <text x="195" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      AAA: TACACS+ or RADIUS
    </text>
  </g>
  
  <g transform="translate(10, 310)">
    <text x="0" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Physical Infrastructure (the hardware everything above runs on):
    </text>
    <text x="0" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FC switches in dedicated SAN racks; A and B fabric physical separation;
    </text>
    <text x="0" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      32G/64G SFP+ optics; separate out-of-band management on mgmt0 port.
    </text>
  </g>
  
  <g transform="translate(10, 370)">
    <text x="0" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Key terms:
    </text>
    <text x="0" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      NX-OS         = Cisco network OS for MDS (and Nexus) switches
    </text>
    <text x="0" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      VSAN          = Virtual SAN; logical fabric partition; own name server
    </text>
    <text x="0" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Domain ID     = 1-byte fabric-unique switch ID per VSAN
    </text>
    <text x="0" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FCNS          = Fibre Channel Name Server; tracks WWN logins per VSAN
    </text>
    <text x="0" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FSPF          = Fabric Shortest Path First; FC routing protocol
    </text>
    <text x="0" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      ISSU          = In-Service Software Upgrade; zero-downtime NX-OS upgrade
    </text>
    <text x="0" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      TE port       = Trunked E port; ISL carrying multiple VSANs
    </text>
    <text x="0" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FLOGI         = Fabric Login; HBA logs in to get FC address (FCID)
    </text>
    <text x="0" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FCID          = Fabric-assigned 3-byte address; domain.area.port
    </text>
    <text x="0" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Zoning        = access control; same concept as Brocade; per VSAN
    </text>
    <text x="0" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DCNM/NDFC     = Cisco fabric manager; discover, zone, monitor MDS
    </text>
    <text x="0" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Director      = high-end chassis MDS; dual supervisors; ISSU capable
    </text>
  </g>
  
  <rect y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Cisco MDS Architecture
  </text>
</svg>