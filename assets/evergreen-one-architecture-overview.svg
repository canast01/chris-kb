  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Telemetry sent to Pure1 cloud always</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Health Score: 0-10 across array fleet</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Forecasting: days to full prediction</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Orders: Pure ships HW before you run out</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Pure Assist: auto-schedule upgrades</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">API: Pure1 REST API for automation</text>

