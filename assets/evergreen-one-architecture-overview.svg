  <text x="700" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Pure owns throughout term</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Billing model</text>
  <text x="450" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Annual subscription (fixed)</text>
  <text x="700" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Monthly consumption (variable)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Availability SLA</text>
  <text x="450" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Platform HA guarantee</text>
  <text x="700" y="613" text-anchor="middle" fill="#546e7a" font-size="9">99.9999% contractual SLA</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Hardware managed by</text>
  <text x="450" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Customer (Pure executes)</text>
  <text x="700" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Pure (fully transparent)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Capacity commitment</text>
  <text x="450" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Fixed entitlement + True Forward</text>
  <text x="700" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Committed reserve + burst</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="450" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Capex-tolerant, long-term ownership</text>
  <text x="700" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Opex model, SLA-driven teams</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Pure Evergreen//One Reference · STaaS · 99.9999% SLA · Pure1 · Committed Reserve · Pure-Managed</text>
