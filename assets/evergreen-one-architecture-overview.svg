  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Six 9s = &lt;32 seconds downtime/year</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">IOPS SLA: defined at contract time</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">On-site: 4-hour hardware response</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Capacity: 20% buffer always available</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Credits: account balance for SLA breach</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Perf tier: Standard, Premium, Premier</text>

  <!-- ═ COMPARISON TABLE ═ -->
