  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Committed reserve: guaranteed minimum</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Burst: consume above reserve up to max</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Pure installs, maintains, refreshes HW</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">No capex — opex subscription model</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Exits: buy hardware at term end or extend</text>

