<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SnapMirror — Escalation</text>

  <rect x="20" y="50" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at mysupport.netapp.com with AutoSupport invoked on both clusters</text>

  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="120" width="780" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — TSE acknowledges and reviews AutoSupport + snapmirror show data</text>
  <text x="30" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(P1: &lt; 1 hr; P2: &lt; 2 hr — requires SupportEdge 24×7)</text>

  <line x1="410" y1="190" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="210" width="780" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="235" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 2 hours for P1:</text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply: "Requesting escalation to SnapMirror Specialist Engineer"</text>
  <text x="40" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[all relationships broken / SM-BC quorum lost / resync failing]"</text>

  <line x1="410" y1="300" x2="410" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="320" width="780" height="90" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="345" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Product Specialist Engineer assigned</text>
  <text x="40" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will review EMS events and may request live cluster access (WebEx session)</text>
  <text x="40" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SSH to both cluster management LIFs ready</text>

  <line x1="410" y1="410" x2="410" y2="430" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="430" width="780" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="455" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue involves code-level problem (SM-BC quorum state, resync algorithm bug):</text>
  <text x="40" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Specialist escalates to NetApp ONTAP Engineering</text>
  <text x="40" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide targeted EMS debug commands or a hotpatch</text>

  <line x1="410" y1="500" x2="410" y2="520" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="520" width="780" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For P1 with DR completely unavailable &gt; 2 hours:</text>
  <text x="40" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Call +1-888-463-8277 and request a Duty Manager escalation</text>
  <text x="40" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engage NetApp account team for executive escalation</text>
  <text x="40" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAM involvement: essential for SM-BC implementations where quorum loss affects SAN I/O</text>

  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>