<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MySQL / MariaDB — Escalation</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Engage DBA immediately for any P1 condition</text>
  </g>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 110)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Open case at Oracle MOS or Percona with error log + InnoDB status + replication status</text>
  </g>
  
  <line x1="410" y1="150" x2="410" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 170)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — T1 engineer acknowledges; reviews diagnostic data</text>
  </g>
  
  <line x1="410" y1="210" x2="410" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 230)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If no meaningful progress (Sev1: &lt; 1 hr; Sev2: &lt; 4 hr):</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply: "Requesting escalation to MySQL/MariaDB Senior Engineer"</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[crash loop / replica down / data loss risk / production halted]"</text>
  </g>
  
  <line x1="410" y1="310" x2="410" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 330)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — Senior engineer assigned; may request SSH access via jump host</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have root access to MySQL data directory and error log ready</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Confirm a data directory snapshot exists before allowing any recovery steps</text>
  </g>
  
  <line x1="410" y1="410" x2="410" y2="430" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 430)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — If issue involves a confirmed MySQL/MariaDB bug (version regression):</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Vendor escalates to engineering; may provide a specific build or workaround</text>
  </g>
  
  <rect x="0" y="540" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>