<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Enterprise Storage Design — Architecture Overview</text>

  <!-- Column 1: Storage Tiers -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Storage Tiers</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 0: NVMe all-flash</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 1: SAS all-flash</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 2: Hybrid SAS/SSD</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 3: Object / Archive</text>

  <!-- Column 2: Protocol Layer -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Protocol Layer</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Block (FC/iSCSI)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">File (NFS/SMB/CIFS)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Object (S3 API)</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Backup target (DD/OST)</text>

  <!-- Column 3: Resilience -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Resilience</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">RAID / erasure coding</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Synchronous replication</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Async replication</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Snapshot + clone</text>

  <!-- Comparison Table -->
  <rect x="20" y="330" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Protocol</text>
  <text x="310" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Use Case</text>
  <text x="510" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Latency</text>
  <text x="701" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Throughput</text>

  <rect x="20" y="360" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Fibre Channel</text>
  <text x="310" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">High-perf block (DB/VMs)</text>
  <text x="510" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Sub-ms (dedicated fabric)</text>
  <text x="701" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">16 / 32 Gbps per port</text>

  <rect x="20" y="386" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">iSCSI</text>
  <text x="310" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Block over Ethernet</text>
  <text x="510" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low ms (shared network)</text>
  <text x="701" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">10 / 25 / 100 GbE</text>

  <rect x="20" y="412" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">NFS</text>
  <text x="310" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Shared file (VMs/NAS)</text>
  <text x="510" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low-med ms</text>
  <text x="701" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">10 / 25 GbE</text>

  <rect x="20" y="438" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Object (S3)</text>
  <text x="310" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Unstructured / archive</text>
  <text x="510" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">High ms (HTTP)</text>
  <text x="701" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Highly scalable</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
