<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">ESXi Deploy — Stage Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Prerequisites · Components Deployed · Post-Deploy Verification</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#37474f" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#37474f"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Prerequisites</text>
  <text x="145" y="111" text-anchor="middle" fill="#b0bec5" font-size="9">Before you begin</text>
  <rect x="30" y="126" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">HCL-listed server hardware</text>
  <rect x="30" y="152" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">BIOS: VT-x/VT-d enabled</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">iDRAC / iLO configured</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Network cabling complete</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">ESXi ISO + deployment plan</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">HCL: vmware.com/resources/compat</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">BIOS: enable virtualisation + IOMMU</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">iDRAC/iLO: virtual KVM for install</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">NICs: mgmt + vSAN + vMotion cabled</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Boot: USB/SD or local SSD</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">IP plan: vmk0 + vMotion + vSAN</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Deployed Components</text>
  <text x="410" y="111" text-anchor="middle" fill="#90caf9" font-size="9">What gets installed</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">ESXi 8.x (bare-metal hypervisor)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vmk0 (management vmknic)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Standard vSwitch (vSwitch0)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NTP + DNS + syslog configured</text>
  <rect x="295" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Host added to vCenter cluster</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">ESXi: boot from USB, SD, or local</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">vmk0: management IP via DCUI</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">vSwitch0: default uplink ports</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">NTP: esxcli system ntp set</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">DNS: FQDN + search domain</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">vCenter: add host → cluster</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Post-Deploy Verification</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Confirm it worked</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Host connected in vCenter UI</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NTP sync status green</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSAN vmknic active (if HCI)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">dvSwitch uplinks active</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">First test VM powers on</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">vCenter: host status "Connected"</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Monitor → Hardware → Sensors: all green</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">NTP: esxcli system time get</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">dvSwitch: migrate vmk0 from vSwitch</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">VM: power on + ping network gateway</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Storage: see expected datastores</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">ESXi Minimum Hardware Requirements</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Component</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Minimum</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Recommended</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Notes</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">CPU</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">2-core x86-64 (2018+)</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">2 socket × 20 core</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">VT-x + VT-d required</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">RAM</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">8 GB</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">256 GB+</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">More = more VMs per host</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">Boot device</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">8 GB (USB/SD)</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">32 GB SSD local</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">SSD strongly preferred</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">NIC</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">1 × 1 GbE</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">2+ × 10 GbE</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Redundancy + vSAN</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">Storage</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">Any HCL SAN/NAS</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">NVMe SSD local + vSAN</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">See HCL for RAID cards</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">BIOS</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">VT-x enabled</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">VT-d + IOMMU enabled</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Required for NPIV, SR-IOV</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware ESXi Deploy Reference · HCL · DCUI · vmk0 · vSwitch · NTP · vCenter · iDRAC</text>
</svg>