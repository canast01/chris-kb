<svg xmlns="http://www.w3.org/2000/svg" width="820" height="610" viewBox="0 0 820 610">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Commvault Escalation Process
  </text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 1 — Open case at ma.commvault.com with CV_DIAG bundle attached
    </text>
  </g>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 2 — T1 support acknowledges and reviews the bundle (Sev1: within 1 hr)
    </text>
  </g>
  
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 190)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 3 — If no meaningful progress in 1 hour for Sev1 or 4 hours for Sev2:
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Reply in case: "Requesting escalation to Senior Commvault Engineer"
    </text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → State: "[CommServe down / 150 VMs unprotected / DDB corrupt]"
    </text>
  </g>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 4 — Senior Engineer is assigned; they will request a remote WebEx/Teams session
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Have CommCell Console open and Remote Desktop access to CommServe ready
    </text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Ensure Commvault support can reach CommServe on port 8400 or via VPN
    </text>
  </g>
  
  <line x1="410" y1="370" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 390)">
    <rect x="0" y="0" width="780" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 5 — If issue is a confirmed product bug:
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Engineer escalates to Commvault Engineering
    </text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Engineering may provide a hotfix build or targeted patch
    </text>
  </g>
  
  <line x1="410" y1="450" x2="410" y2="470" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(20, 470)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Step 6 — For Sev1 unresolved after 2 hours or active data loss:
    </text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Request escalation to Commvault Support Manager
    </text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      → Add to case: "Escalation requested — [CommServe down / data loss / Xh elapsed]"
    </text>
  </g>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Escalation Process
  </text>
</svg>