<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Backup &amp; Disaster Recovery Platform
  </text>
  
  <rect x="10" y="50" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup &amp; DR — Scope and Objectives
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup = protecting data and enabling point-in-time recovery
  </text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DR = restoring service availability after a site-level or major disruptive event
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPO drives backup frequency · RTO drives recovery infrastructure sizing
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Untested DR is a hypothesis — validated DR requires scheduled tests and runbooks
  </text>

  <line x1="150" y1="150" x2="150" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="150" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="150" x2="670" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="200" width="260" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup Products
  </text>
  <text x="20" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Veeam · Commvault
  </text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetBackup
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Jobs · repos · proxies
  </text>

  <rect x="280" y="200" width="260" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="290" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DR Runbooks
  </text>
  <text x="290" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Failover · failback
  </text>
  <text x="290" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Step-by-step procedures
  </text>
  <text x="290" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Escalation contacts
  </text>

  <rect x="550" y="200" width="260" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="560" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Recovery Testing
  </text>
  <text x="560" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tabletop · functional
  </text>
  <text x="560" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Full DR test · ransomware
  </text>
  <text x="560" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Evidence and sign-off
  </text>

  <rect x="10" y="290" width="260" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Isolated Recovery Env
  </text>
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Air-gap vault · IRE
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Clean-room restore
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CyberSense integrity
  </text>

  <rect x="280" y="290" width="260" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="290" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    DR Design
  </text>
  <text x="290" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RTO/RPO tiers · strategy
  </text>
  <text x="290" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Site topology · network
  </text>
  <text x="290" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Replication technology
  </text>

  <rect x="550" y="290" width="260" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="560" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup Validation
  </text>
  <text x="560" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Verify restorability
  </text>
  <text x="560" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SureBackup · bpverify
  </text>
  <text x="560" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Test restore cadence
  </text>

  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure:
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup servers · proxy servers · dedup appliances · tape libraries · object storage targets
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Production site · DR site · replication link · management network · vault network
  </text>

  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPO         = Recovery Point Objective; max acceptable data loss window
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RTO         = Recovery Time Objective; max acceptable downtime before restore
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Failover    = activating the DR site; redirecting hosts to replica resources
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Failback    = returning operations to production site after DR event is resolved
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IRE         = Isolated Recovery Environment; air-gapped clean-room for ransomware recovery
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Immutability= backup data that cannot be modified or deleted for a defined retention period
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cyber vault = air-gapped isolated copy with integrity verification for ransomware scenarios
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dedup       = deduplication; eliminates redundant data blocks across backup jobs
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Proxy       = Veeam/Commvault component that moves data from source to repository
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Repository  = backup storage target — disk, dedup appliance, object store, or tape
  </text>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Backup &amp; DR Overview
  </text>
</svg>