<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DATA PROTECTION TIERS:</text>
  
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 1: Pure Protection Snapshots (on-array, space-efficient)</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Schedule: hourly, retain 24h → daily, retain 30 days</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">RPO: minutes  RTO: seconds (clone from snapshot)</text>
  </g>
  
  <g transform="translate(10, 130)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 2: Veeam Backup (application-consistent, VADP)</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Schedule: nightly  Retain: 14 restore points</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">RPO: hours  RTO: minutes (Instant VM Recovery)</text>
  </g>
  
  <g transform="translate(10, 220)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 3: Veeam Backup Copy → Object Storage (immutable)</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Schedule: daily  Retain: 30 days (GFS monthly 12 months)</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">RPO: 24h  RTO: minutes to hours (depends on object tier)</text>
  </g>
  
  <g transform="translate(10, 310)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 4: SafeMode Immutable Snapshots (ransomware protection)</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Eradication delay: 24h minimum (configurable)</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Cannot be deleted during lock period — even by array admin</text>
  </g>
  
  <rect x="0" y="450" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Pure Storage FlashArray with Veeam and Pure Protection</text>
</svg>