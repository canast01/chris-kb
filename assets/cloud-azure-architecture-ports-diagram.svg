<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Microsoft Azure — Ports and Network Requirements
  </text>
  
  <!-- On-Premises / Corporate -->
  <rect x="10" y="50" width="200" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Admin workstations
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Terraform / Ansible
  </text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    CI/CD runners
  </text>

  <!-- Azure -->
  <rect x="400" y="50" width="410" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    management.azure.com API
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    *.azure.com APIs
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    *.microsoftonline.com (Entra ID)
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Azure Virtual Network
  </text>
  <rect x="420" y="140" width="250" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="430" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    VMs / AKS nodes / SQL
  </text>
  <text x="430" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    (NSG per subnet or per NIC)
  </text>

  <!-- On-prem workloads -->
  <rect x="10" y="200" width="200" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    On-prem workloads
  </text>

  <!-- Connections -->
  <line x1="210" y1="65" x2="400" y2="65" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="300" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    443 (HTTPS)
  </text>
  <line x1="210" y1="80" x2="400" y2="80" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="300" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    443
  </text>
  <line x1="210" y1="95" x2="400" y2="95" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="300" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    443
  </text>
  <line x1="210" y1="220" x2="400" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="300" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    22/3389/443
  </text>

  <!-- Footer -->
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Network Architecture
  </text>
</svg>