<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Tools Platform Overview
  </text>
  <rect x="10" y="50" width="800" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Enterprise Tools Platform
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Collaboration, version control, issue tracking, and ITSM services
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Atlassian DC stack: Confluence + Jira on PostgreSQL, shared NFS home, Tomcat app tier
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Git: distributed VCS hosted on GitHub/GitLab/Bitbucket with SSH and HTTPS access
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ServiceNow: SaaS ITSM — Incident, Change, CMDB, ITOM with MID Server on-prem link
  </text>
  <line x1="205" y1="150" x2="205" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="150" x2="615" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="180" width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="205" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Confluence
  </text>
  <text x="205" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Team wiki and knowledge base
  </text>
  <text x="205" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Spaces · Pages · Templates
  </text>
  <text x="205" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Macros · Page tree · REST API
  </text>
  <text x="205" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LDAP / SAML SSO auth
  </text>
  <text x="205" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Lucene search · XML backup
  </text>
  <rect x="420" y="180" width="390" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="615" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Git
  </text>
  <text x="615" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Distributed version control
  </text>
  <text x="615" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Branches · Commits · Tags
  </text>
  <text x="615" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pull requests · Hooks · LFS
  </text>
  <text x="615" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSH keys / PAT auth
  </text>
  <text x="615" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GitHub · GitLab · Bitbucket
  </text>
  <line x1="205" y1="300" x2="205" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="300" x2="615" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="330" width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="205" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Jira
  </text>
  <text x="205" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Issue and project tracking
  </text>
  <text x="205" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Scrum · Kanban · JQL
  </text>
  <text x="205" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Epics · Stories · Sprints
  </text>
  <text x="205" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Workflows · Screens · Fields
  </text>
  <text x="205" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API v3 · Webhooks
  </text>
  <rect x="420" y="330" width="390" height="120" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="615" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    ServiceNow
  </text>
  <text x="615" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SaaS ITSM platform
  </text>
  <text x="615" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Incident · Change · CMDB
  </text>
  <text x="615" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MID Server: on-prem bridge
  </text>
  <text x="615" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Integration Hub REST flows
  </text>
  <text x="615" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SAML SSO · GlideScript
  </text>
  <rect x="0" y="460" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Atlassian DC on vSphere VMs · NFS shared home · PostgreSQL DB VMs · ServiceNow MID Server VM
  </text>
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Confluence = Atlassian wiki platform; Data Center edition on Tomcat + PostgreSQL/Oracle
  </text>
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Jira = Atlassian issue tracker; Scrum/Kanban/SM projects with JQL query language
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Git = distributed VCS; every clone is a full repo with local commit history
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    ServiceNow = SaaS ITSM; Incident, Problem, Change, Request, CMDB on Now Platform
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    MID Server = Management/Instrumentation/Discovery; on-prem Java agent for ServiceNow
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    LDAP = Lightweight Directory Access Protocol; centralised user auth directory
  </text>
  <text x="410" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    SAML SSO = Security Assertion Markup Language; federated single sign-on standard
  </text>
  <text x="410" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    PAT = Personal Access Token; scoped credential replacing password for Git/API
  </text>
  <text x="410" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    JQL = Jira Query Language; SQL-like syntax for filtering and searching issues
  </text>
  <text x="410" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Lucene = Apache full-text search engine embedded in Confluence and Jira
  </text>
  <text x="410" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Tomcat = Apache Tomcat; Java servlet container hosting Confluence/Jira web apps
  </text>
  <text x="410" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Integration = ServiceNow Integration Hub; low-code REST/SOAP/scripted integrations
  </text>
</svg>