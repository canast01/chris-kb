<svg xmlns="http://www.w3.org/2000/svg" width="820" height="710" viewBox="0 0 820 710">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    NetApp InsightIQ — Performance Analytics Architecture
  </text>
  
  <rect x="10" y="50" width="390" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Collection Architecture
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Linux VM (separate appliance)
  </text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PAPI/REST: cluster metrics
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Poll interval: configurable
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Stores: local PostgreSQL DB
  </text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-cluster: one instance
  </text>

  <rect x="420" y="50" width="390" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Analytics Capabilities
  </text>
  <text x="430" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity forecasting
  </text>
  <text x="430" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Performance trending
  </text>
  <text x="430" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workload analysis
  </text>
  <text x="430" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Usage reports: exportable
  </text>
  <text x="430" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Chargebacks: by client IP
  </text>

  <line x1="205" y1="170" x2="205" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="170" x2="615" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="220" width="390" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Report Types
  </text>
  <text x="20" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity: per volume/qtree
  </text>
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Throughput: MB/s over time
  </text>
  <text x="20" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Latency: ops response time
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Protocol: NFS/CIFS breakdown
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Client: per-IP breakdown
  </text>

  <rect x="420" y="220" width="390" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="430" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="430" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Web UI: browser-based
  </text>
  <text x="430" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: report export
  </text>
  <text x="430" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Email: scheduled PDF/CSV
  </text>
  <text x="430" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Alerts: threshold-based
  </text>
  <text x="430" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AD integration: user auth
  </text>

  <rect x="10" y="360" width="800" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Linux VM (4 vCPU, 8 GB RAM, 200+ GB disk); management network access to all monitored clusters on HTTPS; outbound SMTP for email reports.
  </text>

  <rect x="10" y="440" width="800" height="195" rx="6" fill="#ffffff" stroke="#455a64" />
  <text x="20" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    InsightIQ = NetApp/Isilon performance and capacity analytics application
  </text>
  <text x="20" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PAPI = Platform API; cluster REST interface used for metric collection
  </text>
  <text x="20" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity forecast = projects date when volume or cluster will reach threshold
  </text>
  <text x="20" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Performance trending = graphs throughput/latency/IOPS over days, weeks, months
  </text>
  <text x="20" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workload analysis = identifies top clients and protocols consuming capacity
  </text>
  <text x="20" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Chargeback = report showing per-client or per-group storage consumption
  </text>
  <text x="20" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PostgreSQL = local DB inside InsightIQ VM; stores collected metrics
  </text>
  <text x="20" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ActiveIQ = NetApp cloud health monitoring; complementary to InsightIQ
  </text>
  <text x="20" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Poll interval = how often InsightIQ queries cluster (default: 5 minutes)
  </text>
  <text x="20" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Protocol breakdown = IOPS split between NFS, CIFS, iSCSI, FCP
  </text>
  <text x="20" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Qtree = ONTAP subdirectory with quota enforcement; InsightIQ tracks per-qtree
  </text>
  <text x="20" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Scheduled report = PDF/CSV delivered by email on daily/weekly/monthly schedule
  </text>

  <rect x="0" y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Performance Analytics Architecture
  </text>
</svg>