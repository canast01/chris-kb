<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200">
  <!-- Background -->
  <rect width="820" height="200" fill="#f8f9fa" rx="6"/>
  <!-- Navy header bar -->
  <rect width="820" height="44" fill="#0d2b4e" rx="6"/>
  <rect y="38" width="820" height="6" fill="#0d2b4e"/>
  <text x="410" y="27" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Alert Lifecycle</text>

  <!-- Step boxes -->
  <!-- Box 1: Collect Metrics -->
  <rect x="20" y="70" width="136" height="100" rx="6" fill="#1a3a5c" stroke="#0d2b4e" stroke-width="1.5"/>
  <rect x="20" y="70" width="136" height="28" rx="6" fill="#1a3a5c"/>
  <rect x="20" y="88" width="136" height="10" fill="#1a3a5c"/>
  <text x="88" y="89" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Collect Metrics</text>
  <text x="88" y="112" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">vCenter / ONTAP</text>
  <text x="88" y="126" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">Pure / Veeam APIs</text>
  <text x="88" y="140" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">30-min averages</text>
  <text x="88" y="154" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">SNMP / REST polls</text>

  <!-- Arrow 1 -->
  <line x1="158" y1="120" x2="178" y2="120" stroke="#0d2b4e" stroke-width="2"/>
  <polygon points="178,115 188,120 178,125" fill="#0d2b4e"/>

  <!-- Box 2: Compare Threshold -->
  <rect x="190" y="70" width="136" height="100" rx="6" fill="#1e4d7b" stroke="#1a3a5c" stroke-width="1.5"/>
  <rect x="190" y="70" width="136" height="28" rx="6" fill="#1e4d7b"/>
  <rect x="190" y="88" width="136" height="10" fill="#1e4d7b"/>
  <text x="258" y="89" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Compare Threshold</text>
  <text x="258" y="112" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">Warning vs Critical</text>
  <text x="258" y="126" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">Environment baseline</text>
  <text x="258" y="140" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">Trend analysis</text>
  <text x="258" y="154" font-family="Arial,sans-serif" font-size="10" fill="#c8d8ea" text-anchor="middle">Sustained breach check</text>

  <!-- Arrow 2 -->
  <line x1="328" y1="120" x2="348" y2="120" stroke="#0d2b4e" stroke-width="2"/>
  <polygon points="348,115 358,120 348,125" fill="#0d2b4e"/>

  <!-- Box 3: Alert -->
  <rect x="360" y="70" width="136" height="100" rx="6" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <rect x="360" y="70" width="136" height="28" rx="6" fill="#c0392b"/>
  <rect x="360" y="88" width="136" height="10" fill="#c0392b"/>
  <text x="428" y="89" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Alert</text>
  <text x="428" y="112" font-family="Arial,sans-serif" font-size="10" fill="#fde8e6" text-anchor="middle">Warn: email / ticket</text>
  <text x="428" y="126" font-family="Arial,sans-serif" font-size="10" fill="#fde8e6" text-anchor="middle">Critical: page on-call</text>
  <text x="428" y="140" font-family="Arial,sans-serif" font-size="10" fill="#fde8e6" text-anchor="middle">Escalation matrix</text>
  <text x="428" y="154" font-family="Arial,sans-serif" font-size="10" fill="#fde8e6" text-anchor="middle">Suppress duplicates</text>

  <!-- Arrow 3 -->
  <line x1="498" y1="120" x2="518" y2="120" stroke="#0d2b4e" stroke-width="2"/>
  <polygon points="518,115 528,120 518,125" fill="#0d2b4e"/>

  <!-- Box 4: Investigate -->
  <rect x="530" y="70" width="136" height="100" rx="6" fill="#7d6608" stroke="#6d5a08" stroke-width="1.5"/>
  <rect x="530" y="70" width="136" height="28" rx="6" fill="#7d6608"/>
  <rect x="530" y="88" width="136" height="10" fill="#7d6608"/>
  <text x="598" y="89" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Investigate</text>
  <text x="598" y="112" font-family="Arial,sans-serif" font-size="10" fill="#fef9e7" text-anchor="middle">Health-check runbook</text>
  <text x="598" y="126" font-family="Arial,sans-serif" font-size="10" fill="#fef9e7" text-anchor="middle">vCenter / CLI logs</text>
  <text x="598" y="140" font-family="Arial,sans-serif" font-size="10" fill="#fef9e7" text-anchor="middle">Correlate events</text>
  <text x="598" y="154" font-family="Arial,sans-serif" font-size="10" fill="#fef9e7" text-anchor="middle">Engage vendor if needed</text>

  <!-- Arrow 4 -->
  <line x1="668" y1="120" x2="688" y2="120" stroke="#0d2b4e" stroke-width="2"/>
  <polygon points="688,115 698,120 688,125" fill="#0d2b4e"/>

  <!-- Box 5: Resolved -->
  <rect x="700" y="70" width="100" height="100" rx="6" fill="#1e7e34" stroke="#196030" stroke-width="1.5"/>
  <rect x="700" y="70" width="100" height="28" rx="6" fill="#1e7e34"/>
  <rect x="700" y="88" width="100" height="10" fill="#1e7e34"/>
  <text x="750" y="89" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&#10003; Resolved</text>
  <text x="750" y="112" font-family="Arial,sans-serif" font-size="10" fill="#d4edda" text-anchor="middle">Close ticket</text>
  <text x="750" y="126" font-family="Arial,sans-serif" font-size="10" fill="#d4edda" text-anchor="middle">Document root cause</text>
  <text x="750" y="140" font-family="Arial,sans-serif" font-size="10" fill="#d4edda" text-anchor="middle">Review threshold</text>
  <text x="750" y="154" font-family="Arial,sans-serif" font-size="10" fill="#d4edda" text-anchor="middle">Update runbook</text>
</svg>