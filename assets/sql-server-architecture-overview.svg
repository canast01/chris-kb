<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">SQL Server — Engine &amp; High Availability Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Buffer Pool · Transaction Log · Always On AG · SQL Agent</text>

  <!-- COLUMN 1: Engine Components -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Engine Components</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Buffer Pool · Transaction Log · Locks</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Buffer Pool (data + index page cache)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Transaction Log (WAL / VLFs)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Lock Manager (row / page / table)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Query Optimizer (cost-based)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Plan Cache (compiled plan reuse)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Buffer pool hit rate target: &gt;95%</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Transaction log: write-ahead; VLF-segmented</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Lock escalation: row → page → table</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">Checkpoint: flushes dirty pages to data files</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">tempdb: multiple data files recommended</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">max server memory: set explicitly; avoid OOM</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">MAXDOP: limit per-query parallelism</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">sys.dm_exec_requests: active query monitor</text>

  <!-- COLUMN 2: HA Topology -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">HA Topology</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Always On AG · WSFC · FCI</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Always On AG (log-based HA)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">WSFC (Windows Failover Cluster)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FCI (Failover Cluster Instance)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Readable Secondary (AG replica)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Distributed AG (cross-cluster)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">AG: database-level HA; up to 9 replicas</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">AG requires WSFC for auto-failover</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">FCI: instance-level HA; shared SAN storage</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Readable secondaries: offload reporting</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">DAG: stretch across two WSFC clusters</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">AG listener: virtual name routes to primary</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Synchronous commit: RPO=0 within site</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Async replica: DR site; minimal latency hit</text>

  <!-- COLUMN 3: Ancillary Services -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Ancillary Services</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">SQL Agent · SSIS · SSRS · DMVs</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">SQL Agent (job scheduler + alerts)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">SSIS (ETL / package deployment)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">SSRS / PBIRS (paginated reports)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Linked Servers (remote T-SQL)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">DMVs (sys.dm_exec_* diagnostics)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">SQL Agent: backup, index maint, alerts</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">SSIS: SSIS Catalog (SSISDB) for packages</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">SSRS: subscriptions + paginated reports</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Linked servers: T-SQL to remote SQL/Oracle</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">DMVs: sys.dm_exec_query_stats for top SQL</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Wait stats: sys.dm_os_wait_stats for bottlenecks</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">Query Store: plan regression tracking in-DB</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">SSMS / Azure Data Studio: admin clients</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">HA Pattern Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Pattern</text>
  <text x="280" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Failover</text>
  <text x="420" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">RPO</text>
  <text x="545" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Storage</text>
  <text x="690" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Use Case</text>
  <line x1="195" y1="516" x2="195" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="360" y1="516" x2="360" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="480" y1="516" x2="480" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="600" y1="516" x2="600" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Always On AG</text>
  <text x="280" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Automatic (WSFC)</text>
  <text x="420" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Near-0</text>
  <text x="545" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Independent</text>
  <text x="690" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Standard HA + DR replicas</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">FCI (Failover Cluster)</text>
  <text x="280" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Automatic (WSFC)</text>
  <text x="420" y="587" text-anchor="middle" fill="#546e7a" font-size="9">0</text>
  <text x="545" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Shared SAN</text>
  <text x="690" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Instance-level HA</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Log Shipping</text>
  <text x="280" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Manual</text>
  <text x="420" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Minutes</text>
  <text x="545" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Independent</text>
  <text x="690" y="614" text-anchor="middle" fill="#546e7a" font-size="9">DR-only / warm standby</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Distributed AG</text>
  <text x="280" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Automatic</text>
  <text x="420" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Near-0</text>
  <text x="545" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Independent</text>
  <text x="690" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Cross-datacenter HA</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">AG + FCI combined</text>
  <text x="280" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Automatic</text>
  <text x="420" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Near-0</text>
  <text x="545" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Shared + Independent</text>
  <text x="690" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Maximum resilience</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">SQL Server Reference · Buffer Pool · Transaction Log · Always On AG · WSFC · FCI · SQL Agent</text>
</svg>
