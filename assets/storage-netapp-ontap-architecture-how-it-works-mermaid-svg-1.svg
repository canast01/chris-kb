<text x="129.9" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Physical Drives</text>
<text x="129.9" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NVMe SSDs · SATA HDDs · SAS HDDs</text>
<text x="129.9" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Mixed media supported per aggregate</text>
<rect x="239.8" y="80.0" width="246.2" height="68.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="362.9" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">RAID Groups</text>
<text x="362.9" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">RAID-DP: 2 parity disks, 2-drive fault tolerance</text>
<text x="362.9" y="123.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">RAID-TEC: 3 parity disks, 3-drive fault tolerance</text>
<text x="362.9" y="137.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Typical group: 12–28 data drives</text>
<rect x="526.0" y="50.0" width="457.0" height="106.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="754.5" y="66.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">SVM — Tenant A (Production)</text>
<rect x="536.0" y="80.0" width="114.8" height="68.0" rx="4" fill="#ffffff" stroke="#3949ab" stroke-width="1" />
<text x="593.4" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">LIF Set</text>
<text x="593.4" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">iSCSI 192.168.10.10</text>
<text x="593.4" y="123.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">FC WWPN AA:BB:CC</text>
<text x="593.4" y="137.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NFS 192.168.10.11</text>
<rect x="660.8" y="80.0" width="158.2" height="68.0" rx="4" fill="#ffffff" stroke="#3949ab" stroke-width="1" />
<text x="739.9" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">iSCSI Target</text>
<text x="739.9" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">iqn.2010-01.com.netapp:svm-a</text>
<text x="739.9" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Portal group on data LIFs</text>
<rect x="829.0" y="80.0" width="144.0" height="68.0" rx="4" fill="#ffffff" stroke="#3949ab" stroke-width="1" />
<text x="901.0" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NFS Export</text>
<text x="901.0" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">/vol/oracle_data → NFS v4.1</text>
<text x="901.0" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">/vol/oracle_logs → NFS v3</text>
<rect x="1013.0" y="50.0" width="393.6" height="106.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" />
<text x="1209.8" y="66.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">SVM — Tenant B (DevTest)</text>
<rect x="1023.0" y="80.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="1078.0" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">LIF Set</text>
<text x="1078.0" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">SMB 192.168.20.10</text>
<text x="1078.0" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NFS 192.168.20.11</text>
<rect x="1143.0" y="80.0" width="115.6" height="68.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="1200.8" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">CIFS/SMB Share</text>
<text x="1200.8" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">\\\\svm-b\\projects</text>
<text x="1200.8" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">AD-integrated auth</text>
<rect x="1268.6" y="80.0" width="128.0" height="68.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="1332.6" y="103.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NFS Export</text>
<text x="1332.6" y="117.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">/vol/devtest → NFS v3</text>
<text x="1332.6" y="131.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Squash root, read-write</text>
<rect x="541.0" y="196.0" width="344.0" height="121.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2" />
<text x="713.0" y="212.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Aggregate Layer — Physical Storage Pool</text>
<rect x="551.0" y="226.0" width="159.2" height="83.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="630.6" y="241.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Aggregate 1</text>
<text x="630.6" y="255.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Owned by Node 1</text>
<text x="630.6" y="269.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Pool of RAID groups</text>
<text x="630.6" y="283.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Single disk type per aggregate</text>
<text x="630.6" y="297.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Capacity drawn by thin volumes</text>
<rect x="720.2" y="226.0" width="154.8" height="83.0" rx="4" fill="#ffffff" stroke="#f57f17" stroke-width="1" />
<text x="797.6" y="241.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Aggregate 2</text>
<text x="797.6" y="255.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Owned by Node 2</text>
<text x="797.6" y="269.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Separate pool</text>
<text x="797.6" y="283.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Failover: Node 1 adopts AGG2</text>
<text x="797.6" y="297.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">on partner takeover</text>
<rect x="439.7" y="357.0" width="546.6" height="106.0" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.2" />
<text x="713.0" y="373.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Volume Layer — Logical Containers</text>
<rect x="449.7" y="387.0" width="112.6" height="68.0" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1" />
<text x="506.0" y="402.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">FlexVol: oracle_data</text>
<text x="506.0" y="416.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Size: 5 TB (thin)</text>
<text x="506.0" y="430.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Snap reserve: 20%</text>
<text x="506.0" y="444.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Aggregate: AGG1</text>
<rect x="572.3" y="387.0" width="110.4" height="68.0" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1" />
<text x="627.5" y="402.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">FlexVol: oracle_logs</text>
<text x="627.5" y="416.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Size: 1 TB (thin)</text>
<text x="627.5" y="430.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Snap reserve: 10%</text>
<text x="627.5" y="444.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Aggregate: AGG1</text>
<rect x="692.7" y="387.0" width="110.0" height="68.0" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1" />
<text x="747.7" y="402.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">FlexVol: devtest</text>
<text x="747.7" y="416.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Size: 2 TB (thin)</text>
<text x="747.7" y="430.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Snap reserve: 5%</text>
<text x="747.7" y="444.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Aggregate: AGG2</text>
<rect x="812.7" y="387.0" width="163.6" height="68.0" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1" />
<text x="894.5" y="402.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Snapshot Copies</text>
<text x="894.5" y="416.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">WAFL copy-on-write PiT copies</text>
<text x="894.5" y="430.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Instant creation, no data copy</text>
<text x="894.5" y="444.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Retained per volume policy</text>
<rect x="353.5" y="503.0" width="719.0" height="106.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2" />
<text x="713.0" y="519.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Sub-Volume Constructs</text>
<rect x="363.5" y="533.0" width="160.6" height="68.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="443.8" y="548.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">LUN</text>
<text x="443.8" y="562.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Block device inside a volume</text>
<text x="443.8" y="576.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">iSCSI or FC mapped via igroup</text>
<text x="443.8" y="590.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Thin-provisioned inside FlexVol</text>
<rect x="534.1" y="533.0" width="172.2" height="68.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="620.2" y="548.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">qtree</text>
<text x="620.2" y="562.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NFS sub-directory with own quota</text>
<text x="620.2" y="576.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">CIFS share root</text>
<text x="620.2" y="590.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Oplock and security-style scoped</text>
<rect x="716.3" y="533.0" width="161.0" height="68.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="796.8" y="556.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">SMB Share</text>
<text x="796.8" y="570.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Mapped to a volume junction</text>
<text x="796.8" y="584.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">or qtree within SVM namespace</text>
<rect x="887.3" y="533.0" width="175.2" height="68.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="974.9" y="548.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NVMe Namespace</text>
<text x="974.9" y="562.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NVMe/FC or NVMe/TCP</text>
<text x="974.9" y="576.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Mapped via subsystem (host group)</text>
<text x="974.9" y="590.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Like a LUN but NVMe-native</text>
