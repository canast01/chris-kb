<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PostgreSQL — Common Issues</text>
  
  <rect x="10" y="50" width="150" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Query slow?</text>
  
  <line x1="85" y1="80" x2="85" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="110" width="300" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">EXPLAIN shows Seq Scan on large table</text>
  <text x="320" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ add index</text>
  
  <line x1="85" y1="140" x2="85" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="170" width="300" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">EXPLAIN shows correct index but slow</text>
  <text x="320" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ stale statistics → ANALYZE</text>
  
  <line x1="85" y1="200" x2="85" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="230" width="300" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Waiting on lock</text>
  <text x="320" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ find blocker; kill if necessary</text>
  
  <line x1="85" y1="260" x2="85" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="290" width="300" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">High I/O wait</text>
  <text x="320" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ buffer pool too small → increase shared_buffers / innodb_buffer_pool_size</text>
  
  <line x1="85" y1="320" x2="85" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="350" width="300" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">CPU spiking</text>
  <text x="320" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ too many connections or parallel queries → check pool; tune work_mem</text>
  
  <rect x="0" y="400" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Troubleshooting Flowchart</text>
</svg>