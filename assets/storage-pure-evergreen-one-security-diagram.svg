<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Pure Security Architecture</text>
  
  <rect x="10" y="50" width="800" height="380" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">FlashArray / FlashBlade</text>
  
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Encryption</text>
  <text x="40" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Data at rest: XTS-AES-256 (always on)</text>
  <text x="40" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Data in flight: TLS 1.2+ (management)</text>
  <text x="40" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Drive erasure: cryptographic key destroy</text>
  
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">RBAC</text>
  <text x="40" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">array_admin ──► full system access</text>
  <text x="40" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">storage_admin ──► volumes / snapshots</text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">ops_admin ──► read + alert ack</text>
  <text x="40" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">readonly ──► auditors / CMDB</text>
  
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Audit Logging</text>
  <text x="40" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Every admin action ──► syslog ──► SIEM</text>
  <text x="40" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(customer AND Pure Support actions logged)</text>
  
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SafeMode</text>
  <text x="40" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Snapshot destroy requires Pure Support ─►</text>
  <text x="40" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Protection against ransomware</text>
  
  <line x1="10" y1="440" x2="150" y2="440" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="160" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">SSO/SAML ──► IdP MFA enforced for all interactive login</text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Security Architecture</text>
</svg>