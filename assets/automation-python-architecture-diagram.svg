<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Python Automation Architecture — venv and asyncio
  </text>
  
  <rect x="10" y="50" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Environment and Dependencies
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    venv: stdlib isolation
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    poetry: lock + publish
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pyproject.toml: PEP 517/518
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    requirements.txt: pip install
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pip: PyPI package manager
  </text>
  
  <rect x="410" y="50" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Execution Models
  </text>
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Script: python script.py
  </text>
  <text x="420" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    asyncio: event loop + await
  </text>
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ThreadPoolExecutor: I/O parallel
  </text>
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Docker: container per job
  </text>
  <text x="420" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lambda: serverless function
  </text>
  
  <line x1="200" y1="190" x2="200" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="190" x2="600" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="240" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Target APIs
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cloud: boto3, azure-sdk, gcloud
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Infra: pyVmomi, paramiko, netmiko
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST: httpx (async) or requests
  </text>
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DB: psycopg2, pymongo, redis-py
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SSH: paramiko, asyncssh
  </text>
  
  <rect x="410" y="240" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Quality and Testing
  </text>
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    mypy: static type checking
  </text>
  <text x="420" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pytest: unit + integration
  </text>
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ruff: fast linter
  </text>
  <text x="420" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    black: formatter
  </text>
  <text x="420" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pre-commit: gate hooks
  </text>
  
  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Linux host or container (Python 3.11+); API targets require network access;
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Docker daemon for container execution; outbound HTTPS to PyPI/cloud APIs.
  </text>
  
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    venv = virtual environment; isolated Python + packages per project
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    poetry = dependency manager with lock file; pyproject.toml based
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    asyncio = stdlib event loop; await suspends coroutine until I/O ready
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GIL = Global Interpreter Lock; one thread runs Python bytecode
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    httpx = async-capable HTTP client; drop-in alternative to requests
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pyVmomi = VMware vSphere Python SDK; wraps SOAP API
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    boto3 = AWS SDK for Python; all AWS service clients
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    paramiko = SSH client library; exec_command for remote automation
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    mypy = static type checker; enforces type annotations
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pytest = test framework; fixtures, parametrize, plugins
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pyproject.toml = PEP 517/518 build and metadata config file
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ruff = fast Rust-based linter; replaces flake8/isort/pyflakes
  </text>
  
  <rect x="0" y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Python Automation Architecture
  </text>
</svg>