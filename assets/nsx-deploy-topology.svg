  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">9042</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">TCP</text>
