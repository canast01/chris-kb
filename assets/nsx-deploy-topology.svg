  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">NSX Edge VMs (T0 / T1 gateway)</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">10GbE NICs for TEP traffic</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Physical ToR switches (BGP)</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Uplink network (routed segment)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Transport hosts: VIBs + TEP vmknic</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Edge VMs: bare-metal or vSphere</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">10GbE: TEP Geneve UDP 6081</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">ToR: BGP peer with T0 gateway</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Uplink: VLAN to physical router</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Rack ToR: ECMP to 2+ T0 uplinks</text>
