  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Intelligence: IPFIX flows</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Aria Net: topology + latency</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">vCenter plugin: net topology overlay</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">nsxcli: on manager + edge CLI</text>
