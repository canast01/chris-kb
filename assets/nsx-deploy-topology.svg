  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">T1: service router + SR for NAT/LB</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">DFW: stateful kernel firewall</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">TEP: /26 per AZ minimum</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">BFD: fast link detection on T0</text>
