<svg xmlns="http://www.w3.org/2000/svg" width="820" height="690" viewBox="0 0 820 690">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashBlade — Encryption</text>
  
  <rect x="10" y="50" width="800" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Data in Transit</text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">NFS v4.1: Kerberos GSSAPI privacy (optional)</text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">SMB 3.0: end-to-end SMB encryption (AES-128-GCM)</text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">S3: HTTPS (TLS 1.2+)</text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Management GUI/API: HTTPS (443)</text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Replication (ActiveDR): TLS between FlashBlades</text>

  <rect x="10" y="210" width="800" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Before you begin</text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Access: Storage admin credentials (cluster admin or equivalent)</text>
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Change management: security changes require CAB approval in most environments</text>
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Rollback plan: document current state before any security control change</text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Testing: validate in a non-production environment first where possible</text>

  <rect x="10" y="340" width="800" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Data at Rest</text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">All data written to FlashBlade drives is encrypted using XTS-AES-256. Encryption is always on and cannot be disabled.</text>
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Drives are self-encrypting; when a drive is removed or replaced, data is cryptographically erased by destroying the drive encryption key.</text>

  <rect x="10" y="430" width="800" height="90" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Data in Flight — NFS</text>
  <text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">NFS v4.1 Kerberos authentication modes supported:</text>
  <text x="40" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">krb5 — authentication only</text>
  <text x="40" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">krb5i — authentication + integrity</text>
  <text x="40" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">krb5p — authentication + integrity + privacy (full encryption)</text>
  <text x="20" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Configure Kerberos in the NFS export policy to enforce encrypted NFS sessions. Requires an Active Directory or MIT Kerberos KDC.</text>

  <rect x="10" y="570" width="800" height="50" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="590" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Data in Flight — SMB</text>
  <text x="20" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">SMB encryption (AES-128-CCM or AES-256-GCM) is configurable per share. Enable SMB encryption to protect data in transit between Windows clients and FlashBlade.</text>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: FlashBlade Security Reference</text>
</svg>