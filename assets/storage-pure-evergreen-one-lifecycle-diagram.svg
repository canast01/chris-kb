  <text x="240" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">(30 day)</text>
  
  <line x1="410" y1="80" x2="450" y2="80" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="450" y="50" width="180" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="460" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Operate</text>
  <text x="460" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">3–5 yr</text>
  
  <line x1="630" y1="80" x2="670" y2="80" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="670" y="50" width="140" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="680" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Renew /</text>
  <text x="680" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Retire</text>
  
  <line x1="410" y1="110" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="230" y="150" width="360" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="240" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Annual Review</text>
  <text x="240" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ Capacity true-up</text>
  <text x="240" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ SLA review</text>
  <text x="240" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ Tier alignment</text>
  
  <line x1="410" y1="230" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="230" y="270" width="360" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="240" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Monthly Billing</text>
  <text x="240" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Below reserve ──► reserved rate</text>
  <text x="240" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Above reserve ──► burst rate (daily)</text>
  
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Pure manages: controller refresh, Purity upgrades, drive replacement, security patches — all transparent</text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Pure Storage Evergreen//One Lifecycle</text>
