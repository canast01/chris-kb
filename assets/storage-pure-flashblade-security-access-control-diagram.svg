<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashBlade — Access Control</text>
  
  <rect x="20" y="50" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Organization</text>
  
  <line x1="60" y1="110" x2="60" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="40" y="140" width="740" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="50" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Object Store Account (e.g., ml-platform)</text>
  
  <line x1="80" y1="200" x2="80" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="60" y="230" width="340" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="70" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">User (e.g., svc-training-pipeline)</text>
  
  <line x1="100" y1="290" x2="100" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="80" y="320" width="300" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="90" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Access Key (AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY)</text>
  
  <line x1="420" y1="200" x2="420" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="400" y="230" width="380" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Bucket (e.g., prod-ml-training-data)</text>
  
  <line x1="440" y1="290" x2="440" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="420" y="320" width="340" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="430" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Bucket Policy (optional — grants/denies access to specific users or prefixes)</text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Access Control Structure</text>
</svg>