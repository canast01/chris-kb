<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    AWS Storage Overview
  </text>
  
  <rect x="10" y="40" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AWS Storage — EBS, S3, EFS, and FSx
  </text>
  <text x="20" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EBS: persistent block volumes attached to EC2; types gp3/io2/sc1/st1; AZ-locked; snapshots to
  </text>
  <text x="20" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3: unlimited object storage; 11 nines durability; lifecycle, versioning, replication, and
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EFS: managed NFS for Linux; multi-AZ shared filesystem; provisioned or bursting throughput
  </text>
  <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FSx: managed Windows SMB (FSx for Windows) and HPC Lustre (FSx for Lustre) file systems
  </text>

  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    EBS serves block I/O for EC2 · S3 stores objects durably · EFS/FSx serve shared file workloads
  </text>

  <line x1="130" y1="180" x2="130" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="690" y1="180" x2="690" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="200" width="220" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    EBS
  </text>
  <text x="30" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Types: gp3/io2/st1/sc1
  </text>
  <text x="30" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IOPS: gp3=3K, io2=64K
  </text>
  <text x="30" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Encrypt: CMK default
  </text>
  <text x="30" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshots: S3-backed copy
  </text>
  <text x="30" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Resize: online (no reboot)
  </text>

  <rect x="300" y="200" width="220" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="310" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    S3
  </text>
  <text x="310" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Buckets: region-scoped
  </text>
  <text x="310" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Storage classes: S/IA/GDA
  </text>
  <text x="310" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Versioning: protect objs
  </text>
  <text x="310" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lifecycle: tier+expire
  </text>
  <text x="310" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Replication: X-region
  </text>

  <rect x="580" y="200" width="220" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="590" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    EFS / FSx
  </text>
  <text x="590" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EFS: NFS v4.1 + 4.2
  </text>
  <text x="590" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FSx Windows: SMB AD
  </text>
  <text x="590" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FSx Lustre: HPC Gbps
  </text>
  <text x="590" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EFS: bursting throughput
  </text>
  <text x="590" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mount: NFS or DFS-N
  </text>

  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    EBS for EC2 block I/O · S3 for durable objects and lifecycle
  </text>

  <line x1="130" y1="360" x2="130" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="360" x2="410" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="690" y1="360" x2="690" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="380" width="800" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    EBS        │  EBS Snapshots   │         S3        │   S3 Lifecycle   │    EFS / FSx
  </text>
  <text x="20" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    gp3: baseline   │   Create snap    │   Bucket: create  │ Transition rule  │   Mount target
  </text>
  <text x="20" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    io2: 64K IOPS   │  AMI from snap   │    Block public   │  Expire: delete  │   EFS SG rules
  </text>
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Resize: no stop  │ Cross-region cp  │    Object lock    │ IA: 30d+ infreq  │   FSx: AD join
  </text>
  <text x="20" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Encrypt at rest  │Retention: policy │  Replication: CRR │  GDA: 90d+ cold  │    FSx backup
  </text>

  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EBS storage fabric (AZ-local) · S3 distributed storage (region) · EFS/FSx managed NAS infrastructure
  </text>

  <text x="20" y="540" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="20" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EBS            = Elastic Block Store; persistent block volumes; AZ-locked; attach to one EC2 at a
  </text>
  <text x="20" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    gp3            = General Purpose SSD v3; 3,000 IOPS and 125 MiB/s baseline; independently
  </text>
  <text x="20" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    io2            = Provisioned IOPS SSD; up to 64,000 IOPS; 99.999% durability; multi-attach supported
  </text>
  <text x="20" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EBS Snapshot   = Incremental S3-backed copy of a volume; used for backup, AMI creation, region copy
  </text>
  <text x="20" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3             = Simple Storage Service; object storage; buckets in a region; 11 nines durability
  </text>
  <text x="20" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3 Storage Class= Tiers: Standard / Standard-IA / Glacier Instant / Glacier DA / Glacier Deep Archive
  </text>
  <text x="20" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3 Lifecycle   = Rules transitioning objects between classes or expiring them after N days
  </text>
  <text x="20" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3 Replication = CRR (cross-region) or SRR (same-region); requires versioning on source bucket
  </text>
  <text x="20" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EFS            = Elastic File System; serverless NFS; multi-AZ; auto-scales; mount via EFS mount
  </text>
  <text x="20" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FSx for Windows= Managed SMB file share with Active Directory integration; DFS namespace support
  </text>
  <text x="20" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FSx for Lustre = High-performance parallel file system; used for ML training and HPC workloads
  </text>
  <text x="20" y="725" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Object Lock    = S3 WORM; Governance or Compliance mode; prevents delete/overwrite for retention
  </text>

  <rect x="0" y="740" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="760" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: AWS Storage Overview
  </text>
</svg>