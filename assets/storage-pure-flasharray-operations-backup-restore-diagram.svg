<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashArray Data Protection Tiers</text>
  
  <rect x="10" y="50" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 1: Local Snapshots (Protection Groups)</text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Volumes → PGroup schedule → hourly/daily snaps on array</text>
  
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">async replication</text>
  
  <rect x="10" y="140" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 2: Async Replication (ActiveDR)</text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">PGroup snaps ──&gt; remote FlashArray DR site (RPO: mins)</text>
  
  <line x1="410" y1="200" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">sync replication</text>
  
  <rect x="10" y="230" width="800" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 3: Synchronous (ActiveCluster)</text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Pod stretched ──&gt; site A + site B (RPO = 0)</text>
  
  <line x1="410" y1="290" x2="410" y2="310" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">backup integration</text>
  
  <rect x="10" y="320" width="800" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 4: Application-Consistent Backup</text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Veeam / Commvault ──&gt; FlashArray snap API ──&gt; backup repo</text>
  
  <rect x="10" y="400" width="800" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Restore path:</text>
  <text x="100" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Snapshot → clone (validate) → overwrite production → remount</text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Backup &amp; Restore</text>
</svg>