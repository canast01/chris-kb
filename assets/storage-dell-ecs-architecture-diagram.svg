<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Dell ECS — Elastic Cloud Storage Architecture
  </text>
  
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Software-defined object storage on commodity x86 nodes; S3/Swift/CAS protocols;
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Reed-Solomon erasure coding across nodes; geo-distribution across multiple sites.
  </text>

  <rect x="10" y="100" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cluster Architecture
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    3+ nodes minimum per VDC
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RAIN: node-level redundancy
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Scale: add nodes horizontally
  </text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VDC: virtual data center
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Geo: multiple VDCs linked
  </text>

  <rect x="410" y="100" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Supported Protocols
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3: primary; widest support
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Swift: OpenStack object API
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CAS: content-addressable
  </text>
  <text x="420" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS: via S3-NFS gateway
  </text>
  <text x="420" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HDFS: Hadoop connector
  </text>

  <text x="10" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Namespace and bucket hierarchy controls access; no traditional filesystem paths.
  </text>

  <line x1="200" y1="270" x2="200" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="270" x2="620" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="310" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Protection
  </text>
  <text x="20" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Erasure coding: 12/4 or 10/4
  </text>
  <text x="20" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    No RAID: node-level coding
  </text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Geo-replication across VDCs
  </text>
  <text x="20" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WORM: immutable object lock
  </text>
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Object versioning supported
  </text>

  <rect x="410" y="310" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="420" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ECS Portal: web UI
  </text>
  <text x="420" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ECS REST API: automation
  </text>
  <text x="420" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Namespace + bucket structure
  </text>
  <text x="420" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3 ACLs + bucket policies
  </text>
  <text x="420" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    IAM-compatible user model
  </text>

  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ECS commodity x86 nodes (ECS 300/500 series); 25GbE networking between nodes;
  </text>
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ECS Appliance or ECS Software on commodity servers; 3-node minimum per VDC.
  </text>

  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ECS            = Elastic Cloud Storage; Dell object storage platform
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Object storage = stores data as objects (ID + data + metadata); no file hierarchy
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3             = Simple Storage Service; Amazon API now the object storage standard
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RAIN           = Redundant Array of Independent Nodes; erasure coding at node level
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Erasure coding = like RAID 6 but across nodes; 12 data + 4 parity = 25% overhead
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WORM           = Write Once Read Many; immutable object lock for compliance
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VDC            = Virtual Data Center; an ECS cluster unit; multiple VDCs = geo
  </text>
  <text x="10" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Namespace      = top-level ECS tenant container; like an S3 account
  </text>
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Bucket         = object container within a namespace; like an S3 bucket
  </text>
  <text x="10" y="685" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CAS            = Content Addressable Storage; Dell Centera-compatible API
  </text>
  <text x="10" y="700" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Swift          = OpenStack object storage API; ECS-supported for OpenStack
  </text>
  <text x="10" y="715" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Geo-distribution= objects replicated across multiple VDCs in different sites
  </text>

  <rect x="0" y="730" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="750" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Dell ECS Architecture
  </text>
</svg>