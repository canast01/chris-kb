<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Architecture — Design Principles</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Compute HA · Storage Resilience · Network Redundancy · Disaster Recovery</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Compute & HA</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">vSphere clusters · HA/DRS</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSphere Cluster (HA/DRS)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Anti-Affinity Rules</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vCenter HA (3-node)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Fault Domains</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Heartbeat Datastores</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">N+1 host capacity minimum</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">HA admission control: 25%</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">DRS: fully automated</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">VM restart priority defined</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Cross-host vMotion enabled</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">VCSA backed up daily</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">No single host dependency</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">Capacity headroom monitored</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Storage & Networking</text>
  <text x="410" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">SAN/NAS/HCI · redundant paths</text>
  <rect x="295" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Primary Storage (SAN/HCI)</text>
  <rect x="295" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Backup Storage (DD/NFS)</text>
  <rect x="295" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Dual-fabric SAN (FC)</text>
  <rect x="295" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Redundant NICs (LACP)</text>
  <rect x="295" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Storage Replication</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">RAID / FTT per workload tier</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">Backup to separate datastore</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Multipath I/O (Round Robin)</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">VLAN isolation per tier</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">NSX microsegmentation</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Jumbo frames on storage</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Storage queue depth tuned</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Path failover tested</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Disaster Recovery</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">RPO/RTO · site pairing</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">RPO / RTO Defined per App</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Site Pairing (SRM/SRDF)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Sync Replication (RecoverPoint)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Async Replication (SnapMirror)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Backup + Recovery (Veeam)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">RPO: mission-critical ≤ 15 min</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">RTO: tier-1 ≤ 4 hours</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">DR test: quarterly minimum</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Runbooks: documented+tested</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Failover: automated SRM</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Backup retention: 30 days+</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">Offsite copy mandatory</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Recovery validated annually</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Architecture Pattern Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Pattern</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Active/Active</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Active/Passive</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Backup Only</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">Compute HA</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">DRS + HA across hosts</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">vCenter HA (VCSA)</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">Manual restart</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">Storage HA</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">vSAN / dual-fabric FC</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">SnapMirror async</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">Backup restore</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">Network HA</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">LACP / dual uplinks</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">NIC teaming failover</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">Single path</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">Recovery Model</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Zero-downtime failover</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">SRM orchestrated</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Restore from backup</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">RPO Target</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">0 (synchronous)</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">≤ 15 min async</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">≤ 24 hours</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">RTO Target</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Seconds (automatic)</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">≤ 4 hours (SRM)</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Hours to days</text>
