  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Architecture Design Reference · Compute HA · Storage Resilience · Network Redundancy · DR Patterns</text>
