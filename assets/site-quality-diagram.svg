<svg xmlns="http://www.w3.org/2000/svg" width="820" height="650" viewBox="0 0 820 650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    KB Site Quality Dashboard
  </text>
  
  <rect x="10" y="40" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Quality gates and content standards for the chrisanastasiadis.com knowledge base
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    37-check automated audit · pre-commit hooks · GitHub Actions CI
  </text>
  
  <line x1="180" y1="100" x2="180" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="100" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="640" y1="100" x2="640" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="40" y="140" width="280" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="180" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Structure Rules
  </text>
  <text x="180" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ─────────────
  </text>
  <text x="180" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Every page in nav
  </text>
  <text x="180" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    index.md → card grid only
  </text>
  <text x="180" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No raw kb-grid in content
  </text>
  <text x="180" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Products under vendor nav
  </text>
  
  <rect x="270" y="140" width="280" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Content Rules
  </text>
  <text x="410" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ─────────────
  </text>
  <text x="410" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ≥ 3 ## sections on CLI pg
  </text>
  <text x="410" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ≥ 1 code block on CLI pg
  </text>
  <text x="410" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Mermaid via fenced block
  </text>
  <text x="410" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Tags on every content page
  </text>
  
  <rect x="500" y="140" width="280" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="640" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    CI / Tooling
  </text>
  <text x="640" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ─────────────
  </text>
  <text x="640" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    site_audit.py (37 checks)
  </text>
  <text x="640" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    pre-commit hooks (5 rules)
  </text>
  <text x="640" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GitHub Actions CI pipeline
  </text>
  <text x="640" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MkDocs strict build check
  </text>
  
  <line x1="180" y1="250" x2="180" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="640" y1="250" x2="640" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="40" y="290" width="740" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Section          │  Pages  │  Section            │  Pages  │  Section          │  Pages
  </text>
  <text x="410" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Storage          │   709   │  SAN                │   136   │  Backup           │   103
  </text>
  <text x="410" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Virtualization   │   685   │  ITSM               │   153   │  Networking       │    83
  </text>
  <text x="410" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cloud            │   295   │  Security           │   113   │  Certifications   │    14
  </text>
  <text x="410" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Compute          │   175   │  Automation         │   126   │                   │
  </text>
  
  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Physical: GitHub Pages / Cloudflare CDN · MkDocs Material build · Actions CI pipeline
  </text>
  
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    kb-summary      = Required &lt;div&gt; block on every page; summarises content for search/nav
  </text>
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    kb-card         = Anchor-style card (&lt;a class="kb-card"&gt;) used in landing page grids
  </text>
  <text x="410" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    kb-grid         = Card grid container; appears on index.md pages only, never content pages
  </text>
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CLI reference   = Page with commands, flags, and examples; must have ≥ 3 sections + code block
  </text>
  <text x="410" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Mermaid         = Diagram syntax rendered by mkdocs-material; must use fenced ```mermaid block
  </text>
  <text x="410" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    site_audit.py   = 37-check automated audit; run before committing or after bulk changes
  </text>
  
  <rect x="0" y="540" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Site Quality Dashboard
  </text>
</svg>