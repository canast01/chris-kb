<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Evergreen Management Interfaces</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Pure1 REST API</text>
    <text x="30" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├── GET /arrays          — array inventory</text>
    <text x="30" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├── GET /subscriptions   — entitlement + capacity</text>
    <text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├── GET /metrics         — performance data</text>
    <text x="30" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└── GET /alerts          — fleet-wide alerts</text>
  </g>
  
  <g transform="translate(10, 170)">
    <rect x="0" y="0" width="800" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Per-array Purity CLI (SSH to array mgmt IP)</text>
    <text x="30" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├── purearray list --controller  — controller gen</text>
    <text x="30" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├── purearray list --space       — capacity used</text>
    <text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└── purearray phonehome list     — telemetry ok</text>
  </g>
  
  <rect x="0" y="350" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: CLI Reference</text>
</svg>