  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">12</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">415</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">Small (≤100 hosts, ≤1000 VMs)</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">4</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">19</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">480</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">Medium (≤400 hosts, ≤4000 VMs)</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">8</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">28</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">700</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">Large (≤1000 hosts, ≤10000 VMs)</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">16</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">37</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">1065</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">XL (≤2000 hosts, ≤35000 VMs)</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">24</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">56</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">1805</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">Note</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Thin provision OK</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Reservation required</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">NFS or VMFS</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware vCenter Deploy Reference · VCSA OVA · PSC · SSO · VAMI · ESXi · DNS · NTP</text>
