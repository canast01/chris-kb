<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">vCenter Deploy — Stage Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Prerequisites · Components Deployed · Post-Deploy Verification</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#37474f" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#37474f"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Prerequisites</text>
  <text x="145" y="111" text-anchor="middle" fill="#b0bec5" font-size="9">Before you begin</text>
  <rect x="30" y="126" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">ESXi 7.0+ host (HCL-listed)</text>
  <rect x="30" y="152" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">FQDN + forward/reverse DNS</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">NTP source reachable</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Datastore ≥ 50 GB free</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Management network segment</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">ESXi: target host for VCSA OVA</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">DNS: VCSA FQDN must resolve</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">NTP: time sync required for SSO</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">Datastore: sizing by VCSA size</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Network: VLAN + IP + gateway</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Ports: 443, 5480, 7080 open</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Deployed Components</text>
  <text x="410" y="111" text-anchor="middle" fill="#90caf9" font-size="9">What gets installed</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VCSA OVA (Linux appliance)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Embedded PSC (vSphere 7.0+)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vPostgres (embedded DB)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">SSO domain (vsphere.local)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VAMI service (port 5480)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">VCSA: deployed via ISO installer</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">PSC: embedded since vSphere 7</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">vPostgres: all inventory data</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">SSO: initial admin password set</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">VAMI: network + cert + backup config</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">VMCA: built-in cert authority</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
