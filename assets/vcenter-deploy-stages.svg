  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">VAMI UI loads (:5480)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">First ESXi host added to inventory</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">HA cluster created + configured</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">https://vcsa-fqdn: login with admin@vsphere.local</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">VAMI: verify NTP sync status</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Add first ESXi host via UI</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Create datacenter + cluster</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Configure HA admission control</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Set backup schedule in VAMI</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">VCSA Sizing Reference</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Deployment Size</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">vCPU</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">RAM (GB)</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Storage (GB)</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
