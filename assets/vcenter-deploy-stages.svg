  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FQDN resolves to VCSA IP</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
