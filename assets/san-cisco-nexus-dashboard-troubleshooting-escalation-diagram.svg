<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cisco Nexus Dashboard — Escalation</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open SR at case.cisco.com with ND tech-support bundle attached</text>
  </g>
  
  <line x1="410" y1="100" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 140)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Cisco TAC SE acknowledges (Sev-1: &lt; 1 hr; Sev-2: &lt; 2 hr — requires SMARTnet 24×7)</text>
  </g>
  
  <line x1="410" y1="190" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 230)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within 2 hours for Sev-1:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to Nexus Dashboard SME"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[cluster node NotReady / etcd quorum lost / app unavailable / upgrade failed]"</text>
  </g>
  
  <line x1="410" y1="310" x2="410" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 350)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Cisco ND Subject Matter Expert assigned</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will review the tech-support bundle and may request a remote session (WebEx)</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have ndadmin SSH access and ESXi console access to the affected node ready</text>
  </g>
  
  <line x1="410" y1="430" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 470)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue is a confirmed k8s or etcd code-level bug:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ SME escalates to Cisco Nexus Dashboard Engineering</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide a targeted patch, node-rejoin procedure, or etcd recovery steps</text>
  </g>
  
  <line x1="410" y1="550" x2="410" y2="580" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 590)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For Sev-1 unresolved &gt; 2 hours:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request Duty Manager escalation during the TAC call</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engage Cisco account team and TAM for executive escalation</text>
    <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have the ND backup timestamp and location ready in case a restore is needed</text>
  </g>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>