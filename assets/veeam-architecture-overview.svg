<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Veeam — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Backup Infrastructure</text>

  <!-- Col 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f" text-anchor="middle">Backup Server</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(scheduler + SQL DB)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f" text-anchor="middle">Backup Proxy</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(data mover — VADP / agent)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f" text-anchor="middle">Scale-Out Backup Repository</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(SOBR — tiered storage pool)</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Transport Modes</text>

  <!-- Col 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">VADP Hot-Add</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Direct NFS</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">NBD (network fallback)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Agent-Based</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Storage Tiers</text>

  <!-- Col 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Performance Tier (fast disk)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Capacity Tier (S3 / object)</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Archive Tier (Glacier)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Immutability (WORM object)</text>

  <!-- Flow arrows -->
  <line x1="270" y1="212" x2="287" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="537" y1="212" x2="553" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="160" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Veeam B&amp;R</text>
  <text x="420" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Veeam Agent</text>
  <text x="680" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Veeam ONE</text>

  <!-- Row labels -->
  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="557" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Use case</text>
  <text x="160" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">VM / NAS backup &amp; replication</text>
  <text x="420" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Physical &amp; cloud workload backup</text>
  <text x="680" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Monitoring, alerting, reporting</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="583" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Target</text>
  <text x="160" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">VMware vSphere / Hyper-V</text>
  <text x="420" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Windows, Linux, Mac</text>
  <text x="680" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Veeam infrastructure &amp; VMs</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="609" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Scheduling</text>
  <text x="160" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Centralized on Backup Server</text>
  <text x="420" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Local or centrally managed</text>
  <text x="680" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">N/A (passive monitoring)</text>

  <rect x="20" y="618" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Reporting</text>
  <text x="160" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Built-in job reports</text>
  <text x="420" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Via Veeam ONE integration</text>
  <text x="680" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Dashboards, capacity, SLA</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
