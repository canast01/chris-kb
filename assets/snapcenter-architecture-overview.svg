<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">SnapCenter — Architecture Overview</text>

  <!-- Column 1 header: Server Components (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SERVER COMPONENTS</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">SnapCenter Server</text>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">Windows Server 2019/2022 VM</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Web GUI (port 8146) + REST API</text>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">policy scheduler and RBAC</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Repository Database (MySQL)</text>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">job history, policies, resource groups</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">SnapCenter Agent (port 8145)</text>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">Windows or Linux service on each host</text>

  <rect x="20" y="286" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">HA &amp; SIZING</text>

  <rect x="20" y="332" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Minimum: 4 vCPU / 8 GB RAM</text>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">per server instance</text>

  <rect x="20" y="372" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">MySQL HA Cluster option</text>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">for repository high availability</text>

  <rect x="20" y="412" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Active Directory integration</text>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">for RBAC and authentication</text>

  <!-- Column 2 header: Plug-in Model (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PLUG-IN MODEL</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Plug-in for SQL Server</text>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">VSS-consistent DB snapshots</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Plug-in for Oracle</text>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">Linux agent + RMAN integration</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Plug-in for VMware (OVA)</text>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">VM/datastore backup, agentless</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Plug-in for SAP HANA</text>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">HCMT-compatible backups</text>

  <rect x="287" y="286" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">POLICY ENGINE</text>

  <rect x="287" y="332" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="352" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Backup Policies (schedule + retention)</text>

  <rect x="287" y="372" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Resource Groups</text>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">(group hosts, DBs, VMs together)</text>

  <rect x="287" y="412" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Pre/Post Scripts</text>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">custom hooks per backup job</text>

  <!-- Column 3 header: ONTAP Integration (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ONTAP INTEGRATION</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">ONTAP Snapshots</text>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">primary protection via snapshot engine</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">SnapMirror (replication)</text>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">clone backups to DR site</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">SnapVault (archive)</text>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">long-retention backup copies</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">FlexClone</text>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">instant writable clones for test/dev</text>

  <rect x="553" y="286" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">RESTORE CAPABILITIES</text>

  <rect x="553" y="332" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Volume-level restore</text>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">revert entire volume to snapshot</text>

  <rect x="553" y="372" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Item-level recovery</text>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">files, DB tables, mailbox items</text>

  <rect x="553" y="412" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Application-consistent recovery</text>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">log replay for SQL/Oracle</text>

  <!-- Comparison table -->
  <rect x="20" y="462" width="783" height="30" fill="#1e293b"/>
  <text x="130" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="340" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Platform</text>
  <text x="570" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Notes</text>

  <rect x="20" y="492" width="783" height="26" fill="#f1f5f9"/>
  <text x="130" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">SnapCenter Server</text>
  <text x="340" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Windows Server 2019/2022 VM</text>
  <text x="570" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Web GUI :8146, REST API, scheduler</text>

  <rect x="20" y="518" width="783" height="26" fill="#ffffff"/>
  <text x="130" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Repository Database</text>
  <text x="340" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">MySQL (local or HA cluster)</text>
  <text x="570" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Job history, policies, RBAC</text>

  <rect x="20" y="544" width="783" height="26" fill="#f1f5f9"/>
  <text x="130" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">SnapCenter Agent</text>
  <text x="340" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Windows or Linux service</text>
  <text x="570" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Port 8145, installed on protected host</text>

  <rect x="20" y="570" width="783" height="26" fill="#ffffff"/>
  <text x="130" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Plug-in for VMware</text>
  <text x="340" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">OVA appliance (per vCenter)</text>
  <text x="570" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">VM/datastore backup, no in-guest agent</text>

  <!-- Key notes -->
  <rect x="20" y="608" width="783" height="26" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="410" y="625" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">SnapCenter orchestrates ONTAP Snapshots centrally — plug-ins quiesce the application before snapshot</text>

  <rect x="20" y="640" width="783" height="26" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="657" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">FlexClone enables instant writable clones from backup — used for test/dev refresh without copying data</text>

  <rect x="20" y="672" width="783" height="26" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="410" y="689" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Plug-in for VMware (OVA) protects VMs and datastores without in-guest agents via vSphere APIs</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
