<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    GitHub Actions — Escalation
  </text>
  
  <!-- Step 1 -->
  <rect x="20" y="50" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 1 — Internal: automation team investigates with step debug logging
  </text>
  <text x="30" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    (ACTIONS_STEP_DEBUG: true and ACTIONS_RUNNER_DEBUG: true secrets)
  </text>
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <rect x="20" y="130" width="780" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 2 — If issue is not workflow-specific (affects all runners or all workflows):
  </text>
  <text x="30" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Platform / infra team: check runner host networking, DNS, TLS, proxy config
  </text>
  <line x1="410" y1="190" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <rect x="20" y="210" width="780" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 3 — If platform team cannot resolve: open GitHub Enterprise support case at support.github.com
  </text>
  <text x="30" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Attach runner diagnostics and failing run logs
  </text>
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 4 -->
  <rect x="20" y="290" width="780" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 4 — If GitHub confirms a platform incident affecting your organisation:
  </text>
  <text x="30" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Follow githubstatus.com for resolution timeline
  </text>
  <text x="30" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → No further escalation needed — GitHub's SRE team is engaged
  </text>
  <line x1="410" y1="360" x2="410" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 5 -->
  <rect x="20" y="380" width="780" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 5 — If case is not progressing within SLA:
  </text>
  <text x="30" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Reply in the support case: "Requesting escalation — impact: [describe production impact]"
  </text>
  <text x="30" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Contact your GitHub account manager to expedite
  </text>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Escalation Process
  </text>
</svg>