<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Nutanix — Architecture Overview</text>

  <!-- Col 1 header (blue): AHV Node -->
  <rect x="20" y="70" width="187" height="36" rx="4" fill="#2563eb"/>
  <text x="113" y="93" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">AHV Node</text>

  <!-- Col 1 boxes -->
  <rect x="20" y="116" width="187" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="113" y="136" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">AHV — KVM Type-1 hypervisor</text>

  <rect x="20" y="156" width="187" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="113" y="176" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">CVM — AOS storage services</text>

  <rect x="20" y="196" width="187" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="113" y="209" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">CVM — 4 vCPU /</text>
  <text x="113" y="221" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">12 GB reserved</text>

  <rect x="20" y="236" width="187" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="113" y="256" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Local SSD — write cache tier</text>

  <rect x="20" y="276" width="187" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="113" y="296" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Local HDD — capacity tier</text>

  <rect x="20" y="316" width="187" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="113" y="336" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">iSCSI / NFS — VM I/O path</text>

  <!-- Col 2 header (green): Storage Fabric -->
  <rect x="217" y="70" width="187" height="36" rx="4" fill="#15803d"/>
  <text x="310" y="93" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Storage Fabric (DSF)</text>

  <!-- Col 2 boxes -->
  <rect x="217" y="116" width="187" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="310" y="136" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">DSF — cluster-wide datastore</text>

  <rect x="217" y="156" width="187" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="310" y="169" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">RF2 — 2 copies</text>
  <text x="310" y="181" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">3+ node minimum</text>

  <rect x="217" y="196" width="187" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="310" y="209" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">RF3 — 3 copies</text>
  <text x="310" y="221" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">5+ node minimum</text>

  <rect x="217" y="236" width="187" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="310" y="249" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">EC-X — erasure coding</text>
  <text x="310" y="261" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">4+2 / 8+2</text>

  <rect x="217" y="276" width="187" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="310" y="296" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">OpLog — SSD write buffer</text>

  <rect x="217" y="316" width="187" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="310" y="336" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Medusa — metadata store</text>

  <!-- Col 3 header (purple): Prism -->
  <rect x="414" y="70" width="187" height="36" rx="4" fill="#7c3aed"/>
  <text x="507" y="93" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Prism (Management)</text>

  <!-- Col 3 boxes -->
  <rect x="414" y="116" width="187" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="507" y="136" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Prism Element — cluster UI</text>

  <rect x="414" y="156" width="187" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="507" y="169" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Prism Central</text>
  <text x="507" y="181" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">multi-cluster management</text>

  <rect x="414" y="196" width="187" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="507" y="216" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">REST API v2 / v3</text>

  <rect x="414" y="236" width="187" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="507" y="256" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">RBAC — role-based access</text>

  <rect x="414" y="276" width="187" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="507" y="296" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">LCM — lifecycle manager</text>

  <rect x="414" y="316" width="187" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="507" y="329" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Flow / Calm / Karbon</text>
  <text x="507" y="341" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">optional add-ons</text>

  <!-- Col 4 header (orange): Cluster Services -->
  <rect x="611" y="70" width="187" height="36" rx="4" fill="#d97706"/>
  <text x="704" y="86" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Cluster Services</text>
  <text x="704" y="100" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">(CVM internal)</text>

  <!-- Col 4 boxes -->
  <rect x="611" y="116" width="187" height="32" rx="3" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="704" y="136" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Zookeeper — config store</text>

  <rect x="611" y="156" width="187" height="32" rx="3" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="704" y="169" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Cassandra — metrics</text>
  <text x="704" y="181" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">&amp; events DB</text>

  <rect x="611" y="196" width="187" height="32" rx="3" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="704" y="216" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Genesis — service manager</text>

  <rect x="611" y="236" width="187" height="32" rx="3" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="704" y="256" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Cerebro — replication</text>

  <rect x="611" y="276" width="187" height="32" rx="3" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="704" y="296" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Stargate — I/O handler</text>

  <rect x="611" y="316" width="187" height="32" rx="3" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="704" y="336" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Curator — rebalance</text>

  <!-- Comparison table header -->
  <rect x="20" y="380" width="783" height="30" fill="#1e293b"/>
  <text x="22" y="399" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">Feature</text>
  <text x="340" y="399" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RF2 — 3+ Node Cluster</text>
  <text x="620" y="399" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RF3 — 5+ Node Cluster</text>

  <!-- Row 1 -->
  <rect x="20" y="410" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="427" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Minimum nodes</text>
  <text x="340" y="427" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">3 nodes</text>
  <text x="620" y="427" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">5 nodes</text>

  <!-- Row 2 -->
  <rect x="20" y="436" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="453" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Host failure tolerance</text>
  <text x="340" y="453" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">1 node</text>
  <text x="620" y="453" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">2 nodes</text>

  <!-- Row 3 -->
  <rect x="20" y="462" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="479" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Erasure coding</text>
  <text x="340" y="479" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">5+ nodes only</text>
  <text x="620" y="479" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Fully supported</text>

  <!-- Row 4 -->
  <rect x="20" y="488" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="505" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Storage efficiency</text>
  <text x="340" y="505" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">~50% usable</text>
  <text x="620" y="505" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">~33% usable</text>

  <!-- Row 5 -->
  <rect x="20" y="514" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="531" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Typical use case</text>
  <text x="340" y="531" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Standard HA workloads</text>
  <text x="620" y="531" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Mission-critical / DR</text>

  <!-- Physical infrastructure -->
  <rect x="20" y="560" width="783" height="70" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="580" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Physical Infrastructure</text>
  <text x="32" y="598" font-family="Arial,sans-serif" font-size="10" fill="#475569">Nutanix NX-series or OEM nodes (Dell XC / HPE DX / Lenovo HX) — local SSD + HDD tiers per node</text>
  <text x="32" y="614" font-family="Arial,sans-serif" font-size="10" fill="#475569">10 / 25 GbE ToR switching · IPMI / iDRAC / iLO for out-of-band management · Foundation for bare-metal imaging</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
