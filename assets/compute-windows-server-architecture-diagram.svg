<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Windows Server — Platform Architecture Overview
  </text>
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Microsoft server OS; roles and features architecture; AD DS for identity;
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Group Policy for management; Hyper-V for virtualisation; WinRM for remote ops.
  </text>
  <rect x="10" y="90" width="390" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Core Roles
  </text>
  <text x="205" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AD DS: domain identity
  </text>
  <text x="205" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DNS: name resolution
  </text>
  <text x="205" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DHCP: IP address service
  </text>
  <text x="205" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    File Services: SMB shares
  </text>
  <text x="205" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Hyper-V: virtualisation
  </text>
  <rect x="420" y="90" width="390" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management Layer
  </text>
  <text x="615" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Group Policy: GPO
  </text>
  <text x="615" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WinRM: remote PowerShell
  </text>
  <text x="615" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Server Manager: local UI
  </text>
  <text x="615" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WSUS: patch management
  </text>
  <text x="615" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SCCM/Intune: config mgmt
  </text>
  <text x="10" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Roles are modular; install only what is needed; each role has its own services.
  </text>
  <line x1="205" y1="240" x2="205" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="240" x2="615" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="280" width="390" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Storage and Networking
  </text>
  <text x="205" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NTFS: primary filesystem
  </text>
  <text x="205" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ReFS: resilient filesystem
  </text>
  <text x="205" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    iSCSI initiator: SAN attach
  </text>
  <text x="205" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Failover Clustering: WSFC
  </text>
  <text x="205" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMB 3.0: file sharing
  </text>
  <rect x="420" y="280" width="390" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Security Components
  </text>
  <text x="615" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Windows Defender: AV/EDR
  </text>
  <text x="615" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Windows Firewall: host FW
  </text>
  <text x="615" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    BitLocker: disk encryption
  </text>
  <text x="615" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Kerberos: auth protocol
  </text>
  <text x="615" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    TLS 1.3: wire encryption
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="445" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    x86-64 servers; TPM 2.0 required for BitLocker; BIOS/UEFI; NIC team for HA;
  </text>
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    iDRAC/iLO OOB management; Windows Server requires CAL for each connecting user.
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AD DS          = Active Directory Domain Services; user and computer identity
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Group Policy   = GPO; domain-wide config pushed to computers and users
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WinRM          = Windows Remote Management; PowerShell remote sessions
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Hyper-V        = Windows hypervisor; type-1; VMs run as partitions
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WSFC           = Windows Server Failover Cluster; SQL Always On, Hyper-V HA
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NTFS           = NT File System; permissions, journaling, compression
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ReFS           = Resilient File System; checksums, no repair needed; Storage Spaces
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMB 3.0        = Server Message Block; Windows file sharing protocol
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    BitLocker      = Microsoft full-disk encryption; requires TPM 2.0
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Kerberos       = AD authentication protocol; ticket-based; default in domain
  </text>
  <text x="10" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WSUS           = Windows Server Update Services; internal patch distribution
  </text>
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CAL            = Client Access License; required per user/device connecting
  </text>
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Windows Server Architecture
  </text>
</svg>