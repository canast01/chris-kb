<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Compute — Service Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">EC2 · Auto Scaling · Lambda · Systems Manager · AMIs · Patch Manager</text>

  <!-- ═ COLUMN 1: Virtual Machines ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Virtual Machines</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">EC2 · Auto Scaling · AMIs</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EC2 Instances</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Auto Scaling Groups</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Launch Templates</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Amazon Machine Images (AMIs)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Instance Recovery Alarms</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Elastic IP / ENI</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Families: t3, m6i, c6i, r6i, p3</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Launch template = versioned config</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">AMI baking: EC2 Image Builder</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">ASG: min / desired / max capacity</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Recovery: CloudWatch alarm action</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">EBS root + data volumes attached</text>

  <!-- ═ COLUMN 2: Serverless ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Serverless &amp; Containers</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Lambda · ECS Fargate · EKS</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">AWS Lambda (FaaS)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ECS (EC2 or Fargate)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">EKS (managed Kubernetes)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Step Functions (orchestration)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">EventBridge (event triggers)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">API Gateway (REST / HTTP)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Lambda: 15 min max, 10 GB RAM</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Fargate: serverless containers (no EC2)</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">EKS: node groups or Fargate profiles</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Lambda runtimes: Node, Python, Go, Java</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Layers: shared dependencies</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Step Functions: workflow state machine</text>

  <!-- ═ COLUMN 3: Fleet Management ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Fleet Management</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Systems Manager · Patch Manager · SSM</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SSM Session Manager (no bastion)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Patch Manager (baselines)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SSM Inventory (fleet visibility)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Run Command (remote exec)</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Parameter Store (config)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Maintenance Windows</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">SSM Agent required on all instances</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Patch baselines per OS family</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Maintenance window = scheduled patching</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Inventory: OS, apps, network config</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Parameter Store: plaintext + SecureString</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Session Manager: audited, no SSH needed</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Compute Model Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">EC2</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Lambda</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">ECS / Fargate</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Infrastructure managed</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Full (OS, runtime)</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">None (fully managed)</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Containers only</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Max execution duration</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Unlimited</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">15 minutes</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Unlimited (long-running)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Scaling model</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">ASG (minutes)</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Instant (per request)</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Service auto-scaling</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Billing unit</text>
  <text x="340" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Per hour (instance)</text>
  <text x="540" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Per 1ms invocation</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Per vCPU/memory-second</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">OS / runtime control</text>
  <text x="340" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Container image</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Lift-and-shift, stateful apps</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Event-driven, short tasks</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Microservices, APIs</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Compute Reference · EC2 · Auto Scaling · Lambda · ECS · EKS · Systems Manager · Patch Manager</text>
</svg>
