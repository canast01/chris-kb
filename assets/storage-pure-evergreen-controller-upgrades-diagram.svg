<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Ever Modern Controller Upgrade — Step by Step
  </text>

  <rect x="10" y="50" width="800" height="80" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pre-upgrade (customer):
  </text>
  <text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &#x2022; Confirm hosts have ≥ 2 active paths
  </text>
  <text x="40" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &#x2022; No active drive rebuilds
  </text>
  <text x="40" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &#x2022; ActiveCluster pods healthy + replicating
  </text>

  <line x1="410" y1="130" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure engineer on-site
  </text>

  <rect x="10" y="160" width="800" height="60" fill="#e8eaf6" stroke="#3949ab" rx="6" />
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    CT0 replacement:
  </text>
  <text x="40" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CT1 serves all I/O ──&gt; old CT0 removed
  </text>
  <text x="40" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    New CT0' installed ──&gt; joins HA pair
  </text>

  <line x1="410" y1="220" x2="410" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="250" width="800" height="60" fill="#e8f5e9" stroke="#2e7d32" rx="6" />
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    CT1 replacement:
  </text>
  <text x="40" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CT0' serves all I/O ──&gt; old CT1 removed
  </text>
  <text x="40" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    New CT1' installed ──&gt; joins HA pair
  </text>

  <line x1="410" y1="310" x2="410" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="340" width="800" height="40" fill="#fff8e1" stroke="#f57f17" rx="6" />
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Post-upgrade (customer validates):
  </text>
  <text x="40" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    purearray list --controller → both controllers ok
  </text>

  <rect x="0" y="560" width="820" height="40" fill="#f5f7fa" />
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Storage Controller Upgrade Process
  </text>
</svg>