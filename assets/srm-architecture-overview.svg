  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="302" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Test</text>
  <text x="450" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Planned Migration</text>
  <text x="597" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">DR Failover</text>
  <text x="742" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Reprotect</text>
  <line x1="220" y1="516" x2="220" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="385" y1="516" x2="385" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="515" y1="516" x2="515" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="680" y1="516" x2="680" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="562" text-anchor="middle" fill="#455a64" font-size="9">Production impact</text>
  <text x="302" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">Protected site shut down</text>
  <text x="302" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="613" text-anchor="middle" fill="#455a64" font-size="9">Data loss</text>
  <text x="302" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="613" text-anchor="middle" fill="#546e7a" font-size="9">RPO-bounded</text>
  <text x="742" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">Cleanup required after</text>
  <text x="302" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="450" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Frequency</text>
  <text x="302" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Monthly</text>
  <text x="450" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Planned events</text>
  <text x="597" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Disaster</text>
  <text x="742" y="665" text-anchor="middle" fill="#546e7a" font-size="9">After failover</text>
  <text x="120" y="691" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="302" y="691" text-anchor="middle" fill="#546e7a" font-size="9">DR validation</text>
  <text x="450" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Datacenter migration</text>
  <text x="597" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Disaster recovery</text>
  <text x="742" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Failback prep</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware SRM Reference · Protection Groups · Recovery Plans · vSphere Replication · Array-Based Replication</text>
