<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Site Recovery Manager — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Protected Site · Recovery Site · Replication Layer · SRM Orchestration</text>

  <!-- ═ COLUMN 1: Protected Site ═ -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="112" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Protected Site</text>
  <text x="112" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Primary production site</text>
  <rect x="30" y="126" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vCenter Server</text>
  <rect x="30" y="152" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">SRM Server (Windows/appliance)</text>
  <rect x="30" y="178" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Production VMs</text>
  <rect x="30" y="204" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Protection Groups</text>
  <rect x="30" y="230" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Storage Array (if ABR)</text>
  <text x="112" y="282" text-anchor="middle" fill="#78909c" font-size="9">SRM registers with vCenter</text>
  <text x="112" y="300" text-anchor="middle" fill="#78909c" font-size="9">SRM paired with recovery site</text>
  <text x="112" y="318" text-anchor="middle" fill="#78909c" font-size="9">Protection groups = VM sets</text>
  <text x="112" y="336" text-anchor="middle" fill="#78909c" font-size="9">VMs replicated to recovery site</text>
  <text x="112" y="354" text-anchor="middle" fill="#78909c" font-size="9">RPO controlled per VM or group</text>

  <!-- ═ COLUMN 2: Recovery Site ═ -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#00695c"/>
  <text x="307" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Recovery Site</text>
  <text x="307" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">DR site · standby capacity</text>
  <rect x="225" y="126" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="307" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter Server</text>
  <rect x="225" y="152" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="307" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SRM Server (paired)</text>
  <rect x="225" y="178" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="307" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Placeholder VMs (inactive)</text>
  <rect x="225" y="204" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="307" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Recovery Plan</text>
  <rect x="225" y="230" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="307" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Storage Array (if ABR)</text>
  <text x="307" y="282" text-anchor="middle" fill="#78909c" font-size="9">Placeholder VMs created by SRM</text>
  <text x="307" y="300" text-anchor="middle" fill="#78909c" font-size="9">Network mappings configured</text>
  <text x="307" y="318" text-anchor="middle" fill="#78909c" font-size="9">Compute resource mappings</text>
  <text x="307" y="336" text-anchor="middle" fill="#78909c" font-size="9">Datastore mappings (for replica)</text>
  <text x="307" y="354" text-anchor="middle" fill="#78909c" font-size="9">Recovery plan steps configured</text>

  <!-- ═ COLUMN 3: Replication Layer ═ -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#e65100" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#e65100"/>
  <text x="502" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Replication Layer</text>
  <text x="502" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">VR · ABR · storage-based</text>
  <rect x="420" y="126" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vSphere Replication (VRA)</text>
  <rect x="420" y="152" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Array-Based Replication (ABR)</text>
  <rect x="420" y="178" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SRA Plugin (per array vendor)</text>
  <rect x="420" y="204" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">VRA Appliance (VR-based PGs)</text>
  <rect x="420" y="230" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">TCP 31031 (VR data) + 44046 (mgmt)</text>
  <text x="502" y="282" text-anchor="middle" fill="#78909c" font-size="9">VR: hypervisor-level, per-VM RPO</text>
  <text x="502" y="300" text-anchor="middle" fill="#78909c" font-size="9">ABR: SAN-based, group consistency</text>
  <text x="502" y="318" text-anchor="middle" fill="#78909c" font-size="9">ABR: SRA is per-vendor (Pure, Dell)</text>
  <text x="502" y="336" text-anchor="middle" fill="#78909c" font-size="9">Mix VR + ABR in same recovery plan</text>
  <text x="502" y="354" text-anchor="middle" fill="#78909c" font-size="9">VR RPO: 5 min to 24 hours</text>

  <!-- ═ COLUMN 4: SRM Orchestration ═ -->
  <rect x="605" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="185" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="605" y="100" width="185" height="14" fill="#6a1b9a"/>
  <text x="697" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">SRM Orchestration</text>
  <text x="697" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Recovery plans · automation</text>
  <rect x="615" y="126" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Recovery Plan (ordered steps)</text>
  <rect x="615" y="152" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Test (non-destructive, isolated)</text>
  <rect x="615" y="178" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Planned Migration (graceful)</text>
  <rect x="615" y="204" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">DR Failover (disaster mode)</text>
  <rect x="615" y="230" width="165" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="697" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Reprotect (reverse replication)</text>
  <text x="697" y="282" text-anchor="middle" fill="#78909c" font-size="9">Priority groups 1–4 for VM ordering</text>
  <text x="697" y="300" text-anchor="middle" fill="#78909c" font-size="9">Pre/post commands in plan steps</text>
  <text x="697" y="318" text-anchor="middle" fill="#78909c" font-size="9">Test: isolated network, no prod impact</text>
  <text x="697" y="336" text-anchor="middle" fill="#78909c" font-size="9">Failback: Reprotect → Planned Migr.</text>
  <text x="697" y="354" text-anchor="middle" fill="#78909c" font-size="9">REST API for automation</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
