<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Veeam Escalation Process</text>

  <rect x="20" y="50" width="780" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at my.veeam.com with log bundle attached</text>

  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="110" width="780" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="135" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — T1 support acknowledges and confirms logs received (typically 1–2 hr)</text>

  <line x1="410" y1="150" x2="410" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="170" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="195" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within SLA (1 hr for Sev1, 4 hr for Sev2):</text>
  <text x="50" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in the case: "Requesting escalation to Senior Veeam Engineer"</text>
  <text x="50" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State impact: "[47 VMs unprotected / restore failing in DR / chain broken]"</text>

  <line x1="410" y1="250" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="270" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="295" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Senior engineer is assigned; they may request a live remote session</text>
  <text x="50" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have VBR Console open and screen sharing ready (Teams/Zoom)</text>
  <text x="50" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Ensure SSH/RDP to Backup Server is accessible</text>

  <line x1="410" y1="350" x2="410" y2="370" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="370" width="780" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="395" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue requires code-level investigation or patch:</text>
  <text x="50" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Senior engineer escalates to Veeam Engineering</text>
  <text x="50" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide a hotfix build if a product bug is confirmed</text>

  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="460" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For active data loss or restore failure in a live DR scenario:</text>
  <text x="50" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request escalation to Veeam ProSupport duty manager</text>
  <text x="50" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add to case: "Escalation requested — active DR restore failing; data at risk"</text>

  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>