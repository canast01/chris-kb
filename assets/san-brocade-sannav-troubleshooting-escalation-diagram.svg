<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Brocade SANnav — Escalation Process</text>
  
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at support.broadcom.com with SANnav bundle + journalctl + supportsaves</text>
  </g>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 110)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — TAC T1 engineer acknowledges (Sev1: &lt; 30 min; Sev2: &lt; 2 hr)</text>
  </g>
  
  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 180)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 30 minutes for Sev1 or 2 hours for Sev2:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply: "Requesting escalation to SANnav Senior Engineer"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[UI down / zone push failing / discovery stopped / upgrade failed]"</text>
  </g>
  
  <line x1="410" y1="260" x2="410" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 280)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — SANnav T2 Senior Engineer assigned</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They may request SSH access to the SANnav appliance VM for a live session</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SSH access to the appliance and vSphere console access (for VM restart) ready</text>
  </g>
  
  <line x1="410" y1="360" x2="410" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 380)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue involves a confirmed SANnav bug (upgrade regression, DB schema issue):</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ T2 escalates to SANnav Engineering</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering provides targeted recovery procedure or patch build</text>
  </g>
  
  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 460)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For Sev1 with SANnav down &gt; 2 hours and no resolution:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request TAM or account team escalation</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAC will arrange a bridge call with Engineering if needed</text>
  </g>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>