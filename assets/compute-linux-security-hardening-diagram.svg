<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    /etc/sysctl.d/99-hardening.conf
  </text>
  
  <!-- Network Hardening Section -->
  <rect x="10" y="40" width="800" height="300" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Network hardening
  </text>
  
  <text x="20" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Disable IP forwarding (unless this is a router)
  </text>
  <text x="20" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.ip_forward = 0
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv6.conf.all.forwarding = 0
  </text>
  
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Disable IPv6 if not used
  </text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv6.conf.all.disable_ipv6 = 1
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv6.conf.default.disable_ipv6 = 1
  </text>
  
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Prevent source routing
  </text>
  <text x="20" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.all.accept_source_route = 0
  </text>
  <text x="20" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.default.accept_source_route = 0
  </text>
  <text x="20" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv6.conf.all.accept_source_route = 0
  </text>
  
  <text x="20" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Prevent ICMP redirects (MITM vector)
  </text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.all.accept_redirects = 0
  </text>
  <text x="20" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.default.accept_redirects = 0
  </text>
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.all.send_redirects = 0
  </text>
  <text x="20" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv6.conf.all.accept_redirects = 0
  </text>
  
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Enable reverse path filtering (anti-spoofing)
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.all.rp_filter = 1
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.default.rp_filter = 1
  </text>
  
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Log suspicious packets
  </text>
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.all.log_martians = 1
  </text>
  <text x="20" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.conf.default.log_martians = 1
  </text>
  
  <text x="20" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Ignore ICMP broadcast (Smurf attack prevention)
  </text>
  <text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.icmp_echo_ignore_broadcasts = 1
  </text>
  
  <text x="20" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Ignore bogus ICMP error responses
  </text>
  <text x="20" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.icmp_ignore_bogus_error_responses = 1
  </text>
  
  <text x="20" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SYN cookies — protect against SYN flood
  </text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.tcp_syncookies = 1
  </text>
  
  <text x="20" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TCP timestamps — disable to reduce fingerprinting
  </text>
  <text x="20" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    net.ipv4.tcp_timestamps = 0
  </text>
  
  <!-- Kernel Hardening Section -->
  <rect x="10" y="570" width="800" height="200" fill="#e8eaf6" stroke="#3949ab" rx="6" />
  <text x="20" y="590" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Kernel hardening
  </text>
  
  <text x="20" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Restrict dmesg to root only
  </text>
  <text x="20" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kernel.dmesg_restrict = 1
  </text>
  
  <text x="20" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Restrict kernel pointer exposure
  </text>
  <text x="20" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kernel.kptr_restrict = 2
  </text>
  
  <text x="20" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Disable core dumps for setuid programs
  </text>
  <text x="20" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    fs.suid_dumpable = 0
  </text>
  
  <text x="20" y="715" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Restrict ptrace — 1 = only parent can ptrace child; 3 = disabled entirely
  </text>
  <text x="20" y="730" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kernel.yama.ptrace_scope = 1
  </text>
  
  <text x="20" y="750" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Disable magic SysRq key
  </text>
  <text x="20" y="765" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kernel.sysrq = 0
  </text>
  
  <text x="20" y="785" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Randomise virtual address space (ASLR) — 2 = full randomisation
  </text>
  <text x="20" y="800" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kernel.randomize_va_space = 2
  </text>
  
  <text x="20" y="820" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Restrict access to kernel address space
  </text>
  <text x="20" y="835" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    kernel.perf_event_paranoid = 3
  </text>
  
  <rect x="0" y="850" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="870" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Linux Hardening Configuration
  </text>
</svg>