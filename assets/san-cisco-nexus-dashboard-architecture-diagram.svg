<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Cisco Nexus Dashboard — App-Hosting Platform
  </text>
  
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    3-node or 5-node cluster with shared identity, multi-site connectivity, and API
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    gateway; NDFC, NDI, and NDO run as hosted applications on the cluster.
  </text>

  <rect x="20" y="140" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cluster Architecture
  </text>
  <text x="30" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    3-node: HA quorum
  </text>
  <text x="30" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    5-node: scale + apps separation
  </text>
  <text x="30" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Kubernetes: shared app runtime
  </text>
  <text x="30" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Etcd: cluster state store
  </text>
  <text x="30" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Shared: identity + secrets
  </text>

  <rect x="420" y="140" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="430" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Hosted Applications
  </text>
  <text x="430" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDFC: SAN+LAN fabric control
  </text>
  <text x="430" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDI: network insights
  </text>
  <text x="430" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDO: multi-site orchestrator
  </text>
  <text x="430" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Apps: install from app store
  </text>
  <text x="430" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    License: per-app subscription
  </text>

  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Each app (NDFC/NDI/NDO) is independent; all share ND auth and multi-site links.
  </text>

  <line x1="200" y1="320" x2="200" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="320" x2="620" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="350" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Network Connectivity
  </text>
  <text x="30" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data network: switch discovery
  </text>
  <text x="30" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mgmt network: OOB access
  </text>
  <text x="30" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SSH/HTTPS to Nexus/MDS
  </text>
  <text x="30" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SNMP: trap receiving
  </text>
  <text x="30" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NTP: all nodes sync required
  </text>

  <rect x="420" y="350" width="380" height="140" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="430" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Multi-Site and API
  </text>
  <text x="430" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-site: inter-ND link
  </text>
  <text x="430" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: per-app + platform
  </text>
  <text x="430" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SAML/LDAP: SSO integration
  </text>
  <text x="430" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Webhook: alert forwarding
  </text>
  <text x="430" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Syslog: event forwarding
  </text>

  <rect x="10" y="510" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="530" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Nexus Dashboard hardware appliance (NDC) or VMware/KVM VMs; 3-node minimum;
  </text>
  <text x="20" y="560" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    management + data networks; outbound HTTPS to Cisco app store for installs.
  </text>

  <rect x="10" y="600" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="620" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ND = Nexus Dashboard; Cisco app-hosting platform for DC management
  </text>
  <text x="20" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDFC = Nexus Dashboard Fabric Controller; SAN/LAN fabric management
  </text>
  <text x="20" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDI = Nexus Dashboard Insights; telemetry + network assurance
  </text>
  <text x="20" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDO = Nexus Dashboard Orchestrator; ACI multi-site policy
  </text>
  <text x="20" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    3-node = minimum HA cluster; tolerates 1 node failure
  </text>
  <text x="420" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    5-node = production recommended; separates infra and app nodes
  </text>
  <text x="420" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Kubernetes = ND runs K8s internally; apps are pods on the cluster
  </text>
  <text x="420" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Etcd = distributed KV for cluster state; used by ND Kubernetes
  </text>
  <text x="420" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data network = second NIC; device discovery + telemetry collection
  </text>
  <text x="420" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-site = ND instances linked across sites for global view
  </text>
  <text x="420" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    App store = Cisco app catalogue; install NDFC/NDI/NDO from UI
  </text>
  <text x="420" y="725" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NDC = Nexus Dashboard Cluster; Cisco hardware appliance option
  </text>

  <rect x="0" y="750" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="770" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Nexus Dashboard Architecture
  </text>
</svg>