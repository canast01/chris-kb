<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    DR Failover: VMware SRM with NetApp SnapMirror
  </text>
  
  <!-- Primary Site -->
  <rect x="10" y="50" width="390" height="500" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">PRIMARY SITE</text>
  
  <!-- vCenter Primary -->
  <rect x="30" y="100" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="6" />
  <text x="40" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vCenter</text>
  <text x="40" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Primary</text>
  
  <!-- SRM Primary -->
  <rect x="150" y="100" width="100" height="40" fill="#e8eaf6" stroke="#3949ab" stroke-width="1" rx="6" />
  <text x="160" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SRM</text>
  <text x="160" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Primary</text>
  
  <!-- ESXi Cluster (Prod) -->
  <rect x="30" y="180" width="340" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="6" />
  <text x="40" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi Cluster (Prod)</text>
  <rect x="50" y="220" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="60" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">VM1</text>
  <rect x="90" y="220" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="100" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">VM2</text>
  <rect x="130" y="220" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="140" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">VM3</text>
  
  <!-- ONTAP Primary Cluster -->
  <rect x="30" y="300" width="340" height="60" fill="#fff8e1" stroke="#f57f17" stroke-width="1" rx="6" />
  <text x="40" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ONTAP Primary Cluster</text>
  <text x="40" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">svm_prod / vol_prod_*</text>
  <text x="40" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(SnapMirror source)</text>
  
  <!-- Secondary (DR) Site -->
  <rect x="420" y="50" width="390" height="500" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SECONDARY (DR) SITE</text>
  
  <!-- vCenter DR -->
  <rect x="440" y="100" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="6" />
  <text x="450" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vCenter</text>
  <text x="450" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">DR</text>
  
  <!-- SRM DR -->
  <rect x="560" y="100" width="100" height="40" fill="#e8eaf6" stroke="#3949ab" stroke-width="1" rx="6" />
  <text x="570" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SRM</text>
  <text x="570" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">DR</text>
  
  <!-- ESXi Cluster (DR) -->
  <rect x="440" y="180" width="340" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="6" />
  <text x="450" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi Cluster (DR)</text>
  <rect x="460" y="220" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="470" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">VM1</text>
  <rect x="500" y="220" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="1" rx="6" />
  <text x="510" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">VM2</text>
  <text x="540" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(dark)</text>
  
  <!-- ONTAP DR Cluster -->
  <rect x="440" y="300" width="340" height="60" fill="#fff8e1" stroke="#f57f17" stroke-width="1" rx="6" />
  <text x="450" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ONTAP DR Cluster</text>
  <text x="450" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">svm_dr / vol_dr_*</text>
  <text x="450" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(SnapMirror dest, RO)</text>
  
  <!-- Connections -->
  <line x1="250" y1="120" x2="440" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="370" y1="330" x2="440" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Footer -->
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Storage/Runbooks/DR Failover
  </text>
</svg>