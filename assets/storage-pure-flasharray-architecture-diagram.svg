<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Pure FlashArray — All-NVMe Block Storage Architecture
  </text>
  
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    All-NVMe all-flash array for block workloads; Purity//FA OS; ActiveCluster for
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    active-active stretch; SafeMode immutable snapshots; Pure1 SaaS management.
  </text>
  
  <rect x="10" y="100" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Platform
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //X: NVMe enterprise block
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //C: QLC capacity block
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //XL: extreme enterprise
  </text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dual controller: active-active
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FC, iSCSI, NVMe-oF: host
  </text>
  
  <rect x="410" y="100" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Services
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshots: instant, space-eff
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Clones: writable snap copy
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Async replication: remote DR
  </text>
  <text x="420" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ActiveCluster: sync AA
  </text>
  <text x="420" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SafeMode: immutable snaps
  </text>
  
  <text x="10" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Inline dedup and compression are always on; no performance impact on NVMe.
  </text>
  
  <line x1="200" y1="260" x2="200" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="260" x2="620" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="290" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ActiveCluster (Sync Repl)
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Synchronous: 0 RPO, 0 RTO
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Both arrays serve host IO
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mediator: Pure cloud tiebreak
  </text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Max RTT: 10ms between sites
  </text>
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VMware vMSC: certified
  </text>
  
  <rect x="410" y="290" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1: SaaS portal
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Purity UI: per-array web
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: v2; automation
  </text>
  <text x="420" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerShell/Ansible modules
  </text>
  <text x="420" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1 AI: predictive alerts
  </text>
  
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="445" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FlashArray chassis (3U); dual controllers active-active internally; NVMe drive modules;
  </text>
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FC or 25GbE iSCSI or NVMe-oF to host; management on dedicated port.
  </text>
  
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FlashArray     = Pure all-NVMe block storage array; //X //C //XL variants
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Purity//FA     = FlashArray OS; manages dedup, compression, replication
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ActiveCluster  = Pure synchronous replication; active-active; 0 RPO and 0 RTO
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SafeMode       = immutable Snapshot; protected from deletion even by admin
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1          = SaaS management portal; all FlashArrays in one view
  </text>
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshot       = instant point-in-time copy; no performance impact
  </text>
  <text x="10" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Clone          = writable copy from Snapshot; dev/test use case
  </text>
  <text x="10" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Mediator       = Pure cloud service; tiebreaker for ActiveCluster failover
  </text>
  <text x="10" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NVMe-oF        = NVMe over Fabrics; FC-NVMe or iSER; lowest latency path
  </text>
  <text x="10" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //X series     = mainstream enterprise; NVMe with DirectFlash modules
  </text>
  <text x="10" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //C series     = capacity-optimized; QLC NAND; lower cost per GB
  </text>
  <text x="10" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vMSC           = vSphere Metro Storage Cluster; ActiveCluster is certified
  </text>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: FlashArray Architecture
  </text>
</svg>