<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    SQL Server — Enterprise RDBMS Architecture
  </text>
  
  <rect x="10" y="50" width="390" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Engine Architecture
  </text>
  <text x="205" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SQL Server Database Engine
  </text>
  <text x="205" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SQL Server Agent: jobs
  </text>
  <text x="205" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSRS: report server
  </text>
  <text x="205" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSAS: analysis services
  </text>
  <text x="205" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSIS: ETL integration
  </text>
  
  <rect x="420" y="50" width="390" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Memory Components
  </text>
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Buffer pool: data cache
  </text>
  <text x="615" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Plan cache: query plans
  </text>
  <text x="615" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Column store: in-memory
  </text>
  <text x="615" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    tempdb: work area
  </text>
  <text x="615" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Max server memory: required
  </text>
  
  <line x1="205" y1="190" x2="205" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="190" x2="615" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="240" width="390" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    HA: Always On AG
  </text>
  <text x="205" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Primary: reads + writes
  </text>
  <text x="205" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Secondaries: read replicas
  </text>
  <text x="205" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Listener: virtual IP/name
  </text>
  <text x="205" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Sync or async per secondary
  </text>
  <text x="205" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Auto-failover: sync only
  </text>
  
  <rect x="420" y="240" width="390" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    HA: Failover Cluster (FCI)
  </text>
  <text x="615" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Shared storage: SAN LUN
  </text>
  <text x="615" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WSFC: Windows cluster
  </text>
  <text x="615" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    One instance at a time
  </text>
  <text x="615" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AG+FCI: combine for best
  </text>
  <text x="615" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DTC: distributed tx
  </text>
  
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Windows Server VMs (min 4 vCPU, 16 GB RAM); local NVMe for tempdb; SAN LUN for
  </text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    user DBs (FCI) or local/SAN per replica (AG); WSFC quorum disk or cloud witness.
  </text>
  
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Always On AG   = Availability Group; HA/DR for user databases; most common SQL HA
  </text>
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FCI            = Failover Cluster Instance; WSFC + shared storage; HA for instance
  </text>
  <text x="410" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Listener       = virtual network name for AG; clients connect here
  </text>
  <text x="410" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Buffer pool    = SQL Server memory cache for data pages; largest memory consumer
  </text>
  <text x="410" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    tempdb         = system DB for temp tables, sort spills; shared across all sessions
  </text>
  <text x="410" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSMS           = SQL Server Management Studio; primary admin GUI
  </text>
  <text x="410" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SQL Agent      = job scheduler; runs maintenance plans, SSIS packages, backups
  </text>
  <text x="410" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WSFC           = Windows Server Failover Cluster; required for both AG and FCI
  </text>
  <text x="410" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Max server memory= set to leave 10-15% RAM for OS; prevents OOM
  </text>
  <text x="410" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Sync replica   = AG secondary in sync mode; 0 RPO; auto-failover eligible
  </text>
  <text x="410" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Async replica  = AG secondary with lag; lower network cost; manual failover only
  </text>
  <text x="410" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Quorum         = WSFC vote mechanism; need majority to operate; use cloud witness
  </text>
  
  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: SQL Server Architecture
  </text>
</svg>