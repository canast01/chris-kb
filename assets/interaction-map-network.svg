<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700">Network Domain — Interaction Map</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">NSX · vSphere Networking (vDS) · BGP/GENEVE · key protocols</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#e65100"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">NSX Manager</text>
  <rect x="30" y="126" width="230" height="22" fill="#fff3e0" rx="3" stroke="#e65100" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">NSX Manager Cluster</text>
  <rect x="30" y="152" width="230" height="22" fill="#fff3e0" rx="3" stroke="#e65100" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">NSX Controller Plane</text>
  <rect x="30" y="178" width="230" height="22" fill="#fff3e0" rx="3" stroke="#e65100" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">Policy API</text>
  <rect x="30" y="204" width="230" height="22" fill="#fff3e0" rx="3" stroke="#e65100" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">MP API (legacy)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">REST API: /policy/api/v1 (preferred)</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Transport zones: overlay + VLAN types</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">nsxcli on Edge: get routes, get bgp</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">GENEVE encap on ESXi VTEP VMkernel</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Edge VM: T0/T1 gateway, NAT, LB, VPN</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">NSX Edge</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#1565c0" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Edge Node (VM)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#1565c0" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">T0 Gateway (BGP)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#1565c0" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">T1 Gateway (tenant)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#1565c0" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Edge Cluster</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">BGP to physical ToR on uplink VLANs</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">BFD for fast failover detection</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">ECMP: 4-8 paths from T0 to ToR</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">VRF-Lite for tenant separation</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">NAT44/NAT64 on T0/T1 boundary</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">vSphere Networking</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#6a1b9a" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#6a1b9a" font-size="9" font-weight="700">vDistributed Switch (vDS)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#6a1b9a" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#6a1b9a" font-size="9" font-weight="700">Port Groups (VLAN)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#6a1b9a" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#6a1b9a" font-size="9" font-weight="700">VMkernel Adapters</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#6a1b9a" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#6a1b9a" font-size="9" font-weight="700">NIOC</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">vDS: managed by vCenter (dvs API)</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">LACP / active-active uplink teaming</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">TEP VMkernel: GENEVE overlay src IP</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Storage VMkernel: iSCSI / NFS traffic</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Management VMkernel: ESXi mgmt + vMotion</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Key Network Integrations</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Integration</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Protocol / API</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Direction</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Notes</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">NSX → ESXi</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">GENEVE / VIBs</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">NSX VIB installs on ESXi</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">TEP on VMkernel adapter</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">NSX → vCenter</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">NSX plugin / REST</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">vCenter UI shows NSX objects</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">NSX Manager registers with vCenter</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">T0 → Physical ToR</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">BGP / BFD</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">ECMP routing uplink</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">VLAN-backed uplink port group</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">NSX → Aria Networks</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Flow telemetry / API</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">vRNI reads IPFIX + API</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Aria Networks data source: NSX</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">vDS → ESXi</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">vSphere API (dvs)</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">vCenter pushes vDS config</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">vDS lives in vCenter; agents on ESXi</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">NSX DFW → VMs</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Kernel-level filter</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Stateful east-west firewall</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">No extra hop; rules on ESXi host</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">NSX runs inside ESXi kernel · Edge VMs route north-south · vDS provides physical uplinks</text>
</svg>