<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashArray Hardening Sequence</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">1. Change defaults</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">rename/vault pureuser, create named admins</text>
  </g>
  
  <g transform="translate(10, 100)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">2. Configure AD/LDAP</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">group-to-role mapping</text>
  </g>
  
  <g transform="translate(10, 150)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">3. Enable SAML SSO</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">MFA enforced at IdP level</text>
  </g>
  
  <g transform="translate(10, 200)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">4. Restrict mgmt network</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">dedicated VLAN, firewall ACL</text>
  </g>
  
  <g transform="translate(10, 250)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">5. Install CA-signed TLS cert</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">replace self-signed</text>
  </g>
  
  <g transform="translate(10, 300)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">6. Disable unused protocols</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">FC/iSCSI only what is needed</text>
  </g>
  
  <g transform="translate(10, 350)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">7. Configure SNMPv3</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">disable legacy SNMP versions</text>
  </g>
  
  <g transform="translate(10, 400)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">8. Enable SafeMode</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Pure Support required to destroy snaps</text>
  </g>
  
  <g transform="translate(10, 450)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">9. Verify encryption at rest</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">purearray list --encryption</text>
  </g>
  
  <g transform="translate(10, 500)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">10. Configure TLS syslog</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">forward audit log to SIEM</text>
  </g>
  
  <g transform="translate(10, 550)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">11. Set idle timeout</text>
    <line x1="200" y1="20" x2="300" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="310" y="20" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">purearray setattr --idle-timeout 15</text>
  </g>
  
  <rect x="0" y="590" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: FlashArray Hardening Sequence</text>
</svg>