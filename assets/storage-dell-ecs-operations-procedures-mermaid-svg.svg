<svg xmlns="http://www.w3.org/2000/svg" width="820" height="426" viewBox="0 0 820 426">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#455a64" /></marker></defs>
<rect x="0" y="0" width="820" height="30" fill="#1a2744" />
<text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Common Bucket Operations</text>
<rect x="192.3" y="50.0" width="171.4" height="54.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2" />
<text x="278.0" y="73.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">1. Create new key</text>
<text x="278.0" y="89.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">ecscli user secret-key create</text>
<rect x="393.7" y="50.0" width="234.0" height="54.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="510.7" y="73.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">ECS allows up to 2 active keys per user</text>
<text x="510.7" y="89.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">enabling zero-downtime rotation</text>
<rect x="336.5" y="144.0" width="147.0" height="54.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" />
<text x="410.0" y="167.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">2. Deploy new key</text>
<text x="410.0" y="183.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">to app / secrets manager</text>
<rect x="340.0" y="238.0" width="140.0" height="54.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2" />
<text x="410.0" y="261.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">3. Verify app is using</text>
<text x="410.0" y="277.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">new key (access logs)</text>
<rect x="325.5" y="332.0" width="169.0" height="54.0" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.2" />
<text x="410.0" y="355.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">4. Delete old key</text>
<text x="410.0" y="371.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">ecscli user secret-key delete</text>
<line x1="278.0" y1="104.0" x2="410.0" y2="144.0" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
<line x1="410.0" y1="198.0" x2="410.0" y2="238.0" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
<line x1="410.0" y1="292.0" x2="410.0" y2="332.0" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
<rect x="0" y="396.0" width="820" height="30" fill="#f5f7fa" />
<text x="10" y="416.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Common Bucket Operations</text>
</svg>