<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Site Recovery Manager — Capabilities Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Protection Groups · Recovery Plans · DR Operations</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Protection</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Groups · Mapping · Replication</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Protection Groups (VM sets)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Inventory Mapping (folders/pools)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Network Mapping (src → dst)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSphere Replication (RPO ≥ 5 min)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Array-Based Replication (ABR)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">PG: group related VMs together</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Inventory map: place VMs in dst VC</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Network map: re-IP or same VLAN</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">vSphere Rep: per-VM CBT replication</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">ABR: EMC SRDF / NetApp SnapMirror</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Placeholder VMs: reserved in dst</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Recovery Plans</text>
  <text x="410" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Steps · Priority · Scripts</text>
  <rect x="295" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Recovery Plan (ordered steps)</text>
  <rect x="295" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VM Priority (1–5 groups)</text>
  <rect x="295" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Pre/Post Power-On Scripts</text>
  <rect x="295" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">IP Customization (re-IP on DR)</text>
  <rect x="295" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Message Prompts (manual gates)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">Plan: click Run to failover VMs</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">Priority 1: first VMs powered on</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Scripts: call Aria / webhook</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">IP custom: static address remap</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Prompts: wait for confirmation</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">RTO: configurable per priority</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">DR Operations</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Test · Failover · Failback</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Test Recovery (non-disruptive)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Planned Migration (zero-RPO)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Emergency Failover (any RPO)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Re-Protection (reverse replication)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Failback (return to primary)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">Test: bubble network, no impact</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Planned: sync then power off src</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Emergency: last consistent point</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Re-protect: reverse repl direction</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Failback: reverse plan execution</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">History: all runs logged</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">SRM Recovery Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Operation</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Test Recovery</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Planned Migration</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Emergency Failover</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">Replication active?</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">Continues unchanged</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">Final sync then stop</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">Stop on failure</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">Source VMs affected?</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">✗ — no impact</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">✓ — powered off</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">✗ — already down</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">RPO</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">N/A (bubble only)</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">Near-zero (sync)</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">Last replicated point</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">RTO</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Per plan priority</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Per plan priority</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Per plan priority</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">Re-protect needed?</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">N/A</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">✓</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">✓</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Quarterly DR test</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Planned maintenance</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Actual disaster</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware SRM Reference · Protection Groups · Recovery Plans · vSphere Replication · Failback</text>
</svg>