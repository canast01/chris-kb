<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Python Automation — Escalation</text>

  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Internal: automation team investigates with debug logging and environment checks</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Check for recent package upgrades: git log, pip freeze diff</text>
  </g>

  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — If the issue is in the operating environment (SSL, network, OS):</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Infra team: OS SSL library update, certificate trust store, proxy config</text>
  </g>

  <line x1="410" y1="200" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 230)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If the issue is a CPython bug (segfault, memory corruption, incorrect stdlib behavior):</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ File a bug at bugs.python.org with a minimal reproduction script</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Temporary fix: pin to previous Python minor version</text>
  </g>

  <line x1="410" y1="310" x2="410" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 340)">
    <rect x="0" y="0" width="780" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If the issue is in a third-party library (requests, boto3, paramiko, etc.):</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ File a GitHub issue on the library's repository</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Community repos: github.com/psf/requests, github.com/boto/boto3, etc.</text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Include: Python version, library version, minimal reproduction script, expected vs actual</text>
  </g>

  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 470)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If a CVE is found in a production dependency:</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Pin the vulnerable package to a patched version immediately</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Rotate any secrets the vulnerable code could have accessed</text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engage the security team to assess the exposure window</text>
  </g>

  <line x1="410" y1="550" x2="410" y2="570" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 580)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — If the vendor library has a paid support contract (e.g., Red Hat Python, IBM):</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Open a case with the vendor support portal (support.redhat.com, etc.)</text>
  </g>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>