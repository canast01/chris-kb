<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Networking — Switching, Routing, Security &amp; Services
  </text>
  
  <rect x="10" y="40" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Networking KB: design references, configuration procedures, and troubleshooting guides
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Covers: VLANs, BGP/OSPF, firewall validation, DNS, load balancing, connectivity tests
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Foundation: segment by function, redundant paths, document every rule and change
  </text>

  <line x1="160" y1="110" x2="160" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="110" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="660" y1="110" x2="660" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="150" width="260" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="150" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Switching &amp; Routing
  </text>
  <text x="150" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VLANs / trunking
  </text>
  <text x="150" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    BGP / OSPF routing
  </text>
  <text x="150" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Subnetting / CIDR
  </text>
  <text x="150" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    STP / LACP
  </text>
  <text x="150" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    QoS marking
  </text>

  <rect x="280" y="150" width="260" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="410" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Security
  </text>
  <text x="410" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Firewall rules
  </text>
  <text x="410" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPN tunnels
  </text>
  <text x="410" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ACL validation
  </text>
  <text x="410" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NAT / PAT
  </text>
  <text x="410" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IDS/IPS rules
  </text>

  <rect x="540" y="150" width="260" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="670" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Services &amp; TS
  </text>
  <text x="670" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DNS resolution
  </text>
  <text x="670" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Load balancer
  </text>
  <text x="670" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Connectivity tests
  </text>
  <text x="670" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Packet capture
  </text>
  <text x="670" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Path tracing
  </text>

  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VLAN = Virtual LAN; logical broadcast domain; isolates traffic by function or tenant
  </text>
  <text x="20" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    BGP = Border Gateway Protocol; path-vector routing; used for WAN and DC fabric
  </text>
  <text x="20" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OSPF = Open Shortest Path First; link-state IGP; used within a campus or data centre
  </text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LACP = Link Aggregation; bonds NICs for bandwidth + redundancy; IEEE 802.3ad
  </text>
  <text x="20" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    STP = Spanning Tree Protocol; loop prevention; RSTP preferred; MSTP for VLANs
  </text>
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ECMP = Equal-Cost Multi-Path; load-balance across redundant L3 paths
  </text>
  <text x="20" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NAT = Network Address Translation; maps private IPs to public; hides topology
  </text>
  <text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    QoS = Quality of Service; priority marking to protect latency-sensitive traffic
  </text>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Networking Overview
  </text>
</svg>