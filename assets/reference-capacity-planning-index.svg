<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <!-- Navy header background -->
  <rect width="820" height="50" fill="#0f172a"/>
  <text x="410" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Capacity Planning Workflow</text>
  <!-- Main body background -->
  <rect y="50" width="820" height="150" fill="#f1f5f9"/>

  <!-- Box 1: Baseline -->
  <rect x="20" y="75" width="130" height="90" rx="6" fill="#1e3a5f" stroke="#334155" stroke-width="1.5"/>
  <text x="85" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">1. Baseline</text>
  <text x="85" y="118" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Measure CPU, RAM,</text>
  <text x="85" y="132" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">storage &amp; network</text>
  <text x="85" y="146" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">utilisation today</text>

  <!-- Arrow 1→2 -->
  <line x1="150" y1="120" x2="178" y2="120" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 2: Growth Model -->
  <rect x="180" y="75" width="130" height="90" rx="6" fill="#1e3a5f" stroke="#334155" stroke-width="1.5"/>
  <text x="245" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">2. Growth Model</text>
  <text x="245" y="118" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Project 12 / 36-month</text>
  <text x="245" y="132" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">demand; apply CAGR</text>
  <text x="245" y="146" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">or business forecast</text>

  <!-- Arrow 2→3 -->
  <line x1="310" y1="120" x2="338" y2="120" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 3: Headroom Calc -->
  <rect x="340" y="75" width="130" height="90" rx="6" fill="#1e3a5f" stroke="#334155" stroke-width="1.5"/>
  <text x="405" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">3. Headroom Calc</text>
  <text x="405" y="118" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Apply warning/critical</text>
  <text x="405" y="132" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">thresholds; add N+1</text>
  <text x="405" y="146" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">HA buffer overhead</text>

  <!-- Arrow 3→4 -->
  <line x1="470" y1="120" x2="498" y2="120" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 4: Model Scenarios -->
  <rect x="500" y="75" width="130" height="90" rx="6" fill="#1e3a5f" stroke="#334155" stroke-width="1.5"/>
  <text x="565" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">4. Model Scenarios</text>
  <text x="565" y="118" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Best / base / worst</text>
  <text x="565" y="132" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">case; stress-test peak</text>
  <text x="565" y="146" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">load assumptions</text>

  <!-- Arrow 4→5 -->
  <line x1="630" y1="120" x2="658" y2="120" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 5: Right-sized -->
  <rect x="660" y="75" width="140" height="90" rx="6" fill="#14532d" stroke="#166534" stroke-width="1.5"/>
  <text x="730" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bbf7d0" text-anchor="middle">5. &#10003; Right-sized</text>
  <text x="730" y="118" font-family="sans-serif" font-size="10" fill="#86efac" text-anchor="middle">Validated bill of</text>
  <text x="730" y="132" font-family="sans-serif" font-size="10" fill="#86efac" text-anchor="middle">materials; procurement</text>
  <text x="730" y="146" font-family="sans-serif" font-size="10" fill="#86efac" text-anchor="middle">order ready to sign</text>
</svg>