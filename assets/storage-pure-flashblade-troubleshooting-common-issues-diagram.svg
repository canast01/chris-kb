<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashBlade Triage Flow</text>
  
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Symptom</text>
    
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="780" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NFS/SMB issue</text>
      
      <g transform="translate(20, 20)">
        <line x1="0" y1="10" x2="200" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="15" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Stale file handle ──► unmount/remount clients</text>
        
        <line x1="0" y1="30" x2="200" y2="30" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Mount hang ──► check VIP: purefb network iface list; ping VIP</text>
        
        <line x1="0" y1="50" x2="200" y2="50" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">SMB access fail ──► rejoin AD; update bind creds</text>
      </g>
    </g>
    
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="780" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Performance issue</text>
      
      <g transform="translate(20, 20)">
        <line x1="0" y1="10" x2="200" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="15" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">NFS high latency ──► enable pNFS (NFSv4.1) clients: nfsvers=4.1 proto=tcp</text>
      </g>
    </g>
    
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="780" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Capacity issue</text>
      
      <g transform="translate(20, 20)">
        <line x1="0" y1="10" x2="200" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="15" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Filesystem near limit ──► purefb filesystem update --provisioned &lt;new_size&gt;</text>
      </g>
    </g>
    
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="780" height="90" rx="6" fill="#fce4ec" stroke="#c62828" />
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Blade issues</text>
      
      <g transform="translate(20, 20)">
        <line x1="0" y1="10" x2="200" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="15" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Blade failed/missing ──► purefb blade list</text>
        <text x="210" y="30" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Open Pure Support case immediately</text>
        
        <line x1="0" y1="50" x2="200" y2="50" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
        <text x="210" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Blade rebalancing ──► normal after blade add monitor; alert if stuck &gt;24h</text>
      </g>
    </g>
    
    <g transform="translate(20, 380)">
      <line x1="0" y1="10" x2="200" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <text x="210" y="15" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">S3 403 Forbidden ──► purefb objectstoreuser list regenerate access key</text>
    </g>
  </g>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: FlashBlade Triage Flow</text>
</svg>