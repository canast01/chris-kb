<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Cisco DCNM / NDFC — Architecture Overview</text>

  <!-- Column 1 header: Deployment Models (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DEPLOYMENT MODELS</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">DCNM 11.x — Standalone</text>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">single server — no HA</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">DCNM 11.x — Native HA</text>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">active + standby, VIP, external DB</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">DCNM 11.x — Federation</text>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">multiple instances, single login (11.5+)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">NDFC 12.x (on Nexus Dashboard)</text>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">successor to DCNM from v12.0 (2022)</text>

  <rect x="20" y="286" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">MANAGEMENT TOPOLOGY</text>

  <rect x="20" y="332" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">DCNM Active (VIP)</text>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">admin access via HTTPS :443</text>

  <rect x="20" y="372" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">DCNM Standby</text>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">sync'd via HA link, auto-promotes</text>

  <rect x="20" y="412" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">SSH + SNMP v3 to MDS switches</text>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">SNMP traps and syslog from switches</text>

  <!-- Column 2 header: SAN Management Functions (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SAN MANAGEMENT FUNCTIONS</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Fabric Discovery</text>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">auto-discover MDS topology</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Zone Management</text>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">create, edit, activate VSANs/zones</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Performance Monitoring</text>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">IOPS, throughput, latency per port</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Event and Alarm Management</text>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">SNMP traps, syslog, email alerts</text>

  <rect x="287" y="286" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">NDFC ENHANCEMENTS</text>

  <rect x="287" y="332" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="348" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Runs on Nexus Dashboard cluster</text>
  <text x="412" y="348" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">(3-node or 5-node)</text>

  <rect x="287" y="372" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">SAN + LAN fabric management</text>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">unified controller for both domains</text>

  <rect x="287" y="412" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">POAP (Power-On Auto Provisioning)</text>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">zero-touch switch bring-up</text>

  <!-- Column 3 header: Integrations (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">INTEGRATIONS</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Cisco MDS 9000 switches</text>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">primary managed devices</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">LDAP / Active Directory</text>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">RBAC authentication</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">SIEM / Syslog Forwarding</text>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">security and audit events</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">REST API</text>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">automation and orchestration hooks</text>

  <rect x="553" y="286" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">TELEMETRY &amp; ANALYTICS</text>

  <rect x="553" y="332" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Network Insights (NDFC)</text>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">streaming telemetry analytics</text>

  <rect x="553" y="372" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Switch Image Management</text>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">ISSU via DCNM/NDFC scheduler</text>

  <rect x="553" y="412" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Configuration Compliance</text>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">drift detection and remediation</text>

  <!-- Comparison table -->
  <rect x="20" y="462" width="783" height="30" fill="#1e293b"/>
  <text x="130" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Model</text>
  <text x="340" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Description</text>
  <text x="610" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">HA</text>

  <rect x="20" y="492" width="783" height="26" fill="#f1f5f9"/>
  <text x="130" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Standalone</text>
  <text x="340" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Single DCNM server</text>
  <text x="610" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">None</text>

  <rect x="20" y="518" width="783" height="26" fill="#ffffff"/>
  <text x="130" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Native HA</text>
  <text x="340" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Active + standby, shared external DB, VIP</text>
  <text x="610" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Yes</text>

  <rect x="20" y="544" width="783" height="26" fill="#f1f5f9"/>
  <text x="130" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Federation</text>
  <text x="340" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Multiple instances, single login (11.5+)</text>
  <text x="610" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Per instance</text>

  <!-- Key notes -->
  <rect x="20" y="582" width="783" height="26" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="410" y="599" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">DCNM 11.x is the last standalone version — from v12.0 it is renamed NDFC and hosted on Nexus Dashboard</text>

  <rect x="20" y="614" width="783" height="26" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="631" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Native HA uses a VIP — both nodes share an external database; standby auto-promotes on active failure</text>

  <rect x="20" y="646" width="783" height="26" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="410" y="663" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">NDFC on Nexus Dashboard supports both SAN and LAN — single platform for MDS and Nexus fabric management</text>

  <rect x="20" y="678" width="783" height="26" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="410" y="695" font-family="Arial,sans-serif" font-size="11" fill="#713f12" text-anchor="middle">POAP (Power-On Auto Provisioning) enables zero-touch deployment of new MDS switches via NDFC</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
