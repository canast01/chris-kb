  <line x1="110" y1="240" x2="110" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="60" y="270" width="200" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="70" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
