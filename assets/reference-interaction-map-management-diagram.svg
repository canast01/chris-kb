  </text>
  
  <rect x="20" y="50" width="180" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
