<svg xmlns="http://www.w3.org/2000/svg" width="820" height="403" viewBox="0 0 820 403">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Certificates — Backup &amp; Restore
  </text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="300" fill="#ffffff" />
    
    <rect x="10" y="10" width="200" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="20" y="30" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      /etc/ssl/CA/
    </text>
    
    <rect x="30" y="50" width="180" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="40" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ca.key
    </text>
    <text x="40" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      CA private key — MUST be encrypted
    </text>
    
    <rect x="30" y="100" width="180" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="40" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ca.crt
    </text>
    <text x="40" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      CA certificate (self-signed)
    </text>
    
    <rect x="30" y="150" width="180" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="40" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ca.csr
    </text>
    <text x="40" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Original signing request (keep for reference)
    </text>
    
    <rect x="30" y="200" width="180" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="40" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      index.txt
    </text>
    <text x="40" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Certificate database
    </text>
    
    <rect x="30" y="250" width="180" height="20" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="40" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      index.txt.attr
    </text>
    
    <rect x="30" y="280" width="180" height="20" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="40" y="295" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      serial
    </text>
    <text x="40" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Current serial number
    </text>
    
    <rect x="30" y="320" width="180" height="20" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="40" y="335" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      crlnumber
    </text>
    <text x="40" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      CRL serial counter
    </text>
    
    <rect x="250" y="50" width="180" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="260" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      crl/
    </text>
    
    <rect x="270" y="90" width="160" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="280" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      ca.crl
    </text>
    <text x="280" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Current CRL
    </text>
    
    <rect x="250" y="150" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="260" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      certs/
    </text>
    <text x="260" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Issued certificates archive
    </text>
    
    <rect x="250" y="200" width="180" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="260" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      newcerts/
    </text>
    <text x="260" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Copies of all issued certs (by serial)
    </text>
  </g>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: File Structure
  </text>
</svg>