<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Monitoring — Observability Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">CloudWatch · CloudTrail · EventBridge · AWS Health</text>

  <!-- ═ COLUMN 1: Metrics & Dashboards ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Metrics &amp; Alarms</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">CloudWatch · Dashboards · Alarms</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CloudWatch Metrics</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Custom Metrics (put-metric-data)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CloudWatch Alarms</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CloudWatch Dashboards</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Composite Alarms</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CloudWatch Agent (OS metrics)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Default metrics: CPU, network, disk I/O</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">CW Agent: memory, disk used (custom)</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Alarm states: OK, ALARM, INSUFFICIENT</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Actions: SNS, EC2, Auto Scaling</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Composite: AND/OR logic on alarms</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Metric math for calculated metrics</text>

  <!-- ═ COLUMN 2: Logs & Audit ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Logs &amp; Audit Trail</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">CloudWatch Logs · CloudTrail</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">CloudWatch Log Groups</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Log Retention Policies</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Metric Filters (logs → metrics)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">CloudTrail (API audit log)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">CloudTrail Lake (query logs)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Logs Insights (query language)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Log Groups → Streams → Events</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Retention: 1 day to 10 years</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">CloudTrail: who, what, when, from where</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Trail: org-level covers all accounts</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Logs Insights: fields, filter, stats, sort</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Export to S3 for long-term archive</text>

  <!-- ═ COLUMN 3: Events & Health ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Events &amp; Health</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">EventBridge · AWS Health · SNS</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">EventBridge Rules</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">EventBridge Schedules (cron)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">EventBridge Pipes</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">AWS Health Dashboard</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Health Event Notifications (SNS)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SNS (fan-out notifications)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">EventBridge: event pattern matching</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Targets: Lambda, SQS, Step Functions</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Schedules: rate(1 day) or cron expression</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">AWS Health: planned + incident events</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Health org view: all accounts in AWS Org</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">SNS: email, SMS, Lambda, SQS targets</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">CloudWatch vs CloudTrail vs EventBridge</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">CloudWatch</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">CloudTrail</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">EventBridge</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Primary function</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Metrics, logs, alarms</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">API call audit log</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Event routing / automation</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Data type</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Metrics + log streams</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">JSON API events</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">JSON event payloads</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Real-time alerting</text>
  <text x="340" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Security audit use</text>
  <text x="340" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Access log patterns</text>
  <text x="540" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Retention default</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Never (configurable)</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">90 days (events), 7 yr (Lake)</text>
  <text x="720" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Automation trigger</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Alarm action</text>
  <text x="540" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Monitoring Reference · CloudWatch · CloudTrail · EventBridge · AWS Health · SNS · Logs Insights</text>
</svg>
