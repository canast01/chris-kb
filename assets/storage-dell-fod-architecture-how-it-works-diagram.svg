<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Flex on Demand — How It Works
  </text>
  <rect x="20" y="50" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Total Installed Capacity (physically installed)
  </text>
  <line x1="60" y1="110" x2="60" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="40" y="140" width="300" height="75" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="50" y="165" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Committed Baseline (licensed, always billed)
  </text>
  <line x1="90" y1="200" x2="90" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="100" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Available for immediate use
  </text>
  <line x1="60" y1="110" x2="200" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="180" y="140" width="400" height="90" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="190" y="165" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Burst Range (base → burst ceiling)
  </text>
  <line x1="230" y1="180" x2="230" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="240" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Metered monthly at per-TiB rate
  </text>
  <text x="240" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Billed on peak-hour consumption during billing month
  </text>
  <rect x="0" y="270" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Architecture Overview
  </text>
</svg>