<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    FlashArray Authentication Flow
  </text>
  
  <!-- Human admin login -->
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Human admin login:
  </text>
  <rect x="30" y="70" width="140" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="40" y="95" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Browser/SSH
  </text>
  <line x1="170" y1="90" x2="220" y2="90" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="230" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SAML SSO configured?
  </text>
  <text x="230" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Yes
  </text>
  <line x1="270" y1="105" x2="270" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="230" y="140" width="140" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="240" y="165" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IdP (Okta/Azure AD)
  </text>
  <line x1="370" y1="160" x2="420" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="430" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MFA
  </text>
  <line x1="270" y1="140" x2="320" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="330" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SAML assertion
  </text>
  <line x1="370" y1="140" x2="370" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="230" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    No
  </text>
  <line x1="270" y1="120" x2="320" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="320" y="110" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="330" y="135" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AD/LDAP bind
  </text>
  <line x1="460" y1="130" x2="510" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="520" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    group membership
  </text>
  <line x1="460" y1="140" x2="460" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="320" y="168" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    (fallback) local account (pureuser)
  </text>
  
  <!-- Automation login -->
  <text x="10" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Automation login:
  </text>
  <rect x="30" y="240" width="140" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="40" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Script
  </text>
  <line x1="170" y1="260" x2="220" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="230" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    x-auth-token: &lt;api_token&gt;
  </text>
  <line x1="370" y1="260" x2="370" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Purity RBAC -->
  <rect x="320" y="200" width="140" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="330" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Purity RBAC
  </text>
  <line x1="460" y1="220" x2="510" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="520" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    role assigned
  </text>
  <line x1="460" y1="240" x2="460" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="470" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    all actions logged (pureaudit)
  </text>
  <line x1="460" y1="280" x2="510" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="520" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SIEM via TLS syslog
  </text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Authentication Flow
  </text>
</svg>