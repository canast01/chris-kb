<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Aria Operations — Architecture Overview</text>

  <!-- Column 1: Analytics Cluster (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Analytics Cluster</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Primary Node</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(analytics engine + UI)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Replica Node (HA)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Data Nodes (2–4+)</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(enterprise scale)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Metrics Store (Cassandra)</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Alert Engine / Compliance</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Dashboards &amp; Reports UI</text>

  <!-- Column 2: Collection Layer (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Collection Layer</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Remote Collector</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(per-site telemetry proxy)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">vCenter Adapter</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">NSX Adapter</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">vSAN Adapter</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="290" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Third-party Management Packs</text>
  <text x="412" y="302" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(NetApp, Dell, Cisco, etc.)</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">SNMP / REST / WMI sources</text>

  <!-- Column 3: Alerting & Integration (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Alerting &amp; Integration</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="130" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Alert Definitions</text>
  <text x="678" y="142" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(symptom + recommendation)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Email / SNMP Trap Notifications</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">ServiceNow Outbound REST</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(incident auto-creation)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Aria Automation Integration</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Log Insight Integration</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Capacity / Workload Optimization</text>

  <!-- Deployment sizing table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="145" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Deployment Size</text>
  <text x="380" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Nodes</text>
  <text x="640" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Use Case</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Small (xSmall)</text>
  <text x="380" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">1 node</text>
  <text x="640" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Lab / proof-of-concept</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Medium</text>
  <text x="380" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Primary + Replica</text>
  <text x="640" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Up to ~3,000 VMs</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Large</text>
  <text x="380" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Primary + Replica + 2–4 Data Nodes</text>
  <text x="640" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Up to ~10,000 VMs</text>

  <rect x="20" y="498" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Extra Large</text>
  <text x="380" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Primary + Replica + 4+ Data Nodes</text>
  <text x="640" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Enterprise fleet</text>

  <!-- Key capabilities -->
  <rect x="20" y="572" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="592" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Key Capabilities</text>

  <rect x="20" y="602" width="250" height="26" fill="#f1f5f9"/>
  <text x="145" y="619" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">VM / host capacity analytics</text>
  <rect x="287" y="602" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="619" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Workload placement optimization</text>
  <rect x="553" y="602" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="619" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Compliance policies &amp; reporting</text>

  <rect x="20" y="628" width="250" height="26" fill="#ffffff"/>
  <text x="145" y="645" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Custom dashboards &amp; views</text>
  <rect x="287" y="628" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="645" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Troubleshooting root-cause analysis</text>
  <rect x="553" y="628" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="645" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">What-if scenario modeling</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
