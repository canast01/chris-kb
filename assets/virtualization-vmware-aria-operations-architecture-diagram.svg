<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Aria Operations Architecture — Analytics Cluster
  </text>
  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Analytics cluster for vSphere performance, capacity, and compliance; adapters
  </text>
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    collect metrics from vCenter/NSX/storage; remote collectors extend reach.
  </text>
  <rect x="20" y="130" width="370" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cluster Architecture
  </text>
  <text x="30" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Primary + replica nodes
  </text>
  <text x="30" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data nodes: metric storage
  </text>
  <text x="30" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Witness node: HA quorum
  </text>
  <text x="30" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HBase: time-series storage
  </text>
  <text x="30" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cassandra: config + metadata
  </text>
  <rect x="410" y="130" width="370" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="420" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Collection
  </text>
  <text x="420" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vCenter adapter: 5 min poll
  </text>
  <text x="420" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NSX adapter: topology + perf
  </text>
  <text x="420" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Storage adapters: array metrics
  </text>
  <text x="420" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Remote collector: DMZ/WAN reach
  </text>
  <text x="420" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SDDC Health: self-monitoring
  </text>
  <line x1="205" y1="270" x2="205" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="270" x2="615" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="20" y="310" width="370" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Analytics and Alerting
  </text>
  <text x="30" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workload Optimization: DRS+
  </text>
  <text x="30" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    What-if: cluster sizing model
  </text>
  <text x="30" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Alert: symptom + recommendation
  </text>
  <text x="30" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Custom dashboard: widgets
  </text>
  <text x="30" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Reports: scheduled PDF/CSV
  </text>
  <rect x="410" y="310" width="370" height="130" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Capacity and Compliance
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity: runway forecast
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Reclaim: idle VM detection
  </text>
  <text x="420" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Compliance: benchmark packs
  </text>
  <text x="420" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pricing: cost per VM model
  </text>
  <text x="420" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Predictive DRS: sends forecast
  </text>
  <rect x="10" y="460" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="495" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Linux VMs (Photon OS) for each node; shared NFS for backups; cluster needs
  </text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    connectivity to all vCenter instances and adapters on TCP 443.
  </text>
  <rect x="10" y="530" width="800" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="550" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Primary node    = master node; UI + API + orchestration
  </text>
  <text x="20" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data node       = stores time-series metrics in HBase
  </text>
  <text x="20" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Remote collector= separate VM; collects from isolated networks
  </text>
  <text x="20" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Adapter         = plugin connecting Aria Ops to a data source
  </text>
  <text x="20" y="625" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HBase           = distributed time-series store; metric retention
  </text>
  <text x="20" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cassandra       = config and relationship metadata store
  </text>
  <text x="20" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Symptom         = threshold crossing or anomaly on a metric
  </text>
  <text x="20" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Alert           = grouped symptoms with recommendation and action
  </text>
  <text x="420" y="565" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workload Opt    = automated vMotion recommendations via DRS integration
  </text>
  <text x="420" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity runway = days until resource exhaustion at current growth rate
  </text>
  <text x="420" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Predictive DRS  = sends 60-min demand forecast to vCenter DRS
  </text>
  <text x="420" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Compliance pack = benchmark rules; CIS, vSphere Security Hardening Guide
  </text>
  <rect x="0" y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Aria Operations Architecture
  </text>
</svg>