<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Nutanix — Learning Path</text>

  <rect x="10" y="50" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Key CLIs:</text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">ncli cluster info</text>
  <line x1="150" y1="87" x2="200" y2="87" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">cluster status</text>

  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">allssh "genesis status"</text>
  <line x1="150" y1="107" x2="200" y2="107" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">service health across all CVMs</text>

  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">ncc --health_checks run_all</text>
  <line x1="150" y1="127" x2="200" y2="127" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">full automated health check</text>

  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">acli vm.list</text>
  <line x1="150" y1="147" x2="200" y2="147" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">list all VMs</text>

  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">ncli alert list severity=critical</text>
  <line x1="150" y1="167" x2="200" y2="167" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">active critical alerts</text>

  <rect x="410" y="50" width="380" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Key directories (CVM):</text>
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/home/nutanix/data/logs/</text>
  <line x1="570" y1="87" x2="620" y2="87" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="630" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">all service logs</text>

  <text x="420" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/home/nutanix/data/logbay/</text>
  <line x1="570" y1="107" x2="620" y2="107" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="630" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">support bundles</text>

  <rect x="10" y="210" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Key ports:</text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">9440</text>
  <line x1="60" y1="247" x2="110" y2="247" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="120" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Prism Element HTTPS</text>

  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">9443</text>
  <line x1="60" y1="267" x2="110" y2="267" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="120" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Prism Central HTTPS</text>

  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">2009</text>
  <line x1="60" y1="287" x2="110" y2="287" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="120" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">CVM to CVM (cluster traffic + replication)</text>

  <rect x="0" y="360" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Nutanix Learning Path Overview</text>
</svg>