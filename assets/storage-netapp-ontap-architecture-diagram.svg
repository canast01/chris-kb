<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    NetApp ONTAP — Unified Storage OS Architecture
  </text>
  <rect x="10" y="50" width="390" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Architecture
  </text>
  <text x="205" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HA pair: two nodes active-active
  </text>
  <text x="205" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cluster: 2-24 nodes
  </text>
  <text x="205" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SVM: storage virtual machine
  </text>
  <text x="205" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Aggregate: RAID group of disks
  </text>
  <text x="205" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Volume: logical data container
  </text>
  <rect x="420" y="50" width="390" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Protocols
  </text>
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NFS v3/v4.1: file
  </text>
  <text x="615" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMB/CIFS: Windows file
  </text>
  <text x="615" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC: block SAN (FCP)
  </text>
  <text x="615" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    iSCSI: block over IP
  </text>
  <text x="615" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NVMe-oF: FC or RDMA
  </text>
  <line x1="205" y1="190" x2="205" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="190" x2="615" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="230" width="390" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Data Services
  </text>
  <text x="205" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Snapshot: instant, no-cost copy
  </text>
  <text x="205" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapMirror: async replication
  </text>
  <text x="205" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapVault: backup-to-disk
  </text>
  <text x="205" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMBC: sync active-active
  </text>
  <text x="205" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FabricPool: cloud tiering
  </text>
  <rect x="420" y="230" width="390" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management
  </text>
  <text x="615" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    System Manager: web UI
  </text>
  <text x="615" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ONTAP CLI: SSH session
  </text>
  <text x="615" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API: 9.6+
  </text>
  <text x="615" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ZAPI: legacy automation
  </text>
  <text x="615" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ActiveIQ: cloud health
  </text>
  <rect x="10" y="380" width="800" height="140" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AFF (all-flash) or FAS (hybrid) HA pair in rack; cluster interconnect (100GbE);
  </text>
  <text x="410" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC or Ethernet host connectivity; dedicated e0M management port per node.
  </text>
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ONTAP = NetApp unified storage OS; runs on AFF and FAS hardware
  </text>
  <text x="410" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SVM = Storage Virtual Machine; multi-tenant partition; own protocols
  </text>
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HA pair = two ONTAP nodes in active-active cluster; failover in seconds
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Aggregate = physical RAID group; contains one or more volumes
  </text>
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Volume = logical data container; flexible size; thin or thick
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LIF = Logical Interface; floating IP that moves on failover
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Snapshot = space-efficient point-in-time copy; no IO impact
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapMirror = async replication between ONTAP systems; DR foundation
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapVault = vault-mode SnapMirror; retains long-term backup snapshots
  </text>
  <text x="410" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMBC = SnapMirror Business Continuity; synchronous active-active
  </text>
  <text x="410" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FabricPool = auto-tier cold data to S3 object store (AWS, GCP, Azure, ECS)
  </text>
  <text x="410" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RAID-DP = ONTAP RAID level; double parity; default for FAS
  </text>
  <rect y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: ONTAP Architecture Overview
  </text>
</svg>