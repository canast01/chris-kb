<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Flex on Demand — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SUPPORTED PLATFORMS</text>

  <!-- Column 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerMax (Enterprise NVMe)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerStore (Mid-Range NVMe)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerScale (Scale-Out NAS)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="250" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Additional Capacity Pre-Installed</text>
  <text x="145" y="262" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">at Factory</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">No CapEx — Metered Monthly</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">TELEMETRY PIPELINE</text>

  <!-- Column 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Array Telemetry (Hourly Metrics)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Secure Connect Gateway (SCG)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Outbound HTTPS 443</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Dell CloudIQ (Metering Engine)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">APEX Console (Monthly Billing)</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CONSUMPTION TIERS</text>

  <!-- Column 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Committed Baseline (Fixed Bill)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="170" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Burst Range</text>
  <text x="678" y="182" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(Per-TiB Rate Above Baseline)</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Burst Ceiling</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(Max — Over-Usage Charges Apply)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Peak-Hour Metering (Monthly)</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Admin Portal Visibility</text>

  <!-- Flow arrows -->
  <line x1="270" y1="200" x2="287" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="537" y1="200" x2="553" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="183" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">COMMITTED BASELINE</text>
  <text x="411" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">BURST RANGE</text>
  <text x="639" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">BURST CEILING</text>

  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="183" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Licensed outright</text>
  <text x="411" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Pre-installed; metered monthly</text>
  <text x="639" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Maximum metered capacity</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="183" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Always billed; immediately usable</text>
  <text x="411" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Per-TiB rate above baseline</text>
  <text x="639" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Over-ceiling: over-usage charges</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="183" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Fixed monthly cost</text>
  <text x="411" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Peak-hour metering basis</text>
  <text x="639" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Configurable alert thresholds</text>

  <line x1="346" y1="510" x2="346" y2="618" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="573" y1="510" x2="573" y2="618" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
