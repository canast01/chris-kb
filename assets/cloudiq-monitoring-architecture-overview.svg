<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Dell CloudIQ — Architecture Overview</text>

  <!-- Column 1: On-Premises Components (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">On-Premises Layer</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Secure Connect Gateway (SCG)</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">OVA virtual appliance</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PowerMax / VMAX</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">enterprise block storage</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PowerStore / Unity XT</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">midrange block/file storage</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="250" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PowerScale (Isilon)</text>
  <text x="145" y="262" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">scale-out NAS</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerFlex / VxRail</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">HTTPS outbound (443) only</text>

  <!-- Column 2: CloudIQ SaaS Platform (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CloudIQ SaaS Platform</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">CloudIQ Cloud (Dell-hosted)</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">fleet analytics &amp; management</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Health Score Engine</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">ML-based 0–100 scoring</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Capacity Forecasting (AI)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Proactive Recommendations</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Performance Trending</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">CloudIQ REST API</text>

  <!-- Column 3: Alerting & Integrations (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Alerting &amp; Integration</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Email Alert Notifications</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">ServiceNow Integration</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Slack / Teams Webhooks</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SIEM Integration</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Support Case Auto-Creation</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Web Portal (cloudiq.dell.com)</text>

  <!-- Component table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="200" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="500" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Role</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CloudIQ Cloud</text>
  <text x="500" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">SaaS platform hosted by Dell — health scores, capacity forecasts, AI recommendations</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="200" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Secure Connect Gateway (SCG)</text>
  <text x="500" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">On-premises OVA; collects telemetry and relays to CloudIQ over HTTPS</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CloudIQ REST API</text>
  <text x="500" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Programmatic access to fleet data, alerts, and capacity metrics</text>

  <!-- Key facts -->
  <rect x="20" y="520" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="540" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Architecture Highlights</text>

  <rect x="20" y="550" width="250" height="40" fill="#f1f5f9"/>
  <text x="145" y="564" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">No inbound firewall rules required</text>
  <text x="145" y="580" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">SCG uses outbound HTTPS 443 only</text>

  <rect x="287" y="550" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="564" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">ML health score: 0–100</text>
  <text x="412" y="580" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">per device, updated continuously</text>

  <rect x="553" y="550" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="564" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Multi-array fleet visibility</text>
  <text x="678" y="580" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">single pane of glass for Dell storage</text>

  <rect x="20" y="602" width="250" height="40" fill="#ffffff"/>
  <text x="145" y="616" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Telemetry collection interval</text>
  <text x="145" y="632" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">every 5 minutes (near-real-time)</text>

  <rect x="287" y="602" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="616" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Data residency</text>
  <text x="412" y="632" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Dell cloud (US region, GDPR compliant)</text>

  <rect x="553" y="602" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="616" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">License model</text>
  <text x="678" y="632" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">included with Dell support contract</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
