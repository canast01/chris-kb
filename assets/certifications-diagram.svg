<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Certifications — Study Hub
  </text>
  
  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Study notes and practice materials for SAN and storage vendor certification tracks
  </text>
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Covers: Fibre Channel fabric concepts, zoning theory, storage product-specific exam prep
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Materials: exam tracking, practice notes, weak-area analysis, and time-boxed review plans
  </text>
  
  <rect x="10" y="130" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SAN certifications
  </text>
  <text x="20" y="165" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Focus: Fibre Channel fabric fundamentals, zoning, ISL design, port types, and fabric services
  </text>
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Includes: concept deep-dives, practice exam questions, and vendor-specific study notes
  </text>
  
  <rect x="10" y="230" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Storage certifications
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Focus: storage vendor tracks (Dell, Pure, NetApp); product architecture and operations
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Includes: weak-area trackers, review plans, and practice notes per vendor product line
  </text>
  
  <rect x="10" y="330" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Study approach
  </text>
  <text x="20" y="365" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Review plan: time-boxed weekly study blocks with topic coverage targets
  </text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Weak-area analysis: track topics where practice exam scores are below threshold
  </text>
  <text x="20" y="395" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Exam tracking: record scheduled date, score targets, and pass/fail result per attempt
  </text>
  
  <rect x="10" y="430" width="800" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="465" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FC fabric    = Fibre Channel switched network; switches connect hosts and storage via N_Ports
  </text>
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    VSAN         = Virtual SAN; logical fabric partition within an MDS switch
  </text>
  <text x="20" y="495" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Zoning       = access control mechanism; determines which initiators can see which targets
  </text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Weak-area    = topic where practice exam performance is below target; prioritised for re-study
  </text>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Certifications Overview
  </text>
</svg>