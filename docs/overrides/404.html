{% extends "main.html" %}

{% block content %}
<div style="text-align:center;padding:4rem 2rem;max-width:480px;margin:0 auto;">
  <div style="font-size:5rem;font-weight:800;background:linear-gradient(135deg,#f1f5f9 40%,#7dd3fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem;">404</div>
  <p style="font-size:1.15rem;color:var(--md-typeset-color);margin-bottom:0.5rem;font-weight:600;">Page not found</p>
  <p style="color:var(--md-default-fg-color--light);margin-bottom:2rem;line-height:1.65;">More to come — I'm still in the process of learning it.</p>
  <a href="{{ '/' | url }}" style="display:inline-block;padding:0.55rem 1.4rem;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.35);border-radius:100px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:0.9rem;margin-right:0.75rem;">← Home</a>
  <a href="{{ '/site-map/' | url }}" style="display:inline-block;padding:0.55rem 1.4rem;background:transparent;border:1px solid rgba(148,163,184,0.3);border-radius:100px;color:var(--md-typeset-color);text-decoration:none;font-weight:600;font-size:0.9rem;">Site Map</a>
</div>
{% endblock %}
