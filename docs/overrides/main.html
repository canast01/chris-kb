{% extends "base.html" %}

{% block content %}
  {% if page.previous_page or page.next_page %}
  <nav class="kb-topnav">
    {% if page.previous_page %}
    <a href="{{ page.previous_page.url | url }}" class="kb-topnav__link kb-topnav__link--prev">
      <span class="kb-topnav__arrow">&#8592;</span>
      <span class="kb-topnav__title">{{ page.previous_page.title }}</span>
    </a>
    {% else %}
    <span></span>
    {% endif %}
    {% if page.next_page %}
    <a href="{{ page.next_page.url | url }}" class="kb-topnav__link kb-topnav__link--next">
      <span class="kb-topnav__title">{{ page.next_page.title }}</span>
      <span class="kb-topnav__arrow">&#8594;</span>
    </a>
    {% endif %}
  </nav>
  {% endif %}
  {{ super() }}
{% endblock %}
