  </text>
  <rect x="320" y="70" width="300" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="330" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
