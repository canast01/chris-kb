<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">ITSM &amp; Collaboration Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Confluence · Jira · Git · ServiceNow</text>

  <!-- COLUMN 1: Confluence -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="113" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Confluence</text>
  <text x="113" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Spaces · Pages · Templates · Macros</text>
  <rect x="28" y="126" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Spaces (team / project areas)</text>
  <rect x="28" y="152" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Pages (wiki documents)</text>
  <rect x="28" y="178" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Templates (standardised layouts)</text>
  <rect x="28" y="204" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Macros (dynamic content)</text>
  <rect x="28" y="230" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Jira integration (linked tickets)</text>
  <text x="113" y="282" text-anchor="middle" fill="#78909c" font-size="9">Spaces: default space per project</text>
  <text x="113" y="300" text-anchor="middle" fill="#78909c" font-size="9">Page hierarchy: parent/child tree</text>
  <text x="113" y="318" text-anchor="middle" fill="#78909c" font-size="9">Restrictions: page-level access</text>
  <text x="113" y="336" text-anchor="middle" fill="#78909c" font-size="9">@mention: notify team members</text>
  <text x="113" y="354" text-anchor="middle" fill="#78909c" font-size="9">Page history: diff + restore</text>
  <text x="113" y="372" text-anchor="middle" fill="#78909c" font-size="9">Blueprints: pre-built templates</text>
  <text x="113" y="390" text-anchor="middle" fill="#78909c" font-size="9">Inline comments: collaborative review</text>
  <text x="113" y="408" text-anchor="middle" fill="#78909c" font-size="9">Export: PDF / Word / HTML</text>

  <!-- COLUMN 2: Jira -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#00695c"/>
  <text x="308" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Jira</text>
  <text x="308" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Issues · Boards · Workflows · JQL</text>
  <rect x="223" y="126" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Issues (bug / story / task)</text>
  <rect x="223" y="152" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Scrum / Kanban boards</text>
  <rect x="223" y="178" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Workflows (status transitions)</text>
  <rect x="223" y="204" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">JQL (Jira Query Language)</text>
  <rect x="223" y="230" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Epics + sprints (Agile)</text>
  <text x="308" y="282" text-anchor="middle" fill="#78909c" font-size="9">Issue types: Epic/Story/Task/Bug</text>
  <text x="308" y="300" text-anchor="middle" fill="#78909c" font-size="9">Scrum: sprint planning + velocity</text>
  <text x="308" y="318" text-anchor="middle" fill="#78909c" font-size="9">Kanban: WIP limits + flow</text>
  <text x="308" y="336" text-anchor="middle" fill="#78909c" font-size="9">JQL: project = X AND status != Done</text>
  <text x="308" y="354" text-anchor="middle" fill="#78909c" font-size="9">Automations: trigger on status change</text>
  <text x="308" y="372" text-anchor="middle" fill="#78909c" font-size="9">Dashboards: gadgets + saved filters</text>
  <text x="308" y="390" text-anchor="middle" fill="#78909c" font-size="9">Components: sub-area grouping</text>
  <text x="308" y="408" text-anchor="middle" fill="#78909c" font-size="9">Versions: release planning</text>

  <!-- COLUMN 3: Git -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#6a1b9a" rx="6"/>
