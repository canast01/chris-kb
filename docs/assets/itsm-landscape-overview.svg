  <rect x="418" y="152" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">GitHub (remote + collaboration)</text>
  <rect x="418" y="178" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Pull Requests (code review)</text>
  <rect x="418" y="204" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">GitHub Actions (CI/CD)</text>
