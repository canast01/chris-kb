  <text x="503" y="300" text-anchor="middle" fill="#78909c" font-size="9">Branching: feature/ / fix/ / hotfix/</text>
  <text x="503" y="318" text-anchor="middle" fill="#78909c" font-size="9">Merge strategies: squash / rebase</text>
  <text x="503" y="336" text-anchor="middle" fill="#78909c" font-size="9">Tags: semver release marking</text>
  <text x="503" y="354" text-anchor="middle" fill="#78909c" font-size="9">CODEOWNERS: auto-assign reviewers</text>
  <text x="503" y="372" text-anchor="middle" fill="#78909c" font-size="9">Environments: prod approval gates</text>
  <text x="503" y="390" text-anchor="middle" fill="#78909c" font-size="9">Dependabot: auto dep updates</text>
  <text x="503" y="408" text-anchor="middle" fill="#78909c" font-size="9">Secret scanning + code scanning</text>

