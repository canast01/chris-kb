  <text x="703" y="300" text-anchor="middle" fill="#78909c" font-size="9">Change: normal / standard / emergency</text>
  <text x="703" y="318" text-anchor="middle" fill="#78909c" font-size="9">CMDB: CI attributes + relationships</text>
  <text x="703" y="336" text-anchor="middle" fill="#78909c" font-size="9">CAB: change advisory board review</text>
  <text x="703" y="354" text-anchor="middle" fill="#78909c" font-size="9">Business Rules: server-side logic</text>
  <text x="703" y="372" text-anchor="middle" fill="#78909c" font-size="9">Catalog items: self-service requests</text>
  <text x="703" y="390" text-anchor="middle" fill="#78909c" font-size="9">Integration Hub: API connectors</text>
  <text x="703" y="408" text-anchor="middle" fill="#78909c" font-size="9">Flow Designer: no-code workflows</text>

