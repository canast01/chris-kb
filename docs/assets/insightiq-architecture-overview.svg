<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">InsightIQ — Architecture Overview</text>

  <!-- Column 1: Data Sources (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PowerScale Sources</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PowerScale Cluster (OneFS)</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">telemetry via REST API port 8080</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">CPU / Memory utilization</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">per-node and per-disk metrics</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Throughput / IOPS / Latency</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="250" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">File System Analytics (FSA)</text>
  <text x="145" y="262" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">directory &amp; file activity data</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Protocol metrics (NFS/SMB)</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Capacity &amp; quota usage</text>

  <!-- Column 2: InsightIQ Server (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">InsightIQ Appliance</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">InsightIQ VM</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(OVA for VMware or Linux installer)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Collection Engine</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(polls OneFS REST API)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="210" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">PostgreSQL Database</text>
  <text x="412" y="222" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(local metrics store)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="250" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Web Dashboard UI</text>
  <text x="412" y="262" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(HTTPS browser access)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Historical Report Generator</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Scheduled Report Export (CSV)</text>

  <!-- Column 3: Analytics Outputs (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Analytics &amp; Reporting</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Performance Dashboards</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Capacity Trending</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">File System Analytics (FSA)</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">largest files / hot directories</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Historical Trend Analysis</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Scheduled PDF / CSV Reports</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Email Alert Notifications</text>

  <!-- Component table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="200" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="500" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Details</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">InsightIQ VM</text>
  <text x="500" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">OVA (VMware) or Linux installer; hosts collection engine and web dashboard</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="200" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">PostgreSQL</text>
  <text x="500" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Local metrics database on the appliance</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">OneFS Data Connector</text>
  <text x="500" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">REST API pull from cluster management IP (port 8080)</text>

  <!-- Key specifications -->
  <rect x="20" y="520" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="540" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Deployment Specifications</text>

  <rect x="20" y="550" width="250" height="40" fill="#f1f5f9"/>
  <text x="145" y="564" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Data retention</text>
  <text x="145" y="580" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">configurable; typically 30–365 days</text>

  <rect x="287" y="550" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="564" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Collection interval</text>
  <text x="412" y="580" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">every 30 seconds (performance)</text>

  <rect x="553" y="550" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="564" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Supported clusters</text>
  <text x="678" y="580" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">multiple PowerScale clusters</text>

  <rect x="20" y="602" width="250" height="40" fill="#ffffff"/>
  <text x="145" y="616" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Minimum VM sizing</text>
  <text x="145" y="632" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">4 vCPU, 8 GB RAM, 500 GB disk</text>

  <rect x="287" y="602" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="616" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Network requirement</text>
  <text x="412" y="632" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">TCP 8080 to cluster mgmt IP</text>

  <rect x="553" y="602" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="616" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">FSA scan</text>
  <text x="678" y="632" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">daily or on-demand filesystem scan</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
