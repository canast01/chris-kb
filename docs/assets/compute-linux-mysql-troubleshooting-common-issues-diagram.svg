<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MySQL / MariaDB — Common Issues</text>
  
  <rect x="10" y="50" width="200" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Query slow?</text>
  
  <line x1="110" y1="90" x2="110" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="120" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="70" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">EXPLAIN shows Seq Scan on large table</text>
  <text x="70" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">add index</text>
  
  <line x1="110" y1="170" x2="110" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="200" width="300" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="70" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">EXPLAIN shows correct index but slow</text>
  <text x="70" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">stale statistics → ANALYZE</text>
  
  <line x1="110" y1="250" x2="110" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="280" width="300" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="70" y="305" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Waiting on lock</text>
  <text x="70" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">find blocker; kill if necessary</text>
  
  <line x1="110" y1="330" x2="110" y2="360" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="360" width="650" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="70" y="385" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">High I/O wait</text>
  <text x="70" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">buffer pool too small → increase shared_buffers / innodb_buffer_pool_size</text>

  <line x1="110" y1="410" x2="110" y2="440" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="440" width="650" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="70" y="465" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">CPU spiking</text>
  <text x="70" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">too many connections or parallel queries → check pool; tune work_mem</text>
  
  <rect x="0" y="490" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Troubleshooting Flowchart</text>
</svg>