<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Security Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Identity &amp; Access · Certificates &amp; PKI · Compliance &amp; Hardening</text>

  <!-- COLUMN 1: Identity & Access -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Identity &amp; Access</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">AD · LDAP · RBAC · MFA · PAM</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Active Directory (AD DS)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">LDAP / Kerberos authentication</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">RBAC (role-based access control)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">MFA (multi-factor authentication)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">PAM (privileged access management)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">AD DS: domains, forests, trusts, OUs</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Kerberos: TGT + service ticket flow</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">RBAC: least privilege + role assignment</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">MFA: TOTP / FIDO2 / push notification</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">LAPS: managed local admin passwords</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">PAM: just-in-time access + session record</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">SSO: SAML 2.0 / OIDC / OAuth 2.0</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">Service accounts: use GMSA where possible</text>

  <!-- COLUMN 2: Certificates & PKI -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Certificates &amp; PKI</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">TLS · CA · VMCA · Certificate Lifecycle</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">X.509 certificates (TLS)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Internal CA (ADCS / VMCA)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Certificate Authority hierarchy</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SAN certificates (Subject Alt Names)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Certificate rotation + renewal</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">TLS 1.2/1.3: handshake, cipher suites</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">VMCA: default VMware CA for vSphere certs</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">ADCS: Windows enterprise CA for corp infra</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Root CA offline; sub CA online for issuance</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">SAN certs: multiple hostnames one cert</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">CRL / OCSP: revocation checking</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">openssl: inspect, generate CSR, verify chain</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">cert-manager: K8s automated cert lifecycle</text>

  <!-- COLUMN 3: Compliance & Hardening -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Compliance &amp; Hardening</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">CIS Benchmarks · STIG · Vulnerability Mgmt</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">CIS Benchmarks</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">DISA STIGs</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Vulnerability management (Tenable)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">OS hardening (SELinux / GPO)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Audit logging (auditd / SIEM)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">CIS L1/L2: scored hardening for Linux/Windows</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">STIG: DoD hardening standards per product</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Tenable: authenticated scans + CVE scoring</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">SELinux: enforcing mode; policy booleans</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">GPO: password policy, account lockout</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">auditd rules: file access + syscall monitoring</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">SIEM: log aggregation + correlation rules</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Patch cadence: monthly OS + quarterly infra</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Access Control Model Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="290" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">RBAC</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">ABAC</text>
  <text x="665" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">MAC</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Decision basis</text>
  <text x="290" y="562" text-anchor="middle" fill="#546e7a" font-size="9">User role membership</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">User + resource attributes</text>
  <text x="665" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Security label (system-enforced)</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Flexibility</text>
  <text x="290" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Moderate</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">High</text>
  <text x="665" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Low (rigid by design)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Complexity</text>
  <text x="290" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Low — roles easy to audit</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">High — policy complexity</text>
  <text x="665" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Low — label-driven</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Examples</text>
  <text x="290" y="639" text-anchor="middle" fill="#546e7a" font-size="9">AD groups, vCenter roles</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">OPA / AWS IAM conditions</text>
  <text x="665" y="639" text-anchor="middle" fill="#546e7a" font-size="9">SELinux, AppArmor</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="290" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Enterprise user access</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Cloud / fine-grained authz</text>
  <text x="665" y="665" text-anchor="middle" fill="#546e7a" font-size="9">High-assurance / govt</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Security Reference · AD DS · LDAP · MFA · PKI · TLS · CIS · STIG · auditd · SELinux</text>
</svg>
