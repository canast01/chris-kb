<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Automation Domain — Interaction Map
  </text>

  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="240" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Horizon Connection Server
    </text>
  </g>

  <g transform="translate(40, 100)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-20" y="20" width="240" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="0" y="45" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      vCenter (pool provisioning)
    </text>
  </g>

  <g transform="translate(60, 160)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-40" y="20" width="240" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="-30" y="45" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Instant Clone Engine (or Full Clone)
    </text>
  </g>

  <g transform="translate(80, 220)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-60" y="20" width="240" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="-50" y="45" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
