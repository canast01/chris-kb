  <g transform="translate(140, 400)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-120" y="20" width="240" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="-110" y="45" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
