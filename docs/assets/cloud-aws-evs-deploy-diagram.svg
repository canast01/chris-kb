<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Amazon EVS Deployment
  </text>
  
  <rect x="10" y="50" width="800" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1a2744" text-anchor="middle">
    EVS Deployment Sequence
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pre-requisites: VPC, subnets, SGs, IAM service-linked role, key pair, DX
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cluster creation via AWS console or CLI; takes 90-120 minutes
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Post-deploy: retrieve secrets, configure SDDC Manager, deploy HCX service mesh
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Validation: cluster CREATED + vSAN green + NSX-T stable + HCX service mesh Up
  </text>
  
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SDDC Manager = VCF control plane; manages hosts, domains, upgrades, credentials
  </text>
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VTEP subnet  = NSX-T tunnel endpoint traffic; separate from management subnet
  </text>
  <text x="20" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Service mesh = HCX Interconnect + WAN Opt + Network Extension appliance pair
  </text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Amazon EVS Deployment
  </text>
</svg>