<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Security — Security
  </text>
  
  <g transform="translate(10, 40)">
    <rect width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Index.Md security: access control, authentication, encryption, and hardening guide
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Principle of least privilege applied to all admin roles and service accounts
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Encryption at rest and in transit enforced; key rotation on defined schedule
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Annual security review and audit; logs forwarded to SIEM for correlation
    </text>
  </g>
  
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Define roles → enforce MFA → enable encryption → harden → audit
  </text>
  
  <line x1="150" y1="150" x2="150" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="150" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="150" x2="670" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
