<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    MySQL / MariaDB — Escalation
  </text>
  
  <rect x="10" y="50" width="800" height="60" fill="#ffffff" stroke="none" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Escalate MySQL/MariaDB issues to vendor support (Oracle or Percona) when the instance is
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    completely unreachable, InnoDB crash recovery is looping, replication is stopped with an
  </text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    error that cannot be skipped safely, or data loss or corruption is suspected.
  </text>

  <rect x="20" y="120" width="370" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 1 — Collect Data
  </text>
  <text x="30" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Save error log (last 500 lines)
  </text>
  <text x="30" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Run SHOW ENGINE INNODB STATUS
  </text>
  <text x="30" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Run SHOW REPLICA STATUS \G
  </text>
  <text x="30" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Run SHOW FULL PROCESSLIST
  </text>
  <text x="30" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Write timeline: last good → first failure
  </text>

  <rect x="430" y="120" width="370" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="440" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 2 — Open the Case
  </text>
  <text x="440" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Oracle MySQL: support.oracle.com (MOS)
  </text>
  <text x="440" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Percona: percona.com/services
  </text>
  <text x="440" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Severity: P1 (down) / P2 (degraded)
  </text>
  <text x="440" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Attach error log + InnoDB status + replic
  </text>
  <text x="440" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    For P1: also call vendor phone support
  </text>

  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    For P1: do not restart mysqld repeatedly on crash recovery loop; take data dir snapshot first.
  </text>

  <line x1="205" y1="280" x2="205" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="280" x2="615" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="310" width="370" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 3 — Escalation Path
  </text>
  <text x="30" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    T1: triage + confirm logs received
  </text>
  <text x="30" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    T2: MySQL/MariaDB SE assigned; deep review
  </text>
  <text x="30" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DBA: involve DBA for schema or data issues
  </text>
  <text x="30" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    P1 data loss: snapshot data dir before ops
  </text>

  <rect x="430" y="310" width="370" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="440" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    What NOT to Do
  </text>
  <text x="440" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not run innodb_force_recovery &gt; 3
  </text>
  <text x="440" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not flush binary logs before capture
  </text>
  <text x="440" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not delete corrupted .ibd files
  </text>
  <text x="440" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not repeatedly restart on InnoDB loop
  </text>

  <rect x="10" y="460" width="800" height="180" fill="#ffffff" stroke="none" />
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    InnoDB = MySQL/MariaDB default storage engine; transactional; ACID-compliant
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REPLICA STATUS = SHOW REPLICA STATUS \G; shows replication position, lag, and errors
  </text>
  <text x="20" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Last_Error = replication SQL thread error; error code + message; core for escalation
  </text>
  <text x="20" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    innodb_force_recovery = startup option 1-6; allows MySQL to start with InnoDB damage; dangerous
  </text>
  <text x="20" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    crash recovery = InnoDB automatic repair process on startup after unclean shutdown
  </text>
  <text x="20" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OOM kill = Linux out-of-memory killer terminates mysqld; check with `dmesg`
  </text>
  <text x="20" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    binlog = binary log; records all changes for replication and point-in-time recovery
  </text>
  <text x="20" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Errno = OS-level error code in replication status; 0 = no error
  </text>
  <text x="20" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pt-query-digest = Percona tool; analyzes slow query log; install from percona-toolkit
  </text>
  <text x="20" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ibdata1 = InnoDB shared tablespace file; corruption here is catastrophic
  </text>

  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Escalation Process
  </text>
</svg>