<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">NetApp Keystone — Architecture Overview</text>

  <!-- Column 1 header: Service Tiers (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SERVICE TIERS</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Extreme — NVMe-AF (12,000 IOPS/TB)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Premium — AFF (4,000 IOPS/TB)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Standard — FAS Hybrid (2,000 IOPS/TB)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Object — StorageGRID (S3 / archive)</text>

  <rect x="20" y="286" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CAPACITY MODEL</text>

  <rect x="20" y="332" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="352" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Committed Capacity (baseline)</text>

  <rect x="20" y="372" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="392" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Burst Capacity (on-demand overage)</text>

  <rect x="20" y="412" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="432" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Monthly Subscription Billing</text>

  <!-- Column 2 header: On-Premises Components (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ON-PREMISES COMPONENTS</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Keystone Collector</text>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">(on-prem VM — telemetry agent)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">ONTAP Arrays (AFF / FAS)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">StorageGRID Object Store</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">QoS Policy Groups</text>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">(mapped per service tier)</text>

  <rect x="287" y="286" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">MANAGEMENT PLANE</text>

  <rect x="287" y="332" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="352" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Keystone STaaS Portal</text>

  <rect x="287" y="372" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="392" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">ActiveIQ / BlueXP Integration</text>

  <rect x="287" y="412" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="432" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Customer Admin Portal (self-service)</text>

  <!-- Column 3 header: Operational Flow (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">OPERATIONAL FLOW</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Collector gathers ONTAP telemetry</text>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">(capacity, IOPS, throughput)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Telemetry sent to Keystone Portal</text>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">(NetApp cloud — encrypted)</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Committed vs. burst usage calculated</text>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">per service tier monthly</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Customer views usage reports</text>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">and billing via portal</text>

  <rect x="553" y="286" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DELIVERY MODEL</text>

  <rect x="553" y="332" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="352" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">STaaS — NetApp-operated hardware</text>

  <rect x="553" y="372" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">On-premises / colocation deployment</text>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">(customer data centre)</text>

  <rect x="553" y="412" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">NetApp manages hardware lifecycle</text>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">and capacity planning</text>

  <!-- Comparison table -->
  <rect x="20" y="472" width="783" height="30" fill="#1e293b"/>
  <text x="145" y="492" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Tier</text>
  <text x="320" y="492" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Platform</text>
  <text x="490" y="492" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Latency</text>
  <text x="680" y="492" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Primary Use Case</text>

  <rect x="20" y="502" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="519" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Extreme</text>
  <text x="320" y="519" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">NVMe-AF (all-flash NVMe)</text>
  <text x="490" y="519" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">&lt; 1 ms</text>
  <text x="680" y="519" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Databases, high-IOPS workloads</text>

  <rect x="20" y="528" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="545" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Premium</text>
  <text x="320" y="545" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">AFF (all-flash SAS/NVMe)</text>
  <text x="490" y="545" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">&lt; 1 ms</text>
  <text x="680" y="545" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Mixed workloads, virtualisation</text>

  <rect x="20" y="554" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="571" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Standard</text>
  <text x="320" y="571" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">FAS (hybrid flash/disk)</text>
  <text x="490" y="571" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">&lt; 2 ms</text>
  <text x="680" y="571" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">File storage, backup targets</text>

  <rect x="20" y="580" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="597" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Object</text>
  <text x="320" y="597" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">StorageGRID</text>
  <text x="490" y="597" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">&lt; 17 ms</text>
  <text x="680" y="597" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Unstructured data, archives, S3</text>

  <!-- Key notes -->
  <rect x="20" y="618" width="783" height="26" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="410" y="635" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Keystone Collector VM deployed on-prem — pushes telemetry to NetApp cloud for billing and reporting</text>

  <rect x="20" y="650" width="783" height="26" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="667" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Capacity tiers auto-scale — burst overage billed at higher rate; committed floor ensures SLA</text>

  <rect x="20" y="682" width="783" height="26" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="410" y="699" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">NetApp manages hardware refresh and lifecycle — customer retains data control and management access</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
