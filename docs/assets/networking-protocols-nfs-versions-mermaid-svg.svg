<line x1="410.0" y1="352.0" x2="410.0" y2="130.0" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
<rect x="351.6" y="232.0" width="116.8" height="14" fill="#ffffff" opacity="0.85"/>
