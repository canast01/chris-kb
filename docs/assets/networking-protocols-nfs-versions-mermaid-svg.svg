<rect x="352.1" y="363.0" width="115.7" height="14" fill="#ffffff" opacity="0.85"/>
<text x="410.0" y="374.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#546e7a">COMPOUND ops (metadata)</text>
<line x1="410.0" y1="528.0" x2="410.0" y2="276.0" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
<rect x="373.6" y="393.0" width="72.9" height="14" fill="#ffffff" opacity="0.85"/>
<text x="410.0" y="404.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#546e7a">layout + deviceid</text>
<line x1="290.0" y1="325.0" x2="410.0" y2="325.0" stroke="#78909c" stroke-width="1.2" stroke-dasharray="3,2" />
<line x1="410.0" y1="325.0" x2="530.0" y2="325.0" stroke="#78909c" stroke-width="1.2" stroke-dasharray="3,2" />
