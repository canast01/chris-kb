<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#455a64" /></marker></defs>
<rect x="0" y="0" width="820" height="30" fill="#1a2744" />
<text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MDS vs DS Role Separation</text>
<rect x="255.4" y="130.0" width="309.2" height="106.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="410.0" y="146.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Data Plane (pNFS)</text>
<rect x="265.4" y="160.0" width="132.2" height="68.0" rx="4" fill="#ffffff" stroke="#3949ab" stroke-width="1" />
<text x="331.5" y="175.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Data Server 1</text>
<text x="331.5" y="189.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── file stripe 0 → 511 MB</text>
<text x="331.5" y="203.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── direct TCP :2049</text>
<text x="331.5" y="217.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── no MDS involvement</text>
<rect x="407.6" y="160.0" width="147.0" height="68.0" rx="4" fill="#ffffff" stroke="#3949ab" stroke-width="1" />
<text x="481.1" y="175.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Data Server 2</text>
<text x="481.1" y="189.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── file stripe 512 MB → EOF</text>
<text x="481.1" y="203.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── direct TCP :2049</text>
<text x="481.1" y="217.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── parallel to DS1</text>
<rect x="225.0" y="276.0" width="370.0" height="76.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" />
<text x="410.0" y="292.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">NFS Client</text>
<rect x="235.0" y="306.0" width="110.0" height="38.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="290.0" y="321.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Application</text>
<text x="290.0" y="335.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">(read/write calls)</text>
<rect x="355.0" y="306.0" width="110.0" height="38.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="410.0" y="329.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">VFS Layer</text>
<rect x="475.0" y="306.0" width="110.0" height="38.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1" />
<text x="530.0" y="321.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">NFSv4.1 Module</text>
<text x="530.0" y="335.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">+ pNFS driver</text>
<rect x="321.0" y="392.0" width="178.0" height="136.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="410.0" y="408.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Control Plane</text>
<rect x="331.0" y="422.0" width="158.0" height="98.0" rx="4" fill="#ffffff" stroke="#3949ab" stroke-width="1" />
<text x="410.0" y="437.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">Metadata Server (MDS)</text>
<text x="410.0" y="451.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── namespace / dentries</text>
<text x="410.0" y="465.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── open / lock / delegation</text>
<text x="410.0" y="479.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── layout grant (LAYOUTGET)</text>
<text x="410.0" y="493.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── attribute updates</text>
<text x="410.0" y="507.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">── port 2049</text>
