<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">NSX-T Microsegmentation with Active Directory Integration</text>

  <!-- Active Directory -->
  <rect x="10" y="50" width="200" height="180" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ACTIVE DIRECTORY</text>
  <rect x="30" y="90" width="160" height="40" rx="6" fill="#ffffff" stroke="#1565c0" />
  <text x="40" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Domain</text>
  <text x="40" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">corp.local</text>
  <rect x="30" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#1565c0" />
  <text x="40" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Groups:</text>
  <text x="40" y="175" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">grp-db</text>
  <text x="40" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">grp-web</text>
  <text x="40" y="205" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">grp-admins</text>

  <!-- NSX Manager -->
  <rect x="250" y="50" width="300" height="280" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="260" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NSX MANAGER</text>
  <rect x="270" y="90" width="260" height="40" rx="6" fill="#ffffff" stroke="#3949ab" />
  <text x="280" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Identity Source</text>
  <text x="280" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">(AD/LDAP)</text>
  <rect x="270" y="140" width="260" height="80" rx="6" fill="#ffffff" stroke="#3949ab" />
  <text x="280" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NSX Security Groups</text>
  <text x="280" y="175" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">sg-db-servers</text>
  <text x="280" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">sg-web-servers</text>
  <rect x="270" y="230" width="260" height="80" rx="6" fill="#ffffff" stroke="#3949ab" />
  <text x="280" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Distributed Firewall (DFW)</text>
  <text x="280" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">+ IDFW Rules</text>

  <!-- vCenter -->
  <rect x="580" y="50" width="200" height="180" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="590" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vCENTER</text>
  <rect x="600" y="90" width="160" height="40" rx="6" fill="#ffffff" stroke="#2e7d32" />
  <text x="610" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vCenter</text>
  <text x="610" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tags</text>
  <rect x="600" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#2e7d32" />
  <text x="610" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">VM Tags:</text>
  <text x="610" y="175" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">tier=web</text>
  <text x="610" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">tier=app</text>
  <text x="610" y="205" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">tier=db</text>

  <!-- Connections -->
  <line x1="190" y1="110" x2="270" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">LDAP/LDAPS</text>
  <line x1="190" y1="175" x2="270" y2="175" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="200" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Group Sync</text>
  <line x1="680" y1="175" x2="530" y2="175" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- VMs -->
  <rect x="150" y="350" width="140" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="160" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Web VMs</text>
  <text x="160" y="385" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">(tier=web)</text>
  <text x="160" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">80/443</text>

  <rect x="340" y="350" width="140" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="350" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">App VMs</text>
  <text x="350" y="385" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">(tier=app)</text>
  <text x="350" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">8080</text>

  <rect x="530" y="350" width="140" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="540" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">DB VMs</text>
  <text x="540" y="385" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">(tier=db)</text>
  <text x="540" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">5432</text>

  <!-- VM Connections -->
  <line x1="290" y1="380" x2="340" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="480" y1="380" x2="530" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Footer -->
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: NSX-T Microsegmentation with Active Directory Integration</text>
</svg>