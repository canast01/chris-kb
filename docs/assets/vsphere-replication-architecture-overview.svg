<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">vSphere Replication — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">VRMS · VRS · RPO-Based VM Replication · SRM Integration</text>

  <!-- ═ COLUMN 1: Appliances ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Replication Appliances</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">VRMS · VRS · vCenter Plugin</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VRMS (Mgmt Server — protected site)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VRS (Replication Server — recovery site)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vCenter Plugin (vSphere Replication UI)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VR Agent (ESXi host — per-VM repl)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Paired vCenter sites (protected → recovery)</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Port 31031 (replication data)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">OVA deployed at both sites</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">VRMS: config, pairing, replication jobs</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">VRS: receives and writes replicated data</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">VR Agent: hypervisor-embedded, no guest</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Port 31031 TCP: compressed + encrypted</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Multiple VRS per site for scalability</text>

  <!-- ═ COLUMN 2: Replication Engine ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Replication Engine</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">VM-Level · RPO · Seed · Quiescing</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Per-VM RPO (5 min – 24 hours)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Changed Block Tracking (CBT)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Multiple point-in-time instances</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Application-consistent (VSS quiesce)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Seed replication (pre-populate)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Replication Groups (SRM protection)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Minimum RPO: 5 minutes (not 0)</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">CBT: only changed blocks transferred</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Instances (PITs): up to 24 per VM</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">VSS quiesce: crash-consistent without</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Seed: USB/NFS copy to cut WAN usage</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Group: replicate multiple VMs together</text>

  <!-- ═ COLUMN 3: Integration & DR ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Integration &amp; DR</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">SRM · vCenter · Network Requirements</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SRM Integration (orchestrated failover)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Protection Groups (VM sets)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Recovery Plans (runbooks)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Test Failover (non-disruptive)</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Re-protect &amp; Failback</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">WAN bandwidth compression</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">SRM: coordinates failover of all VMs</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Protection Group links to replication group</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Recovery Plan: ordered startup + scripts</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Test: isolated network, prod unaffected</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Re-protect: reverse replication after DR</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Compression: reduces WAN bandwidth ~50%</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Replication Method Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">vSphere Replication</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">SAN Replication</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">vSAN Stretched</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Granularity</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Per VM</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">LUN / volume</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Cluster-wide</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Minimum RPO</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">5 minutes</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Async: minutes; Sync: 0</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">0 (synchronous)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">SAN required</text>
  <text x="340" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">SRM integration</text>
  <text x="340" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Not required</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Hypervisor-based</text>
  <text x="340" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Bandwidth optimisation</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">CBT + compression</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Array-level dedupe</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Low-latency link req.</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">vSphere Replication Reference · VRMS · VRS · CBT · RPO · SRM · Protection Groups · Seed Replication</text>
</svg>
