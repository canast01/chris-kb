  </text>

  <rect x="0" y="380" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Storage Architecture
  </text>
</svg>