<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Dell PowerMax — How It Works
  </text>

  <rect x="50" y="60" width="200" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="60" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical NVMe Drives
  </text>

  <line x1="150" y1="100" x2="150" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="130" width="220" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="60" y="155" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Storage Resource Pool (SRP)
  </text>

  <line x1="160" y1="170" x2="160" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="200" width="200" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="60" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Storage Group (SG)
  </text>

  <line x1="150" y1="240" x2="150" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="270" width="200" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="60" y="295" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
