  </text>

  <line x1="150" y1="310" x2="150" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="340" width="200" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="60" y="365" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
