<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Active Directory — Architecture Overview</text>

  <!-- Column 1: Domain Controllers (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Domain Controllers</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Forest Root DC (PDC Emulator)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">DC — Global Catalog Server</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Read-Only DC (RODC) — Branch</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Child Domain DC</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">AD Replication (DFS-R / FRS)</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Sites &amp; Services / Subnets</text>

  <!-- Column 2: Authentication & Services (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Authentication &amp; Services</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Kerberos v5 (port 88)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">LDAP / LDAPS (389 / 636)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">DNS (SRV records — DC locator)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Group Policy (GPO via SYSVOL)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">NTLM (legacy fallback)</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">AD Certificate Services (ADCS)</text>

  <!-- Column 3: FSMO Roles & Trust (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">FSMO Roles &amp; Trusts</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Schema Master (forest-wide)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Domain Naming Master</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">PDC Emulator (per domain)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">RID Master (per domain)</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Infrastructure Master</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Forest / External Trusts</text>

  <!-- Comparison table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="200" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Scope</text>
  <text x="430" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">FSMO Role</text>
  <text x="670" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Recommended Placement</text>

  <rect x="20" y="420" width="783" height="26" rx="0" fill="#f1f5f9"/>
  <text x="200" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Forest-wide</text>
  <text x="430" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Schema Master</text>
  <text x="670" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Forest root DC 1</text>

  <rect x="20" y="446" width="783" height="26" rx="0" fill="#ffffff"/>
  <text x="200" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Forest-wide</text>
  <text x="430" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Domain Naming Master</text>
  <text x="670" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Forest root DC 1</text>

  <rect x="20" y="472" width="783" height="26" rx="0" fill="#f1f5f9"/>
  <text x="200" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Per domain</text>
  <text x="430" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">PDC Emulator</text>
  <text x="670" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Most capable DC (time source)</text>

  <rect x="20" y="498" width="783" height="26" rx="0" fill="#ffffff"/>
  <text x="200" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Per domain</text>
  <text x="430" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">RID Master</text>
  <text x="670" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Same site as PDC Emulator</text>

  <rect x="20" y="524" width="783" height="26" rx="0" fill="#f1f5f9"/>
  <text x="200" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Per domain</text>
  <text x="430" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Infrastructure Master</text>
  <text x="670" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Not a Global Catalog DC</text>

  <!-- Key ports section -->
  <rect x="20" y="572" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="592" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Key Ports &amp; Protocols</text>

  <rect x="20" y="602" width="250" height="26" fill="#f1f5f9"/>
  <text x="145" y="619" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Kerberos: TCP/UDP 88</text>
  <rect x="287" y="602" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="619" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">LDAP: 389 / LDAPS: 636</text>
  <rect x="553" y="602" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="619" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Global Catalog: 3268 / 3269</text>

  <rect x="20" y="628" width="250" height="26" fill="#ffffff"/>
  <text x="145" y="645" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">DNS: UDP/TCP 53</text>
  <rect x="287" y="628" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="645" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">RPC: 135 + dynamic range</text>
  <rect x="553" y="628" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="645" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SMB/SYSVOL: 445</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
