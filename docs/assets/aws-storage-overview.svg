<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Storage — Service Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">EBS · S3 · EFS · FSx · Snapshots · Lifecycle · Replication</text>

  <!-- ═ COLUMN 1: Block Storage ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Block Storage</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">EBS · Snapshots · Instance Store</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EBS gp3 (general purpose SSD)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EBS io2 (provisioned IOPS SSD)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EBS st1 / sc1 (HDD throughput)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EBS Snapshots (point-in-time)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EBS Encryption (KMS)</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Instance Store (ephemeral NVMe)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">gp3: 3000 IOPS / 125 MiB/s baseline</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">io2: up to 64,000 IOPS per volume</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Snapshots: incremental, stored in S3</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Cross-region snapshot copy for DR</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Data Lifecycle Manager automates snapshots</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Instance store: lost on stop/terminate</text>

  <!-- ═ COLUMN 2: Object Storage ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#e65100"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Object Storage</text>
  <text x="410" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">S3 · Glacier · Lifecycle · Replication</text>
  <rect x="295" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">S3 Standard</text>
  <rect x="295" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">S3 Intelligent-Tiering</text>
  <rect x="295" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">S3 Glacier / Glacier Deep Archive</text>
  <rect x="295" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">S3 Lifecycle Policies</text>
  <rect x="295" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">S3 Replication (CRR / SRR)</text>
  <rect x="295" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">S3 Object Lock (WORM)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">11 nines durability (99.999999999%)</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Lifecycle: transition after N days</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">CRR: cross-region for DR / geo</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">SRR: same-region for compliance copy</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Glacier retrieval: minutes to hours</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Object Lock: Governance or Compliance mode</text>

  <!-- ═ COLUMN 3: File Storage ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">File Storage</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">EFS · FSx for Windows · FSx for ONTAP</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">EFS (NFS — Linux)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FSx for Windows (SMB / AD)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FSx for NetApp ONTAP</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FSx for Lustre (HPC)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FSx for OpenZFS</text>
  <rect x="560" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">EFS Access Points (per-app paths)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">EFS: elastic capacity, multi-AZ mount</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">FSx Windows: DFS, AD, VSS snapshots</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">FSx ONTAP: NFS + SMB + iSCSI</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Lustre: linked to S3 for ML/HPC</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">EFS IA: infrequent access tier (cheaper)</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Mount target per AZ for EFS HA</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Storage Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">EBS</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">S3</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">EFS</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Type</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Block</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Object</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">File (NFS)</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Multi-attach</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">io2 only (same AZ)</text>
  <text x="540" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Access method</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">OS block device</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">API / SDK / CLI</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">NFS v4.1 mount</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Persistence</text>
  <text x="340" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Persists (unless deleted)</text>
  <text x="540" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Persists indefinitely</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Persists indefinitely</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">OS, DB, boot volumes</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Backups, logs, static assets</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Shared Linux workloads</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Availability</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Single AZ</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Regional (multi-AZ)</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Regional (multi-AZ)</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Storage Reference · EBS · S3 · EFS · FSx · Snapshots · Lifecycle Policies · Replication</text>
</svg>
