<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PowerStore Migration Process</text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">1. Pre-migration health check</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Source and target both show green in CloudIQ or Unisphere</text>
  </g>
  
  <g transform="translate(20, 120)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">2. Import session creation</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">PowerStore Manager → Protection → Import → Create Import Session</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Provide source array management IP and credentials</text>
  </g>
  
  <g transform="translate(20, 210)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">3. Host re-zoning (FC) or iSCSI re-configuration</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Add PowerStore target ports to existing host fabric zones</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Host sees both source and target simultaneously</text>
  </g>
  
  <g transform="translate(20, 300)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">4. Import session start</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">PowerStore copies source volume data to PowerStore volume in background</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Host continues I/O to source during copy</text>
  </g>
  
  <g transform="translate(20, 390)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">5. Cutover (online or scheduled)</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">PowerStore flushes final delta; host I/O redirected to PowerStore</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Source volume becomes read-only</text>
  </g>
  
  <g transform="translate(20, 480)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">6. Post-migration validation</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Confirm host I/O active on PowerStore; verify data integrity</text>
    <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Remove source array zones/mappings</text>
  </g>
  
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="200" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="290" x2="410" y2="310" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="380" x2="410" y2="400" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="470" x2="410" y2="490" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Migration Process</text>
</svg>