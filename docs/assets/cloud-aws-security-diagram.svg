<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    AWS Security Overview
  </text>
  
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Security — Authentication, Encryption, and Threat Detection
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Authentication: IAM Identity Center SSO · MFA enforcement · no shared credentials; roles only
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Encryption: KMS for data-at-rest · ACM for TLS certificates · Secrets Manager for credentials
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Threat detection: GuardDuty (ML-based) · Security Hub (posture) · Inspector (vulnerability)
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Preventive guardrails: SCPs limit service/region access · Config rules detect drift · WAF
  </text>
  
  <text x="410" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Authentication controls access · Encryption protects data
  </text>
  
  <line x1="205" y1="180" x2="205" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="180" x2="615" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="200" width="310" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Authentication
  </text>
  <text x="205" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IAM Identity Center SSO
  </text>
  <text x="205" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MFA: virtual or hardware
  </text>
  <text x="205" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Roles: no long-lived keys
  </text>
  <text x="205" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SCP: deny root actions
  </text>
  <text x="205" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Access Analyzer: review
  </text>
  
  <rect x="360" y="200" width="310" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="515" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Encryption
  </text>
  <text x="515" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    KMS: CMK + AWS managed
  </text>
  <text x="515" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Secrets Manager: rotate
  </text>
  <text x="515" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ACM: TLS certs managed
  </text>
  <text x="515" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    S3: SSE-S3 / SSE-KMS
  </text>
  <text x="515" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EBS/RDS: encrypt at rest
  </text>
  
  <rect x="670" y="200" width="310" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="825" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Threat Detection
  </text>
  <text x="825" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GuardDuty: ML threat
  </text>
  <text x="825" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Security Hub: score
  </text>
  <text x="825" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Inspector: CVE scanning
  </text>
  <text x="825" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Config: drift detection
  </text>
  <text x="825" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WAF: ALB + CloudFront
  </text>
  
  <text x="410" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Authentication + SCPs prevent access · Encryption protects data
  </text>
  
  <line x1="205" y1="360" x2="205" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="360" x2="410" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="360" x2="615" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="380" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Authentication  │  Access Control  │     Encryption    │    Hardening     │ Certificate Mgr
  </text>
  <text x="410" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSO: IAM IC    │Roles: least priv │  KMS: CMK create  │  GuardDuty: org  │   ACM: request
  </text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MFA: enforce all │ SCP: deny risky  │  Secrets: rotate  │   Security Hub   │ Auto-renew: yes
  </text>
  <text x="410" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No shared keys  │  Boundary: set   │     S3 SSE-KMS    │ Inspector: scan  │  ALB: TLS 1.2+
  </text>
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IdP: SAML 2.0   │ Access Analyzer  │   EBS: encrypted  │  Config: rules   │  DNS valid: txt
  </text>
  
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS security regions · KMS hardware security modules · CloudFront edge for WAF
  </text>
  
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    KMS = Key Management Service; create and manage CMKs for encryption across AWS services
  </text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CMK = Customer Managed Key; KMS key you control; used for S3, EBS, RDS, Secrets Manager
  </text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Secrets Manager = Manages credentials, API keys, and passwords; auto-rotates via Lambda integration
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ACM = AWS Certificate Manager; provisions and auto-renews TLS certificates for ALB/CF
  </text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GuardDuty = ML-based threat detection; analyses CloudTrail, VPC Flow Logs, and DNS logs
  </text>
  <text x="410" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Security Hub = Aggregates findings; computes security score against CIS, PCI-DSS, AWS Foundational
  </text>
  <text x="410" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Inspector = Automated vulnerability scanner for EC2 OS CVEs and container image vulnerabilities
  </text>
  <text x="410" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WAF = Web Application Firewall; Layer 7 rules for ALB, API Gateway, and CloudFront
  </text>
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SSE-KMS = Server-side encryption with KMS CMK; allows key policy + CloudTrail audit of usage
  </text>
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Permission Boundary = IAM policy capping maximum permissions; limits blast radius of over-provisioned
  </text>
  <text x="410" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Access Analyzer = IAM service that finds externally-accessible resources; generates least-priv
  </text>
  <text x="410" y="725" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IAM Identity Center = SSO for human access; enforces MFA; integrates with Okta/Azure AD via SAML/SCIM
  </text>
  
  <rect x="0" y="740" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="760" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: AWS Security Overview
  </text>
</svg>