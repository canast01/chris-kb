<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720" viewBox="0 0 820 720">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell PowerScale — OneFS Scale-Out NAS Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Single filesystem namespace across all nodes; horizontal scale by adding nodes;
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    NFS/SMB/HDFS/S3 protocols; SyncIQ async replication; SmartConnect DNS load balance.
  </text>
  
  <rect x="10" y="80" width="390" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    OneFS Architecture
  </text>
  <text x="205" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Single filesystem namespace
  </text>
  <text x="205" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    H-series: HDD capacity
  </text>
  <text x="205" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    F-series: NVMe performance
  </text>
  <text x="205" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    A-series: AFA nodes
  </text>
  <text x="205" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No LUN abstraction: files only
  </text>
  
  <rect x="420" y="80" width="390" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Protocols
  </text>
  <text x="615" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NFS v3/v4.1: Linux/Unix
  </text>
  <text x="615" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMB 2.1/3.0: Windows
  </text>
  <text x="615" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HDFS: Hadoop workloads
  </text>
  <text x="615" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    S3: via S3 gateway
  </text>
  <text x="615" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Multi-protocol: same data
  </text>
  
  <text x="10" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SmartConnect assigns DNS names per access zone; clients distributed across nodes.
  </text>
  
  <line x1="205" y1="240" x2="205" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="240" x2="615" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="280" width="390" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Data Protection
  </text>
  <text x="205" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    N+M FEC: RAID across nodes
  </text>
  <text x="205" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SyncIQ: async replication
  </text>
  <text x="205" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapshotIQ: point-in-time
  </text>
  <text x="205" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SmartLock: WORM compliance
  </text>
  <text x="205" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudPools: S3 cold tier
  </text>
  
  <rect x="420" y="280" width="390" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management
  </text>
  <text x="615" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OneFS CLI: isi commands
  </text>
  <text x="615" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OneFS web UI: browser
  </text>
  <text x="615" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API: v12+
  </text>
  <text x="615" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    InsightIQ: analytics
  </text>
  <text x="615" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SmartConnect: DNS LB
  </text>
  
  <text x="10" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="455" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PowerScale nodes in rack; InfiniBand or 25GbE backend between nodes; dual-port
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    front-end Ethernet to client network; dedicated management Ethernet port.
  </text>
  
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerScale     = Dell scale-out NAS; formerly Isilon; runs OneFS OS
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OneFS          = PowerScale operating system; presents single namespace across nodes
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FEC            = Forward Error Correction; like RAID 5/6 but across multiple nodes
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SyncIQ         = async policy-based replication between PowerScale clusters
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SnapshotIQ     = point-in-time snapshot; no performance impact; schedule-based
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SmartLock      = WORM (Write Once Read Many) compliance; object immutability
  </text>
  <text x="10" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudPools     = auto-tier cold data to S3 (AWS, Azure, or ECS)
  </text>
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SmartConnect   = DNS-based client distribution across OneFS front-end nodes
  </text>
  <text x="10" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access zone    = logical tenant partition; own auth, protocols, IP range
  </text>
  <text x="10" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    H-series       = HDD-based capacity nodes; high density, moderate performance
  </text>
  <text x="10" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HDFS           = Hadoop Distributed Filesystem; PowerScale presents as HDFS
  </text>
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    isi commands   = OneFS CLI; isi status, isi volumes, isi sync policies
  </text>
  
  <rect x="0" y="690" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: PowerScale Architecture
  </text>
</svg>