<svg xmlns="http://www.w3.org/2000/svg" width="820" height="610" viewBox="0 0 820 610">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashArray — Escalation Process</text>

  <!-- Step 1 -->
  <rect x="20" y="50" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Check Pure1 for auto-opened case; if none, open case at support.purestorage.com</text>

  <!-- Arrow to Step 2 -->
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <rect x="20" y="120" width="780" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Pure TAC engineer reviews Pure1 telemetry + purediag bundle (P1: within 1 hr)</text>

  <!-- Arrow to Step 3 -->
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <rect x="20" y="190" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 1 hour for P1 or 4 hours for P2:</text>
  <text x="50" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add to case: "Requesting escalation to Senior Engineer / TAC Manager"</text>
  <text x="50" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[CT0 down / hosts have no I/O / 6 ESXi hosts affected]"</text>
  <text x="50" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Call support hotline to reinforce the escalation request</text>

  <!-- Arrow to Step 4 -->
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 4 -->
  <rect x="20" y="290" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Senior engineer assigned; they will initiate a remote session via Pure1 tooling</text>
  <text x="50" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SSH access to the array and web GUI available</text>
  <text x="50" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Confirm the purediag bundle was received (support engineer confirms via Pure1)</text>

  <!-- Arrow to Step 5 -->
  <line x1="410" y1="370" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 5 -->
  <rect x="20" y="390" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If hardware is confirmed failed:</text>
  <text x="50" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Pure dispatches a field engineer with replacement hardware</text>
  <text x="50" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ For Evergreen support: controller replacement is non-disruptive if one CT is still running</text>

  <!-- Arrow to Step 6 -->
  <line x1="410" y1="470" x2="410" y2="490" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Step 6 -->
  <rect x="20" y="490" width="780" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="515" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For P1 unresolved after 2 hours:</text>
  <text x="50" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact your Pure Account Executive (AE) directly</text>
  <text x="50" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ AE has an escalation path to VP of Customer Support for sustained P1 incidents</text>

  <!-- Footer -->
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>