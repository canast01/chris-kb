<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Aria Operations for Logs — Cluster Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Log Sources · Cluster (Master + Workers) · Outputs and Integrations</text>

  <!-- ═ COLUMN 1: Log Sources ═ (3-col: 250px, gap=15) -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#546e7a" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#546e7a"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Log Sources</text>
  <text x="145" y="111" text-anchor="middle" fill="#cfd8dc" font-size="9">Syslog · LI Agent · REST API</text>
  <rect x="30" y="126" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">ESXi — syslog (UDP/TCP 514)</text>
  <rect x="30" y="152" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">vCenter — syslog</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">NSX Manager / Edges</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Linux / Windows (LI Agent)</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">REST API (HTTP POST / CFapi)</text>
  <rect x="30" y="256" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Physical / network devices (syslog)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Syslog: UDP 514 / TCP 514</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">SSL syslog: TCP 1514</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">LI Agent: compression + TLS</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Content packs per product (VMware)</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Auto-discovery from vCenter</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">LI Agent preferred (structured logs)</text>

  <!-- ═ COLUMN 2: Cluster Nodes ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cluster Nodes</text>
  <text x="410" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Master + Workers · 3 min for HA</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Master Node (indexing + UI)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Worker Node 1 (throughput + store)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Worker Node 2 (throughput + store)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Integrated Load Balancer (ILB)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cassandra log index (hot tier)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NFS archive (warm / cold tier)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">HA cluster: ILB distributes ingestion</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Master: 16 vCPU / 32 GB / 1 TB disk</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Worker: 16 vCPU / 32 GB / 2 TB disk</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Anti-affinity rules on each node</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Scale: add workers for throughput</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Max ingestion ~75k events/sec per node</text>

  <!-- ═ COLUMN 3: Outputs ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Outputs &amp; Integrations</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Alerts · search · Aria Ops · SIEM</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Real-time log search (UI)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Alert rules → email / webhook</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Aria Operations integration</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Syslog forwarding (to SIEM)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">REST API (query + ingest)</text>
  <rect x="560" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NFS archive (long-term retention)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Launch-in-context with Aria Ops</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Dashboards with Aria Automation</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Forward to Splunk / QRadar / etc.</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Webhook: PagerDuty / ServiceNow</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">NFS: set per-partition retention</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">REST query for automation pipelines</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cluster Sizing Reference</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Deployment</text>
  <text x="310" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Nodes</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Max Events/sec</text>
  <text x="650" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">HA</text>
  <line x1="230" y1="516" x2="230" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="400" y1="516" x2="400" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Small (dev / lab)</text>
  <text x="310" y="562" text-anchor="middle" fill="#546e7a" font-size="9">1 (standalone)</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">~15k events/sec</text>
  <text x="650" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Production HA</text>
  <text x="310" y="587" text-anchor="middle" fill="#546e7a" font-size="9">3 (1 master + 2 workers)</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">~45k events/sec</text>
  <text x="650" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Large scale</text>
  <text x="310" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Up to 6 workers</text>
  <text x="480" y="613" text-anchor="middle" fill="#546e7a" font-size="9">~75k events/sec per node</text>
  <text x="650" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Disk (hot tier) per node</text>
  <text x="310" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Master: 1 TB</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Worker: 2 TB</text>
  <text x="650" y="639" text-anchor="middle" fill="#546e7a" font-size="9">NFS: unlimited</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Ingestion protocols</text>
  <text x="310" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Syslog UDP/TCP 514</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">SSL: TCP 1514</text>
  <text x="650" y="665" text-anchor="middle" fill="#546e7a" font-size="9">LI Agent + REST API</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Retention approach</text>
  <text x="310" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Hot: Cassandra on-disk</text>
  <text x="480" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Warm: NFS mount</text>
  <text x="650" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Policy per bucket/partition</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware Aria Operations for Logs Reference · Log Ingestion · Cluster Nodes · Alerts · SIEM Integration</text>
</svg>
