<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Amazon EVS — Authentication</text>
  
  <rect x="50" y="50" width="220" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="60" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Corporate IdP (Okta/Entra ID)</text>
  
  <line x1="160" y1="90" x2="160" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="165" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">SAML 2.0 federation</text>
  
  <rect x="50" y="120" width="220" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="60" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">AWS IAM Identity Center</text>
  
  <line x1="160" y1="160" x2="160" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="190" width="320" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="60" y="215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Permission Set: EVSFullAccess</text>
  <text x="250" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ EVS API (cluster management)</text>
  
  <rect x="50" y="240" width="320" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="60" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Permission Set: EVSReadOnly</text>
  <text x="250" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ EVS API (audit/monitoring)</text>
  
  <line x1="160" y1="280" x2="160" y2="310" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="310" width="320" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="60" y="335" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">(separate) SAML federation to vCenter SSO</text>
  
  <line x1="210" y1="350" x2="210" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="380" width="320" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="60" y="405" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vCenter → NSX-T (through vCenter-NSX trust)</text>
  
  <rect x="0" y="450" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Authentication Flow</text>
</svg>