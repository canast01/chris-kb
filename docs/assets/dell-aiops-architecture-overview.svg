<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Dell AIOps — Architecture Overview</text>

  <!-- Column 1: Data Sources (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Telemetry Sources</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerMax / VMAX arrays</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerStore / Unity XT</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerScale (Isilon) NAS</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerFlex / VxRail HCI</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="290" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Secure Connect Gateway (SCG)</text>
  <text x="145" y="302" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">on-premises telemetry relay</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">HTTPS outbound 443 only</text>

  <!-- Column 2: AI Pipeline (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Dell AI Pipeline (Cloud)</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">CloudIQ / APEX Console</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">SaaS portal &amp; AI dashboard</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Anomaly Detection Engine</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Root Cause Analysis (RCA)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="250" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Predictive Capacity Forecasting</text>
  <text x="412" y="262" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(ML time-series modelling)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Actionable Recommendations</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="330" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Topology-Aware Alerting</text>
  <text x="412" y="342" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(cross-system correlation)</text>

  <!-- Column 3: Outputs & Integrations (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Outputs &amp; Integrations</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Health Score Dashboard</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Email / Slack Alert Notifications</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">ServiceNow Incident Creation</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">CloudIQ REST API</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Auto Support Case Filing</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SIEM / Monitoring Integration</text>

  <!-- Component table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="200" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="500" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Role</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CloudIQ / APEX Console</text>
  <text x="500" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">SaaS portal — recommendations, anomaly dashboard, health scores</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="200" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Secure Connect Gateway (SCG)</text>
  <text x="500" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">On-premises telemetry collection and forwarding (customer-managed)</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Dell AI Pipeline</text>
  <text x="500" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Anomaly detection, RCA, and capacity forecasting (Dell-managed cloud)</text>

  <!-- AI Capabilities summary -->
  <rect x="20" y="520" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="540" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">AI Capabilities Summary</text>

  <rect x="20" y="550" width="250" height="40" fill="#f1f5f9"/>
  <text x="145" y="564" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Anomaly Detection</text>
  <text x="145" y="580" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">ML models trained on fleet-wide data</text>

  <rect x="287" y="550" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="564" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Root Cause Analysis</text>
  <text x="412" y="580" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">correlates events across components</text>

  <rect x="553" y="550" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="564" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Predictive Capacity</text>
  <text x="678" y="580" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">forecasts exhaustion dates</text>

  <rect x="20" y="602" width="250" height="40" fill="#ffffff"/>
  <text x="145" y="616" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Topology Awareness</text>
  <text x="145" y="632" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">maps alerts to infrastructure topology</text>

  <rect x="287" y="602" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="616" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Noise Reduction</text>
  <text x="412" y="632" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">suppresses related duplicate alerts</text>

  <rect x="553" y="602" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="616" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Actionable Insights</text>
  <text x="678" y="632" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">step-by-step remediation guidance</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
