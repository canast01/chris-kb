<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Terraform — Environment Setup</text>
  
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="200" fill="#ffffff" stroke="none" />
    
    <rect x="10" y="10" width="200" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="20" y="30" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">infra/</text>
    
    <rect x="30" y="50" width="250" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="40" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">main.tf</text>
    <text x="150" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f"># Core resource definitions</text>
    
    <rect x="30" y="90" width="250" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="40" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">variables.tf</text>
    <text x="150" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f"># Input variable declarations</text>
    
    <rect x="30" y="130" width="250" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="40" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">outputs.tf</text>
    <text x="150" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f"># Output value declarations</text>
    
    <rect x="30" y="170" width="250" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="40" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">providers.tf</text>
    <text x="150" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f"># Provider and backend configuration</text>
    
    <rect x="30" y="210" width="250" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="40" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">versions.tf</text>
    <text x="150" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f"># Terraform and provider version constraints</text>
    
    <rect x="30" y="250" width="250" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="40" y="270" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">terraform.tfvars</text>
    <text x="150" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f"># Variable values (never commit secrets here)</text>
  </g>
  
  <rect x="0" y="280" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Directory Structure Diagram</text>
</svg>