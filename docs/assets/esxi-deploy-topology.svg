<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">ESXi Deploy — Topology Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Physical Hardware · ESXi Software Layer · Management Access</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#37474f" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#37474f"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Physical Hardware</text>
  <text x="145" y="111" text-anchor="middle" fill="#b0bec5" font-size="9">Server · NICs · Storage</text>
  <rect x="30" y="126" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Server (HCL-listed x86-64)</text>
  <rect x="30" y="152" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">iDRAC / iLO (BMC out-of-band)</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">2+ NICs (10 GbE min)</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Boot device (SSD/USB/SD)</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Local or SAN storage</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Server: HCL validates driver compat</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">iDRAC/iLO: out-of-band power + KVM</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">NIC 1: management + VM traffic</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">NIC 2: vMotion + vSAN traffic</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Boot: persistent SSD recommended</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">SAN: FC/iSCSI HBA if needed</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">ESXi Software Layer</text>
  <text x="410" y="111" text-anchor="middle" fill="#90caf9" font-size="9">VMkernel + agents + datastores</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">ESXi VMkernel (type-1 hypervisor)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vmk0 (management IP)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSwitch0 (default switch)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VPXA (vCenter agent)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VMFS / NFS / vSAN datastores</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">VMkernel: no general-purpose OS</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">vmk0: primary IP, port 443 + 902</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">vSwitch0: vmnic0 uplink by default</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">VPXA: heartbeat to vCenter every 5 s</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">VMFS: auto-created on local disk</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">VIBs: NSX + vSAN install here</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Management Access</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Inbound management paths</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter (via VPXA agent)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">DCUI (Direct Console UI)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SSH (port 22, optional)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">esxcli (local or remote)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">iDRAC / iLO (hardware level)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">vCenter: primary admin path</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">DCUI: emergency network + password reset</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">SSH: enable only when needed</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">esxcli: scripting + diagnostics</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">iDRAC: power cycle, BIOS, KVM</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Syslog: forward to log aggregator</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">ESXi Management Port Reference</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Port</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Protocol</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Direction</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Purpose</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">22</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">SSH</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">Admin → ESXi</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">SSH shell (disabled by default)</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">80</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">HTTP</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">Any → ESXi</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">Redirect to 443</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">443</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">HTTPS</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">vCenter + admin</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">SOAP API + REST + vSphere UI</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">902</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">TCP</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">vCenter ↔ ESXi</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">VPXA heartbeat + NFC</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">8300</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">HTTPS</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">ESXi → vCenter</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">vSAN health reporting</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">9000-9100</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">TCP</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">Internal</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">ESXi service discovery</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware ESXi Topology Reference · VMkernel · VPXA · DCUI · SSH · VMFS · NFS · iDRAC</text>
</svg>