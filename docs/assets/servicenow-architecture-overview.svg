<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">ServiceNow — Architecture Overview</text>

  <!-- Column 1: SaaS Platform -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SaaS Platform</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">App Nodes (load balanced)</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Primary Database</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Replica Database</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Multi-Instance (per customer)</text>

  <!-- Column 2: MID Servers (On-Prem) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">MID Servers (On-Prem)</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">MID Server 1 (Java agent)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">MID Server 2 (HA)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">HTTPS outbound only</text>
  <text x="412" y="224" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(no inbound firewall rules)</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Discovery, Orchestration, IntHub</text>

  <!-- Column 3: ITSM Modules -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ITSM Modules</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">CMDB (Configuration Items)</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Incident Management</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Change Management</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Service Portal / Flow Designer</text>

  <!-- Comparison Table -->
  <rect x="20" y="330" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Attribute</text>
  <text x="310" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Dev Instance</text>
  <text x="510" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Test / UAT</text>
  <text x="701" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Production</text>

  <rect x="20" y="360" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Purpose</text>
  <text x="310" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Development &amp; initial test</text>
  <text x="510" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Validation before prod</text>
  <text x="701" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Live environment</text>

  <rect x="20" y="386" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Data</text>
  <text x="310" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Dev / synthetic</text>
  <text x="510" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Clone of prod</text>
  <text x="701" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Production data</text>

  <rect x="20" y="412" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Update Sets</text>
  <text x="310" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Created in Dev</text>
  <text x="510" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Imported &amp; tested</text>
  <text x="701" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Promoted from Test</text>

  <rect x="20" y="438" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">MID Servers</text>
  <text x="310" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Optional</text>
  <text x="510" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Match prod config</text>
  <text x="701" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Required for on-prem</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
