<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Cisco Nexus Dashboard — Architecture Overview</text>

  <!-- Column 1: Platform Cluster -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Platform Cluster</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">3-Node Cluster (Raft Consensus)</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Shared Identity &amp; RBAC</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">API Gateway (HTTPS)</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Microservice App Hosting</text>
  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="292" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Physical / Virtual / Cloud</text>
  <text x="145" y="304" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Form Factors</text>

  <!-- Column 2: Hosted Applications -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Hosted Applications</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">NDFC — Nexus Dashboard</text>
  <text x="412" y="144" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Fabric Controller (SAN + LAN)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">NDI — Insights (anomaly</text>
  <text x="412" y="184" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">detection, flow telemetry)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">NDO — Orchestrator</text>
  <text x="412" y="224" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(multi-site ACI + VXLAN)</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Unified Admin Portal</text>
  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Multi-Site Connectivity</text>

  <!-- Column 3: Managed Fabrics -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Managed Fabrics</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Cisco MDS SAN Fabric</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">ACI APIC Fabric</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Nexus NX-OS Fabric</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">VXLAN BGP-EVPN Fabric</text>
  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Multi-Site (NDO)</text>

  <!-- Comparison Table -->
  <rect x="20" y="360" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Attribute</text>
  <text x="310" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">NDFC</text>
  <text x="510" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">NDI</text>
  <text x="701" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">NDO</text>

  <rect x="20" y="390" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Function</text>
  <text x="310" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Fabric Management</text>
  <text x="510" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Observability</text>
  <text x="701" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Multi-site Policy</text>

  <rect x="20" y="416" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Target Fabric</text>
  <text x="310" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">SAN + LAN</text>
  <text x="510" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">ACI / NX-OS</text>
  <text x="701" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">ACI + VXLAN</text>

  <rect x="20" y="442" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Successor To</text>
  <text x="310" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">DCNM 11.x</text>
  <text x="510" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Network Assurance Engine</text>
  <text x="701" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">MSO</text>

  <rect x="20" y="468" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Protocol</text>
  <text x="310" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">SSH + SNMP</text>
  <text x="510" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">HTTPS + Streaming Telemetry</text>
  <text x="701" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">HTTPS to APIC</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
