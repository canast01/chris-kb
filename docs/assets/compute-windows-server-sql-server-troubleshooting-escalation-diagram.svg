<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SQL Server Escalation Process</text>
  
  <rect x="20" y="50" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at support.microsoft.com with error log + blocking + AG output attached</text>
  
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="130" width="780" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Microsoft CSS T1 engineer acknowledges (Sev A: &lt; 2 hr; Sev B: &lt; 4 hr)</text>
  
  <line x1="410" y1="190" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="210" width="780" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within 2 hours for Sev A:</text>
  <text x="40" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to SQL Server Senior Engineer"</text>
  <text x="40" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[service down / database suspect / AG primary lost / transaction log full]"</text>
  
  <line x1="410" y1="310" x2="410" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="330" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — SQL Server T2 Senior CSS Engineer assigned</text>
  <text x="40" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will review the error log and may request a live session</text>
  <text x="40" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SSMS and RDP access to the SQL Server host ready</text>
  
  <line x1="410" y1="410" x2="410" y2="430" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="430" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue involves a known SQL Server bug or regression (e.g. CU regression):</text>
  <text x="40" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ CSS escalates to SQL Server Engineering</text>
  <text x="40" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide a targeted hotfix build or workaround procedure</text>
  
  <line x1="410" y1="510" x2="410" y2="530" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="530" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="550" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For Sev A with data loss or service down &gt; 1 hour with no resolution:</text>
  <text x="40" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request CritSit escalation via the case</text>
  <text x="40" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact your Microsoft account team or Technical Account Manager</text>
  
  <rect x="0" y="590" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: SQL Server Escalation Process</text>
</svg>