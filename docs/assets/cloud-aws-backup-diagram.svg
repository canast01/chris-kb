<svg xmlns="http://www.w3.org/2000/svg" width="820" height="790" viewBox="0 0 820 790">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    AWS Backup Overview
  </text>
  
  <rect x="10" y="50" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AWS Backup — Centralised Backup Management Across AWS Services
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup Plans: define schedules, lifecycle, copy rules, and resource assignments per service
  </text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Supported resources: EC2 · EBS · RDS · Aurora · DynamoDB · EFS · FSx · S3 · Storage Gateway
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup Vaults: encrypted storage for recovery points; Vault Lock enforces immutable retention
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Compliance: backup reports via Audit Manager; cross-region and cross-account copy supported
  </text>

  <line x1="410" y1="150" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="180" x2="200" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="180" x2="620" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="200" width="220" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="60" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup Plans
  </text>
  <text x="60" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Rules: schedule + window
  </text>
  <text x="60" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lifecycle: warm → cold
  </text>
  <text x="60" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Resource assignment: tag
  </text>
  <text x="60" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Copy rules: X-region/acct
  </text>
  <text x="60" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Retention: daily/wk/mo/yr
  </text>

  <rect x="300" y="200" width="220" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="310" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup Vaults
  </text>
  <text x="310" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    KMS-encrypted storage
  </text>
  <text x="310" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Vault Lock: WORM policy
  </text>
  <text x="310" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cross-region copy vault
  </text>
  <text x="310" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access policy: IAM+vault
  </text>
  <text x="310" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Recovery point: RPO time
  </text>

  <rect x="550" y="200" width="220" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="560" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup Jobs
  </text>
  <text x="560" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Status: Completed/Failed
  </text>
  <text x="560" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Monitor: EventBridge events
  </text>
  <text x="560" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Alerts: CloudWatch alarms
  </text>
  <text x="560" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Restore testing: monthly
  </text>
  <text x="560" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Compliance: Audit Manager
  </text>

  <line x1="410" y1="320" x2="410" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="350" x2="200" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="350" x2="620" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="370" width="800" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Backup Plans   │  Backup Vaults   │    Backup Jobs    │ Restore Testing  │    Compliance
  </text>
  <text x="20" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Daily + weekly  │  KMS key assign  │   Monitor status  │  Restore by RPO  │  Audit reports
  </text>
  <text x="20" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cold lifecycle  │ Vault Lock WORM  │   Failed: retry?  │ Test validation  │  Coverage gaps
  </text>
  <text x="20" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tag-based assign │  X-region vault  │  EventBridge hook │    RTO verify    │  Backup report
  </text>
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Org-level plan  │  Access policy   │  Alert on failure │ Compliance test  │  Org framework
  </text>

  <rect x="10" y="480" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AWS Regions · S3-backed Backup Vaults · EC2/EBS/RDS source resources · KMS key infrastructure
  </text>

  <rect x="10" y="550" width="800" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="570" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup Plan    = Policy that defines backup rules: schedule, lifecycle, copy destinations, retention
  </text>
  <text x="20" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup Vault   = Encrypted container for recovery points; access controlled by vault policy + IAM
  </text>
  <text x="20" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Vault Lock     = WORM protection on a vault; prevents deletion even by account root; compliance mode
  </text>
  <text x="20" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Recovery Point = Snapshot/backup of a resource at a point in time; stored in vault; restorable
  </text>
  <text x="20" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup Job     = Single backup execution; status tracked as Pending/Running/Completed/Failed/Aborted
  </text>
  <text x="20" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Restore Job    = Recovery of a resource from a recovery point; creates a new resource copy
  </text>
  <text x="20" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPO            = Recovery Point Objective; maximum age of backup acceptable for restore after failure
  </text>
  <text x="20" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RTO            = Recovery Time Objective; maximum acceptable time to restore service after failure
  </text>
  <text x="20" y="705" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Lifecycle rule = Moves recovery points from warm (standard) to cold (cheaper) storage after N days
  </text>
  <text x="20" y="720" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    X-region copy  = Cross-region replication of recovery points for DR; configured in backup plan rule
  </text>
  <text x="20" y="735" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Audit Manager  = AWS service generating backup compliance reports against defined frameworks
  </text>
  <text x="20" y="750" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Backup Compliance Report= scheduled report showing backup coverage, job success rates, and gaps
  </text>

  <rect x="0" y="760" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="780" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: AWS Backup Overview
  </text>
</svg>