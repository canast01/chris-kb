<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Cloud Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Amazon Web Services · Microsoft Azure · Cloud AI &amp; LLM</text>

  <!-- COLUMN 1: AWS -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Amazon Web Services</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">EC2 · S3 · VPC · IAM · Amazon EVS</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">EC2 (compute instances)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">S3 (object storage)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VPC (virtual private cloud)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">IAM (identity &amp; access management)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Amazon EVS (VMware on AWS)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">EC2: instance types, AMIs, placement groups</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">S3: buckets, versioning, lifecycle, Object Lock</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">VPC: subnets, route tables, security groups</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">IAM: users, roles, policies, SCP (Org)</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Direct Connect: dedicated WAN to AWS</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">EVS: VMware VCF running on bare-metal EC2</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">EBS: block storage; gp3 standard for EC2</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">CloudTrail: API audit; CloudWatch: metrics</text>

  <!-- COLUMN 2: Azure -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Microsoft Azure</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">VMs · Blob · VNet · Entra ID · AVS</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Azure VMs (IaaS compute)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Blob Storage (object)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">VNet (virtual networking)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Entra ID (Microsoft Entra / AAD)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">AVS (Azure VMware Solution)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">VMs: D/E/F series; Av2 general purpose</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">Blob: LRS / ZRS / GRS redundancy tiers</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">VNet peering + private endpoints + ExpressRoute</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Entra ID: SSO, Conditional Access, MFA</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">NSG: network security group (L4 firewall)</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">AVS: VMware VCF private cloud on Azure</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Managed Disks: Premium SSD standard</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Monitor + Log Analytics: telemetry + KQL</text>

  <!-- COLUMN 3: Cloud AI & LLM -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cloud AI &amp; LLM</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Claude · GPT · Ollama · Bedrock · AI Studio</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Claude (Anthropic)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">GPT-4o / o3 (OpenAI)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Ollama (local LLM inference)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">AWS Bedrock (managed LLM APIs)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Azure AI Studio / OpenAI Service</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">Claude: Claude Code, API, Projects, claude.ai</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Ollama: pull + run models locally (GPU/CPU)</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Bedrock: Anthropic, Meta, Mistral via API</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">RAG: retrieval-augmented generation pattern</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Embeddings: vector search, semantic similarity</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Prompt engineering: context, CoT, few-shot</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">MCP: model context protocol for tool use</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Token limits: context window size matters</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cloud Platform Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="290" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">AWS</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Azure</text>
  <text x="665" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VMware Hybrid (EVS/AVS)</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Identity</text>
  <text x="290" y="562" text-anchor="middle" fill="#546e7a" font-size="9">IAM / SCP</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Entra ID / RBAC</text>
  <text x="665" y="562" text-anchor="middle" fill="#546e7a" font-size="9">vCenter SSO / AD integration</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">VMware integration</text>
  <text x="290" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Amazon EVS (VCF)</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">AVS (VCF)</text>
  <text x="665" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Native VCF on cloud bare-metal</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">WAN connectivity</text>
  <text x="290" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Direct Connect</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">ExpressRoute</text>
  <text x="665" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Same as parent cloud</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Object storage</text>
  <text x="290" y="639" text-anchor="middle" fill="#546e7a" font-size="9">S3</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Blob Storage</text>
  <text x="665" y="639" text-anchor="middle" fill="#546e7a" font-size="9">S3 or Blob (via parent)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">IaC tooling</text>
  <text x="290" y="665" text-anchor="middle" fill="#546e7a" font-size="9">CloudFormation / Terraform</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Bicep / Terraform</text>
  <text x="665" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Terraform + VMware provider</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Cloud Reference · AWS EC2/S3/VPC · Azure VMs/Blob/VNet · Amazon EVS · AVS · Ollama · Claude</text>
</svg>
