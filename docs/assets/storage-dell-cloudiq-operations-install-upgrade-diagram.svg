<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    CloudIQ — Lifecycle Management
  </text>
  <rect x="20" y="50" width="370" height="180" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Onboarding
  </text>
  <text x="205" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Create Dell account
  </text>
  <text x="205" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Register arrays
  </text>
  <text x="205" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Configure alerts
  </text>
  <text x="205" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Add users + roles
  </text>
  <text x="205" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Test webhook delivery
  </text>
  <rect x="430" y="50" width="370" height="180" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Ongoing Maintenance
  </text>
  <text x="615" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Monitor telemetry age
  </text>
  <text x="615" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Re-register if stale
  </text>
  <text x="615" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Update array firmware
  </text>
  <text x="615" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Rotate service account
  </text>
  <text x="615" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Annual access review
  </text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure:
  </text>
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudIQ is SaaS — no on-prem component to patch · array firmware controls telemetry client
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Telemetry age = Time since last successful push from array; stale &gt; 15 min triggers alert
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Re-registration = Removing and re-adding array to CloudIQ; resets telemetry stream
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Service account rotation = Changing Dell account password used for CloudIQ API access
  </text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access review = Auditing CloudIQ user list; removing departed staff and role changes
  </text>
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Array firmware = On-array software; update process depends on array model (PSTCLI, ESRS)
  </text>
  <text x="20" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS = EMC Secure Remote Services; gateway used by some older Dell arrays for telemetry
  </text>
  <text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudIQ SaaS = Hosted by Dell; no customer upgrade responsibility for the platform itself
  </text>
  <rect x="0" y="560" width="820" height="40" fill="#f5f7fa" />
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: CloudIQ — Install &amp; Upgrade
  </text>
</svg>