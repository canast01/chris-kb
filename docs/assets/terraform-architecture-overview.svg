<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Terraform — Architecture Overview</text>

  <!-- Column 1: CLI Workflow -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CLI Workflow</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">terraform init</text>
  <text x="145" y="144" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(download providers + modules)</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">terraform plan</text>
  <text x="145" y="184" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(generate execution plan)</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">terraform apply</text>
  <text x="145" y="224" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(mutate infrastructure)</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Workspaces (env isolation)</text>
  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Modules (reusable components)</text>

  <!-- Column 2: State & Locking -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">State &amp; Locking</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">S3 + DynamoDB (AWS)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Azure Blob (Azure)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">GCS (Google Cloud)</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Terraform Cloud / Enterprise</text>
  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="292" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">State Lock prevents concurrent</text>
  <text x="412" y="304" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">mutations</text>

  <!-- Column 3: Providers & APIs -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Providers &amp; APIs</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">AWS Provider (hashicorp/aws)</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Azure Provider (hashicorp/azurerm)</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">vSphere Provider</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">1,000+ Providers (registry)</text>
  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Go Plugin Architecture</text>

  <!-- Comparison Table -->
  <rect x="20" y="360" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Attribute</text>
  <text x="310" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">S3 + DynamoDB</text>
  <text x="510" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Azure Blob</text>
  <text x="701" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Terraform Cloud</text>

  <rect x="20" y="390" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Locking</text>
  <text x="310" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">DynamoDB item</text>
  <text x="510" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Blob lease</text>
  <text x="701" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Native (managed)</text>

  <rect x="20" y="416" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Best For</text>
  <text x="310" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">AWS-primary orgs</text>
  <text x="510" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Azure-primary orgs</text>
  <text x="701" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Multi-cloud / managed</text>

  <rect x="20" y="442" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Versioning</text>
  <text x="310" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">S3 versioning (manual)</text>
  <text x="510" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Blob versioning</text>
  <text x="701" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Built-in history</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
