<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">NSX — Architecture Planes</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Management Plane · Control Plane · Data Plane (DFW + Edge)</text>

  <!-- ═ COLUMN 1: Management Plane ═ (3-col layout: 250px each, gap=15) -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Management Plane</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">NSX Manager cluster (3 nodes)</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NSX Manager Node 1 (active)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NSX Manager Node 2</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NSX Manager Node 3</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Virtual IP (VIP) — single endpoint</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">REST API + UI</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Policy and intent API</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Northbound REST / vCenter plugin</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Active-standby with VIP</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">All nodes on separate ESXi hosts</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">VCF: managed by SDDC Manager</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Manages Transport Nodes + Edge</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">PKI / certificate management</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">Connects to vCenter for inventory</text>

  <!-- ═ COLUMN 2: Control Plane ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#6a1b9a" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Control Plane</text>
  <text x="410" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Transport Nodes · Overlay · Segments</text>
  <rect x="295" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Transport Nodes (ESXi hosts)</text>
  <rect x="295" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Overlay Transport Zone (Geneve)</text>
  <rect x="295" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VLAN Transport Zone</text>
  <rect x="295" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Segments (logical switches)</text>
  <rect x="295" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Tier-1 Gateways (distributed)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">Geneve encapsulation (UDP 6081)</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">VNI per logical segment</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">T1 routing runs on each ESXi host</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">No Edge Nodes needed for E-W</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">vDS or N-VDS as uplink</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">BFD for host liveness</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">CCP: distributed state sync</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">MTU 1600+ on underlay required</text>

  <!-- ═ COLUMN 3: Data Plane ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Data Plane</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">DFW (E-W) · Edge Nodes (N-S)</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Distributed Firewall (DFW)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Edge Nodes (VM or bare metal)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Tier-0 Gateway (BGP peering)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NAT / Load Balancer (Edge)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">IPsec / L2 VPN</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">DFW enforced at vNIC — no bypass</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">East-West: no Edge needed</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">North-South: via T0 on Edge Nodes</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Edge cluster: 2+ nodes (active/active)</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">T0 BGP ECMP for scale</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Gateway Firewall on T0/T1</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">IDS/IPS on DFW (Advanced)</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Physical network sees only VLAN</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Traffic Flow Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Flow Type</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Path</text>
  <text x="570" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Edge Nodes Required</text>
  <text x="730" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Firewall Enforcement</text>
  <line x1="230" y1="516" x2="230" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="660" y1="516" x2="660" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">VM-to-VM (same host)</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">vSwitch → DFW</text>
  <text x="570" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="730" y="562" text-anchor="middle" fill="#546e7a" font-size="9">DFW (at vNIC)</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">VM-to-VM (different host)</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Geneve overlay tunnel</text>
  <text x="570" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="730" y="587" text-anchor="middle" fill="#546e7a" font-size="9">DFW (at vNIC)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">VM to external (N-S)</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">T1 → T0 → Edge → physical</text>
  <text x="570" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="730" y="613" text-anchor="middle" fill="#546e7a" font-size="9">DFW + Gateway FW</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">NAT / Load Balancing</text>
  <text x="340" y="639" text-anchor="middle" fill="#546e7a" font-size="9">T0 or T1 on Edge</text>
  <text x="570" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="730" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Gateway Firewall</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Site-to-site VPN</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">IPsec on T0 Gateway</text>
  <text x="570" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="730" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Gateway Firewall</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">IDS / IPS</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">DFW (NSX Advanced)</text>
  <text x="570" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="730" y="691" text-anchor="middle" fill="#546e7a" font-size="9">DFW at vNIC</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware NSX Reference · Management Plane · Control Plane · Data Plane · DFW · Edge Nodes</text>
</svg>
