<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Compute Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Linux Server · Windows Server · Database Engines</text>

  <!-- COLUMN 1: Linux Server -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Linux Server</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">RHEL · Ubuntu · Rocky · Debian</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">RHEL / Rocky / AlmaLinux</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Ubuntu / Debian</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">systemd (service + boot management)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">SELinux / AppArmor (MAC)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">LVM + XFS / ext4</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">SSH + key auth: standard remote access</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">RHEL: enterprise lifecycle + FIPS support</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Kernel: sysctl tuning, hugepages, NUMA</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">journalctl: centralized systemd log</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Package mgmt: dnf (RHEL) / apt (Debian)</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Databases: MySQL / PostgreSQL on Linux</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">perf / sar / iostat: performance analysis</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">auditd: syscall + file access audit log</text>

  <!-- COLUMN 2: Windows Server -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Windows Server</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Server 2019 / 2022 · AD DS · Hyper-V</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Windows Server 2019 / 2022</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Active Directory Domain Services (AD DS)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Hyper-V (Type 1 hypervisor)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Group Policy (GPO)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SQL Server (database engine)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">RDP + NLA + Kerberos: standard access</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">PowerShell DSC: declarative configuration</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">LAPS: local admin password solution</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">WSUS: Windows patch management</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">WinRM: PS remoting (Invoke-Command)</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Event Viewer: system + security + app logs</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Performance Monitor: counter collection</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Defender AV + firewall: baseline hardening</text>

  <!-- COLUMN 3: Databases -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Database Engines</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">MySQL · PostgreSQL · SQL Server</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">MySQL / MariaDB (InnoDB engine)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">PostgreSQL (MVCC / WAL)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">SQL Server (Always On AG)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">GTID / Patroni / AG (HA replication)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">mysqldump / pg_dump / SQL Agent backup</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">MySQL: InnoDB; GTID replication recommended</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">PostgreSQL: process-per-connection; WAL</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">SQL Server: Always On AG + WSFC</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Buffer pool / shared_buffers: key tuning</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">EXPLAIN / EXPLAIN ANALYZE: query plans</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Slow query log: MySQL; auto_explain: PG</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">VACUUM: PG dead tuple cleanup (critical)</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">tempdb: SQL Server; multiple data files</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">OS Platform Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="290" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">RHEL / Rocky</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Ubuntu</text>
  <text x="665" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Windows Server</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Package manager</text>
  <text x="290" y="562" text-anchor="middle" fill="#546e7a" font-size="9">dnf / yum</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">apt / dpkg</text>
  <text x="665" y="562" text-anchor="middle" fill="#546e7a" font-size="9">winget / WSUS</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Remote access</text>
  <text x="290" y="587" text-anchor="middle" fill="#546e7a" font-size="9">SSH (port 22)</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">SSH (port 22)</text>
  <text x="665" y="587" text-anchor="middle" fill="#546e7a" font-size="9">RDP (3389) + WinRM</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Security framework</text>
  <text x="290" y="614" text-anchor="middle" fill="#546e7a" font-size="9">SELinux</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">AppArmor</text>
  <text x="665" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Defender + AD GPO</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Container runtime</text>
  <text x="290" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Podman / CRI-O</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Docker / containerd</text>
  <text x="665" y="639" text-anchor="middle" fill="#546e7a" font-size="9">CRI-O / Hyper-V</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Enterprise lifecycle</text>
  <text x="290" y="665" text-anchor="middle" fill="#546e7a" font-size="9">10-yr (RHEL) / 5-yr (Rocky)</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">5-yr LTS</text>
  <text x="665" y="665" text-anchor="middle" fill="#546e7a" font-size="9">5-yr mainstream + 5-yr extended</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Compute Reference · Linux · Windows Server · AD DS · MySQL · PostgreSQL · SQL Server</text>
</svg>
