  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Min 4 Hosts Required</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">Next-gen hardware required (HCL)</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">No disk groups — single pool</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Higher space efficiency vs OSA</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Snapshots: space-efficient</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">RAID-5: 4 hosts / RAID-6: 6 hosts</text>
