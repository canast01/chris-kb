  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">2-Node: ROBO / Branch</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">Stretched: metro distance only</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Stretched: low latency &lt; 5 ms RTT</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Witness: separate 3rd site / cloud</text>
