  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">RAID-1 / RAID-5 / RAID-6</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FTT=1 (RAID-1) default</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Min 3 hosts (RAID-1/FTT=1)</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Cache: ≥ 10% of capacity tier</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">All-flash or hybrid config</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">RAID-5 FTT=1: 4 hosts min</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">RAID-6 FTT=2: 6 hosts min</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Dedup + compress: all-flash only</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">vSAN health: continuous monitoring</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">SPBM policies per VM</text>
