  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">Per-site disk groups</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">NVMe required</text>
