<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    AWS Monitoring Overview
  </text>
  
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Monitoring — CloudWatch, CloudTrail, and EventBridge
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudWatch: metrics, logs, alarms, dashboards — native to every AWS service; no agent for
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudWatch Agent: installs on EC2 for OS-level metrics (memory, disk) and custom log forwarding
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudTrail: API audit log; every AWS API call recorded; multi-region trail ships to S3 +
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EventBridge: event bus routing rules to targets (Lambda, SNS, SQS, Step Functions,
  </text>

  <text x="410" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    CloudWatch collects metrics/logs · CloudTrail audits API calls
  </text>

  <line x1="205" y1="160" x2="205" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="160" x2="615" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="180" width="310" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    CloudWatch
  </text>
  <text x="205" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Metrics: service built-in
  </text>
  <text x="205" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Logs: groups + retention
  </text>
  <text x="205" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Alarms: threshold → SNS
  </text>
  <text x="205" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dashboards: metric tiles
  </text>
  <text x="205" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Metric filters: log→metric
  </text>

  <rect x="360" y="180" width="310" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="515" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    CloudTrail
  </text>
  <text x="515" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    API calls: all services
  </text>
  <text x="515" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Multi-region trail: org
  </text>
  <text x="515" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    S3: log delivery + lock
  </text>
  <text x="515" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Log integrity validation
  </text>
  <text x="515" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Athena: query trail logs
  </text>

  <rect x="670" y="180" width="310" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="825" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    EventBridge
  </text>
  <text x="825" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Event bus: default + custom
  </text>
  <text x="825" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Rules: event pattern match
  </text>
  <text x="825" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Targets: Lambda/SQS/SNS
  </text>
  <text x="825" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Schedule: cron-like rules
  </text>
  <text x="825" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    X-acct event bus pipe
  </text>

  <text x="410" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    CloudWatch collects and alerts · CloudTrail records who did what · EventBridge automates responses
  </text>

  <line x1="205" y1="310" x2="205" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="310" x2="410" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="310" x2="615" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="330" width="800" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    CloudWatch    │     CW Logs      │     CW Alarms     │    CloudTrail    │   EventBridge
  </text>
  <text x="410" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Metric: CPUUtil  │  Log group: 30d  │   Alarm: CPU&gt;80%  │  Org trail: all  │  Rule: EC2 stop
  </text>
  <text x="410" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dashboard: ops  │  Metric filter   │    Action: SNS    │   S3 delivery    │  Target: Lambda
  </text>
  <text x="410" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Agent: mem/disk  │ Insights: query  │  Composite alarm  │   Athena query   │  Schedule rule
  </text>
  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS Health: svc  │ Subscription flt │     OK → ALARM    │ Integrity check  │   X-acct pipe
  </text>

  <text x="410" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS CloudWatch backend · S3 for CloudTrail · EventBridge event bus infrastructure · SNS topics
  </text>

  <text x="410" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>

  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudWatch metrics = Time-series data from AWS services; 1-min granularity; stored 15 months
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Log group = CloudWatch Logs container for streams; retention 1 day–10 years or indefinite
  </text>
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Metric filter = Extracts numeric values from log events and publishes them as CloudWatch metrics
  </text>
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CW Alarm = Watches a metric or expression; transitions OK/ALARM/INSUFFICIENT; triggers
  </text>
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Composite alarm = AND/OR combination of alarms; reduces alert noise from correlated conditions
  </text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudTrail = Records management events (API calls) and optionally data events (S3/Lambda)
  </text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Org trail = Single CloudTrail covering all accounts in the AWS Organization; recommended
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Log file integrity = CloudTrail SHA-256 hash validation; detects tampered or deleted log files
  </text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EventBridge rule = Pattern-matches incoming events and routes them to one or more targets
  </text>
  <text x="410" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS Health = Service health and scheduled events for your specific AWS account and resources
  </text>
  <text x="410" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudWatch Agent = Daemon on EC2/on-prem; collects OS metrics (memory, disk) and custom log files
  </text>
  <text x="410" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Logs Insights = Interactive CloudWatch Logs query engine; KQL-like syntax; serverless execution
  </text>

  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: AWS Monitoring Overview
  </text>
</svg>