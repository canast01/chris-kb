<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Cisco Nexus Dashboard — Architecture Overview</text>

  <!-- Column 1: Cluster Infrastructure (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Cluster Infrastructure</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Nexus Dashboard Cluster</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(3 or 5 nodes — Raft consensus)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Physical / Virtual Appliance</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Management Network</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(external) + Data Network</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Kubernetes (internal)</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="290" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">3-node: standard production</text>
  <text x="145" y="302" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">5-node: multi-service / HA</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Web UI (HTTPS 443)</text>

  <!-- Column 2: Services (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Hosted Services</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">NDFC — Nexus Dashboard</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Fabric Controller (DCNM successor)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">NDI — Nexus Dashboard Insights</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">telemetry &amp; flow analysis</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="210" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">NDO — Nexus Dashboard</text>
  <text x="412" y="222" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Orchestrator (multi-site ACI)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Telemetry Streaming (gRPC)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Flow Analysis (NDF)</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Anomaly Detection (NDI)</text>

  <!-- Column 3: Managed Fabrics & Integration (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Fabrics &amp; Integration</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="130" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Cisco ACI Fabric</text>
  <text x="678" y="142" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(APIC integration)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">NX-OS Standalone Fabric</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">MDS (Fibre Channel fabric)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Email / PagerDuty Alerts</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">ServiceNow Integration</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">REST API (northbound)</text>

  <!-- Cluster sizing table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="145" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Cluster Size</text>
  <text x="450" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Use Case</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">3 nodes</text>
  <text x="450" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Standard production (NDFC or NDI, not both at scale)</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">5 nodes</text>
  <text x="450" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">HA / multi-service deployment (NDFC + NDI at scale)</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">1 node</text>
  <text x="450" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Lab only — not supported for production</text>

  <!-- NDI telemetry features -->
  <rect x="20" y="520" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="540" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Nexus Dashboard Insights (NDI) Capabilities</text>

  <rect x="20" y="550" width="250" height="40" fill="#f1f5f9"/>
  <text x="145" y="564" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Fabric-wide visibility</text>
  <text x="145" y="580" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">node, interface, EPG telemetry</text>

  <rect x="287" y="550" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="564" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Flow telemetry analysis</text>
  <text x="412" y="580" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Atomic Counter + ERSPAN</text>

  <rect x="553" y="550" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="564" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Anomaly scoring</text>
  <text x="678" y="580" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">ML-based baseline deviation</text>

  <rect x="20" y="602" width="250" height="40" fill="#ffffff"/>
  <text x="145" y="616" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Compliance checking</text>
  <text x="145" y="632" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">fabric config delta detection</text>

  <rect x="287" y="602" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="616" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Multi-site ACI (NDO)</text>
  <text x="412" y="632" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">stretch policies across DCs</text>

  <rect x="553" y="602" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="616" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">NDFC fabric controller</text>
  <text x="678" y="632" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">VXLAN EVPN provisioning</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
