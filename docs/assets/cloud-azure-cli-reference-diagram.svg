<svg xmlns="http://www.w3.org/2000/svg" width="820" height="770" viewBox="0 0 820 770">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Azure CLI Reference
  </text>
  
  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Azure CLI — az command-line tool for managing Azure resources
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Structured as: az &lt;group&gt; &lt;command&gt; [--options] — e.g. az vm list --resource-group myRG
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Auth: az login (browser) · az login --service-principal · az account set --subscription &lt;id&gt;
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Output formats: --output json (default) | table | tsv | yaml | none
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Query: --query uses JMESPath; e.g. --query "[?powerState==`VM running`].name" -o tsv
  </text>
  
  <text x="410" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    az CLI organises by resource type — vm, network, storage, account, backup, monitor, identity, aks
  </text>
  
  <line x1="150" y1="170" x2="150" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="170" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="170" x2="670" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="200" width="240" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="140" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Compute (VM/AKS)
  </text>
  <text x="140" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az vm list/show/start
  </text>
  <text x="140" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az vm stop/deallocate
  </text>
  <text x="140" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az vm resize/create
  </text>
  <text x="140" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az aks get-credentials
  </text>
  <text x="140" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az vm run-command
  </text>
  
  <rect x="290" y="200" width="240" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="410" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Storage / Disks
  </text>
  <text x="410" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az storage account ls
  </text>
  <text x="410" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az disk list/create
  </text>
  <text x="410" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az snapshot create
  </text>
  <text x="410" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az storage blob up/down
  </text>
  <text x="410" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az keyvault secret get
  </text>
  
  <rect x="560" y="200" width="240" height="120" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="680" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Identity / Network
  </text>
  <text x="680" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az ad user/group list
  </text>
  <text x="680" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az role assignment list
  </text>
  <text x="680" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az network vnet list
  </text>
  <text x="680" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az network nsg rule list
  </text>
  <text x="680" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az monitor alert list
  </text>
  
  <text x="410" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Compute CLI manages VMs/AKS · Storage CLI handles blobs and disks
  </text>
  
  <line x1="150" y1="350" x2="150" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="350" x2="410" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="350" x2="670" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="380" width="780" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Account      │ Virtual Machines │      Storage      │    Networking    │   Backup / KV
  </text>
  <text x="410" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az login     │   vm list --rg   │    blob upload    │    vnet list     │  backup item ls
  </text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    account set  │  vm start/stop   │   blob download   │   nsg rule add   │  kv secret get
  </text>
  <text x="410" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    account list │    vm resize     │    disk create    │     lb list      │  backup protect
  </text>
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    sp create    │    vm run-cmd    │    snapshot cp    │   vnet peering   │   kv key list
  </text>
  
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Azure Resource Manager API · Azure AD token endpoint · Azure CloudShell or local workstation
  </text>
  
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Azure CLI v2     = Current az CLI; install via Homebrew/apt/pip; az --version to verify
  </text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az login         = Browser-based interactive login; stores token in ~/.azure/; expires after 1 hour
  </text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Service principal= Non-human identity; use az login --service-principal for automation
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az account set   = Switch active subscription; use with --subscription &lt;name or id&gt;
  </text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    --resource-group = Required for most resource commands; shorthand --g; targets RG scope
  </text>
  <text x="410" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    --query          = JMESPath filter on JSON output; e.g. [].name for list of resource names
  </text>
  <text x="410" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    --output table   = Renders JSON as a formatted table; useful for terminal readability
  </text>
  <text x="410" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az vm run-command= Execute a script inside a VM via VM agent; works without SSH or port access
  </text>
  <text x="410" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az configure     = Set default resource group, output format, and location for the CLI session
  </text>
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudShell       = Browser-based shell in Azure portal; pre-authenticated; az available by default
  </text>
  <text x="410" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    --no-wait        = Submits a long-running operation without blocking the terminal; async execution
  </text>
  <text x="410" y="725" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    az find          = AI-powered CLI helper; suggests relevant commands for a given scenario
  </text>
  
  <rect x="0" y="740" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="760" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Azure CLI Reference
  </text>
</svg>