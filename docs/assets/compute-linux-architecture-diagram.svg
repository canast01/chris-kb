<svg xmlns="http://www.w3.org/2000/svg" width="820" height="790" viewBox="0 0 820 790">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Linux Platform Architecture Overview
  </text>
  
  <rect x="10" y="50" width="800" height="60" fill="#ffffff" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Linux underpins most infrastructure; RHEL/CentOS for enterprise, Ubuntu for cloud;
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    kernel + systemd + package manager form the core; network via NetworkManager or nmcli.
  </text>

  <rect x="10" y="120" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Distributions
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RHEL: enterprise production
  </text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CentOS Stream: upstream test
  </text>
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Ubuntu: cloud + DevOps
  </text>
  <text x="20" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Debian: stable/minimal
  </text>
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SLES: SAP + HPC workloads
  </text>

  <rect x="410" y="120" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Core Components
  </text>
  <text x="420" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Kernel: hardware abstraction
  </text>
  <text x="420" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    systemd: service manager
  </text>
  <text x="420" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    glibc: C standard library
  </text>
  <text x="420" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PAM: auth stack
  </text>
  <text x="420" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetworkManager: networking
  </text>

  <line x1="200" y1="260" x2="200" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="260" x2="600" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="300" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Package Management
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPM/DNF: RHEL/CentOS/SLES
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    APT/dpkg: Debian/Ubuntu
  </text>
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Subscription: RHEL + SLES
  </text>
  <text x="20" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Repos: local mirror or CDN
  </text>
  <text x="20" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Errata: security + bug fixes
  </text>

  <rect x="410" y="300" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Storage and Security
  </text>
  <text x="420" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LVM: logical volumes
  </text>
  <text x="420" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ext4/XFS: filesystems
  </text>
  <text x="420" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SELinux/AppArmor: MAC
  </text>
  <text x="420" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    firewalld/nftables: FW
  </text>
  <text x="420" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SSH: remote access (22)
  </text>

  <rect x="10" y="460" width="800" height="60" fill="#ffffff" />
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="495" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    x86-64 or ARM64 bare metal or VM; NIC (1/10/25GbE); local disk or SAN/NAS;
  </text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IPMI/iDRAC/iLO for OOB management; firmware and BIOS managed separately.
  </text>

  <rect x="10" y="530" width="800" height="155" fill="#ffffff" />
  <text x="20" y="550" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RHEL = Red Hat Enterprise Linux; subscription required; 10-year support
  </text>
  <text x="20" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    systemd = Linux init system and service manager; PID 1; unit files
  </text>
  <text x="20" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DNF = package manager for RHEL 8+; replaces yum
  </text>
  <text x="20" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LVM = Logical Volume Manager; flexible disk partitioning
  </text>
  <text x="20" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SELinux = Security-Enhanced Linux; Mandatory Access Control by policy
  </text>
  <text x="20" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PAM = Pluggable Authentication Modules; Linux auth stack
  </text>
  <text x="20" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    glibc = GNU C Library; fundamental library all Linux programs use
  </text>
  <text x="20" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NetworkManager = service that manages network interfaces and connections
  </text>
  <text x="20" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    firewalld = RHEL firewall daemon; zones and rules; wraps nftables/iptables
  </text>
  <text x="20" y="705" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    XFS = default filesystem for RHEL 7+; high performance, no shrink
  </text>
  <text x="20" y="720" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Subscription = RHEL/SLES entitlement; required for security patches
  </text>
  <text x="20" y="735" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Errata = security advisory with associated package updates
  </text>

  <rect x="0" y="750" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="770" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Linux Platform Architecture Overview
  </text>
</svg>