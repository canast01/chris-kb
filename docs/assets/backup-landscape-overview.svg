  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">DR Drill · Immutable Recovery · IRE</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">DR drill scheduling + execution</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Instant recovery (Veeam)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Isolated Recovery Environment (IRE)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Ransomware recovery workflow</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Recovery validation (boot test)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">DR drill: annual minimum; test full runbook</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Veeam Instant Recovery: boot VM from backup</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">IRE: air-gapped isolated VLAN for clean restore</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Ransomware: identify clean restore point first</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Boot test: verify guest OS + app startup</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">SureBackup (Veeam): automated boot test</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">Recovery metrics: actual vs target RPO/RTO</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Post-drill report: gaps + remediation actions</text>

