  <text x="290" y="562" text-anchor="middle" fill="#546e7a" font-size="9">VMware / Hyper-V</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Multi-workload enterprise</text>
  <text x="665" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Large-scale enterprise</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Instant recovery</text>
  <text x="290" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Yes (boot from backup)</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Yes (IntelliSnap)</text>
  <text x="665" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Yes (Instant Access)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Cloud integration</text>
  <text x="290" y="614" text-anchor="middle" fill="#546e7a" font-size="9">S3 / Azure / GCS</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">S3 / Azure / GCS</text>
  <text x="665" y="614" text-anchor="middle" fill="#546e7a" font-size="9">S3 / Azure</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Dedup</text>
  <text x="290" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Inline + target</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Source + target</text>
  <text x="665" y="639" text-anchor="middle" fill="#546e7a" font-size="9">MSDP target dedup</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Licensing model</text>
  <text x="290" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Per-socket / per-workload</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Capacity / entity-based</text>
  <text x="665" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Front-end / back-end TB</text>
