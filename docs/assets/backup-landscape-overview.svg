<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Backup &amp; DR Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Backup Products · DR Design · Recovery Testing &amp; IRE</text>

  <!-- COLUMN 1: Backup Products -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Backup Products</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Veeam · Commvault · NetBackup · NDMP</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Veeam Backup &amp; Replication</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Commvault (enterprise data protection)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Veritas NetBackup</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NDMP (NAS / filer backup)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cloud targets (S3 / Azure Blob / GCS)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Veeam: VMware + Hyper-V + agent backup</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">CBT: Changed Block Tracking for incremental</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Commvault: multi-workload: VMs, DBs, NAS</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">NetBackup: enterprise scale + policy engine</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">NDMP: 3-way: client → tape, or local dump</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">3-2-1 rule: 3 copies, 2 media, 1 offsite</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">Immutable backups: S3 Object Lock / WORM</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">Dedup + compression reduce storage 20-50x</text>

  <!-- COLUMN 2: DR Design -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">DR Design</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">SRM · vSphere Replication · RPO/RTO</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">VMware SRM (Site Recovery Manager)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSphere Replication (hypervisor-based)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">RPO / RTO target setting</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">DR runbooks (planned failover / failback)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Array-based replication (SAN)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">SRM: orchestrated failover per protection group</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">vSphere Rep: RPO 5 min; no storage array req</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">RPO: max data loss tolerated (time units)</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">RTO: max downtime allowed for recovery</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Active-passive: cold standby; lower cost</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Active-active: stretched cluster; near-zero RTO</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">DR drill: non-disruptive test in SRM sandbox</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">DRP document: roles, steps, escalation paths</text>

  <!-- COLUMN 3: Recovery Testing & IRE -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
