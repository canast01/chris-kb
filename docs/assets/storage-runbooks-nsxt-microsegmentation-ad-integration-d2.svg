<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    DFW POLICY ORDER (top to bottom)
  </text>
  
  <rect x="10" y="40" width="800" height="150" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Section: NSX-Microseg-Allow
  </text>
  
  <rect x="20" y="70" width="780" height="110" rx="6" fill="#ffffff" stroke="#1565c0" />
  <text x="30" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Rule  Name         Src            Dst         Svc     Action
  </text>
  <text x="30" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    10   web-to-app   sg-web-servers sg-app-srvs TCP 8080 Allow
  </text>
  <text x="30" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    20   app-to-db    sg-app-servers sg-db-srvs  TCP 5432 Allow
  </text>
  <text x="30" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    30   mgmt-to-all  sg-jumpbox     Any         TCP 22   Allow
  </text>
  <text x="30" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    40   health-check sg-lb-nodes    sg-web-srvs TCP 80   Allow
  </text>
  
  <rect x="10" y="200" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Section: NSX-Microseg-Deny
  </text>
  
  <rect x="20" y="230" width="780" height="20" rx="6" fill="#ffffff" stroke="#3949ab" />
  <text x="30" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    90   deny-east-w  Any            Any         Any     Drop
  </text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: NSX-T Microsegmentation with Active Directory Integration
  </text>
</svg>