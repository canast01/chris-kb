<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Ceph Deployment
  </text>
  <rect x="10" y="50" width="800" height="250" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Ceph Deployment with cephadm
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    cephadm manages Ceph daemons as containers (Podman/Docker)
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Sequence: bootstrap first MON → add hosts → add MONs → add OSDs → pools
  </text>
  <text x="410" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Bootstrap: cephadm bootstrap --mon-ip &lt;ip&gt; --cluster-network &lt;CIDR&gt;
  </text>
  <text x="410" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Validation: HEALTH_OK + all OSDs up+in + PGs all active+clean
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    cephadm = Ceph Admin tool; deploys and manages Ceph daemons as containers
  </text>
  <text x="20" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Bootstrap = First command; creates initial MON + MGR on one node
  </text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    noout flag = Prevent OSDs from being marked out during maintenance
  </text>
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Ceph Deployment
  </text>
</svg>