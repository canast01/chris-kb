<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Ceph Distributed Storage
  </text>
  
  <rect x="10" y="40" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Ceph — Open-source Distributed Storage System
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Provides block (RBD), file (CephFS), and object (RGW/S3) from one cluster
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RADOS: object store engine; CRUSH: placement algorithm without metadata server
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OSD: 1 per disk; MON: 3-5 for quorum; MGR: 2 for orchestration + dashboard
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Replication: N copies (replica pool) or erasure coding (k+m chunks)
  </text>

  <line x1="205" y1="150" x2="205" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="150" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="150" x2="615" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="180" width="150" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="125" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Block (RBD)
  </text>
  <text x="125" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Thin-prov images
  </text>
  <text x="125" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Snapshots + clones
  </text>
  <text x="125" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    K8s CSI / OpenStack
  </text>

  <rect x="325" y="180" width="150" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="400" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    File (CephFS)
  </text>
  <text x="400" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    POSIX filesystem
  </text>
  <text x="400" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MDS for namespace
  </text>
  <text x="400" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NFS-Ganesha export
  </text>

  <rect x="600" y="180" width="170" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="685" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Object (RGW)
  </text>
  <text x="685" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    S3/Swift compatible
  </text>
  <text x="685" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    radosgw-admin users
  </text>
  <text x="685" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Bucket lifecycle/quota
  </text>

  <line x1="125" y1="260" x2="125" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="400" y1="260" x2="400" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="685" y1="260" x2="685" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="50" y="290" width="350" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="225" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    RADOS Layer
  </text>
  <text x="225" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Object store (all pools)
  </text>
  <text x="225" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CRUSH placement algo
  </text>
  <text x="225" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PG replication/EC
  </text>
  <text x="225" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Self-healing recovery
  </text>

  <rect x="450" y="290" width="320" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="610" y="310" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Daemon Layer
  </text>
  <text x="610" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OSD: 1 per disk
  </text>
  <text x="610" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MON: cluster map quorum
  </text>
  <text x="610" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MGR: metrics + orchestration
  </text>
  <text x="610" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    cephadm: container mgmt
  </text>

  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Key terms:
  </text>
  <text x="10" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RADOS = Reliable Autonomic Distributed Object Store; storage engine for all Ceph services
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OSD = Object Storage Daemon; one per disk; stores data + handles replication/recovery
  </text>
  <text x="10" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CRUSH = Controlled Replication Under Scalable Hashing; placement algorithm (no lookup)
  </text>
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PG = Placement Group; unit of replication; ~100 per OSD; maps to set of OSDs
  </text>
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    BlueStore = Default OSD backend; raw block device; superior to older FileStore/XFS
  </text>

  <rect x="0" y="510" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Ceph Distributed Storage
  </text>
</svg>