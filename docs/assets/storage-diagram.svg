  </text>
  <text x="140" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FlashArray &amp; FlashBlade
  </text>
  <text x="140" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Capacity &amp; performance
  </text>
  <text x="140" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Proactive support alerts
  </text>

  <rect x="290" y="50" width="240" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Unisphere / CloudIQ
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Unisphere: array admin UI
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CloudIQ: cloud analytics
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Health scoring &amp; forecast
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API &amp; automation
  </text>

  <rect x="560" y="50" width="240" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="680" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    ONTAP System Manager
  </text>
  <text x="680" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Browser-based admin UI
  </text>
  <text x="680" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Volume, LUN &amp; quota mgmt
  </text>
  <text x="680" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ActiveIQ: cloud analytics
  </text>
  <text x="680" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Proactive health alerting
  </text>

  <text x="410" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management planes connect to arrays via HTTPS / REST APIs
  </text>

  <!-- Connection Lines -->
  <line x1="140" y1="150" x2="140" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="150" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="680" y1="150" x2="680" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Storage Arrays -->
  <rect x="20" y="190" width="240" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="140" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Pure FlashArray
  </text>
  <text x="140" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    All-flash block storage
  </text>
  <text x="140" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC · iSCSI · NVMe-oF
  </text>
  <text x="140" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Always-on dedup + comp
  </text>
  <text x="140" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ActiveCluster: active-active
  </text>
  <text x="140" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SafeMode: immutable snaps
  </text>

  <rect x="290" y="190" width="240" height="120" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Dell PowerMax / VMAX
  </text>
  <text x="410" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Mission-critical block
  </text>
  <text x="410" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC · iSCSI · NVMe/FC
  </text>
  <text x="410" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SRDF: sync replication
  </text>
  <text x="410" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dynamic tiering + cache
  </text>
  <text x="410" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerPath: multipathing
  </text>

  <rect x="560" y="190" width="240" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="680" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    NetApp ONTAP
  </text>
  <text x="680" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Unified block + file
  </text>
  <text x="680" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC · iSCSI · NFS · SMB
  </text>
  <text x="680" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapMirror: replication
  </text>
  <text x="680" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapCenter: backup mgmt
  </text>
  <text x="680" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FabricPool: cloud tiering
  </text>

  <text x="410" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Arrays expose LUNs (block) or volumes (file) to hosts and VMs via storage protocols
  </text>

  <!-- Connection Lines -->
  <line x1="140" y1="310" x2="140" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="310" x2="410" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="680" y1="310" x2="680" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Specialty Platforms -->
  <rect x="20" y="350" width="240" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="140" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Pure FlashBlade
  </text>
  <text x="140" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Scale-out file + object
  </text>
  <text x="140" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NFS · SMB · S3 protocols
  </text>
  <text x="140" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Unstructured data at scale
  </text>
  <text x="140" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Rapid Restore: backup
  </text>

  <rect x="290" y="350" width="240" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="410" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    PowerScale / Data Domain
  </text>
  <text x="410" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PowerScale: scale-out NAS
  </text>
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Data Domain: dedup backup
  </text>
  <text x="410" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NFS · SMB · DD Boost
  </text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Multi-PB capacity scaling
  </text>

  <rect x="560" y="350" width="240" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="680" y="370" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Keystone / StorageGRID
  </text>
  <text x="680" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Keystone: STaaS model
  </text>
  <text x="680" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    StorageGRID: object store
  </text>
  <text x="680" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cloud Volumes ONTAP
  </text>
  <text x="680" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Snap replication + backup
  </text>

  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Specialty platforms handle unstructured data, backup, and cloud-connected workloads
  </text>

  <!-- Connection Lines -->
  <line x1="140" y1="450" x2="140" y2="480" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="450" x2="410" y2="480" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="680" y1="450" x2="680" y2="480" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Protocols -->
  <rect x="20" y="490" width="780" height="90" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Fibre Channel   │      iSCSI       │        NFS        │    SMB / CIFS    │   S3 / Object
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SAN block access │ IP block access  │  Unix file mounts │  Windows shares  │REST object store
  </text>
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    16G · 32G · 64G  │  TCP/IP · iSNS   │   NFS v3 · v4.1   │   CIFS · DFS-N   │HTTP · REST · SDK
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HBA → SAN switch │ iSCSI initiator  │    Mount via IP   │   SMB sessions   │Buckets + prefixes
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Zoning + masking │ CHAP auth + iSNS │  Export policies  │ Share perms+ACL  │  Policies + IAM
  </text>

  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NVMe/SSD drives · FC HBAs (16G/32G) · 10/25/100 GbE NICs · SAN switches · Power &amp; Cooling
  </text>

  <text x="410" y="625" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>

  <text x="410" y="640" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LUN          = Logical Unit Number; a block device exposed by a storage array via FC or iSCSI
  </text>
  <text x="410" y="655" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SAN          = Storage Area Network; dedicated high-speed network carrying block storage traffic
  </text>
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NAS          = Network Attached Storage; file-level storage served over IP via NFS or SMB
  </text>
  <text x="410" y="685" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC           = Fibre Channel; high-speed block protocol using HBAs, SAN switches, and WWPN zoning
  </text>
  <text x="410" y="700" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    iSCSI        = Internet SCSI; block storage over standard TCP/IP — no specialised hardware required
  </text>
  <text x="410" y="715" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NFS          = Network File System; Unix/Linux file protocol; mounts remote directories over IP
  </text>
  <text x="410" y="730" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SMB          = Server Message Block; Windows file-sharing protocol, also known as CIFS
  </text>
  <text x="410" y="745" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SRDF         = Symmetrix Remote Data Facility; Dell EMC sync replication between PowerMax arrays
  </text>
  <text x="410" y="760" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SnapMirror   = NetApp replication engine; copies volumes between ONTAP systems or to cloud
  </text>
  <text x="410" y="775" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SafeMode     = Pure Storage immutable snapshot feature; protects data against ransomware deletion
  </text>
  <text x="410" y="790" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ActiveCluster= Pure active-active stretch cluster; I/O served from both sites simultaneously
  </text>
  <text x="410" y="805" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Dedup        = Deduplication; eliminates duplicate data blocks to reduce raw capacity consumption
  </text>
  <text x="410" y="820" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FabricPool   = NetApp tiering; auto-moves cold blocks to S3-compatible object storage
  </text>
  <text x="410" y="835" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ONTAP        = NetApp unified storage OS running on FAS, AFF, Cloud Volumes, and StorageGRID
  </text>
  <text x="410" y="850" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DD Boost     = Data Domain client-side dedup; reduces backup data transferred over the network
  </text>
  <text x="410" y="865" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Keystone     = NetApp STaaS subscription; on-prem arrays billed like cloud consumption
  </text>

  <rect x="0" y="880" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="895" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Enterprise Storage Landscape
  </text>
</svg>