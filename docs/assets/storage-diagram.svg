<svg xmlns="http://www.w3.org/2000/svg" width="820" height="910" viewBox="0 0 820 910">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Enterprise Storage Landscape
  </text>
  
  <!-- Management Planes -->
  <rect x="20" y="50" width="240" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="140" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Pure1
  </text>
  <text x="140" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
