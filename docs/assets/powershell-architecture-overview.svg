<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">PowerShell — Architecture Overview</text>

  <!-- Column 1: Execution Engine -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Execution Engine</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Lexer, Parser &amp; AST</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Runspace (execution context)</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Pipeline Processor (objects)</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">.NET Runtime (PS 7+: .NET 6+)</text>
  <text x="145" y="264" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(.NET Framework 4.x: PS 5.1)</text>
  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Error Stream &amp; $Error[]</text>

  <!-- Column 2: Module System -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Module System</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">PSGallery (public repository)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">VMware PowerCLI</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Az Module (Azure)</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">AWS Tools for PowerShell</text>
  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">DSC (Desired State Config)</text>

  <!-- Column 3: Remoting & Targets -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Remoting &amp; Targets</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">WinRM (5985 HTTP / 5986 HTTPS)</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SSH Remoting (PS 7+)</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">PSSession (persistent)</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Invoke-Command (fan-out)</text>
  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Runspace Pool (parallel)</text>

  <!-- Comparison Table -->
  <rect x="20" y="360" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Attribute</text>
  <text x="310" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Windows PowerShell 5.1</text>
  <text x="510" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">PowerShell 7+</text>
  <text x="701" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">VMware PowerCLI</text>

  <rect x="20" y="390" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Runtime</text>
  <text x="310" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">.NET Framework 4.x</text>
  <text x="510" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">.NET 6 / 7 / 8</text>
  <text x="701" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">On PS 5.1 or 7+</text>

  <rect x="20" y="416" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Platforms</text>
  <text x="310" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Windows only</text>
  <text x="510" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Win / Linux / macOS</text>
  <text x="701" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Win / Linux / macOS</text>

  <rect x="20" y="442" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Status</text>
  <text x="310" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Maintenance only</text>
  <text x="510" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Active development</text>
  <text x="701" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Active (13.x+)</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
