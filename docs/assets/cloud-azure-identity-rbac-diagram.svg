<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Scope hierarchy (broader → narrower):</text>
  
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="200" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Management Group</text>
  </g>
  
  <g transform="translate(80, 110)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-30" y="10" width="260" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Subscription</text>
  </g>
  
  <g transform="translate(110, 170)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-60" y="10" width="320" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Resource Group</text>
  </g>
  
  <g transform="translate(140, 230)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="-90" y="10" width="380" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Resource</text>
  </g>
  
  <rect x="0" y="270" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Azure RBAC Scope Hierarchy</text>
</svg>