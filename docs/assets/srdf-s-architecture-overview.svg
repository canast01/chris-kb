<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">SRDF/S — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Production Site A</text>

  <!-- Col 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Production Hosts</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerMax R1</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Write Acknowledged</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(only after R2 commit)</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Synchronous Link</text>

  <!-- Col 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">RTT ≤10ms Required</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(hard constraint)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Write Commit Both Sides</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(R1 + R2 before ACK)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">No Delta Buffer</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DR Site B</text>

  <!-- Col 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="130" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">PowerMax R2</text>
  <text x="678" y="142" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(read-only, Synchronized)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Standby Hosts</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Zero RPO Guarantee</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(RPO = 0)</text>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="160" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SRDF/S</text>
  <text x="420" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SRDF/A</text>
  <text x="680" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SRDF/Metro</text>

  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="557" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">RPO</text>
  <text x="160" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero</text>
  <text x="420" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">~30 seconds (last cycle)</text>
  <text x="680" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero (active-active)</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="583" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">RTT Requirement</text>
  <text x="160" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">≤10ms (mandatory)</text>
  <text x="420" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">No RTT limit (async)</text>
  <text x="680" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">≤5ms (metro only)</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="609" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Performance Impact</text>
  <text x="160" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">High — write latency added</text>
  <text x="420" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low — DSE buffers bursts</text>
  <text x="680" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Minimal — transparent I/O</text>

  <rect x="20" y="618" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Failover Mode</text>
  <text x="160" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Planned or unplanned failover</text>
  <text x="420" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Failover after cycle completes</text>
  <text x="680" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">No failover needed (active-active)</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
