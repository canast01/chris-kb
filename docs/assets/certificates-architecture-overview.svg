<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">PKI / Certificates — Architecture Overview</text>

  <!-- Column 1: PKI Hierarchy (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PKI Hierarchy</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Root CA</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(offline / air-gapped, HSM)</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Intermediate CA</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(internal issuing — ADCS)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Issuing CA — External</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(DigiCert / Entrust)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Server Certificates</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Client / User Certificates</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Code Signing Certificates</text>

  <!-- Column 2: ADCS Components (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ADCS Components</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Certificate Authority (CA) Role</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Certificate Templates</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="210" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Auto-Enrollment</text>
  <text x="412" y="222" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(Group Policy)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Web Enrollment (certsrv)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">CEP / CES (REST enrollment)</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Venafi TPP Integration</text>

  <!-- Column 3: Revocation & Lifecycle (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Revocation &amp; Lifecycle</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">CRL Distribution Point (CDP)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">OCSP Responder (real-time)</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">AIA (Authority Info Access)</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">published via HTTP</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Certificate Expiry Monitoring</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Auto-Renewal (Venafi / ADCS)</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">HSM Key Storage</text>

  <!-- Comparison table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="145" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PKI Tier</text>
  <text x="380" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Role</text>
  <text x="630" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Connectivity</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Root CA</text>
  <text x="380" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Trust anchor; signs Issuing CA certs</text>
  <text x="630" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Offline / air-gapped</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Issuing CA (ADCS)</text>
  <text x="380" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Day-to-day internal certificate issuance</text>
  <text x="630" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Online</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Issuing CA (Commercial)</text>
  <text x="380" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Public / external trusted certificates</text>
  <text x="630" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Online (via API)</text>

  <rect x="20" y="498" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">OCSP Responder</text>
  <text x="380" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Real-time revocation status</text>
  <text x="630" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Online (HTTP)</text>

  <rect x="20" y="524" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CRL Distribution Point</text>
  <text x="380" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Signed revocation list, published on schedule</text>
  <text x="630" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Online (HTTP / LDAP)</text>

  <!-- Key info row -->
  <rect x="20" y="572" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="592" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Certificate Validity &amp; Lifecycle Guidance</text>

  <rect x="20" y="602" width="250" height="26" fill="#f1f5f9"/>
  <text x="145" y="619" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Root CA: 10–20 yr validity</text>
  <rect x="287" y="602" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="619" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Issuing CA: 5–10 yr validity</text>
  <rect x="553" y="602" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="619" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">End-entity: 1–2 yr validity</text>

  <rect x="20" y="628" width="250" height="26" fill="#ffffff"/>
  <text x="145" y="645" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CRL: published every 1–7 days</text>
  <rect x="287" y="628" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="645" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">OCSP: 24 hr response validity</text>
  <rect x="553" y="628" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="645" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Alert threshold: 30 days before expiry</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
