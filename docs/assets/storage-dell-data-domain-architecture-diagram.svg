<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell Data Domain — Backup Appliance Architecture
  </text>
  
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="400" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="200" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      Core Architecture
    </text>
    <text x="200" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      PBBA: optimized for backup IO
    </text>
    <text x="200" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Inline dedup: before writing
    </text>
    <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Typical ratio: 20:1 to 65:1
    </text>
    <text x="200" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DDVE: virtual edition (VM)
    </text>
    <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DD OS: purpose-built OS
    </text>
  </g>
  
  <g transform="translate(420, 40)">
    <rect x="0" y="0" width="400" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="200" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      Data Paths
    </text>
    <text x="200" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DD Boost: OST plugin on client
    </text>
    <text x="200" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      NFS/CIFS: legacy backup apps
    </text>
    <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DD VTL: virtual tape library
    </text>
    <text x="200" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Boost FC: FC-attached option
    </text>
    <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      S3: object interface (DDVE)
    </text>
  </g>
  
  <line x1="210" y1="160" x2="210" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="610" y1="160" x2="610" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 210)">
    <rect x="0" y="0" width="400" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="200" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      Replication (DD Replicator)
    </text>
    <text x="200" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      AIR: Automatic Image Repl
    </text>
    <text x="200" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Dir-to-dir or MTree replica
    </text>
    <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Collection replication: full
    </text>
    <text x="200" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Cascade: A → B → C chain
    </text>
    <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      Cloud tier: S3 cold tier
    </text>
  </g>
  
  <g transform="translate(420, 210)">
    <rect x="0" y="0" width="400" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="200" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
      Management
    </text>
    <text x="200" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DD OS CLI: ddsh shell
    </text>
    <text x="200" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DD System Manager: web UI
    </text>
    <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      DD Mgmt Center: multi-system
    </text>
    <text x="200" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      REST API v2.1: automation
    </text>
    <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
      SNMP: monitoring integration
    </text>
  </g>
  
  <g transform="translate(10, 340)">
    <text x="0" y="15" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Physical Infrastructure (the hardware everything above runs on):
    </text>
    <text x="0" y="30" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DD appliance (DD6300/DD9300/DD9900) or DDVE VM; FC or Ethernet to backup servers;
    </text>
    <text x="0" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      replication link: WAN between primary and DR site DD appliances.
    </text>
  </g>
  
  <g transform="translate(10, 380)">
    <text x="0" y="15" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Key terms:
    </text>
    <text x="0" y="30" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      PBBA = Purpose-Built Backup Appliance; optimized HW + SW for backup
    </text>
    <text x="0" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DD Boost = Dell Data Domain Boost; dedup-aware backup app protocol
    </text>
    <text x="0" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      OST = OpenStorage Technology; Veritas API that DD Boost uses
    </text>
    <text x="0" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Deduplication = removing duplicate data; write once, reference many times
    </text>
    <text x="0" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      MTree = logical partition on Data Domain; like a volume; each client uses one
    </text>
    <text x="0" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      AIR = Automatic Image Replication; replicates backup images to remote DD
    </text>
    <text x="0" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DDVE = Data Domain Virtual Edition; runs as VM (VMware or AWS)
    </text>
    <text x="0" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DD Replicator = DD feature that performs async replication between DD systems
    </text>
    <text x="0" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DD VTL = Virtual Tape Library; presents DD as tape drives to legacy apps
    </text>
    <text x="0" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Collection replica = full DD system replication; used for DR of the DD itself
    </text>
    <text x="0" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      StreamFusion = DD technology for parallel stream dedup during backup
    </text>
    <text x="0" y="195" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Cloud tier = cold tier to S3/Azure Blob; reduces on-prem footprint
    </text>
  </g>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Data Domain Architecture
  </text>
</svg>