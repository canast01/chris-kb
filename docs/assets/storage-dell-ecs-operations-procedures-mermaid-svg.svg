<svg xmlns="http://www.w3.org/2000/svg" width="906" height="166" viewBox="0 0 906 166">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#455a64" /></marker></defs>
<rect x="0" y="0" width="906" height="30" fill="#1a2744" />
<text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Creating IAM Object Users and Access Keys</text>
<rect x="20.0" y="50.0" width="602.4" height="76.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2" />
<text x="321.2" y="66.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">Key Rotation (zero downtime)</text>
<rect x="30.0" y="80.0" width="154.0" height="38.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="107.0" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">1. Create new key</text>
<text x="107.0" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">ecscli user secret-key create</text>
<rect x="194.0" y="80.0" width="131.8" height="38.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="259.9" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">2. Deploy new key</text>
<text x="259.9" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">to app / secrets manager</text>
<rect x="335.8" y="80.0" width="114.8" height="38.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="393.2" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">3. Verify app is using</text>
<text x="393.2" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">new key (access logs)</text>
<rect x="460.6" y="80.0" width="151.8" height="38.0" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
<text x="536.5" y="95.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">4. Delete old key</text>
<text x="536.5" y="109.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#37474f">ecscli user secret-key delete</text>
<rect x="652.4" y="50.0" width="234.0" height="76.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2" />
<text x="769.4" y="84.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2744">ECS allows up to 2 active keys per user</text>
<text x="769.4" y="100.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#1a2744">enabling zero-downtime rotation</text>
<line x1="107.0" y1="99.0" x2="259.9" y2="99.0" stroke="#78909c" stroke-width="1.2" stroke-dasharray="3,2" />
<line x1="259.9" y1="99.0" x2="393.2" y2="99.0" stroke="#78909c" stroke-width="1.2" stroke-dasharray="3,2" />
<line x1="393.2" y1="99.0" x2="536.5" y2="99.0" stroke="#78909c" stroke-width="1.2" stroke-dasharray="3,2" />
<rect x="0" y="136.0" width="906" height="30" fill="#f5f7fa" />
<text x="10" y="156.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Creating IAM Object Users and Access Keys</text>
</svg>