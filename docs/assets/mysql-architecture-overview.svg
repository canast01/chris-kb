<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">MySQL — InnoDB Engine &amp; Replication Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">InnoDB · Buffer Pool · MVCC · Query Pipeline · GTID Replication</text>

  <!-- COLUMN 1: InnoDB Engine -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">InnoDB Engine</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Default production engine</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Buffer Pool (in-memory page cache)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Redo Log (WAL / crash recovery)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Undo Log (MVCC + rollback)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Clustered Index (PK = table on disk)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Change Buffer (defer 2nd index writes)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Buffer pool: 60-80% of RAM; target &gt;99% hit</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Redo log: WAL ensures durability on crash</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Undo log: old row versions for MVCC reads</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">Clustered idx: rows in PK order on disk</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">No query cache in 8.0+; use ProxySQL</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">innodb_flush_log_at_trx_commit: 1 (safe)</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">innodb_buffer_pool_instances: 8 (large pools)</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">MyISAM: legacy; not recommended for prod</text>

  <!-- COLUMN 2: Query Pipeline -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Query Pipeline</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Parser → Optimizer → InnoDB → Disk</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Connection Handler (thread pool)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SQL Parser (syntax tree)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Query Optimizer (cost-based)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Execution Engine</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">InnoDB Storage Engine (leaf)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">EXPLAIN: shows index + join type + rows</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">Optimizer uses statistics for cost estimate</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">ANALYZE TABLE: updates index statistics</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">slow_query_log: log queries over threshold</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Index selectivity drives optimizer decisions</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">EXPLAIN FORMAT=JSON: full optimizer trace</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Prepared statements: skip parse/optimise</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">performance_schema: query-level metrics</text>

  <!-- COLUMN 3: Replication Topology -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Replication Topology</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Binlog · GTID · Semi-sync</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Primary (binary log, ROW format)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">I/O Thread (replica reads binlog)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">SQL Thread (replays relay log)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">GTID (Global Transaction Identifier)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Group Replication (InnoDB Cluster)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">Binlog: ROW format recommended for safety</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">GTID: unique per-TX; simplifies failover</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Semi-sync: primary waits for 1 replica ACK</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Group Replication: multi-primary option</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">MySQL Router: routes client to primary</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Parallel applier: slave_parallel_workers</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">binlog_expire_logs_seconds: retention limit</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">SHOW REPLICA STATUS: lag monitoring</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Replication Mode Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Mode</text>
  <text x="295" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Data Loss Risk</text>
  <text x="490" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Primary Latency</text>
  <text x="680" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Use Case</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="580" y1="516" x2="580" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Asynchronous</text>
  <text x="295" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Up to seconds</text>
  <text x="490" y="562" text-anchor="middle" fill="#546e7a" font-size="9">None</text>
  <text x="680" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Standard HA / read scale</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Semi-synchronous</text>
  <text x="295" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Near-0 (1 ACK required)</text>
  <text x="490" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Minor (+1 RTT)</text>
  <text x="680" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Data-critical HA</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Group Replication</text>
  <text x="295" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Near-0 (quorum)</text>
  <text x="490" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Quorum overhead</text>
  <text x="680" y="614" text-anchor="middle" fill="#546e7a" font-size="9">InnoDB Cluster / multi-primary</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">GTID failover</text>
  <text x="295" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Replication-dependent</text>
  <text x="490" y="639" text-anchor="middle" fill="#546e7a" font-size="9">None</text>
  <text x="680" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Automated failover (MHA / Router)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Read replicas (async)</text>
  <text x="295" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Replication lag</text>
  <text x="490" y="665" text-anchor="middle" fill="#546e7a" font-size="9">None</text>
  <text x="680" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Offload reporting / analytics</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">MySQL Reference · InnoDB · Buffer Pool · MVCC · GTID Replication · Group Replication</text>
</svg>
