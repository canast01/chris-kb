<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">NetApp ONTAP — How It Works</text>
  
  <rect x="20" y="50" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Physical Drives (NVMe, SSD, HDD, or mixed)</text>
  
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="130" width="780" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">RAID Groups (RAID-DP or RAID-TEC)</text>
  
  <line x1="410" y1="190" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="210" width="780" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Aggregate (storage pool owned by a node)</text>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="20" y="290" width="780" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Volume (FlexVol or FlexGroup — logical container)</text>
  
  <line x1="40" y1="340" x2="40" y2="360" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="50" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Snapshot copies (WAFL PiT copies; stored in volume)</text>
  
  <line x1="410" y1="340" x2="410" y2="360" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">LUNs (for SAN: iSCSI, FC, NVMe)</text>
  
  <line x1="410" y1="380" x2="410" y2="400" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">NVMe Namespaces (NVMe/FC or NVMe/TCP)</text>
  
  <line x1="780" y1="340" x2="780" y2="360" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="790" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Files / Shares (for NAS: NFS exports, SMB shares)</text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Storage Architecture</text>
</svg>