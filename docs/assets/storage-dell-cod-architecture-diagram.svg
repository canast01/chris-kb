<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell COD — Capacity on Demand Architecture
  </text>
  
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Software-defined capacity expansion for PowerMax; no hardware shipment needed;
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    activated via ESRS connectivity to Dell cloud; license key unlocks pre-installed capacity.
  </text>
  
  <rect x="10" y="100" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Licensing Model
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Base capacity: shipped with array
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    COD: pre-installed, locked
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tiers: increments of capacity
  </text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pay: only activated capacity
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Grace period: 30 days offline
  </text>
  
  <rect x="410" y="100" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Activation Process
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Order COD units from Dell
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    License key sent by email
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Import in Unisphere: COD
  </text>
  <text x="420" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS validates entitlement
  </text>
  <text x="420" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity available in minutes
  </text>
  
  <text x="10" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    COD is capacity only; FOD is for software features; both require ESRS connectivity.
  </text>
  
  <line x1="200" y1="250" x2="200" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="250" x2="600" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="280" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    ESRS Integration
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS: call-home to esrs.dell.com
  </text>
  <text x="20" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TCP 443 outbound required
  </text>
  <text x="20" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS gateway: optional proxy
  </text>
  <text x="20" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Offline: 30-day grace period
  </text>
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ConnectEMC: legacy ESRS name
  </text>
  
  <rect x="410" y="280" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    COD vs FOD
  </text>
  <text x="420" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    COD: raw capacity unlock
  </text>
  <text x="420" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FOD: feature activation
  </text>
  <text x="420" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Both: same ESRS channel
  </text>
  <text x="420" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Both: supported on PowerMax
  </text>
  <text x="420" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Both: instant activation
  </text>
  
  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="435" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PowerMax array (all capacity physically installed); ESRS gateway VM optional;
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    management network with internet access to esrs.dell.com on TCP 443.
  </text>
  
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    COD = Capacity on Demand; pre-installed capacity unlocked by license
  </text>
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FOD = Features on Demand; software feature activation (SRDF, TimeFinder)
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS = EMC Secure Remote Services; call-home + license validation channel
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unisphere = PowerMax web management UI; where COD is activated
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    License key = alphanumeric string delivered by Dell email after order
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Capacity tier = fixed increment of COD capacity available for activation
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Grace period = 30 days ESRS offline before COD locks; contact Dell to extend
  </text>
  <text x="10" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ConnectEMC = legacy name for ESRS call-home service
  </text>
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS gateway = optional on-prem VM that proxies array call-home traffic
  </text>
  <text x="10" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerMax = Dell high-end AFA; COD applies to this platform
  </text>
  <text x="10" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Entitlement = Dell contract record matching license key to serial number
  </text>
  <text x="10" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    esrs.dell.com = Dell ESRS validation endpoint; TCP 443 must be reachable
  </text>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Capacity on Demand Architecture
  </text>
</svg>