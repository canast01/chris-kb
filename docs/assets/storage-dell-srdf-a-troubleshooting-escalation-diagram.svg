<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SRDF/A — Escalation</text>

  <rect x="20" y="50" width="780" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at dell.com/support with symrdf output + event logs from both arrays</text>

  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="110" width="780" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="135" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Dell T1 engineer acknowledges (P1: &lt; 2 hr ProSupport Plus; P2: &lt; 4 hr)</text>

  <line x1="410" y1="150" x2="410" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="170" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="195" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within 2 hours for P1:</text>
  <text x="40" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to PowerMax/SRDF Senior Engineer"</text>
  <text x="40" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[groups suspended / link down / failover blocked / RPO breach]"</text>

  <line x1="410" y1="250" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="270" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="295" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — PowerMax T2 Senior Engineer assigned</text>
  <text x="40" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will review the symrdf data and may request a remote SE session</text>
  <text x="40" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Confirm SRS-VE is deployed and Dell can connect remotely</text>
  <text x="40" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have Solutions Enabler host and Unisphere access ready</text>

  <line x1="410" y1="350" x2="410" y2="370" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="370" width="780" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="395" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue is an SRDF/A code-level problem (cycle consistency mechanism, delta set corruption):</text>
  <text x="40" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ T2 escalates to PowerMax SRDF Engineering</text>
  <text x="40" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide targeted recovery commands</text>

  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="460" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For P1 with DR unavailable &gt; 2 hours:</text>
  <text x="40" y="505" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request TAM engagement</text>
  <text x="40" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAM to arrange engineering bridge and confirm failover decision if data loss is imminent</text>

  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>