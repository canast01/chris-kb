<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Identity — IAM Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">IAM Users · Roles · Policies · Cross-Account · Permission Review</text>

  <!-- ═ COLUMN 1: IAM Core ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">IAM Core Principals</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Users · Groups · Roles</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">IAM Users (human or service)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">IAM Groups (policy attachment)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">IAM Roles (assumed identity)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Instance Profiles (EC2 role)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Service-Linked Roles</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Root Account (emergency use only)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Root: MFA required, never use daily</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Users: assign groups, not direct policies</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Roles: short-lived temp credentials (STS)</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Instance Profile: one role per EC2</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Service-linked: managed by AWS service</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Prefer roles over access keys always</text>

  <!-- ═ COLUMN 2: Policies ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#e65100"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Policies &amp; Boundaries</text>
  <text x="410" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Managed · Inline · Boundaries · SCPs</text>
  <rect x="295" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">AWS Managed Policies</text>
  <rect x="295" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Customer Managed Policies</text>
  <rect x="295" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Inline Policies (avoid)</text>
  <rect x="295" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Permission Boundaries</text>
  <rect x="295" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Resource-based Policies</text>
  <rect x="295" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Service Control Policies (SCPs)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Policy eval: SCP → boundary → identity → resource</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Explicit deny always wins</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Condition keys: aws:SourceIp, aws:MFA</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Resource-based: S3 bucket policy, KMS</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">SCP max size: 5,120 characters</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">IAM Policy Simulator for testing</text>

  <!-- ═ COLUMN 3: Access Governance ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Access Governance</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Access Keys · Reviews · Cross-Account</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Access Key Rotation (&lt;90 days)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">IAM Access Analyzer</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Credential Report</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Access Advisor (last used)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Cross-Account Role Assumption</text>
  <rect x="560" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Permission Review Workflow</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Access Analyzer: finds external access</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Credential report: CSV all users + MFA status</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Access Advisor: prune unused services</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Cross-account: trust policy + assume-role</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">ExternalId for 3rd-party role assumption</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Quarterly review cycle: remove unused</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">IAM Principal Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">IAM User</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">IAM Role</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Access Key</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Credential type</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Password / access key</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Temporary STS token</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Static key + secret</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Expiry</text>
  <text x="340" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Console human access</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Services, CI/CD, cross-account</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">CLI (avoid; use roles)</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">MFA supported</text>
  <text x="340" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Via assume-role condition</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">MFA condition in policy</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Rotation needed</text>
  <text x="340" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Preferred in production</text>
  <text x="340" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Identity Reference · IAM · Roles · Policies · Permission Boundaries · Access Analyzer · Cross-Account</text>
</svg>
