<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Active Directory Communication Flow</text>
  
  <rect x="50" y="50" width="200" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="150" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Client</text>
  
  <rect x="570" y="50" width="200" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="670" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Active Directory (LDAP)</text>
  <text x="670" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">(port 389 / 636)</text>
  
  <line x1="250" y1="110" x2="570" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">TCP SYN</text>
  
  <line x1="570" y1="130" x2="250" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">TCP SYN-ACK</text>
  
  <line x1="250" y1="150" x2="570" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">LDAP Bind Request (DN + password)</text>
  
  <line x1="570" y1="170" x2="250" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="165" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Bind Response (success / error)</text>
  
  <line x1="250" y1="190" x2="570" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="185" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Search Request (filter + scope)</text>
  
  <line x1="570" y1="210" x2="250" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="205" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Search Entries</text>
  
  <line x1="570" y1="230" x2="250" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Search Done</text>
  
  <line x1="250" y1="250" x2="570" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="245" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Unbind</text>
  
  <line x1="250" y1="270" x2="570" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">TCP FIN</text>
  
  <rect x="0" y="370" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">Diagram Type: Communication Flow</text>
</svg>