<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PowerStore — Encryption</text>
  
  <rect x="20" y="50" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Drive Encryption Keys (DEKs)</text>
  <text x="30" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Unique per NVMe SSD; generated and stored on the drive controller</text>

  <rect x="20" y="130" width="780" height="110" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Key Encryption Keys (KEKs)</text>
  <text x="30" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Encrypt the DEKs; held by PowerStore node</text>
  <text x="30" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Options:</text>
  <text x="50" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Internal Key Management (IKM) — KEKs stored within PowerStoreOS (default)</text>
  <text x="50" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">External Key Management (EKM) — KEKs stored in an external KMIP key server</text>

  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="0" y="290" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Encryption Key Management</text>
</svg>