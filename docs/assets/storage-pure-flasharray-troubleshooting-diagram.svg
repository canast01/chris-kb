<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashArray Triage Entry Points</text>
  
  <g transform="translate(20, 50)">
    <text x="0" y="15" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Alert type</text>
    <line x1="60" y1="10" x2="150" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="150" y="0" width="120" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="160" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purealert list</text>
    
    <g transform="translate(0, 50)">
      <line x1="30" y1="0" x2="30" y2="40" stroke="#455a64" stroke-width="1.5" />
      <line x1="30" y1="40" x2="150" y2="40" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <rect x="150" y="30" width="160" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
      <text x="160" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">puredrive list / purehw list</text>
      <line x1="230" y1="60" x2="230" y2="90" stroke="#455a64" stroke-width="1.5" />
      <rect x="150" y="90" width="240" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
      <text x="160" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Open Pure support case if drive failed</text>
    </g>
    
    <g transform="translate(0, 150)">
      <line x1="30" y1="0" x2="30" y2="40" stroke="#455a64" stroke-width="1.5" />
      <line x1="30" y1="40" x2="150" y2="40" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <rect x="150" y="30" width="240" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
      <text x="160" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purehost list + pureport list</text>
      <line x1="270" y1="60" x2="270" y2="90" stroke="#455a64" stroke-width="1.5" />
      <rect x="150" y="90" width="240" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
      <text x="160" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Check FC zoning / iSCSI network</text>
    </g>
    
    <g transform="translate(0, 250)">
      <line x1="30" y1="0" x2="30" y2="40" stroke="#455a64" stroke-width="1.5" />
      <line x1="30" y1="40" x2="150" y2="40" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <rect x="150" y="30" width="280" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
      <text x="160" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purepod list + purepod list --replicating</text>
      <line x1="290" y1="60" x2="290" y2="90" stroke="#455a64" stroke-width="1.5" />
      <rect x="150" y="90" width="280" height="30" rx="6" fill="#fff8e1" stroke="#f57f17" />
      <text x="160" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Check inter-array replication link</text>
    </g>
    
    <g transform="translate(0, 350)">
      <line x1="30" y1="0" x2="30" y2="40" stroke="#455a64" stroke-width="1.5" />
      <line x1="30" y1="40" x2="150" y2="40" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <rect x="150" y="30" width="260" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
      <text x="160" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purearray monitor / purevol monitor</text>
      <line x1="280" y1="60" x2="280" y2="90" stroke="#455a64" stroke-width="1.5" />
      <rect x="150" y="90" width="260" height="30" rx="6" fill="#fce4ec" stroke="#c62828" />
      <text x="160" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Check QoS limits, check queue depth</text>
    </g>
    
    <g transform="translate(0, 450)">
      <line x1="30" y1="0" x2="30" y2="40" stroke="#455a64" stroke-width="1.5" />
      <line x1="30" y1="40" x2="150" y2="40" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
      <rect x="150" y="30" width="200" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
      <text x="160" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Pure1 diagnostics</text>
      <line x1="250" y1="60" x2="250" y2="90" stroke="#455a64" stroke-width="1.5" />
      <rect x="150" y="90" width="260" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
      <text x="160" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Open support case</text>
      <line x1="250" y1="120" x2="250" y2="150" stroke="#455a64" stroke-width="1.5" />
      <rect x="150" y="150" width="260" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
      <text x="160" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">purediag --send (upload bundle to case)</text>
    </g>
  </g>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: FlashArray Triage Entry Points</text>
</svg>