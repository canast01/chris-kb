<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">SAN Fabric Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Cisco MDS · Brocade Fabric OS · FC Fabric Services</text>

  <!-- COLUMN 1: Cisco MDS -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cisco MDS</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">MDS 9000 Series · NX-OS · DCNM / NDFC</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">MDS 9148T / 9396T (48/96-port FC)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NX-OS (storage-specific OS)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">DCNM / NDFC (fabric management)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VSANs (virtual SANs)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FCoE (Fibre Channel over Ethernet)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">VSANs: isolation within a physical fabric</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">IVR: inter-VSAN routing for selective access</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Port types: F (host), E (ISL), TE (trunk E)</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">FLOGI: host registers with fabric login</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Zoning: single-initiator-single-target rule</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">FCID: 24-bit address assigned at FLOGI</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">ISL: inter-switch link (E or TE port)</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">NDFC: replaces DCNM; REST API + telemetry</text>

  <!-- COLUMN 2: Brocade Fabric OS -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Brocade Fabric OS</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">G620 / G720 · Fabric OS (FOS) · BNA</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Brocade G620 / G720 directors</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Fabric OS (FOS)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Brocade Network Advisor (BNA)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Zones + zone aliases</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Trunking (LAG over ISLs)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">switchshow: list ports, speed, state</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">cfgshow / zoneshow: zone config display</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">cfgsave / cfgenable: activate zone config</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">portcfgspeed: set 8/16/32G auto-negotiate</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">creditrecovery: fix buffer credit stalls</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">fos upgrade: ISSU for non-disruptive update</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">errshow: view hardware + fabric error log</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">perfmon: port throughput + frame counters</text>

  <!-- COLUMN 3: FC Fabric Services -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">FC Fabric Services</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Zoning · FCNS · Performance · Diagnostics</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">FC Zoning (WWN / port-based)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">FC Name Server (FCNS)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Buffer-to-buffer credits (B2B)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">FC-BB_6 / 32GFC speeds</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">SAN health checks + diagnostics</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">Zoning: WWN preferred; port for lab/test</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">FCNS: distributes FLOGI DB across fabric</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">B2B credits: flow control; stall = I/O delay</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">32GFC: 28.05 Gbps full duplex per port</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">LUN masking: array-side access control</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">portlog: per-port FLOGI/PLOGI event trace</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">SAN health: check BB credit, CRC errors</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">fctracedump: fabric trace for issue capture</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">FC Vendor Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="330" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Cisco MDS</text>
  <text x="600" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Brocade (Broadcom)</text>
  <line x1="220" y1="516" x2="220" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="470" y1="516" x2="470" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Management OS</text>
  <text x="330" y="562" text-anchor="middle" fill="#546e7a" font-size="9">NX-OS (CLI identical to Nexus)</text>
  <text x="600" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Fabric OS (FOS)</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">GUI / management</text>
  <text x="330" y="587" text-anchor="middle" fill="#546e7a" font-size="9">NDFC / DCNM</text>
  <text x="600" y="587" text-anchor="middle" fill="#546e7a" font-size="9">BNA / SANnav</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Isolation method</text>
  <text x="330" y="614" text-anchor="middle" fill="#546e7a" font-size="9">VSAN</text>
  <text x="600" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Logical fabric</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Max port speed</text>
  <text x="330" y="639" text-anchor="middle" fill="#546e7a" font-size="9">64GFC (MDS 9700)</text>
  <text x="600" y="639" text-anchor="middle" fill="#546e7a" font-size="9">64GFC (G730)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Strengths</text>
  <text x="330" y="665" text-anchor="middle" fill="#546e7a" font-size="9">NX-OS consistency, VSAN, IVR</text>
  <text x="600" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Market share, FICON, ISSU</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">SAN Reference · Cisco MDS · Brocade FOS · FC Zoning · FCNS · B2B Credits · 32GFC</text>
</svg>
