<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Active Directory — Identity and Directory Architecture
  </text>
  
  <g transform="translate(10, 40)">
    <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      AD DS on Windows DCs; LDAP + Kerberos; NTDS.dit database; multi-master replication;
    </text>
    <text x="0" y="15" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Sites and Services control topology; FSMO roles for single-master operations.
    </text>
  </g>
  
  <g transform="translate(10, 70)">
    <rect x="0" y="0" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Domain Controller
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      NTDS.dit: AD database
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      SYSVOL: GPO + scripts
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Kerberos KDC: auth service
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      LDAP 389/636: directory
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DNS integrated: SRV records
    </text>
  </g>
  
  <g transform="translate(410, 70)">
    <rect x="0" y="0" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Directory Structure
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Forest: top-level boundary
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Domain: admin boundary
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      OU: Organizational Unit
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Trust: cross-domain auth
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Schema: object definitions
    </text>
  </g>
  
  <g transform="translate(10, 200)">
    <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      FSMO roles must be placed on reliable DCs; PDC Emulator is the most critical.
    </text>
  </g>
  
  <line x1="200" y1="230" x2="200" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="230" x2="620" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 260)">
    <rect x="0" y="0" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      FSMO Roles (5 total)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Schema Master: 1 per forest
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Domain Naming: 1 per forest
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      PDC Emulator: 1 per domain
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      RID Master: 1 per domain
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Infra Master: 1 per domain
    </text>
  </g>
  
  <g transform="translate(410, 260)">
    <rect x="0" y="0" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Replication
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Multi-master: all DCs equal
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      USN: update sequence number
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      KCC: auto-topology build
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Sites: control WAN repl
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      SYSVOL: DFS-R replication
    </text>
  </g>
  
  <g transform="translate(10, 390)">
    <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Physical Infrastructure (the hardware everything above runs on):
    </text>
    <text x="0" y="15" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      2+ Domain Controllers per domain (HA); Windows Server 2019/2022 VMs; dedicated
    </text>
    <text x="0" y="30" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      NIC; time sync critical (Kerberos 5-min skew tolerance); DNS on same VMs.
    </text>
  </g>
  
  <g transform="translate(10, 440)">
    <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Key terms:
    </text>
  </g>
  
  <g transform="translate(10, 460)">
    <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      AD DS          = Active Directory Domain Services; the role providing identity
    </text>
    <text x="0" y="15" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DC             = Domain Controller; server running AD DS; holds NTDS.dit
    </text>
    <text x="0" y="30" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      NTDS.dit       = Jet database file storing all AD objects and attributes
    </text>
    <text x="0" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      SYSVOL         = shared folder on DCs; holds GPOs and logon scripts
    </text>
    <text x="0" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      FSMO           = Flexible Single Master Operations; 5 special AD roles
    </text>
    <text x="0" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      PDC Emulator   = handles password changes, time sync, legacy NT auth
    </text>
    <text x="0" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      RID Master     = issues pools of RIDs to DCs so they can create unique SIDs
    </text>
    <text x="0" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      KCC            = Knowledge Consistency Checker; automatically builds repl topology
    </text>
    <text x="0" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      USN            = Update Sequence Number; tracks changes on each DC
    </text>
    <text x="0" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Site           = AD Sites and Services; maps to IP subnets; controls repl cost
    </text>
    <text x="0" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Trust          = relationship between domains/forests; enables cross-domain auth
    </text>
    <text x="0" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DFS-R          = Distributed File System Replication; replicates SYSVOL
    </text>
  </g>
  
  <rect x="0" y="670" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Active Directory Architecture
  </text>
</svg>