<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Amazon EVS — Elastic VMware Service
  </text>
  
  <rect x="10" y="50" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Amazon Elastic VMware Service (EVS)
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VMware Cloud Foundation (VCF) running on dedicated bare-metal EC2 in your VPC
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Hosts: i4i.metal / i3en.metal; ESXi installed by AWS; vSAN HCI storage
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Network: OVN via NSX-T overlay on ENIs; T0 BGP to VPC routing tables
  </text>
  <text x="410" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Migration: HCX vMotion / bulk migration from on-premises; no re-IP required
  </text>

  <text x="410" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#1a2744" text-anchor="middle">
    Control plane and storage are VCF-managed; host lifecycle is AWS-managed
  </text>

  <line x1="205" y1="180" x2="205" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="180" x2="615" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="200" width="400" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="210" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    VCF Management Domain
  </text>
  <text x="210" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SDDC Manager
  </text>
  <text x="210" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vCenter Server
  </text>
  <text x="210" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX-T Manager (3-node)
  </text>
  <text x="210" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vSAN (NVMe disk groups)
  </text>

  <rect x="410" y="200" width="400" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="610" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Layer
  </text>
  <text x="610" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Bare-metal EC2 hosts
  </text>
  <text x="610" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC + subnets + ENIs
  </text>
  <text x="610" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Direct Connect / TGW
  </text>
  <text x="610" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    S3, KMS, Secrets Mgr
  </text>

  <line x1="205" y1="300" x2="205" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="300" x2="615" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="320" width="400" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="210" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Security
  </text>
  <text x="210" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IAM roles (cluster mgmt)
  </text>
  <text x="210" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vSphere RBAC + SSO/AD
  </text>
  <text x="210" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX-T DFW micro-segment
  </text>
  <text x="210" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vSAN encryption (KMS)
  </text>

  <rect x="410" y="320" width="400" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="610" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Migration &amp; Connectivity
  </text>
  <text x="610" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HCX: vMotion + bulk migrate
  </text>
  <text x="610" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Network Extension (L2 stretch)
  </text>
  <text x="610" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DX private VIF to EVS VPC
  </text>
  <text x="610" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Transit Gateway (multi-VPC)
  </text>

  <text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    EVS = Amazon Elastic VMware Service; managed VCF on dedicated bare-metal EC2
  </text>
  <text x="410" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    i4i.metal = Primary EVS host type; 128 vCPU, 1 TB RAM, 30 TB NVMe; supports vSAN ESA
  </text>
  <text x="410" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VCF = VMware Cloud Foundation; SDDC Manager + vCenter + vSAN + NSX-T stack
  </text>
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HCX = VMware Hybrid Cloud Extension; live + cold VM migration to/from on-prem
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ENI = Elastic Network Interface; used for NSX-T VTEP and management VMkernels
  </text>
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DX = Direct Connect; private 1G or 10G link between on-premises and AWS
  </text>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Amazon EVS Architecture
  </text>
</svg>