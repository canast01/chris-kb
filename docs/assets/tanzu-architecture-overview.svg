<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">VMware Tanzu — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Supervisor Cluster · TKG Workload Clusters · Platform Services</text>

  <!-- ═ COLUMN 1: Supervisor ═ (3-col: 250px) -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Supervisor Cluster</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Kubernetes control plane on vSphere</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Supervisor Control Plane VMs (3)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Kubernetes API Server</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSphere Namespaces</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NSX or AVI (networking)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">TanzuKubernetesCluster CRD</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Pinniped + Dex (auth)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Enabled in vCenter Workload Mgmt</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">3 control plane VMs on each host</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">NSX required for overlay networking</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">kubectl vsphere login for access</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Namespace = RBAC + resource quota</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">AVI LB or NSX-T LB for services</text>

  <!-- ═ COLUMN 2: TKG Workload ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">TKG Workload Clusters</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Tenant Kubernetes clusters</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">TKC Control Plane nodes (3)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">TKC Worker nodes</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Containerd runtime</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Calico CNI (intra-cluster)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSAN StorageClass (PVC)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Contour + HTTPProxy (ingress)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">Created via TanzuKubernetesCluster YAML</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Multiple clusters per Supervisor</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Lifecycle: tanzu cluster create/upgrade</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">PVCs backed by vSAN StorageClass</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Cluster-admin kubeconfig via Supervisor</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">OPA Gatekeeper for policy enforcement</text>

  <!-- ═ COLUMN 3: Platform Services ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Platform Services</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Harbor · Velero · cert-manager · OPA</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Harbor Registry (OVA)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Velero (backup / restore)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">cert-manager (TLS automation)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">OPA Gatekeeper (policy)</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Carvel tools (kapp / ytt / imgpkg)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">External Secrets Operator</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Harbor: scan images, RBAC projects</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Velero: S3 + VolumeSnapshotClass</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">cert-manager: ClusterIssuer + Let's Encrypt</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">OPA: ConstraintTemplate + Constraint CRDs</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">kapp: GitOps-style app deployment</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">ytt: YAML templating for manifests</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cluster Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Supervisor Cluster</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">TKG Workload Cluster</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">TKG Management Cluster</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Runs workloads</text>
  <text x="340" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">vSphere managed</text>
  <text x="340" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Control plane</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Embedded in vCenter</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">3 VMs (per cluster)</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Standalone (TKG CLI)</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Networking</text>
  <text x="340" y="639" text-anchor="middle" fill="#546e7a" font-size="9">NSX-T / AVI</text>
  <text x="540" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Calico + NSX LB</text>
  <text x="720" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Calico + AVI</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Storage</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">vSAN / datastore</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">vSAN CSI PVCs</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">vSAN CSI PVCs</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Auth</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">vCenter SSO</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Pinniped + Dex (LDAP/OIDC)</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Pinniped + Dex</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware Tanzu Reference · Supervisor · TKG Clusters · Harbor · Velero · OPA Gatekeeper · cert-manager</text>
</svg>
