<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Pure FlashBlade — Scale-Out Unstructured Storage Architecture
  </text>
  
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Scale-out all-flash for unstructured data; blade-based architecture; NFS, SMB, S3;
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    target: AI/ML datasets, genomics, media workflows, backup targets.
  </text>
  
  <rect x="10" y="100" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Architecture
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FlashBlade chassis (4U)
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Blades: capacity + compute
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Scale: add blades for perf
  </text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //S: storage blade (current)
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Fabric: 40GbE or 100GbE
  </text>
  
  <rect x="410" y="100" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Protocols
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS v3/v4.1: Linux/AI
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SMB 2/3: Windows shares
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    S3: object; AI data lakes
  </text>
  <text x="420" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HDFS: Hadoop connector
  </text>
  <text x="420" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-protocol: same data
  </text>
  
  <line x1="200" y1="240" x2="200" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="240" x2="600" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="270" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Services
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshots: instant, no-cost
  </text>
  <text x="20" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Replication: async to remote
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure Object Store: S3 compat
  </text>
  <text x="20" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SafeMode: immutable snaps
  </text>
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    File system: directory-based
  </text>
  
  <rect x="410" y="270" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Purity//FB UI: web browser
  </text>
  <text x="420" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API v2: automation
  </text>
  <text x="420" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure1: multi-site SaaS
  </text>
  <text x="420" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CLI: purectl commands
  </text>
  <text x="420" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS exports: per-FS share
  </text>
  
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="445" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FlashBlade chassis in rack; 40GbE or 100GbE data ports per blade; management
  </text>
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    port (Eth); blades share chassis backplane for internal communication.
  </text>
  
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FlashBlade     = Pure scale-out all-flash for file and object workloads
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    //S blade      = current FlashBlade generation; each blade = storage + compute
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Scale-out      = add blades to grow capacity and performance simultaneously
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Purity//FB     = FlashBlade OS; manages filesystem, S3, snapshots
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS export     = directory shared over NFS; each filesystem can have one export
  </text>
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pure Object Store= S3-compatible object store built into FlashBlade //S
  </text>
  <text x="10" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SafeMode       = immutable Snapshot; admin cannot delete; ransomware protection
  </text>
  <text x="10" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HDFS           = Hadoop filesystem; FlashBlade presents as HDFS target
  </text>
  <text x="10" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AI/ML workload = high-throughput random read; FlashBlade optimized for this
  </text>
  <text x="10" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Replication    = async policy-based; replicates filesystems to remote FlashBlade
  </text>
  <text x="10" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-protocol = same data accessible via NFS, SMB, and S3 simultaneously
  </text>
  <text x="10" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Blade          = hot-plug module; each adds storage capacity + bandwidth + IOPS
  </text>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: FlashBlade Architecture
  </text>
</svg>