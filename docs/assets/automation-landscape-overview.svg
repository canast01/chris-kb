<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Automation Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Ansible · Terraform · GitHub Actions · PowerShell &amp; Python</text>

  <!-- COLUMN 1: Ansible -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="113" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Ansible</text>
  <text x="113" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Playbooks · Roles · AWX / AAP</text>
  <rect x="28" y="126" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Playbooks (YAML automation)</text>
  <rect x="28" y="152" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Roles (reusable task bundles)</text>
  <rect x="28" y="178" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Inventory (static / dynamic)</text>
  <rect x="28" y="204" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Ansible Vault (secret encrypt)</text>
  <rect x="28" y="230" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">AWX / AAP (enterprise UI)</text>
  <text x="113" y="282" text-anchor="middle" fill="#78909c" font-size="9">Agentless: SSH / WinRM</text>
  <text x="113" y="300" text-anchor="middle" fill="#78909c" font-size="9">Idempotent: safe to re-run</text>
  <text x="113" y="318" text-anchor="middle" fill="#78909c" font-size="9">galaxy: community roles repo</text>
  <text x="113" y="336" text-anchor="middle" fill="#78909c" font-size="9">Collections: modular content</text>
  <text x="113" y="354" text-anchor="middle" fill="#78909c" font-size="9">Handlers: run on notified only</text>
  <text x="113" y="372" text-anchor="middle" fill="#78909c" font-size="9">facts: auto-discovered host vars</text>
  <text x="113" y="390" text-anchor="middle" fill="#78909c" font-size="9">-v/-vvv: debug verbosity flags</text>
  <text x="113" y="408" text-anchor="middle" fill="#78909c" font-size="9">--check: dry-run mode</text>

  <!-- COLUMN 2: Terraform -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#00695c"/>
  <text x="308" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Terraform</text>
  <text x="308" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">HCL · Providers · State · Modules</text>
  <rect x="223" y="126" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">HCL configuration files</text>
  <rect x="223" y="152" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Providers (VMware, AWS, Azure)</text>
  <rect x="223" y="178" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">State file (terraform.tfstate)</text>
  <rect x="223" y="204" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Modules (reusable components)</text>
  <rect x="223" y="230" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Remote state (S3 / Azure)</text>
  <text x="308" y="282" text-anchor="middle" fill="#78909c" font-size="9">init / plan / apply / destroy</text>
  <text x="308" y="300" text-anchor="middle" fill="#78909c" font-size="9">State lock: prevent concurrent apply</text>
  <text x="308" y="318" text-anchor="middle" fill="#78909c" font-size="9">tfvars: separate var files per env</text>
  <text x="308" y="336" text-anchor="middle" fill="#78909c" font-size="9">workspaces: multi-env state split</text>
  <text x="308" y="354" text-anchor="middle" fill="#78909c" font-size="9">data sources: read existing infra</text>
  <text x="308" y="372" text-anchor="middle" fill="#78909c" font-size="9">import: bring existing into state</text>
  <text x="308" y="390" text-anchor="middle" fill="#78909c" font-size="9">vsphere provider: VM/net/storage</text>
  <text x="308" y="408" text-anchor="middle" fill="#78909c" font-size="9">tflint + tfsec: lint + security scan</text>

  <!-- COLUMN 3: GitHub Actions -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#6a1b9a"/>
  <text x="503" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">GitHub Actions</text>
  <text x="503" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Workflows · Jobs · Runners</text>
  <rect x="418" y="126" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Workflows (.github/workflows/)</text>
  <rect x="418" y="152" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Jobs + steps (YAML pipeline)</text>
  <rect x="418" y="178" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Runners (GitHub / self-hosted)</text>
  <rect x="418" y="204" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Secrets + environments</text>
  <rect x="418" y="230" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Reusable workflows</text>
  <text x="503" y="282" text-anchor="middle" fill="#78909c" font-size="9">on: push/PR/schedule trigger</text>
  <text x="503" y="300" text-anchor="middle" fill="#78909c" font-size="9">matrix: multi-version parallel jobs</text>
  <text x="503" y="318" text-anchor="middle" fill="#78909c" font-size="9">uses: call reusable workflow</text>
  <text x="503" y="336" text-anchor="middle" fill="#78909c" font-size="9">cache: speed up pip/npm/go</text>
  <text x="503" y="354" text-anchor="middle" fill="#78909c" font-size="9">actions/checkout: clone repo</text>
  <text x="503" y="372" text-anchor="middle" fill="#78909c" font-size="9">GITHUB_TOKEN: built-in auth</text>
  <text x="503" y="390" text-anchor="middle" fill="#78909c" font-size="9">self-hosted: on-prem runner</text>
  <text x="503" y="408" text-anchor="middle" fill="#78909c" font-size="9">artifacts: pass between jobs</text>

  <!-- COLUMN 4: PowerShell & Python -->
  <rect x="605" y="72" width="195" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="195" height="42" fill="#e65100" rx="6"/>
  <rect x="605" y="100" width="195" height="14" fill="#e65100"/>
  <text x="703" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">PowerShell &amp; Python</text>
  <text x="703" y="111" text-anchor="middle" fill="#ffab91" font-size="9">PS Core · PowerCLI · Python · Bash</text>
  <rect x="613" y="126" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">PowerShell Core (cross-platform)</text>
  <rect x="613" y="152" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">VMware PowerCLI</text>
  <rect x="613" y="178" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Python (scripting + APIs)</text>
  <rect x="613" y="204" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Bash (Linux shell scripting)</text>
  <rect x="613" y="230" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">REST API automation</text>
  <text x="703" y="282" text-anchor="middle" fill="#78909c" font-size="9">PS: pipeline, Invoke-Command</text>
  <text x="703" y="300" text-anchor="middle" fill="#78909c" font-size="9">PowerCLI: Connect-VIServer; Get-VM</text>
  <text x="703" y="318" text-anchor="middle" fill="#78909c" font-size="9">Python: requests, paramiko, pyVmomi</text>
  <text x="703" y="336" text-anchor="middle" fill="#78909c" font-size="9">Bash: loops, traps, heredoc, jq</text>
  <text x="703" y="354" text-anchor="middle" fill="#78909c" font-size="9">REST: curl / requests + JSON parse</text>
  <text x="703" y="372" text-anchor="middle" fill="#78909c" font-size="9">vCenter REST API: /api/vcenter</text>
  <text x="703" y="390" text-anchor="middle" fill="#78909c" font-size="9">DSC: PS declarative config state</text>
  <text x="703" y="408" text-anchor="middle" fill="#78909c" font-size="9">pyVmomi: vSphere API in Python</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Automation Tool Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="80" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="240" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Ansible</text>
  <text x="390" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Terraform</text>
  <text x="550" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">GitHub Actions</text>
  <text x="710" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">PS / Python</text>
  <line x1="145" y1="516" x2="145" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="320" y1="516" x2="320" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="470" y1="516" x2="470" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="80" y="562" text-anchor="middle" fill="#455a64" font-size="9">Primary use</text>
  <text x="240" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Config mgmt + app deploy</text>
  <text x="390" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Infrastructure provisioning</text>
  <text x="550" y="562" text-anchor="middle" fill="#546e7a" font-size="9">CI/CD pipeline automation</text>
  <text x="710" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Scripting + API calls</text>
  <text x="80" y="587" text-anchor="middle" fill="#455a64" font-size="9">State model</text>
  <text x="240" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Stateless (idempotent)</text>
  <text x="390" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Stateful (tfstate)</text>
  <text x="550" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Stateless (event-driven)</text>
  <text x="710" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Stateless (script logic)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="80" y="614" text-anchor="middle" fill="#455a64" font-size="9">Language</text>
  <text x="240" y="614" text-anchor="middle" fill="#546e7a" font-size="9">YAML</text>
  <text x="390" y="614" text-anchor="middle" fill="#546e7a" font-size="9">HCL</text>
  <text x="550" y="614" text-anchor="middle" fill="#546e7a" font-size="9">YAML</text>
  <text x="710" y="614" text-anchor="middle" fill="#546e7a" font-size="9">PowerShell / Python</text>
  <text x="80" y="639" text-anchor="middle" fill="#455a64" font-size="9">Agent required</text>
  <text x="240" y="639" text-anchor="middle" fill="#546e7a" font-size="9">No (SSH/WinRM)</text>
  <text x="390" y="639" text-anchor="middle" fill="#546e7a" font-size="9">No (API-based)</text>
  <text x="550" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Runner (GitHub/self)</text>
  <text x="710" y="639" text-anchor="middle" fill="#546e7a" font-size="9">No</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="80" y="665" text-anchor="middle" fill="#455a64" font-size="9">Best for VMware</text>
  <text x="240" y="665" text-anchor="middle" fill="#546e7a" font-size="9">OS config + app tasks</text>
  <text x="390" y="665" text-anchor="middle" fill="#546e7a" font-size="9">VM/net/storage provisioning</text>
  <text x="550" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Deployment pipelines</text>
  <text x="710" y="665" text-anchor="middle" fill="#546e7a" font-size="9">PowerCLI bulk operations</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Automation Reference · Ansible · Terraform · GitHub Actions · PowerShell · Python · PowerCLI</text>
