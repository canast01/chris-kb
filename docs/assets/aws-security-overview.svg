<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Security — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Authentication · Encryption · Threat Detection · Compliance</text>

  <!-- ═ COLUMN 1: Identity & Auth ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Identity &amp; Authentication</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">IAM Identity Center · SSO · MFA</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">IAM Identity Center (SSO)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Multi-Factor Authentication (MFA)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">SAML 2.0 / OIDC Federation</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">IAM Roles (least privilege)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Permission Boundaries</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Service Control Policies (SCPs)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Identity Center: single sign-on portal</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Federate with AD, Okta, Azure AD</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">MFA: hardware token or TOTP app</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">No long-term access keys on EC2</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Permission boundary caps effective perms</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">SCP: org-wide deny guardrail</text>

  <!-- ═ COLUMN 2: Encryption & Secrets ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#6a1b9a" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Encryption &amp; Secrets</text>
  <text x="410" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">KMS · Secrets Manager · ACM</text>
  <rect x="295" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">AWS KMS (key management)</text>
  <rect x="295" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Secrets Manager (rotate secrets)</text>
  <rect x="295" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">ACM (TLS certificate lifecycle)</text>
  <rect x="295" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">S3 SSE-KMS / SSE-S3</text>
  <rect x="295" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">EBS + RDS encryption at rest</text>
  <rect x="295" y="256" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">CloudHSM (FIPS 140-2 Level 3)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">KMS: AWS-managed or customer-managed keys</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Secrets Manager: auto rotation via Lambda</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">ACM: free certs, auto-renew for ALB/CF</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">KMS key policies + IAM = dual control</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">CloudHSM: bring-your-own key material</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Enforce encryption via SCPs</text>

  <!-- ═ COLUMN 3: Threat Detection ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#b71c1c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#b71c1c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Threat Detection</text>
  <text x="675" y="111" text-anchor="middle" fill="#ef9a9a" font-size="9">GuardDuty · Security Hub · Inspector</text>
  <rect x="560" y="126" width="230" height="22" fill="#ffebee" rx="3" stroke="#ef9a9a" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">GuardDuty (threat intelligence)</text>
  <rect x="560" y="152" width="230" height="22" fill="#ffebee" rx="3" stroke="#ef9a9a" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">Security Hub (findings aggregation)</text>
  <rect x="560" y="178" width="230" height="22" fill="#ffebee" rx="3" stroke="#ef9a9a" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">Amazon Inspector (vuln scanning)</text>
  <rect x="560" y="204" width="230" height="22" fill="#ffebee" rx="3" stroke="#ef9a9a" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">Macie (S3 data classification)</text>
  <rect x="560" y="230" width="230" height="22" fill="#ffebee" rx="3" stroke="#ef9a9a" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">WAF + Shield (DDoS protection)</text>
  <rect x="560" y="256" width="230" height="22" fill="#ffebee" rx="3" stroke="#ef9a9a" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">AWS Config (resource compliance)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">GuardDuty: ML on CloudTrail, DNS, VPC logs</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Security Hub: CIS Benchmark, NIST scores</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Inspector: CVE scan EC2 + container images</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Macie: PII detection in S3</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Shield Advanced: $3,000/mo DDoS SLA</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Config: remediation via SSM Automation</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Threat Detection Service Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">GuardDuty</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Security Hub</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Inspector</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Primary function</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Threat detection (ML)</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Finding aggregation</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Vulnerability scanning</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Data sources</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">CloudTrail, VPC, DNS</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">GuardDuty, Inspector, Macie</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">EC2 agents, ECR images</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Agent required</text>
  <text x="340" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">SSM Agent (EC2)</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Generates findings</text>
  <text x="340" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Aggregates from others</text>
  <text x="720" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Compliance scores</text>
  <text x="340" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Alert destination</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">EventBridge / SNS</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">EventBridge / Security Hub UI</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Security Hub / EventBridge</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Security Reference · IAM Identity Center · KMS · Secrets Manager · GuardDuty · Security Hub · Inspector</text>
</svg>
