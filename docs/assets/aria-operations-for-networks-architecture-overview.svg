  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Cloud: VPC flow logs + NIC metadata</text>

  <!-- ═ COLUMN 2: Collector VMs ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
