  <text x="320" y="613" text-anchor="middle" fill="#546e7a" font-size="9">NetFlow (UDP 2055)</text>
  <text x="510" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="700" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Underlay visibility</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">VM inventory / vDS</text>
