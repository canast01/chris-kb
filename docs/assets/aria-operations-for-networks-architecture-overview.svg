  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Data Sources · Collector VMs · Platform VM (Analytics + UI)</text>

  <!-- ═ COLUMN 1: Data Sources ═ (3-col: 250px, gap=15) -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#546e7a" rx="6"/>
