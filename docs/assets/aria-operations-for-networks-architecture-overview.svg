  <text x="510" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="700" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Microsegmentation firewall rules</text>
