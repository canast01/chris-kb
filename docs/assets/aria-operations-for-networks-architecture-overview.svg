  <rect x="295" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">NetFlow / IPFIX receiver (UDP 2055)</text>
  <rect x="295" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">NSX-T API polling</text>
  <rect x="295" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vCenter API polling</text>
  <rect x="295" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">SNMP polling (switches)</text>
  <rect x="295" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Forwards data → Platform VM</text>
  <rect x="295" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Paired with one Platform VM</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">4 vCPU / 12 GB RAM / 150 GB disk</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">One Collector per network segment</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Multiple Collectors per Platform</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">NetFlow must reach Collector IP</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Data forwarding: encrypted HTTPS</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">OVA deployed in target segment</text>

