  <rect x="30" y="152" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">vCenter Server (REST API)</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Physical switches (SNMP)</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">NetFlow / IPFIX (UDP 2055)</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Cisco switches (ERSPAN / SPAN)</text>
  <rect x="30" y="256" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">AWS / Azure (cloud accounts)</text>
