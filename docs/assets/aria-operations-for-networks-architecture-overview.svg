  <rect x="560" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Security planning dashboard</text>
  <rect x="560" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Problem detection (AI/ML)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">16 vCPU / 32 GB RAM / 1 TB disk</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Single OVA — all-in-one</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Collects from all paired Collectors</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Query language: NQL</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Exports: CSV / REST / NSX rules</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Syslog forwarding to SIEM</text>

