  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">vCenter: VM inventory + vDS flows</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">NetFlow: L3 flow data from switches</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">IPFIX: NSX-T kernel flows from ESXi</text>
