<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Dell Unity XT — Escalation
  </text>
  <rect x="10" y="50" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 1 — Collect Data
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    uemcli /sys/general show (health + version)
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    uemcli /env/health show (component faults)
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    uemcli /sys/alert show (active alerts)
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Generate service bundle (Unisphere UI)
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Write timeline: last healthy → first fault
  </text>
  <rect x="410" y="50" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 2 — Open the Case
  </text>
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Go to dell.com/support → My Cases
  </text>
  <text x="420" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Select product by SP serial number
  </text>
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Severity: P1 SP down / P2 degraded
  </text>
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Attach service bundle + alert history
  </text>
  <text x="420" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    For P1: also call Dell support
  </text>
  <line x1="205" y1="170" x2="205" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="170" x2="615" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="210" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 3 — Escalation Path
  </text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    T1: triage + confirm bundle received
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    T2: Unity SE assigned; deep array review
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TAM: engage for P1 or prolonged issues
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GPS: on-site senior engineering for complex
  </text>
  <rect x="410" y="210" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    What NOT to Do
  </text>
  <text x="420" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not reboot both SPs simultaneously
  </text>
  <text x="420" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not modify pools during single-SP mode
  </text>
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not pull drives without Dell guidance
  </text>
  <text x="420" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Do not start OE upgrade during incident
  </text>
  <rect x="0" y="350" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Escalation Process
  </text>
  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SP-A / SP-B = Storage Processors; active-active HA pair; one failing = single-SP mode
  </text>
  <text x="10" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    OE = Operating Environment; Unity operating system; version in uemcli /sys/sw show
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    uemcli = Unity CLI; `uemcli -d &lt;sp-ip&gt; -u admin -p &lt;pw&gt; /command` on management host
  </text>
  <text x="10" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    pool = collection of drives forming usable storage capacity; FAST VP tiers data
  </text>
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FAST VP = Fully Automated Storage Tiering VP; moves hot/cold data between drive tiers
  </text>
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NAS server = virtual file server on Unity; owns IP, DNS, shares; independent per-tenant
  </text>
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    service bundle = Unity diagnostic archive; generated via Unisphere or uemcli; mandatory
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SupportAssist = Dell telemetry and auto-case creation; configured in Unisphere
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ProSupport Plus = Dell highest support tier; 24×7; P1 response &lt; 2 hr
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TAM = Technical Account Manager; named Dell contact for critical case escalation
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GPS = Global Priority Services; senior on-site or remote Dell engineering
  </text>
</svg>