<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Subscription &amp; Capacity Management — Command Flow
  </text>
  
  <rect x="10" y="50" width="390" height="180" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pure1 REST API
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /subscriptions
  </text>
  <text x="40" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ├─ list all subs
  </text>
  <text x="40" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    └─ get capacity
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /subscription-assets
  </text>
  <text x="40" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    └─ per-array usage
  </text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    /metrics/history
  </text>
  <text x="40" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    └─ trend data
  </text>
  
  <rect x="410" y="50" width="390" height="180" fill="#e8eaf6" stroke="#3949ab" rx="6" />
  <text x="420" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Per-Array CLI (SSH)
  </text>
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    purearray list
  </text>
  <text x="440" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    --space (usage)
  </text>
  <text x="440" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    --controller
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    purevol list --space
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    purealert list
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    purehw list
  </text>
  <text x="440" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    --type drive/fan
  </text>
  
  <line x1="200" y1="230" x2="200" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="210" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Bearer token (OAuth2 RS256 JWT)
  </text>
  
  <rect x="10" y="280" width="800" height="100" fill="#e8f5e9" stroke="#2e7d32" rx="6" />
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Capacity States
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Reserved ◄── OK
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &gt;Reserved ◄─ BURST
  </text>
  <text x="40" y="355" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ← higher per-TiB billing
  </text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &gt;Burst cap ◄─ OVER
  </text>
  <text x="40" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ← order required
  </text>
  
  <rect x="0" y="450" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Command Flow
  </text>
</svg>