<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="570" fill="#f4f6f9"/>

  <!-- Title header -->
  <rect x="0" y="0" width="820" height="54" fill="#1a2744"/>
  <text x="410" y="31" text-anchor="middle" fill="white" font-size="17" font-weight="700" letter-spacing="0.3">VMkernel Resource Scheduling</text>
  <text x="410" y="47" text-anchor="middle" fill="#7a8fbb" font-size="10">ESXi Hypervisor — CPU · Memory · Storage · Network resource paths</text>

  <!-- ── Layer 1: VM Layer ── -->
  <rect x="20" y="62" width="780" height="26" fill="#1565c0" rx="5"/>
  <rect x="20" y="78" width="780" height="10" fill="#1565c0"/>
  <text x="410" y="80" text-anchor="middle" fill="white" font-size="12" font-weight="700">VM Layer</text>

  <!-- VM 1 -->
  <rect x="28" y="92" width="238" height="72" fill="#e3f2fd" rx="4" stroke="#90caf9" stroke-width="1.2"/>
  <rect x="28" y="92" width="238" height="20" fill="#bbdefb" rx="4"/>
  <rect x="28" y="102" width="238" height="10" fill="#bbdefb"/>
  <text x="147" y="107" text-anchor="middle" fill="#0d47a1" font-size="10" font-weight="700">VM 1</text>
  <text x="147" y="126" text-anchor="middle" fill="#1565c0" font-size="9">Guest OS · VMX process</text>
  <text x="147" y="142" text-anchor="middle" fill="#546e7a" font-size="9">vCPU · vMEM · vNIC · vDisk</text>
  <text x="147" y="157" text-anchor="middle" fill="#546e7a" font-size="9">Virtual hardware abstraction</text>

  <!-- VM 2 -->
  <rect x="291" y="92" width="238" height="72" fill="#e3f2fd" rx="4" stroke="#90caf9" stroke-width="1.2"/>
  <rect x="291" y="92" width="238" height="20" fill="#bbdefb" rx="4"/>
  <rect x="291" y="102" width="238" height="10" fill="#bbdefb"/>
  <text x="410" y="107" text-anchor="middle" fill="#0d47a1" font-size="10" font-weight="700">VM 2</text>
  <text x="410" y="126" text-anchor="middle" fill="#1565c0" font-size="9">Guest OS · VMX process</text>
  <text x="410" y="142" text-anchor="middle" fill="#546e7a" font-size="9">vCPU · vMEM · vNIC · vDisk</text>
  <text x="410" y="157" text-anchor="middle" fill="#546e7a" font-size="9">Virtual hardware abstraction</text>

  <!-- VM 3 -->
  <rect x="554" y="92" width="238" height="72" fill="#e3f2fd" rx="4" stroke="#90caf9" stroke-width="1.2"/>
  <rect x="554" y="92" width="238" height="20" fill="#bbdefb" rx="4"/>
  <rect x="554" y="102" width="238" height="10" fill="#bbdefb"/>
  <text x="673" y="107" text-anchor="middle" fill="#0d47a1" font-size="10" font-weight="700">VM 3</text>
  <text x="673" y="126" text-anchor="middle" fill="#1565c0" font-size="9">Guest OS · VMX process</text>
  <text x="673" y="142" text-anchor="middle" fill="#546e7a" font-size="9">vCPU · vMEM · vNIC · vDisk</text>
  <text x="673" y="157" text-anchor="middle" fill="#546e7a" font-size="9">Virtual hardware abstraction</text>

  <!-- Arrow: VMs → Scheduler -->
  <line x1="147" y1="164" x2="147" y2="186" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="164" x2="410" y2="186" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="673" y1="164" x2="673" y2="186" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 2: VMkernel Scheduler ── -->
  <rect x="20" y="190" width="780" height="26" fill="#2e7d32" rx="5"/>
  <rect x="20" y="206" width="780" height="10" fill="#2e7d32"/>
  <text x="410" y="208" text-anchor="middle" fill="white" font-size="12" font-weight="700">VMkernel Scheduler</text>

  <!-- CPU Scheduler -->
  <rect x="28" y="220" width="376" height="72" fill="#e8f5e9" rx="4" stroke="#81c784" stroke-width="1.2"/>
  <rect x="28" y="220" width="376" height="20" fill="#c8e6c9" rx="4"/>
  <rect x="28" y="230" width="376" height="10" fill="#c8e6c9"/>
  <text x="216" y="235" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="700">CPU Scheduler</text>
  <text x="216" y="254" text-anchor="middle" fill="#2e7d32" font-size="9">vCPU → pCPU mapping · NUMA-aware placement</text>
  <text x="216" y="270" text-anchor="middle" fill="#546e7a" font-size="9">%RDY — time waiting for pCPU · %CSTP — co-stop</text>
  <text x="216" y="286" text-anchor="middle" fill="#546e7a" font-size="9">Shares / Reservations / Limits enforced here</text>

  <!-- Memory Manager -->
  <rect x="416" y="220" width="376" height="72" fill="#e8f5e9" rx="4" stroke="#81c784" stroke-width="1.2"/>
  <rect x="416" y="220" width="376" height="20" fill="#c8e6c9" rx="4"/>
  <rect x="416" y="230" width="376" height="10" fill="#c8e6c9"/>
  <text x="604" y="235" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="700">Memory Manager</text>
  <text x="604" y="254" text-anchor="middle" fill="#2e7d32" font-size="9">TPS (Transparent Page Sharing) · Balloon driver</text>
  <text x="604" y="270" text-anchor="middle" fill="#546e7a" font-size="9">Compression · Swap to host swap file</text>
  <text x="604" y="286" text-anchor="middle" fill="#546e7a" font-size="9">Mem Shares / Reservations / Limits</text>

  <!-- Arrows: Scheduler → I/O -->
  <line x1="216" y1="292" x2="216" y2="316" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="604" y1="292" x2="604" y2="316" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 3: I/O Paths (split) ── -->
  <!-- Storage I/O header -->
  <rect x="20" y="320" width="378" height="22" fill="#e65100" rx="4"/>
  <text x="209" y="335" text-anchor="middle" fill="white" font-size="11" font-weight="700">Storage I/O Path</text>
  <!-- Network I/O header -->
  <rect x="422" y="320" width="378" height="22" fill="#e65100" rx="4"/>
  <text x="611" y="335" text-anchor="middle" fill="white" font-size="11" font-weight="700">Network I/O Path</text>

  <!-- Storage Stack PSA/NMP -->
  <rect x="28" y="346" width="362" height="42" fill="#fff3e0" rx="4" stroke="#ffb74d" stroke-width="1"/>
  <text x="209" y="362" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Storage Stack — PSA / NMP</text>
  <text x="209" y="378" text-anchor="middle" fill="#546e7a" font-size="9">NMP → SATP (array rule) → PSP (path policy)</text>

  <!-- HBA / iSCSI Initiator -->
  <rect x="28" y="394" width="362" height="38" fill="#fff3e0" rx="4" stroke="#ffb74d" stroke-width="1"/>
  <text x="209" y="409" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">HBA / iSCSI Initiator</text>
  <text x="209" y="425" text-anchor="middle" fill="#546e7a" font-size="9">Fibre Channel · iSCSI · NVMe-oF</text>

  <!-- vSwitch / dvSwitch -->
  <rect x="430" y="346" width="362" height="42" fill="#fff3e0" rx="4" stroke="#ffb74d" stroke-width="1"/>
  <text x="611" y="362" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vSwitch / dvSwitch</text>
  <text x="611" y="378" text-anchor="middle" fill="#546e7a" font-size="9">vmknic · port groups · NIOC traffic shaping</text>

  <!-- pNIC Uplinks -->
  <rect x="430" y="394" width="362" height="38" fill="#fff3e0" rx="4" stroke="#ffb74d" stroke-width="1"/>
  <text x="611" y="409" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">pNIC Uplinks</text>
  <text x="611" y="425" text-anchor="middle" fill="#546e7a" font-size="9">10 GbE · 25 GbE · 100 GbE · teaming</text>

  <!-- Arrows: I/O → Hardware -->
  <line x1="209" y1="432" x2="209" y2="456" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="611" y1="432" x2="611" y2="456" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 4: Hardware ── -->
  <rect x="20" y="460" width="780" height="22" fill="#6a1b9a" rx="5"/>
  <text x="410" y="475" text-anchor="middle" fill="white" font-size="12" font-weight="700">Hardware Layer</text>

  <!-- CPU / RAM -->
  <rect x="28" y="486" width="238" height="56" fill="#f3e5f5" rx="4" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="147" y="503" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="700">CPU / RAM</text>
  <text x="147" y="520" text-anchor="middle" fill="#546e7a" font-size="9">x86 processors · NUMA nodes</text>
  <text x="147" y="535" text-anchor="middle" fill="#546e7a" font-size="9">ECC memory · physical cores</text>

  <!-- NIC Hardware -->
  <rect x="291" y="486" width="238" height="56" fill="#f3e5f5" rx="4" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="410" y="503" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="700">NIC Hardware</text>
  <text x="410" y="520" text-anchor="middle" fill="#546e7a" font-size="9">Intel · Broadcom · Mellanox</text>
  <text x="410" y="535" text-anchor="middle" fill="#546e7a" font-size="9">SR-IOV · RDMA · TCP offload</text>

  <!-- HBA Hardware -->
  <rect x="554" y="486" width="238" height="56" fill="#f3e5f5" rx="4" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="673" y="503" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="700">HBA Hardware</text>
  <text x="673" y="520" text-anchor="middle" fill="#546e7a" font-size="9">QLogic · Emulex · NVMe controllers</text>
  <text x="673" y="535" text-anchor="middle" fill="#546e7a" font-size="9">FC HBA · iSCSI NIC · NVMe-oF</text>

  <!-- Footer -->
  <text x="410" y="558" text-anchor="middle" fill="#90a4ae" font-size="9">ESXi Hypervisor Architecture · Resource Scheduling Reference</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#455a64"/>
    </marker>
  </defs>
</svg>
