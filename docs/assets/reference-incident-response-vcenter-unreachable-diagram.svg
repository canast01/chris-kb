<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">INC-001: vCenter Server Unreachable</text>
  
  <rect x="20" y="50" width="240" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Is the vCenter VM pingable?</text>
  
  <line x1="140" y1="90" x2="140" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="150" y="115" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">YES</text>
  
  <rect x="20" y="130" width="240" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="155" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Is HTTPS (443) responding?</text>
  
  <line x1="140" y1="170" x2="140" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="150" y="195" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">YES</text>
  
  <rect x="20" y="210" width="240" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="235" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Is the UI loading?</text>
  
  <line x1="140" y1="250" x2="140" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="150" y="275" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">YES</text>
  
  <rect x="20" y="290" width="240" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Client-side or DNS issue — clear browser cache / check DNS</text>
  
  <line x1="260" y1="70" x2="400" y2="70" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="270" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NO</text>
  
  <rect x="410" y="50" width="360" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="420" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">[A] vCenter VM is down (power off or host issue)</text>
  
  <line x1="260" y1="150" x2="400" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="270" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NO</text>
  
  <rect x="410" y="130" width="360" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">[B] vCenter service is down (vpxd or rhttpproxy crashed)</text>
  
  <line x1="260" y1="230" x2="400" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="270" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NO</text>
  
  <rect x="410" y="210" width="360" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="420" y="235" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">[C] Database issue (vPostgres not responding)</text>
  
  <rect x="0" y="360" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Incident Response Flowchart</text>
</svg>