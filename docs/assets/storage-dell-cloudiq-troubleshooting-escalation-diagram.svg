<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">CloudIQ — Escalation</text>

  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open Dell support case at support.dell.com with SCG log bundle attached</text>
  </g>
  <line x1="410" y1="100" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 140)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Dell T1 reviews SCG logs and triage begins (typically 4 hours for P2)</text>
  </g>
  <line x1="410" y1="190" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 230)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If issue is SCG-side (connectivity, certificate, proxy):</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Dell T1/T2 guidance on SCG reconfiguration</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Common: update trust store after certificate rotation; proxy exception for CloudIQ endpoints</text>
  </g>
  <line x1="410" y1="310" x2="410" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 350)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If issue is CloudIQ SaaS-side (ingest pipeline, missing data in backend):</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Dell escalates to CloudIQ product team for backend investigation</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request: "Requesting CloudIQ SRE to check ingest pipeline for system ID [id] since [timestamp]"</text>
  </g>
  <line x1="410" y1="430" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 470)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If no progress in 4 hours for P1 / 1 business day for P2:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add case update: "Requesting escalation — [n] systems unmonitored since [date]"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact Dell account team to expedite if SaaS team investigation is needed</text>
  </g>
  <line x1="410" y1="550" x2="410" y2="580" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 590)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For sustained SaaS outages affecting contractual monitoring obligations:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request engagement through Dell Global Priority Services via your account team</text>
  </g>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>