<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Active Directory Escalation Process</text>
  
  <rect x="10" y="50" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at support.microsoft.com with dcdiag + repadmin + event logs attached</text>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="110" width="800" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Microsoft CSS T1 engineer acknowledges (Sev A: &lt; 2 hr; Sev B: &lt; 4 hr)</text>
  
  <line x1="410" y1="150" x2="410" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="170" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress within 2 hours for Sev A:</text>
  <text x="40" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to Active Directory Senior Engineer"</text>
  <text x="40" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[auth down / replication split-brain / FSMO lost]"</text>
  
  <line x1="410" y1="250" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="270" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — AD T2 Senior CSS Engineer assigned</text>
  <text x="40" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They will review repadmin output and may request a remote session</text>
  <text x="40" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have RDP or local console access to each affected DC ready</text>
  
  <line x1="410" y1="350" x2="410" y2="370" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="370" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue involves the AD schema, forest, or cross-domain trust:</text>
  <text x="40" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ CSS may involve the AD Engineering team directly</text>
  <text x="40" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Schema changes and forest-level recovery require Engineering involvement</text>
  
  <line x1="410" y1="450" x2="410" y2="470" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="470" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For Sev A with authentication down and no resolution:</text>
  <text x="40" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request CritSit escalation via the case</text>
  <text x="40" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact your Microsoft account team or Technical Account Manager</text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Active Directory Escalation Process</text>
</svg>