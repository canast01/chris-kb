<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Purity NDU Upgrade Sequence (non-disruptive)
  </text>
  
  <g transform="translate(10, 50)">
    <rect width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      1. Pre-check: purearray upgrade --check
    </text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      (clears all blockers — drives, pods, alerts)
    </text>
  </g>
  
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 130)">
    <rect width="800" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      2. Stage image: purearray upgrade --stage &lt;img&gt;
    </text>
  </g>
  
  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 190)">
    <rect width="800" height="65" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      3. Execute: purearray upgrade --exec
    </text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      CT1 restarts first → CT0 takes all I/O
    </text>
    <text x="10" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      CT1 comes back → CT0 restarts → I/O shifts back
    </text>
  </g>
  
  <line x1="410" y1="240" x2="410" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 270)">
    <rect width="800" height="50" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      4. Validate: purearray list --controller
    </text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Both controllers on new version → done
    </text>
  </g>
  
  <rect x="0" y="460" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Upgrade Sequence
  </text>
</svg>