<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Terraform Architecture — Declarative IaC
  </text>
  <rect x="10" y="50" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Core Workflow
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    init: download providers + modules
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    plan: diff desired vs state
  </text>
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    apply: create/update/delete
  </text>
  <text x="20" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    destroy: tear down all managed
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    fmt + validate: code hygiene
  </text>
  <rect x="410" y="50" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Provider Plugins
  </text>
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Go binary per provider
  </text>
  <text x="420" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Registry: registry.terraform.io
  </text>
  <text x="420" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pinned: required_providers
  </text>
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    aws, azurerm, google, vsphere
  </text>
  <text x="420" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Custom: internal provider SDK
  </text>
  <line x1="200" y1="170" x2="200" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="170" x2="620" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="230" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    State Management
  </text>
  <text x="20" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    terraform.tfstate: resource map
  </text>
  <text x="20" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Remote backend: S3, GCS, Azure
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Locking: DynamoDB / S3 lease
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workspaces: isolated state sets
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    import: onboard existing resources
  </text>
  <rect x="410" y="230" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Modules
  </text>
  <text x="420" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Package reusable infra patterns
  </text>
  <text x="420" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    source: local or registry URL
  </text>
  <text x="420" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    version: pinned in module call
  </text>
  <text x="420" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Input vars + output values
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    for_each/count: fan-out
  </text>
  <rect x="10" y="360" width="780" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workstation or CI runner with terraform binary; remote backend: cloud storage
  </text>
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    bucket + DynamoDB table for locking; network to target API endpoints.
  </text>
  <rect x="10" y="430" width="780" height="180" rx="6" fill="#ffffff" stroke="#455a64" />
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HCL = HashiCorp Configuration Language; declarative config syntax
  </text>
  <text x="20" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Provider = Go plugin wrapping a target API; versioned independently
  </text>
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Resource = managed infra object; tracked in state file
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Data source = read-only query of external data; not managed in state
  </text>
  <text x="20" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    State file = JSON map of real resource IDs to Terraform config
  </text>
  <text x="20" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Remote backend = cloud storage for state; enables team collaboration
  </text>
  <text x="20" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Workspace = isolated state within one config; dev/staging/prod
  </text>
  <text x="20" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Module = reusable .tf files with input vars and output values
  </text>
  <text x="20" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    for_each = create multiple resource instances from a map/set
  </text>
  <text x="20" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    depends_on = explicit dependency override; use when implicit fails
  </text>
  <text x="20" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Locking = prevents concurrent apply; DynamoDB with S3 backend
  </text>
  <text x="20" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    import = bring existing resource under Terraform management
  </text>
  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Terraform Architecture
  </text>
</svg>