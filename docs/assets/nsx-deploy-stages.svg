  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">DFW: Security → Distributed Firewall</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Segment: ping across overlay VMs</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Traceflow: verify packet path</text>
