<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Networking — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">VPC · Subnets · Route Tables · Security Groups · ELB · Route 53</text>

  <!-- ═ COLUMN 1: VPC Fundamentals ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">VPC Fundamentals</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Virtual Private Cloud · Subnets · Routing</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VPC (CIDR block)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Public Subnets (per AZ)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Private Subnets (per AZ)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Internet Gateway (IGW)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NAT Gateway (per AZ)</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Route Tables</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Typical CIDR: 10.0.0.0/16 per VPC</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Public subnet: route 0.0.0.0/0 → IGW</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Private subnet: route 0.0.0.0/0 → NAT GW</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">NAT GW: one per AZ for HA</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">VPC Flow Logs → CloudWatch / S3</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Min /28 subnet — max /16 VPC</text>

  <!-- ═ COLUMN 2: Connectivity ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#6a1b9a" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Connectivity</text>
  <text x="410" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Transit Gateway · Direct Connect · Endpoints</text>
  <rect x="295" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Transit Gateway (hub-and-spoke)</text>
  <rect x="295" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">VPC Peering</text>
  <rect x="295" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Gateway VPC Endpoints (S3, DynamoDB)</text>
  <rect x="295" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Interface VPC Endpoints (PrivateLink)</text>
  <rect x="295" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Direct Connect (on-prem link)</text>
  <rect x="295" y="256" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Site-to-Site VPN</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">TGW: central router across VPCs + accounts</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">VPC Peering: non-transitive, 1:1</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Gateway endpoint: free, no ENI</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">PrivateLink: private IP in your VPC</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Direct Connect: 1/10 Gbps dedicated</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">VPN: IPSec over internet (backup path)</text>

  <!-- ═ COLUMN 3: Security & Load Balancing ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Security &amp; Load Balancing</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">SGs · NACLs · ELB · Route 53</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Security Groups (stateful)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Network ACLs (stateless)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Application Load Balancer (ALB)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Network Load Balancer (NLB)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Route 53 (DNS + health checks)</text>
  <rect x="560" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">VPC Flow Logs</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">SGs: instance-level, allow-only rules</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">NACLs: subnet-level, ordered rules</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">ALB: HTTP/HTTPS, path/host routing</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">NLB: TCP/UDP, static IPs, ultra-low latency</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Route 53: failover, latency, weighted</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Flow logs: accept/reject per interface</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Security Group vs Network ACL</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="430" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Security Group</text>
  <text x="680" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Network ACL</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="590" y1="516" x2="590" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Applied at</text>
  <text x="430" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Instance / ENI level</text>
  <text x="680" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Subnet level</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">State</text>
  <text x="430" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Stateful (return traffic auto-allowed)</text>
  <text x="680" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Stateless (both directions explicit)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Default action</text>
  <text x="430" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Deny all (allow rules only)</text>
  <text x="680" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Allow all (numbered allow/deny)</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Rule processing</text>
  <text x="430" y="639" text-anchor="middle" fill="#546e7a" font-size="9">All rules evaluated</text>
  <text x="680" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Lowest number wins (first match)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Deny rules supported</text>
  <text x="430" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="680" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="430" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Primary traffic control layer</text>
  <text x="680" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Subnet-wide deny / blocklist</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Networking Reference · VPC · Subnets · Transit Gateway · ELB · Security Groups · Route 53</text>
</svg>
