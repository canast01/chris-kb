<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Nutanix Architecture — AOS HCI Cluster
  </text>

  <rect x="10" y="50" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Node Architecture
  </text>
  <text x="200" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AHV: Type-1 hypervisor (KVM)
  </text>
  <text x="200" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CVM: runs AOS + storage svc
  </text>
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CVM: reserved 4 vCPU / 12 GB
  </text>
  <text x="200" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Local SSD: CVM cache tier
  </text>
  <text x="200" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    HDD: persistent capacity tier
  </text>

  <rect x="410" y="50" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Distributed Storage Fabric
  </text>
  <text x="600" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DSF: pools all node disks
  </text>
  <text x="600" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RF2/RF3: replica factor
  </text>
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Erasure coding: 4+2 / 8+2
  </text>
  <text x="600" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OpLog: write buffer per node
  </text>
  <text x="600" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Medusa: metadata key-value
  </text>

  <line x1="200" y1="190" x2="200" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="190" x2="600" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="220" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management Plane (Prism)
  </text>
  <text x="200" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Prism Element: per-cluster UI
  </text>
  <text x="200" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Prism Central: multi-cluster
  </text>
  <text x="200" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API v2/v3: automation
  </text>
  <text x="200" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    RBAC: role-based access
  </text>
  <text x="200" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    LCM: lifecycle manager
  </text>

  <rect x="410" y="220" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Cluster Services
  </text>
  <text x="600" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Zookeeper: cluster config
  </text>
  <text x="600" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cassandra: metric storage
  </text>
  <text x="600" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Genesis: service manager
  </text>
  <text x="600" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cerebro: replication engine
  </text>
  <text x="600" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Stargate: I/O path handler
  </text>

  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Nutanix Architecture
  </text>
</svg>