<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    /etc/audit/rules.d/99-hardening.rules
  </text>
  
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Delete all existing rules first
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -D
    </text>
  </g>

  <g transform="translate(10, 90)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Set buffer size — increase on busy systems
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -b 8192
    </text>
  </g>

  <g transform="translate(10, 140)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Failure mode: 1 = print warning; 2 = panic (use 2 on high-security systems)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -f 1
    </text>
  </g>

  <g transform="translate(10, 190)">
    <rect x="0" y="0" width="800" height="240" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Identity and authentication
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/passwd -p wa -k identity
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/shadow -p wa -k identity
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/group -p wa -k identity
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/gshadow -p wa -k identity
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/sudoers -p wa -k sudoers
    </text>
    <text x="10" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/sudoers.d/ -p wa -k sudoers
    </text>
    <text x="10" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/security/access.conf -p wa -k login_access
    </text>
  </g>

  <g transform="translate(10, 440)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Authentication events
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /var/log/lastlog -p wa -k logins
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /var/run/faillock/ -p wa -k logins
    </text>
  </g>

  <g transform="translate(10, 490)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      SSH configuration changes
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/ssh/sshd_config -p wa -k sshd_config
    </text>
  </g>

  <g transform="translate(10, 540)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Privileged command execution
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -a always,exit -F arch=b64 -S execve -F euid=0 -k privileged_exec
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /usr/bin/sudo -p x -k sudo_exec
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /usr/bin/su -p x -k su_exec
    </text>
  </g>

  <g transform="translate(10, 630)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Network configuration
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k hostname_change
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/hosts -p wa -k network_config
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/sysconfig/network -p wa -k network_config
    </text>
  </g>

  <g transform="translate(10, 720)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Module loading
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /sbin/insmod -p x -k modules
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /sbin/rmmod -p x -k modules
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /sbin/modprobe -p x -k modules
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -a always,exit -F arch=b64 -S init_module -S delete_module -k modules
    </text>
  </g>

  <g transform="translate(10, 810)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Cron
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/cron.allow -p wa -k cron
    </text>
    <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/cron.deny -p wa -k cron
    </text>
    <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/cron.d/ -p wa -k cron
    </text>
    <text x="10" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /etc/cron.daily/ -p wa -k cron
    </text>
    <text x="10" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -w /var/spool/cron/ -p wa -k cron
    </text>
  </g>

  <g transform="translate(10, 900)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Time
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -S clock_settime -k time_change
    </text>
  </g>

  <g transform="translate(10, 950)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Make rules immutable — requires reboot to change (comment out during setup)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      -e 2
    </text>
  </g>

  <rect x="0" y="1000" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="1020" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Linux Hardening Audit Rules
  </text>
</svg>