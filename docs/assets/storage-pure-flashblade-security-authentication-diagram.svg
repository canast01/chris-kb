<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    FlashBlade Authentication — Data vs Management Plane
  </text>
  
  <!-- Management Plane -->
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management plane (GUI / API / CLI):
  </text>
  <rect x="20" y="70" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Browser</text>
  <line x1="200" y1="85" x2="280" y2="85" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="280" y="70" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="290" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SAML SSO (IdP)</text>
  <line x1="460" y1="85" x2="540" y2="85" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="540" y="70" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="550" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">MFA</text>
  <line x1="720" y1="85" x2="800" y2="85" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="800" y="70" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="810" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Purity//FB RBAC</text>

  <rect x="20" y="110" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Script</text>
  <line x1="200" y1="125" x2="280" y2="125" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="280" y="110" width="180" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="290" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">API token</text>
  <line x1="460" y1="125" x2="800" y2="125" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Data Plane -->
  <text x="10" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data plane:
  </text>
  <rect x="20" y="180" width="180" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">NFS clients</text>
  <line x1="200" y1="195" x2="400" y2="195" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Kerberos (AD) or AUTH_SYS (UID/GID)
  </text>

  <rect x="20" y="220" width="180" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SMB clients</text>
  <line x1="200" y1="235" x2="400" y2="235" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Active Directory (Kerberos / NTLM)
  </text>

  <rect x="20" y="260" width="180" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">S3 clients</text>
  <line x1="200" y1="275" x2="400" y2="275" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    S3 access key + secret key
  </text>

  <!-- Identity Sources -->
  <text x="10" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Identity sources:
  </text>
  <rect x="20" y="330" width="180" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">AD / LDAP</text>
  <line x1="200" y1="345" x2="400" y2="345" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="410" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    group membership ──► role mapping
  </text>

  <rect x="20" y="370" width="180" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Local accounts</text>
  <text x="210" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(break-glass only)</text>

  <rect x="20" y="410" width="180" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">API tokens</text>
  <text x="210" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(service accounts for automation)</text>

  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: FlashBlade Authentication
  </text>
</svg>