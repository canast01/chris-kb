<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell VPLEX — Storage Virtualization Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Storage virtualization appliance between hosts and arrays; presents virtual volumes
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    abstracting underlying LUNs; Metro active-active stretch; non-disruptive migration.
  </text>
  
  <rect x="10" y="80" width="390" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="205" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Function
  </text>
  <text x="205" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Storage virtualization layer
  </text>
  <text x="205" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Sits between hosts + arrays
  </text>
  <text x="205" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Presents virtual volumes
  </text>
  <text x="205" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Abstracts underlying LUNs
  </text>
  <text x="205" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cache coherency: distributed
  </text>
  
  <rect x="420" y="80" width="390" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="615" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Deployment Topologies
  </text>
  <text x="615" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Local: single site; migrate
  </text>
  <text x="615" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Metro: active-active 2-site
  </text>
  <text x="615" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Geo: async distant sites
  </text>
  <text x="615" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cluster: 2 directors per site
  </text>
  <text x="615" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FC: only connectivity
  </text>
  
  <text x="10" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    VPLEX Metro enables VMware vMSC (Metro Storage Cluster) for cross-site vMotion.
  </text>
  
  <line x1="205" y1="240" x2="205" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="240" x2="615" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="270" width="390" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="205" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key Use Cases
  </text>
  <text x="205" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Non-disruptive migration
  </text>
  <text x="205" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Heterogeneous array support
  </text>
  <text x="205" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Active-active Metro stretch
  </text>
  <text x="205" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Host transparent migration
  </text>
  <text x="205" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vMSC: VMware stretched cluster
  </text>
  
  <rect x="420" y="270" width="390" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="615" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management
  </text>
  <text x="615" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPLEX Management Console
  </text>
  <text x="615" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vscli: command line
  </text>
  <text x="615" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API: automation
  </text>
  <text x="615" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPLEX Witness: tiebreaker
  </text>
  <text x="615" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vCenter plugin optional
  </text>
  
  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="435" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    VPLEX VS2 appliance (2U rackmount); FC fabric connections to both hosts and arrays;
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Inter-cluster link (ICL): FC between VPLEX clusters at both Metro sites.
  </text>
  
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VPLEX          = Dell storage virtualization appliance; brand name
  </text>
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Virtual volume = logical volume presented to hosts; maps to one or more LUNs
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Virtual device = internal VPLEX construct mapping virtual vol to storage extents
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Metro          = synchronous active-active VPLEX across 2 sites; shared volume
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Local          = single-site VPLEX; non-disruptive migration use case
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cache coherency= VPLEX distributed cache ensures consistency across both copies
  </text>
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ICL            = Inter-Cluster Link; FC link between the two VPLEX clusters
  </text>
  <text x="10" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Director       = VPLEX compute module; two per cluster for HA
  </text>
  <text x="10" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vMSC           = vSphere Metro Storage Cluster; VMware validated with VPLEX Metro
  </text>
  <text x="10" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Witness        = VPLEX tiebreaker VM; determines surviving site on network partition
  </text>
  <text x="10" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Non-disruptive migration= move LUNs between arrays while host IO continues
  </text>
  <text x="10" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Heterogeneous  = VPLEX virtualizes LUNs from any vendor (PowerMax, NetApp, Pure)
  </text>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: VPLEX Architecture Overview
  </text>
</svg>