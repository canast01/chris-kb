<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Superna Eyeglass — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Primary Site</text>

  <!-- Col 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerScale Cluster A</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Eyeglass Primary Appliance</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(monitors + orchestrates)</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">SyncIQ Policies</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Orchestration</text>

  <!-- Col 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Eyeglass DR Assistant</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">DR Readiness Score</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">DNS / AD Cutover</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Share / Quota Sync</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DR Site</text>

  <!-- Col 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">PowerScale Cluster B</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="170" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Eyeglass DR Appliance</text>
  <text x="678" y="182" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(activates on site loss)</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Access Zone Migration</text>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="160" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Eyeglass</text>
  <text x="420" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Manual SyncIQ</text>
  <text x="680" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">NetApp SnapMirror</text>

  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="557" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Failover Time</text>
  <text x="160" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">5–15 minutes automated</text>
  <text x="420" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Hours (manual steps)</text>
  <text x="680" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Varies (tool-dependent)</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="583" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Automation</text>
  <text x="160" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Full DR orchestration</text>
  <text x="420" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">CLI / manual runbook</text>
  <text x="680" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Partial (NetApp tools)</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="609" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">DNS Cutover</text>
  <text x="160" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Automated SmartConnect zone</text>
  <text x="420" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Manual DNS updates required</text>
  <text x="680" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Manual DNS updates required</text>

  <rect x="20" y="618" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Config Sync</text>
  <text x="160" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Shares, quotas, access zones</text>
  <text x="420" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Data only (no config)</text>
  <text x="680" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Data only (no config)</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
