<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Brocade Fabric OS — Escalation</text>

  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at support.broadcom.com with supportsave bundles from all switches</text>
  </g>

  <line x1="410" y1="100" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — T1 TAC engineer acknowledges and confirms bundles received (typically 30 min–2 hr)</text>
  </g>

  <line x1="410" y1="180" x2="410" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 210)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 2 hours for Sev1 or 1 business day for Sev2:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in the case: "Requesting escalation to Senior Brocade SAN Engineer"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "Impact: [N] hosts cannot access storage on fabric [A/B]; I/O stalled"</text>
  </g>

  <line x1="410" y1="290" x2="410" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 320)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Senior SAN Engineer is assigned; they may request remote access to the switch</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Enable remote access: TAC will connect via SSH to the switch through your jump host</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have the TAC tunnel or Webex session ready</text>
  </g>

  <line x1="410" y1="400" x2="410" y2="430" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 430)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue requires firmware-level investigation or a code defect:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Senior engineer escalates to Brocade Engineering</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering may provide a patch FOS build if a defect is confirmed</text>
  </g>

  <line x1="410" y1="510" x2="410" y2="540" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(20, 540)">
    <rect x="0" y="0" width="780" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For full fabric down with no path to restore, or 24h+ without resolution:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Request escalation to Broadcom TAC manager</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add to case: "Escalation requested — fabric down, N hosts with no storage, Xh+ elapsed"</text>
  </g>

  <rect x="0" y="630" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>