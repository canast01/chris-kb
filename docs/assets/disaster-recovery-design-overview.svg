<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Disaster Recovery Design — Architecture Overview</text>

  <!-- Column 1: Recovery Tiers -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Recovery Tiers</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 0: Active-Active</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 1: Warm Standby</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 2: Pilot Light</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Tier 3: Backup-Restore</text>

  <!-- Column 2: Replication Technologies -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Replication Technologies</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">RecoverPoint (sync/async)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Zerto (journal-based)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Veeam (snapshot replication)</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Native array (SnapMirror)</text>

  <!-- Column 3: DR Site Infrastructure -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DR Site Infrastructure</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Pre-provisioned compute</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Network runbooks</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">DNS cutover plan</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Runbook automation</text>

  <!-- Comparison Table -->
  <rect x="20" y="330" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Metric</text>
  <text x="310" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Active-Active</text>
  <text x="510" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Warm Standby</text>
  <text x="701" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Backup-Restore</text>

  <rect x="20" y="360" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">RTO</text>
  <text x="310" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Near-zero / seconds</text>
  <text x="510" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Minutes to hours</text>
  <text x="701" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Hours to days</text>

  <rect x="20" y="386" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">RPO</text>
  <text x="310" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero (synchronous)</text>
  <text x="510" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Seconds to minutes</text>
  <text x="701" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Hours (last backup)</text>

  <rect x="20" y="412" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Cost</text>
  <text x="310" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Very high (2x infra)</text>
  <text x="510" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">High (partial infra)</text>
  <text x="701" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low (storage only)</text>

  <rect x="20" y="438" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Complexity</text>
  <text x="310" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Very high</text>
  <text x="510" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Medium</text>
  <text x="701" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
