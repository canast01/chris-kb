<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    /etc/pam.d/system-auth — full hardened stack
  </text>

  <!-- Auth Section -->
  <rect x="10" y="40" width="800" height="120" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    auth
  </text>
  <text x="20" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_env.so
  </text>
  <text x="20" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_faillock.so preauth silent deny=5 unlock_time=900
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    sufficient pam_unix.so nullok
  </text>
  <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    sufficient pam_sss.so forward_pass
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    [default=die] pam_faillock.so authfail deny=5 unlock_time=900
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    requisite pam_succeed_if.so uid &gt;= 1000 quiet_success
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_deny.so
  </text>

  <!-- Account Section -->
  <rect x="10" y="180" width="800" height="120" fill="#e8eaf6" stroke="#3949ab" rx="6" />
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    account
  </text>
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_unix.so
  </text>
  <text x="20" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    sufficient pam_localuser.so
  </text>
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    sufficient pam_succeed_if.so uid &lt; 1000 quiet
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    [default=bad success=ok user_unknown=ignore] pam_sss.so
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_permit.so
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_faillock.so
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_access.so
  </text>

  <!-- Password Section -->
  <rect x="10" y="320" width="800" height="80" fill="#e8f5e9" stroke="#2e7d32" rx="6" />
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    password
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    requisite pam_pwquality.so try_first_pass local_users_only retry=3 minlen=14 minclass=3 maxrepeat=3 dictcheck=1
  </text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    sufficient pam_unix.so sha512 shadow nullok use_authtok remember=24
  </text>
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    sufficient pam_sss.so use_authtok
  </text>
  <text x="20" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_deny.so
  </text>

  <!-- Session Section -->
  <rect x="10" y="410" width="800" height="100" fill="#fff8e1" stroke="#f57f17" rx="6" />
  <text x="20" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    session
  </text>
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    optional pam_keyinit.so revoke
  </text>
  <text x="20" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_limits.so
  </text>
  <text x="20" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    optional pam_oddjob_mkhomedir.so umask=0077
  </text>
  <text x="20" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    [success=1 default=ignore] pam_succeed_if.so service in crond quiet use_uid
  </text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    required pam_unix.so
  </text>
  <text x="20" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    optional pam_sss.so
  </text>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Linux PAM Configuration
  </text>
</svg>