<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">VMware Cloud Foundation — Domain Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">SDDC Manager · Management Domain · VI Workload Domain · VVF / Tanzu Domain</text>

  <!-- ═ COLUMN 1: SDDC Manager ═ -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="49" fill="#37474f" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#37474f"/>
  <text x="112" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">SDDC Manager</text>
  <text x="112" y="111" text-anchor="middle" fill="#b0bec5" font-size="9">VCF orchestration layer</text>
  <rect x="30" y="126" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Cloud Builder (initial deploy)</text>
  <rect x="30" y="152" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">SDDC Manager VM</text>
  <rect x="30" y="178" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">BOM (Bill of Materials)</text>
  <rect x="30" y="204" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Network Pools</text>
  <rect x="30" y="230" width="165" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="112" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">Lifecycle Manager (LCM)</text>
  <text x="112" y="282" text-anchor="middle" fill="#78909c" font-size="9">Orchestrates all domains</text>
  <text x="112" y="300" text-anchor="middle" fill="#78909c" font-size="9">Validates HCL compliance</text>
  <text x="112" y="318" text-anchor="middle" fill="#78909c" font-size="9">Password vault for components</text>
  <text x="112" y="336" text-anchor="middle" fill="#78909c" font-size="9">Certificate lifecycle management</text>
  <text x="112" y="354" text-anchor="middle" fill="#78909c" font-size="9">Automated lifecycle upgrades</text>

  <!-- ═ COLUMN 2: Management Domain ═ -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="49" fill="#1565c0" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="307" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Management Domain</text>
  <text x="307" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Control plane · 4 hosts min</text>
  <rect x="225" y="126" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vCenter Server</text>
  <rect x="225" y="152" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NSX Manager cluster</text>
  <rect x="225" y="178" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSAN datastore</text>
  <rect x="225" y="204" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Aria Operations (optional)</text>
  <rect x="225" y="230" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="307" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Aria Automation (optional)</text>
  <text x="307" y="282" text-anchor="middle" fill="#78909c" font-size="9">Hosts VCF management VMs</text>
  <text x="307" y="300" text-anchor="middle" fill="#78909c" font-size="9">Minimum 4 ESXi hosts</text>
  <text x="307" y="318" text-anchor="middle" fill="#78909c" font-size="9">Dedicated vCenter + NSX instance</text>
  <text x="307" y="336" text-anchor="middle" fill="#78909c" font-size="9">No customer workloads here</text>
  <text x="307" y="354" text-anchor="middle" fill="#78909c" font-size="9">Foundation for all workload domains</text>

  <!-- ═ COLUMN 3: VI Workload Domain ═ -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="49" fill="#2e7d32" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#2e7d32"/>
  <text x="502" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Workload Domain (VI)</text>
  <text x="502" y="111" text-anchor="middle" fill="#a5d6a7" font-size="9">vSphere workloads · own vCenter</text>
  <rect x="420" y="126" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="502" y="141" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">vCenter Server (dedicated)</text>
  <rect x="420" y="152" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="502" y="167" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">NSX instance (shared or dedicated)</text>
  <rect x="420" y="178" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="502" y="193" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">vSAN or external storage</text>
  <rect x="420" y="204" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="502" y="219" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">ESXi Workload Hosts</text>
  <rect x="420" y="230" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="502" y="245" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">Customer VMs</text>
  <text x="502" y="282" text-anchor="middle" fill="#78909c" font-size="9">Isolated per business unit / team</text>
  <text x="502" y="300" text-anchor="middle" fill="#78909c" font-size="9">Managed by SDDC Manager</text>
  <text x="502" y="318" text-anchor="middle" fill="#78909c" font-size="9">Lifecycle upgrades coordinated</text>
  <text x="502" y="336" text-anchor="middle" fill="#78909c" font-size="9">Can expand with new hosts</text>
  <text x="502" y="354" text-anchor="middle" fill="#78909c" font-size="9">Use: general vSphere workloads</text>

  <!-- ═ COLUMN 4: VVF / Tanzu ═ -->
  <rect x="605" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="185" height="49" fill="#00695c" rx="6"/>
  <rect x="605" y="100" width="185" height="14" fill="#00695c"/>
