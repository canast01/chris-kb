  <text x="302" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">NSX required</text>
  <text x="302" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="450" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="613" text-anchor="middle" fill="#455a64" font-size="9">Kubernetes support</text>
  <text x="302" y="614" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="614" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="614" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Optional</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">Min hosts</text>
  <text x="302" y="639" text-anchor="middle" fill="#546e7a" font-size="9">4</text>
  <text x="450" y="639" text-anchor="middle" fill="#546e7a" font-size="9">3+</text>
  <text x="597" y="639" text-anchor="middle" fill="#546e7a" font-size="9">3+</text>
  <text x="742" y="639" text-anchor="middle" fill="#546e7a" font-size="9">4 (all-in-one)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Dedicated vCenter</text>
  <text x="302" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="450" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Shared</text>
  <text x="120" y="691" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="302" y="691" text-anchor="middle" fill="#546e7a" font-size="9">VCF control plane</text>
  <text x="450" y="691" text-anchor="middle" fill="#546e7a" font-size="9">vSphere workloads</text>
  <text x="597" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Kubernetes / DevOps</text>
  <text x="742" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Small deployments</text>
