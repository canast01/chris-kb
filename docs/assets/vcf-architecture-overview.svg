  <text x="697" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Cloud-native / Kubernetes</text>
  <rect x="615" y="126" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter + Tanzu Supervisor</text>
  <rect x="615" y="152" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NSX (required for Supervisor)</text>
  <rect x="615" y="178" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">TanzuKubernetes Clusters</text>
  <rect x="615" y="204" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Harbor Registry</text>
  <rect x="615" y="230" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSAN with encrypted policies</text>
  <text x="697" y="282" text-anchor="middle" fill="#78909c" font-size="9">Kubernetes-native workloads</text>
  <text x="697" y="300" text-anchor="middle" fill="#78909c" font-size="9">vSphere Namespace isolation</text>
  <text x="697" y="318" text-anchor="middle" fill="#78909c" font-size="9">NSX mandatory (overlay required)</text>
  <text x="697" y="336" text-anchor="middle" fill="#78909c" font-size="9">Velero for backup</text>
  <text x="697" y="354" text-anchor="middle" fill="#78909c" font-size="9">Use: cloud-native / DevOps</text>

