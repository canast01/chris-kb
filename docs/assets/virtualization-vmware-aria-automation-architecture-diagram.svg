<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Aria Automation Architecture — Self-Service IaC
  </text>
  
  <rect x="10" y="50" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Platform Architecture
  </text>
  <text x="200" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    K8s microservices in vSphere
  </text>
  <text x="200" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Services: catalog, blueprint, k8s
  </text>
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Embedded NSX integration
  </text>
  <text x="200" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    PostgreSQL + MinIO for data
  </text>
  <text x="200" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Multi-tenant: projects + orgs
  </text>
  
  <rect x="410" y="50" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Cloud Template (IaC)
  </text>
  <text x="600" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    YAML declarative definition
  </text>
  <text x="600" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Resource types: Cloud.vSphere.Machine
  </text>
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Constraints: tag/cloud/region
  </text>
  <text x="600" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Versioned in Service Catalog
  </text>
  <text x="600" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Input params: consumer choices
  </text>
  
  <line x1="200" y1="190" x2="200" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="190" x2="600" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="220" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Integrations
  </text>
  <text x="200" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    vCenter: VM provisioning
  </text>
  <text x="200" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NSX: network on-demand
  </text>
  <text x="200" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS/Azure/GCP: public cloud
  </text>
  <text x="200" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ServiceNow: ITSM ticket-driven
  </text>
  <text x="200" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IPAM: Infoblox or internal
  </text>
  
  <rect x="410" y="220" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Orchestration
  </text>
  <text x="600" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ABX: serverless action scripts
  </text>
  <text x="600" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Orchestrator: complex workflows
  </text>
  <text x="600" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pipelines: CI/CD integration
  </text>
  <text x="600" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Git: template version control
  </text>
  <text x="600" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Notification: Slack/email hooks
  </text>
  
  <text x="410" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    3–4 VM cluster running embedded Kubernetes; vSphere 7+ required; 16 vCPU
  </text>
  <text x="410" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    / 40 GB RAM per node minimum; PostgreSQL data on shared storage.
  </text>
  
  <text x="410" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cloud template  = YAML IaC file defining a deployable set of resources
  </text>
  <text x="410" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Deployment      = running instance created from a cloud template
  </text>
  <text x="410" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Service Catalog = portal where users request templates; RBAC-gated
  </text>
  <text x="410" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Project         = multi-tenancy unit; controls which clouds + users can access
  </text>
  <text x="410" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ABX             = Action-Based Extensibility; serverless scripts (Python/JS/PS)
  </text>
  <text x="410" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Orchestrator    = workflow engine; complex multi-step automation
  </text>
  <text x="410" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Constraint      = placement rule; tag, cloud, or availability zone filter
  </text>
  <text x="410" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Day-2 action    = post-deployment operation; resize, snapshot, power actions
  </text>
  <text x="410" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pipeline        = CI/CD; build-test-deploy chain triggered by Git events
  </text>
  <text x="410" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    IPAM            = IP Address Manager; external integration for IP allocation
  </text>
  <text x="410" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Input param     = consumer-visible variable in template; dropdown or text
  </text>
  <text x="410" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MinIO           = S3-compatible object store; artifact storage in Aria Automation
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Aria Automation Architecture
  </text>
</svg>