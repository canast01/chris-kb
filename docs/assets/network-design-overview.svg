<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Enterprise Network Design — Architecture Overview</text>

  <!-- Column 1: Physical Tiers -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Physical Tiers</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Core / Spine Layer</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Distribution / Leaf Layer</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Access Layer</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Out-of-band Mgmt</text>

  <!-- Column 2: Network Segments -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Network Segments</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Production VLANs</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Storage (iSCSI/NFS)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Management</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">DMZ / Internet Edge</text>

  <!-- Column 3: Redundancy -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Redundancy</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Dual uplinks (LAG/vPC)</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Dual switches (VSS/vPC)</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Dual routers (HSRP/VRRP)</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Dual WAN providers</text>

  <!-- Comparison Table -->
  <rect x="20" y="330" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Pattern</text>
  <text x="310" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Topology</text>
  <text x="510" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Failover</text>
  <text x="701" y="350" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Use Case</text>

  <rect x="20" y="360" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Spine-Leaf</text>
  <text x="310" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Every leaf to every spine</text>
  <text x="510" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Sub-second ECMP</text>
  <text x="701" y="377" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Large DC / hyperscale</text>

  <rect x="20" y="386" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Three-Tier</text>
  <text x="310" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Core / Dist / Access</text>
  <text x="510" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">STP / HSRP</text>
  <text x="701" y="403" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Enterprise campus / DC</text>

  <rect x="20" y="412" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Collapsed Core</text>
  <text x="310" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Core + Dist combined</text>
  <text x="510" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Dual switch failover</text>
  <text x="701" y="429" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Small / mid DC</text>

  <rect x="20" y="438" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Active-Active DC</text>
  <text x="310" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Stretched L2 / BGP</text>
  <text x="510" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Transparent site failover</text>
  <text x="701" y="455" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Metro DR / HA</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
