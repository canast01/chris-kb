  <text x="360" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(do not wait on email)</text>
  
  <line x1="580" y1="260" x2="580" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
