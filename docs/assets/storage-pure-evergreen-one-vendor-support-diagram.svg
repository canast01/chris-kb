  <text x="360" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ P3: non-crit ─ NBD</text>
  <text x="360" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ P4: query ─ best</text>
  
  <line x1="160" y1="105" x2="350" y2="105" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
