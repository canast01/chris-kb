<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FOD — Escalation</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open SR at support.dell.com with error output and SN comparison attached</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Specify in Notes which team should handle (Licensing vs TAC vs Account team)</text>
  </g>
  
  <line x1="410" y1="110" x2="410" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 140)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — Key rejection / SN mismatch → Dell Licensing team</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Typical resolution: Licensing re-generates the key for the correct SN</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">SLA: 1 business day; if time-critical, ask account team to expedite</text>
  </g>
  
  <line x1="410" y1="220" x2="410" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 250)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — Feature not activating after valid key import → Dell TAC</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">TAC will check firmware version requirements and backend feature flag state</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">May require a firmware update or a TAC-initiated backend unlock</text>
  </g>
  
  <line x1="410" y1="330" x2="410" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 360)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Contract or billing issue → Dell Account team</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Account team connects to Dell Contract Management for entitlement verification</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Purchase order number required for account team to locate the key history</text>
  </g>
  
  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 470)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If unresolved after 1 business day for P2 or P3:</text>
    <text x="10" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Add case update: "Requesting escalation — capacity expansion blocked since [date]"</text>
    <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Contact your Dell account executive directly to expedite with the Licensing team</text>
  </g>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>