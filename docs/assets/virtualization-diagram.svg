<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    VMware Platform Stack
  </text>
  
  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    VMware Cloud Foundation (VCF / SDDC)
  </text>
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Packages and delivers the full SDDC: vSphere + vSAN + NSX + Lifecycle
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SDDC Manager: bringup · upgrades · compliance · certificate rotation
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tanzu: Kubernetes workload domains hosted within VCF
  </text>

  <line x1="410" y1="120" x2="410" y2="140" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    orchestrates
  </text>

  <rect x="10" y="150" width="250" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    vCenter
  </text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Management &amp; Control Plane
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inventory · Roles · Alarms
  </text>
  <text x="20" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    HA · DRS · vMotion · vLCM
  </text>
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SSO · LDAP · Permissions
  </text>

  <rect x="285" y="150" width="250" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="295" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    NSX-T
  </text>
  <text x="295" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Software-Defined Networking
  </text>
  <text x="295" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Segments · T0/T1 Gateways
  </text>
  <text x="295" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Distributed Firewall · LB
  </text>
  <text x="295" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Micro-segmentation · VPN
  </text>

  <rect x="560" y="150" width="250" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="570" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    VxRail
  </text>
  <text x="570" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Hyper-Converged Appliance
  </text>
  <text x="570" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dell hardware + VMware stack
  </text>
  <text x="570" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VxRail Manager · Lifecycle
  </text>
  <text x="570" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Automated node expansion
  </text>

  <line x1="135" y1="250" x2="135" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="250" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="280" width="800" height="90" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ESXi Hosts (vSphere Cluster)
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Type-1 hypervisor: installed directly on bare metal — no host OS required
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cluster features: HA · DRS · vMotion · Fault Tolerance · EVC
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VMkernel adapters: vmk0(mgmt) · vmk1(vMotion) · vmk2(vSAN) · vmk3(other)
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Each host runs 50-200+ VMs; types: web · DB · app · AD · infra
  </text>

  <line x1="410" y1="360" x2="410" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="390" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    vSAN (Software-Defined Storage)
  </text>
  <text x="20" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pools local NVMe/SSD/HDD disks from all ESXi hosts into a shared datastore
  </text>
  <text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Storage policy assigned per VM: RAID-1 (mirror) · RAID-5/6 (erasure coding)
  </text>
  <text x="20" y="455" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Features: Deduplication · Compression · Encryption · Stretched Cluster
  </text>

  <rect x="0" y="490" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Virtualization
  </text>
</svg>