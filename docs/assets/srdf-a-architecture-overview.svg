<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">SRDF/A — Architecture Overview</text>

  <!-- Column 1 header (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Production Site</text>

  <!-- Col 1 boxes -->
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Production Hosts</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PowerMax R1</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">DSE Overflow Buffer</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">(WAN saturation protection)</text>

  <!-- Column 2 header (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Replication Engine</text>

  <!-- Col 2 boxes -->
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Delta Set</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(~30s cycle flush)</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">WAN Link</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">(compressed replication)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">RPO Monitor</text>

  <!-- Column 3 header (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DR Site</text>

  <!-- Col 3 boxes -->
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">PowerMax R2</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Consistency Groups</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Standby Hosts</text>

  <!-- Comparison table -->
  <rect x="20" y="510" width="783" height="30" fill="#1e293b"/>
  <text x="160" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SRDF/A</text>
  <text x="420" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SRDF/S</text>
  <text x="680" y="530" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SRDF/Metro</text>

  <rect x="20" y="540" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="557" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">RPO</text>
  <text x="160" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">~30 seconds (last cycle)</text>
  <text x="420" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero (RPO = 0)</text>
  <text x="680" y="557" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero (active-active)</text>

  <rect x="20" y="566" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="583" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Distance</text>
  <text x="160" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Unlimited (async)</text>
  <text x="420" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">≤10ms RTT (~100km)</text>
  <text x="680" y="583" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">≤5ms RTT (metro only)</text>

  <rect x="20" y="592" width="783" height="26" fill="#f1f5f9"/>
  <text x="22" y="609" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Performance Impact</text>
  <text x="160" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Low — DSE buffers write bursts</text>
  <text x="420" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">High — synchronous write latency</text>
  <text x="680" y="609" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Minimal — active-active I/O</text>

  <rect x="20" y="618" width="783" height="26" fill="#ffffff"/>
  <text x="22" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Use Case</text>
  <text x="160" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Long-distance DR, low RPO</text>
  <text x="420" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Zero data-loss, metro DR</text>
  <text x="680" y="635" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Business continuity, no failover</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
