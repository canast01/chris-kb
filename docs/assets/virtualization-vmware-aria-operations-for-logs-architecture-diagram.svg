<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Aria Operations for Logs — Log Analytics Architecture
  </text>
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Collects syslog and LI Agent data; indexes in Cassandra hot tier; optional NFS archive; real-time search, alerting, and launch-in-context with Aria Operations.
  </text>
  <rect x="10" y="70" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cluster Architecture
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Master + worker nodes
  </text>
  <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cassandra: hot-tier index
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NFS archive: cold-tier logs
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VIP/LB: multi-node ingestion
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Retention: default 30 days hot
  </text>
  <rect x="410" y="70" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Log Ingestion
  </text>
  <text x="420" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Syslog: UDP/TCP 514 (plain)
  </text>
  <text x="420" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Syslog TLS: TCP 1514
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LI Agent: CFAPI port 9543
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CFAPI: structured JSON events
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vCenter: plugin auto-config
  </text>
  <text x="10" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    LI Agent adds structured fields; syslog is plain text — agent preferred for VMware.
  </text>
  <line x1="200" y1="220" x2="200" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="220" x2="620" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="260" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Search and Alerting
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Query: interactive log search
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Alert: pattern match + threshold
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Notification: email/webhook
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Content pack: pre-built filters
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dashboard: saved queries
  </text>
  <rect x="410" y="260" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Integrations
  </text>
  <text x="420" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Aria Operations: launch-in-ctx
  </text>
  <text x="420" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SNMP: trap forwarding
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Syslog forward: to SIEM
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    vRNI: network flow correlation
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AD: LDAP/SAML auth
  </text>
  <text x="10" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="415" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Photon OS VMs; NFS share for archive; load balancer (NSX/VIP) for multi-node;
  </text>
  <text x="10" y="430" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    UDP 514 / TCP 514 / TCP 1514 / TCP 9543 open on firewall.
  </text>
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="475" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    LI Agent = Log Insight Agent; structured log forwarding to Aria Logs
  </text>
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    CFAPI = Content Frame API; structured JSON ingestion; port 9543
  </text>
  <text x="10" y="505" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Cassandra = hot-tier index; in-cluster; fast search on recent logs
  </text>
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    NFS archive = cold-tier; compressed log storage; not searchable in-place
  </text>
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Content pack = pre-built filters, queries, alerts for a product
  </text>
  <text x="10" y="550" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Launch-in-ctx = link from Aria Operations alert to correlated log view
  </text>
  <text x="10" y="565" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Syslog = UDP/TCP 514 plain; TCP 1514 TLS; no structured fields
  </text>
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Retention = hot: configurable (default 30 days); archive: NFS limit
  </text>
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Master node = primary; handles UI, API, Cassandra coordination
  </text>
  <text x="10" y="610" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Worker node = ingestion + indexing; scales horizontally
  </text>
  <text x="10" y="625" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Alert = query that fires notification when match count &gt; threshold
  </text>
  <text x="10" y="640" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    vRNI = Aria Operations for Networks; network flow log correlation
  </text>
  <rect x="0" y="660" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Log Analytics Architecture
  </text>
</svg>