<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">OpenShift — Control Plane Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Control Plane · Worker Nodes · Networking (OVN-K) · Storage (ODF/CSI)</text>

  <!-- COLUMN 1: Control Plane -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Control Plane</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">3-node HA cluster · RHCOS only</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">API Server (kube-apiserver)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">etcd cluster (3 members, quorum)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Controller Manager</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Scheduler (kube-scheduler)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cluster Version Operator (CVO)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">All masters run RHCOS only</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">etcd: 3 members; max 5 for quorum</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">50+ Cluster Operators manage platform</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">CVO: orchestrates OCP upgrades</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Masters tainted: no user workloads</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">API server: single authenticated entry</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">etcd stores all cluster state</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">IPI: bootstrap node provisions masters</text>

  <!-- COLUMN 2: Worker Nodes -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Worker Nodes</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">RHCOS or RHEL · MachineSet managed</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">RHCOS / RHEL Base OS</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">CRI-O (container runtime)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">kubelet (node agent)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Pod (workload unit)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Infra Node (ingress / registry / monitoring)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">MachineSet: declarative auto-scaling</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">CRI-O: OCI-compliant; replaces Docker</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Infra nodes host platform workloads</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Max 2,000 nodes per cluster</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">RHEL workers supported from OCP 4.x</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">MCO: applies OS-level Machine Config</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">Node labels: route pods via nodeSelector</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">Requests required for Guaranteed QoS</text>

  <!-- COLUMN 3: Networking & Storage -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Networking &amp; Storage</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">OVN-K · Ingress · CSI / ODF</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">OVN-Kubernetes (CNI plugin)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Ingress Controller (HAProxy)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Service (ClusterIP / NodePort / LB)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">PersistentVolume / CSI Driver</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">ODF / Rook-Ceph (in-cluster storage)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">OVN-K: Geneve overlay; replaces kube-proxy</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Routes: OCP Ingress object maps host → service</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">Service ClusterIP: internal only</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">CSI: dynamic PV via StorageClass</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">ODF = OpenShift Data Foundation (Ceph)</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">NetworkPolicy enforced by OVN-K flows</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">Egress IP: source NAT per namespace</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">RWX volumes require CephFS or NFS</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Install Method Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Install Method</text>
  <text x="320" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Control Plane</text>
  <text x="505" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Workers</text>
  <text x="690" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Best For</text>
  <line x1="210" y1="516" x2="210" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="420" y1="516" x2="420" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="590" y1="516" x2="590" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="562" text-anchor="middle" fill="#455a64" font-size="9">IPI (Installer-Provisioned)</text>
  <text x="320" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Fully automated</text>
  <text x="505" y="562" text-anchor="middle" fill="#546e7a" font-size="9">MachineSet auto-scale</text>
  <text x="690" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Cloud / vSphere / bare metal</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">UPI (User-Provisioned)</text>
  <text x="320" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Admin-managed nodes</text>
  <text x="505" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Admin-managed</text>
  <text x="690" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Air-gap / custom hardware</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="614" text-anchor="middle" fill="#455a64" font-size="9">SNO (Single Node OCP)</text>
  <text x="320" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Combined on 1 node</text>
  <text x="505" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Same single node</text>
  <text x="690" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Edge / ROBO sites</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">Hosted Control Plane (HCP)</text>
  <text x="320" y="639" text-anchor="middle" fill="#546e7a" font-size="9">SaaS-managed (ROSA / ARO)</text>
  <text x="505" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Customer manages workers</text>
  <text x="690" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Multi-tenant / managed service</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Compact (3-node)</text>
  <text x="320" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Masters = workers (combined)</text>
  <text x="505" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Same 3 nodes</text>
  <text x="690" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Small environments / DR site</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Red Hat OpenShift Reference · Control Plane · Worker Nodes · OVN-Kubernetes · CSI / ODF</text>
</svg>
