<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Pure Operational Procedure Flow
  </text>

  <!-- Provision volume -->
  <rect x="10" y="50" width="300" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purevol create
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purevol connect
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    --hgroup
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Host rescan
  </text>
  <text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    multipath -ll
  </text>

  <!-- Snapshot / Replication -->
  <rect x="350" y="50" width="300" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="360" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purepgroup create
  </text>
  <text x="360" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purepgroup setattr
  </text>
  <text x="360" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    --vollist
  </text>
  <text x="360" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purepgroup schedule
  </text>
  <text x="360" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    --snap-frequency
  </text>
  <text x="360" y="170" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purepgroup connect
  </text>
  <text x="360" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    --hgroup &lt;remote&gt;
  </text>

  <!-- Purity Upgrade -->
  <rect x="10" y="200" width="800" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pre: purearray upgrade --check
  </text>
  <text x="20" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purealert list (no errors)
  </text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purehostconnection list
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    (≥2 paths per host)
  </text>
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Run: Pure Support leads
  </text>
  <line x1="580" y1="280" x2="700" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="710" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    rolling controller restart
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Post: purearray list (version)
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purealert list (no new)
  </text>
  <text x="20" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    purepod list (online)
  </text>

  <rect x="0" y="510" width="820" height="40" fill="#f5f7fa" />
  <text x="10" y="535" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Operational Procedure Flow
  </text>
</svg>