  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Routing Protocol Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="290" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">OSPF</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">BGP</text>
  <text x="665" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">EIGRP</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Type</text>
  <text x="290" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Link-state (IGP)</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Path-vector (EGP)</text>
  <text x="665" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Advanced dist-vector (IGP)</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Metric</text>
  <text x="290" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Cost (bandwidth)</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">AS path / attributes</text>
  <text x="665" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Composite (BW + delay)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Convergence</text>
  <text x="290" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Fast (SPF)</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Slower (policy-driven)</text>
  <text x="665" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Fast (DUAL)</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="290" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Data centre / campus</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Internet / ISP peering</text>
  <text x="665" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Cisco-only enterprise</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Transport</text>
  <text x="290" y="665" text-anchor="middle" fill="#546e7a" font-size="9">IP protocol 89</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">TCP 179</text>
  <text x="665" y="665" text-anchor="middle" fill="#546e7a" font-size="9">IP protocol 88</text>
