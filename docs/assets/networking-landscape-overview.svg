<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Networking Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Switching &amp; Routing · Network Security · Services &amp; Troubleshooting</text>

  <!-- COLUMN 1: Switching & Routing -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Switching &amp; Routing</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Cisco IOS · NX-OS · BGP · OSPF</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cisco Catalyst (access / distribution)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cisco Nexus / NX-OS (data centre)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">BGP (inter-AS routing)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">OSPF (intra-area link-state)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VLANs + STP / RSTP</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">L2: VLANs, 802.1Q trunks, STP loops</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">L3: OSPF areas; BGP eBGP peering</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Port-channel / LACP: link aggregation</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">VPC (NX-OS): dual-active layer 2 loop-free</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">HSRP / VRRP: gateway redundancy protocols</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">QoS: DSCP marking, queuing, policing</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">Spanning tree: portfast, BPDU guard</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">NSX-T VDS: virtual distributed switch</text>

  <!-- COLUMN 2: Network Security -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Network Security</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">ACL · Firewall · NSX-T DFW · VPN</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ACLs (access control lists)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Zone-based firewall (ZBFW)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NSX-T Distributed Firewall (DFW)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">IPsec VPN / site-to-site tunnels</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">802.1X port authentication (NAC)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">ACL: standard (src) vs extended (src+dst+port)</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">DFW: east-west micro-segmentation in ESXi</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">IPsec: IKEv2 phase 1 (ISAKMP) + phase 2</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">802.1X: RADIUS + PEAP/EAP-TLS + VLAN</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">SIEM ingestion: NetFlow + syslog sources</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">NSX-T Gateway FW: N-S perimeter traffic</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">CoPP: control-plane protection on switches</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">DHCP snooping + ARP inspection: L2 security</text>

  <!-- COLUMN 3: Services & Troubleshooting -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Services &amp; Troubleshooting</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">DNS · DHCP · NTP · Packet Capture</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">DNS (name resolution)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">DHCP (dynamic IP assignment)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">NTP (time synchronisation)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Packet capture (tcpdump / Wireshark)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">NetFlow / IPFIX (traffic telemetry)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">DNS: A/AAAA, PTR, CNAME, SRV records</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">DHCP: scopes, reservations, relay agents</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">NTP: stratum 1/2; VMware time-sync config</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">tcpdump: src/dst/port filters; pcap export</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">MTU troubleshooting: ping with DF bit set</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">traceroute / mtr: hop-by-hop latency</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">SPAN / ERSPAN: traffic mirror to analyser</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">CDP / LLDP: neighbour discovery + topology</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
