<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">AWS Cost Management — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Cost Explorer · Budgets · Anomaly Detection · Reserved Instances · Savings Plans</text>

  <!-- ═ COLUMN 1: Visibility ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Visibility &amp; Analysis</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Cost Explorer · Billing · Anomaly Detection</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cost Explorer (trends + breakdowns)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Billing Dashboard</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cost Anomaly Detection</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cost &amp; Usage Reports (CUR)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Resource-level Cost Data</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Cost Allocation Tags</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Explorer: filter by service, region, tag</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">CUR: hourly granularity → S3 → Athena</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Anomaly: ML-based spend spike detection</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Cost tags: activate in billing console first</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">Chargeback: tag Owner + CostCenter</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">14 months history in Cost Explorer</text>

  <!-- ═ COLUMN 2: Optimization ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cost Optimization</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Reserved Instances · Savings Plans · Spot</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Reserved Instances (1- or 3-year)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Savings Plans (Compute / EC2 / SageMaker)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Spot Instances (interruptible)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Rightsizing Recommendations</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Trusted Advisor (cost checks)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">S3 Intelligent-Tiering</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">RIs: up to 72% discount, fixed instance</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">Savings Plans: up to 66%, more flexible</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Spot: 90% discount, can be interrupted</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">Rightsizing: CloudWatch utilization based</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Trusted Advisor: idle resources, RI coverage</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Compute Optimizer: ML rightsizing recs</text>

  <!-- ═ COLUMN 3: Governance ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#e65100" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#e65100"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Budget Governance</text>
  <text x="675" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Budgets · Alerts · Controls</text>
  <rect x="560" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">AWS Budgets (spend thresholds)</text>
  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Budget Alerts (SNS / email)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Budget Actions (auto-remediate)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">RI / Savings Plan Coverage Reports</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">RI Utilization Reports</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Cost Categories (chargeback)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Budget types: cost, usage, RI, SP coverage</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Alert at 80% actual + 100% forecast</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Budget Actions: apply SCP, stop EC2</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Coverage target: &gt;80% RI/SP coverage</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Cost Categories: map tags → teams</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Review cadence: weekly + monthly</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Commitment Discount Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="340" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Reserved Instances</text>
  <text x="540" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Savings Plans</text>
  <text x="720" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Spot Instances</text>
  <line x1="240" y1="516" x2="240" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="450" y1="516" x2="450" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="640" y1="516" x2="640" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Max discount</text>
  <text x="340" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Up to 72%</text>
  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Up to 66%</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Up to 90%</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Commitment term</text>
  <text x="340" y="587" text-anchor="middle" fill="#546e7a" font-size="9">1 or 3 years</text>
  <text x="540" y="587" text-anchor="middle" fill="#546e7a" font-size="9">1 or 3 years</text>
  <text x="720" y="587" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Instance flexibility</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Convertible RI (limited)</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Any instance (Compute SP)</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Same family, spot pool</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">Interruption risk</text>
  <text x="340" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Resellable (Marketplace)</text>
  <text x="340" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="720" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Stable RDS / EC2 fleet</text>
  <text x="540" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Mixed compute workloads</text>
  <text x="720" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Batch / fault-tolerant jobs</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">AWS Cost Reference · Cost Explorer · Budgets · Reserved Instances · Savings Plans · Anomaly Detection</text>
</svg>
