<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    ServiceNow — Enterprise ITSM Platform Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SaaS-only ITSM; dedicated customer instance; CMDB tracks CI relationships;
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Integration Hub for third-party connections; release cadence: quarterly.
  </text>

  <rect x="10" y="80" width="380" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Instance Architecture
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dedicated: own DB + compute
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SaaS: ServiceNow-hosted
  </text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-instance: no sharing
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Prod + non-prod instances
  </text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MID Server: on-prem bridge
  </text>

  <rect x="410" y="80" width="380" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Core Modules
  </text>
  <text x="420" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ITSM: incident + change
  </text>
  <text x="420" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CMDB: CI and topology
  </text>
  <text x="420" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Service Catalog: requests
  </text>
  <text x="420" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Knowledge: KB articles
  </text>
  <text x="420" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Asset: inventory tracking
  </text>

  <text x="10" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MID Server is a Java agent on-prem; required for discovery and integration.
  </text>

  <line x1="200" y1="240" x2="200" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="620" y1="240" x2="620" y2="260" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="270" width="380" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Integration Patterns
  </text>
  <text x="20" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: table API
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Integration Hub: connectors
  </text>
  <text x="20" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MID Server: on-prem push
  </text>
  <text x="20" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Event Management: SNMP/syslog
  </text>
  <text x="20" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    LDAP/SAML: user sync + SSO
  </text>

  <rect x="410" y="270" width="380" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Release Model
  </text>
  <text x="420" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Quarterly: named by city
  </text>
  <text x="420" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Current: Yokohama (2025)
  </text>
  <text x="420" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    2 versions supported at once
  </text>
  <text x="420" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Subproduction clone
  </text>
  <text x="420" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Update set: change bundle
  </text>

  <text x="10" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="435" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Entirely SaaS; MID Server VM required on-prem for discovery and integrations;
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    network: instance on HTTPS 443; MID Server needs outbound 443 to instance URL.
  </text>

  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ServiceNow     = enterprise ITSM SaaS; incident, change, problem, service catalog
  </text>
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Instance       = dedicated ServiceNow environment; own URL (company.service-now.com)
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CMDB           = Configuration Management DB; CIs and their relationships
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CI             = Configuration Item; any managed asset in CMDB
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MID Server     = on-prem Java agent; bridges ServiceNow cloud to your network
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Integration Hub= low-code connector platform; 200+ pre-built integrations
  </text>
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Update set     = package of changes; moved between non-prod and prod instances
  </text>
  <text x="10" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Table API      = REST API for every ServiceNow table (incidents, CIs, etc.)
  </text>
  <text x="10" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Discovery      = automated CI discovery via MID Server + probes
  </text>
  <text x="10" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ITSM           = IT Service Management; incident, change, problem, request
  </text>
  <text x="10" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Quarterly release= new named version every 3 months (Utah, Vancouver, Xanadu...)
  </text>
  <text x="10" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Subproduction  = dev/test instance; cloned from prod for safe change testing
  </text>

  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: ServiceNow Architecture
  </text>
</svg>