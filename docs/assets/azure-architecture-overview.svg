<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Azure — Architecture Overview</text>

  <!-- Column 1: Identity & Governance -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Identity &amp; Governance</text>
  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Entra ID (Azure AD)</text>
  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="176" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Management Groups</text>
  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="216" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Azure Policy &amp; RBAC</text>
  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="256" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">PIM / Conditional Access</text>
  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Subscriptions / Resource Groups</text>

  <!-- Column 2: Networking -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Networking</text>
  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="136" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Hub VNet (Firewall / Bastion)</text>
  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Spoke VNets (VNet Peering)</text>
  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">ExpressRoute / VPN Gateway</text>
  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Azure Firewall / NSGs</text>
  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Load Balancer / App Gateway</text>

  <!-- Column 3: Platform Services -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Platform Services</text>
  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">VMs / VMSS / AKS</text>
  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">App Service / Functions</text>
  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="216" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Blob / ADLS / Managed Disks</text>
  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Azure Monitor + Log Analytics</text>
  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Key Vault / Defender</text>

  <!-- Comparison Table -->
  <rect x="20" y="360" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Attribute</text>
  <text x="310" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Azure VMs</text>
  <text x="510" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">AKS</text>
  <text x="701" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">App Service</text>

  <rect x="20" y="390" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Workload Type</text>
  <text x="310" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Lift-and-shift / IaaS</text>
  <text x="510" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Containers / microservices</text>
  <text x="701" y="407" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Web apps / PaaS</text>

  <rect x="20" y="416" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">OS Control</text>
  <text x="310" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Full</text>
  <text x="510" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Node pools</text>
  <text x="701" y="433" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">None (managed)</text>

  <rect x="20" y="442" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Scaling</text>
  <text x="310" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">VMSS (manual/auto)</text>
  <text x="510" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">HPA / Cluster Autoscaler</text>
  <text x="701" y="459" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">Auto-scale plans</text>

  <rect x="20" y="468" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">HA SLA</text>
  <text x="310" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">99.9% (Availability Set)</text>
  <text x="510" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">99.95% (AZ pools)</text>
  <text x="701" y="485" font-family="Arial,sans-serif" font-size="10" fill="#334155" text-anchor="middle">99.95% (Premium tier)</text>

  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
