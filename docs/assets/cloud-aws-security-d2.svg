<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    AWS Security Services — Prevention, Detection, and Response
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Security services span prevention, detection, and response; many can be centralised.
  </text>
  
  <rect x="10" y="70" width="380" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Prevention Services
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Shield Standard: free L3/L4 DDoS
  </text>
  <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Shield Advanced: L7 + cost protection
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WAF: Layer 7 rules (ALB/CF/API GW)
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    KMS: CMK key management + encryption
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SCP: restrict max perms at OU level
  </text>
  
  <rect x="410" y="70" width="380" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Detection Services
  </text>
  <text x="420" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GuardDuty: ML threat detection
  </text>
  <text x="420" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GuardDuty: CloudTrail+FlowLogs+DNS
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inspector: EC2 CVE + container scan
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Macie: S3 PII/sensitive data finding
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Config: resource drift + rules eval
  </text>
  
  <text x="10" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Prevent access and encrypt first; detect threats; respond and investigate.
  </text>
  
  <line x1="190" y1="230" x2="190" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="610" y1="230" x2="610" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="260" width="380" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Monitoring and Audit
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudTrail: all API calls logged
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudTrail Org: captures all accounts
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Config: inventory + config history
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Trusted Advisor: security checks
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access Analyzer: finds external access
  </text>
  
  <rect x="410" y="260" width="380" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Aggregation and Response
  </text>
  <text x="420" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Security Hub: aggregates all findings
  </text>
  <text x="420" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Security Hub: CIS/PCI compliance score
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Detective: graph-based investigation
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Incident Manager: runbooks + alerts
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Systems Manager: patch + run command
  </text>
  
  <text x="10" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    KMS HSMs · GuardDuty ML infra · CloudFront edge for WAF · CloudTrail S3 storage
  </text>
  
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  
  <text x="10" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Shield Standard = Free DDoS protection at L3/L4 for all AWS customers
  </text>
  <text x="10" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Shield Advanced = $3000/mo; L7 DDoS; cost protection; dedicated response team
  </text>
  <text x="10" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WAF = Web Application Firewall; rules on ALB/CloudFront/API Gateway
  </text>
  <text x="10" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GuardDuty = ML-based threat detection; analyses CloudTrail/VPC logs/DNS
  </text>
  <text x="10" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inspector = Automated CVE scanner for EC2 instances and container images
  </text>
  <text x="10" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Macie = Machine learning to discover PII and sensitive data in S3
  </text>
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Config = Resource configuration recorder; evaluates compliance rules
  </text>
  <text x="10" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Security Hub = Aggregates GuardDuty/Inspector/Macie/Config findings; scores
  </text>
  <text x="10" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Detective = Investigates security incidents using graph analysis of logs
  </text>
  <text x="10" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    KMS CMK = Customer Managed Key; full control; CloudTrail logs all usage
  </text>
  <text x="10" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Access Analyzer = Identifies resources accessible from outside the account
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: AWS Security Services Overview
  </text>
</svg>