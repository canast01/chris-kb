<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cisco MDS — Escalation</text>

  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at mycase.cloudapps.cisco.com with show tech-support attached</text>
  </g>
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 120)">
    <rect x="0" y="0" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — TAC engineer acknowledges and reviews the bundle (P1: within 1 hr)</text>
  </g>
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 190)">
    <rect x="0" y="0" width="800" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 1 hour for P1 or 4 hours for P2:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to MDS Senior Engineer / TSM"</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[8 hosts have no storage access / ISSU failed / fabric segmented]"</text>
  </g>
  <line x1="410" y1="280" x2="410" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 300)">
    <rect x="0" y="0" width="800" height="90" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Senior MDS Engineer is assigned; they may request CLI access to the switch</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Enable remote SSH access for TAC through your jump host</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have the switch management IP and read-only credentials ready</text>
  </g>
  <line x1="410" y1="390" x2="410" y2="410" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 410)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue is a confirmed NX-OS bug:</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAC provides a hotfix SMU (Software Maintenance Upgrade)</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Or recommends a specific NX-OS release with the fix</text>
  </g>
  <line x1="410" y1="480" x2="410" y2="500" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <g transform="translate(10, 500)">
    <rect x="0" y="0" width="800" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — If hardware is confirmed failed (ASIC, line card, power supply):</text>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TAC initiates RMA; parts dispatched according to your SmartNet contract SLA</text>
    <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ For 8×5 NBD: next business day; for 24×7×4: 4 hours</text>
  </g>

  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>