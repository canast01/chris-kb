<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">TLS Cipher Suites</text>
  
  <rect x="20" y="50" width="780" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384</text>
  
  <line x1="60" y1="90" x2="60" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="70" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">TLS protocol prefix</text>
  
  <line x1="180" y1="90" x2="180" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="190" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">key exchange + auth</text>
  
  <line x1="300" y1="90" x2="300" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="310" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">bulk cipher (symmetric encryption)</text>
  
  <line x1="420" y1="90" x2="420" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="430" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">key size</text>
  
  <line x1="540" y1="90" x2="540" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="550" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">mode</text>
  
  <line x1="660" y1="90" x2="660" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="670" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">MAC (integrity)</text>
  
  <rect x="0" y="260" width="820" height="40" fill="#f5f7fa" />
  <text x="10" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: TLS Cipher Suites</text>
</svg>