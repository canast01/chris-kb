<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Multi-Factor Authentication (MFA)
  </text>
  
  <!-- User -->
  <rect x="10" y="50" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">User</text>
  
  <!-- Identity Provider (IdP) -->
  <rect x="210" y="50" width="180" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="220" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Identity Provider (IdP)</text>
  
  <!-- MFA Service -->
  <rect x="410" y="50" width="180" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="420" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">MFA Service</text>
  
  <!-- Application -->
  <rect x="610" y="50" width="180" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="620" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Application</text>
  
  <!-- Arrows and Labels -->
  <line x1="50" y1="110" x2="210" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="80" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Username + Password</text>
  
  <line x1="290" y1="110" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="320" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Validate credentials</text>
  
  <line x1="410" y1="130" x2="290" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="320" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Primary auth OK</text>
  
  <line x1="290" y1="150" x2="410" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="320" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Trigger MFA challenge</text>
  <text x="320" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(push / OTP / hardware)</text>
  
  <line x1="210" y1="170" x2="50" y2="170" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="80" y="165" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">MFA challenge sent</text>
  
  <line x1="50" y1="190" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="200" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">OTP / Approve push</text>
  
  <line x1="410" y1="210" x2="290" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="320" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Factor confirmed</text>
  
  <line x1="210" y1="230" x2="50" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="80" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Auth token (SAML/OIDC)</text>
  
  <line x1="50" y1="250" x2="790" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="400" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Present token</text>
  
  <line x1="790" y1="270" x2="50" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="400" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Access granted</text>
  
  <text x="50" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    [Session established — token TTL enforced]
  </text>
  
  <rect x="0" y="570" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Multi-Factor Authentication (MFA) Flow
  </text>
</svg>