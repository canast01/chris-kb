<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Evergreen//One — Design Standards</text>

  <!-- Capacity Planning -->
  <rect x="10" y="50" width="380" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Current TiB</text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">× Growth Factor</text>
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">× 1.15 safety buffer</text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">= Committed Reserve</text>
  <line x1="200" y1="100" x2="200" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- SLA Tiers -->
  <rect x="10" y="160" width="200" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SLA Tiers</text>
  <text x="20" y="195" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 1 — Latency</text>
  <text x="40" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ sub-1ms R/W</text>
  <text x="40" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ NVMe/FC</text>
  <text x="20" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier 2 — Capacity</text>
  <text x="40" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">├─ iSCSI / NFS</text>
  <text x="40" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">└─ 4-6:1 reduction</text>

  <!-- Availability SLA -->
  <text x="10" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Availability SLA: 99.9999%</text>

  <!-- Refresh Triggers -->
  <rect x="420" y="50" width="380" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="430" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">&gt;90% committed</text>
  <line x1="540" y1="70" x2="540" y2="100" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="430" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Reserve increase</text>
  <text x="430" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Controller EOG</text>
  <line x1="540" y1="100" x2="540" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="430" y="115" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Ever Modern swap</text>
  <text x="430" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Contract renewal</text>
  <line x1="540" y1="130" x2="540" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="430" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Tier review</text>

  <!-- Network Requirements -->
  <rect x="420" y="200" width="380" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="430" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Data: 25GbE+ / FC</text>
  <text x="430" y="235" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">MTU 9000 end-to-end</text>
  <text x="430" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Dual fabric (A / B)</text>
  <text x="430" y="265" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Phonehome: TCP 443</text>
  <text x="430" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Proxy supported</text>

  <!-- Footer -->
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Architecture Design Standards</text>
</svg>