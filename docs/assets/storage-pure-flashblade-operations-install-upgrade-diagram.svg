    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      (alerts, blade health, replication lag)
    </text>
  </g>
  
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 210)">
