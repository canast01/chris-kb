<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    EC2 Pricing Models — Commitment vs Discount
  </text>
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Longer commitment = larger discount; Spot gives biggest saving with interruption risk.
  </text>
  <rect x="10" y="70" width="390" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Model
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    On-Demand
  </text>
  <text x="20" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Standard Reserved (1 year)
  </text>
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Standard Reserved (3 year)
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Convertible Reserved (1/3 yr)
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Compute Savings Plan
  </text>
  <rect x="410" y="70" width="390" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="420" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key Facts
  </text>
  <text x="420" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    No commitment; full price; per second
  </text>
  <text x="420" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Up to 72% off; same config only
  </text>
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Maximum RI discount; locked config
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Up to 66% off; can exchange family
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Up to 66% off; EC2+Fargate+Lambda
  </text>
  <text x="10" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Reserved and Savings Plans are billed whether you use the capacity or not.
  </text>
  <line x1="205" y1="230" x2="205" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="230" x2="615" y2="250" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="10" y="260" width="390" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Model (continued)
  </text>
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EC2 Instance Savings Plan
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Spot Instances
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dedicated Host
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dedicated Instance
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Free Tier (12 months new accounts)
  </text>
  <rect x="410" y="260" width="390" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key Facts
  </text>
  <text x="420" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Up to 72% off; same family + Region
  </text>
  <text x="420" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Up to 90% off; 2-min interruption
  </text>
  <text x="420" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Physical server; BYOL; compliance
  </text>
  <text x="420" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    On dedicated HW; per-instance charge
  </text>
  <text x="420" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    750 hrs/mo t2/t3.micro; then billed
  </text>
  <text x="10" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    EC2 billing infrastructure · AWS Cost Explorer API · CUR exported to S3
  </text>
  <text x="10" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    On-Demand = No commitment; highest per-unit cost; most flexible
  </text>
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Reserved RI = 1 or 3-year commitment to capacity; up to 72% discount
  </text>
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Savings Plan = $/hr flexible commitment; applies across instance families
  </text>
  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Spot = Unused EC2 capacity auction; up to 90% off; interruptible
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dedicated Host = Physical server commitment; BYOL compliant; socket/core visibility
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Free Tier = 750 hrs/mo t2.micro or t3.micro for 12 months on new accounts
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RI Marketplace = Sell unused Standard RIs to other AWS customers
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Utilisation = Percentage of purchased Reserved/Savings Plan capacity actually used
  </text>
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: AWS Cost Overview
  </text>
</svg>