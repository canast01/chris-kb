<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Ansible — Escalation</text>

  <rect x="20" y="50" width="780" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Internal: automation team investigates with -vvv logging and checks for collection version changes</text>

  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="120" width="780" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="30" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — If issue is AWX platform-level (all jobs failing, pods crash-looping):</text>
  <text x="50" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Platform team: check AWX pod resource limits, PVC space, Kubernetes node pressure</text>
  <text x="50" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Common: AWX-task OOMKilled → increase memory limit in AWX Operator config</text>

  <line x1="410" y1="200" x2="410" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="220" width="780" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="30" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If issue is a collection/module bug (works in older collection version):</text>
  <text x="50" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Pin the collection to the last known-good version in requirements.yml</text>
  <text x="50" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ File a GitHub issue on the collection repo: github.com/ansible-collections/&lt;name&gt;</text>

  <line x1="410" y1="300" x2="410" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="320" width="780" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="30" y="340" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — If issue is Ansible Core bug or AAP platform defect:</text>
  <text x="50" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Open Red Hat support case at access.redhat.com (requires AAP subscription)</text>
  <text x="50" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Attach AWX support bundle + -vvv log + pod logs</text>

  <line x1="410" y1="400" x2="410" y2="420" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="420" width="780" height="80" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="30" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If Red Hat case is not progressing within SLA:</text>
  <text x="50" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Add case update: "Requesting escalation to Senior Support Engineer"</text>
  <text x="50" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State impact: "All [product] automation blocked since [date]; [n] jobs failing"</text>

  <line x1="410" y1="500" x2="410" y2="520" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="20" y="520" width="780" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="30" y="540" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For AAP licensing issues (subscription expired, activation code error):</text>
  <text x="50" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Red Hat support case: category = Subscription / Licensing</text>
  <text x="50" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Provide subscription account number and subscription ID from access.redhat.com</text>

  <rect x="0" y="580" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="595" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Troubleshooting Escalation Steps</text>
</svg>