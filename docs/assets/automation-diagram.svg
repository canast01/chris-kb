<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Automation — Infrastructure Automation Tools
  </text>
  
  <rect x="10" y="40" width="800" height="75" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Automation: codifying repeatable infra operations into executable, version-controlled logic
  </text>
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Goals: eliminate manual error, enforce consistency, accelerate delivery, self-service
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Tools: Ansible (config mgmt), Terraform (IaC), GitHub Actions (CI/CD), PowerShell, Python
  </text>
  <text x="20" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Maturity path: manual → scripted → idempotent config mgmt → full IaC with pipeline gates
  </text>
  
  <rect x="10" y="120" width="380" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Configuration Management
  </text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Ansible: agentless SSH/WinRM
  </text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Playbooks → roles → collections
  </text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    AWX/AAP: enterprise control plane
  </text>
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Idempotent: safe to re-run
  </text>
  
  <rect x="410" y="120" width="380" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="420" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Infrastructure as Code
  </text>
  <text x="420" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Terraform: declarative HCL
  </text>
  <text x="420" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Plan → apply → state tracking
  </text>
  <text x="420" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multi-cloud and on-prem providers
  </text>
  <text x="420" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Remote state: S3, Terraform Cloud
  </text>
  
  <rect x="10" y="230" width="380" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    CI/CD Pipelines
  </text>
  <text x="20" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    GitHub Actions: event-driven jobs
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Runners: GitHub-hosted or self-hosted
  </text>
  <text x="20" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Secrets, environments, approvals
  </text>
  <text x="20" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Marketplace actions + custom steps
  </text>
  
  <rect x="410" y="230" width="380" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="420" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Scripting Languages
  </text>
  <text x="420" y="265" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerShell: Windows + cross-platform
  </text>
  <text x="420" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Python: scripting, APIs, SDKs
  </text>
  <text x="420" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Virtual envs, pip, Poetry
  </text>
  <text x="420" y="310" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    boto3, paramiko, ansible, requests
  </text>
  
  <rect x="10" y="340" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (what automation manages):
  </text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Bare-metal servers · VMs · containers · cloud VMs · network devices · storage arrays
  </text>
  
  <rect x="10" y="390" width="800" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Ansible = agentless configuration management; SSH/WinRM transport; YAML playbooks
  </text>
  <text x="20" y="425" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Terraform = HashiCorp IaC tool; provider plugins; declarative resource graph
  </text>
  <text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    GitHub Actions = native GitHub CI/CD; workflow YAML in .github/workflows/
  </text>
  <text x="20" y="455" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PowerShell = Microsoft shell and scripting language; .ps1 files; PS7 cross-platform
  </text>
  <text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Python = general-purpose language; dominant for infra scripting and API automation
  </text>
  <text x="20" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Idempotent = running the same automation multiple times produces the same result
  </text>
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AWX / AAP = Ansible Automation Platform; web UI + API + RBAC over Ansible Engine
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IaC = Infrastructure as Code; resources declared in files, tracked in git
  </text>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Automation Overview
  </text>
</svg>