<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    AWS Networking Overview
  </text>
  
  <rect x="10" y="40" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Networking — VPC, Transit Gateway, Security, and Connectivity
  </text>
  <text x="410" y="75" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC: isolated virtual network per account+region; CIDR block /16–/28; multi-AZ subnet design
  </text>
  <text x="410" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Transit Gateway: regional hub connecting VPCs + DirectConnect + VPN; route tables per TGW
  </text>
  <text x="410" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Security: Security Groups (stateful, per-resource) + NACLs (stateless, per-subnet)
  </text>
  <text x="410" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC Endpoints: private access to S3, DynamoDB, and 150+ services without internet gateway
  </text>
  
  <text x="410" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    VPC is the foundation · TGW connects VPCs and on-prem · SGs+NACLs protect resources
  </text>
  
  <line x1="150" y1="160" x2="150" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="160" x2="670" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="180" width="260" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="140" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    VPC &amp; Subnets
  </text>
  <text x="140" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC: CIDR /16-/28
  </text>
  <text x="140" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Public subnet: IGW route
  </text>
  <text x="140" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Private subnet: no IGW
  </text>
  <text x="140" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Route tables: subnet assoc
  </text>
  <text x="140" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC Endpoints: private SVC
  </text>
  
  <rect x="280" y="180" width="260" height="100" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="410" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Security Controls
  </text>
  <text x="410" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Security Groups: stateful
  </text>
  <text x="410" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NACLs: stateless + order
  </text>
  <text x="410" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Flow Logs: VPC traffic
  </text>
  <text x="410" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Network Firewall: L7
  </text>
  <text x="410" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    WAF: ALB / CloudFront
  </text>
  
  <rect x="550" y="180" width="260" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="680" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Connectivity
  </text>
  <text x="680" y="215" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Internet Gateway: public
  </text>
  <text x="680" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NAT Gateway: private out
  </text>
  <text x="680" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Transit Gateway: hub
  </text>
  <text x="680" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DirectConnect: private
  </text>
  <text x="680" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPN: site-to-site IPsec
  </text>
  
  <text x="410" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    VPC/subnets define the network · Security controls filter traffic
  </text>
  
  <line x1="150" y1="320" x2="150" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="320" x2="410" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="670" y1="320" x2="670" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="340" width="800" height="100" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="410" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    VPC        │     Subnets      │  Security Groups  │     Routing      │  Load Balancer
  </text>
  <text x="410" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CIDR: plan /16  │ Public: AZ-a/b/c │   Inbound rules   │  IGW route: 0/0  │  ALB: L7 HTTP/S
  </text>
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Flow Logs: S3   │ Private: no IGW  │   Outbound rules  │  NAT: 0/0 priv   │   NLB: L4 TCP
  </text>
  <text x="410" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DNS: enableDNS  │ Multi-AZ design  │    Ref by SG ID   │  TGW attachment  │  Route 53: DNS
  </text>
  <text x="410" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Endpoint: S3/SVC │ NACL: stateless  │  All-outbound: no │  VPN: DX backup  │  Health checks
  </text>
  
  <text x="410" y="460" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="475" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS network fabric · Availability Zones · DirectConnect physical ports · Transit Gateway routers
  </text>
  
  <text x="410" y="495" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC            = Virtual Private Cloud; logically isolated network within a region; one CIDR block
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Subnet         = CIDR subdivision of a VPC; lives in one AZ; public if route to IGW exists
  </text>
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Security Group = Stateful firewall attached to ENI; return traffic automatically allowed
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NACL           = Network Access Control List; stateless; rules evaluated in order; both in and out
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Internet Gateway= Allows resources in public subnets to reach the internet; 1:1 to a VPC
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    NAT Gateway    = Allows private subnet resources to initiate outbound internet; blocks inbound
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Transit Gateway= Regional router connecting VPCs and on-premises networks; route tables per TGW
  </text>
  <text x="410" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC Endpoint   = Private connection to AWS services (S3, DynamoDB, etc.) without leaving AWS network
  </text>
  <text x="410" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    VPC Flow Logs  = Captures network flow metadata for VPC, subnet, or ENI; written to S3 or CW Logs
  </text>
  <text x="410" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    DirectConnect  = Dedicated 1/10/100 Gbps private link from on-premises to AWS; lower latency than VPN
  </text>
  <text x="410" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ALB            = Application Load Balancer; Layer 7; supports path/host routing, WAF integration
  </text>
  <text x="410" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Route 53       = AWS managed DNS; supports public/private zones, health checks, failover routing
  </text>
  
  <rect x="0" y="680" width="820" height="20" fill="#f5f7fa" />
  <text x="410" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: AWS Networking Overview
  </text>
</svg>