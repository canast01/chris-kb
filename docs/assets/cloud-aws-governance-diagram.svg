<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    AWS Governance Overview
  </text>
  
  <rect x="10" y="40" width="800" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="410" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Governance — Organizations, SCPs, Config, and Compliance
  </text>
  <text x="410" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS Organizations: root account &gt; OUs &gt; member accounts; SCPs enforced at each OU level
  </text>
  <text x="410" y="95" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Service Control Policies: preventive guardrails; deny actions before IAM even evaluates them
  </text>
  <text x="410" y="110" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS Config: detective compliance; records every resource config change; evaluates rules
  </text>
  <text x="410" y="125" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Tagging standards: mandatory tags enforced by Config rules; used for cost and compliance
  </text>
  
  <text x="410" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Organizations provides structure · SCPs prevent violations · Config detects drift
  </text>
  
  <line x1="205" y1="160" x2="205" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="160" x2="410" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="160" x2="615" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="190" width="260" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="140" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Organizations
  </text>
  <text x="140" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Root: management acct
  </text>
  <text x="140" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OUs: env / team / app
  </text>
  <text x="140" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Member accounts: isolated
  </text>
  <text x="140" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Consolidated billing
  </text>
  <text x="140" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Account structure std.
  </text>
  
  <rect x="280" y="190" width="260" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="410" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Service Control Policies
  </text>
  <text x="410" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    JSON policy: allow/deny
  </text>
  <text x="410" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OU-level attachment
  </text>
  <text x="410" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Deny: regions, services
  </text>
  <text x="410" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Allow-list pattern: safe
  </text>
  <text x="410" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Guardrail: no root key
  </text>
  
  <rect x="550" y="190" width="260" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="680" y="210" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    AWS Config
  </text>
  <text x="680" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Config recorder: all types
  </text>
  <text x="680" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Rules: managed + custom
  </text>
  <text x="680" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Compliance: pass/fail/N/A
  </text>
  <text x="680" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Remediation: auto/manual
  </text>
  <text x="680" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Config: S3 delivery dest
  </text>
  
  <text x="410" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Organizations structures accounts · SCPs prevent bad actions
  </text>
  
  <line x1="205" y1="330" x2="205" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="330" x2="410" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="330" x2="615" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="360" width="800" height="100" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="410" y="380" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Organizations   │       SCPs       │     AWS Config    │     Tagging      │    Compliance
  </text>
  <text x="410" y="400" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Create account  │   Attach to OU   │  Enable recorder  │  Mandatory tags  │  Audit reports
  </text>
  <text x="410" y="415" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Move to OU      │  Deny: eu-west   │  Add managed rule │ Tag policy: org  │  Non-compliant?
  </text>
  <text x="410" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Invite accounts │  Test: SCP sim   │  Remediation auto │ Tagging standard │   Security Hub
  </text>
  <text x="410" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Consolidated bill │ Exception: allow │  Delivery: S3+SNS │ Cost alloc tags  │ Frameworks: CIS
  </text>
  
  <text x="410" y="480" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    AWS global infrastructure · Organizations API · Config delivery to S3 · CloudTrail audit trail
  </text>
  
  <text x="410" y="520" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Organizations   = AWS multi-account management service; enforces billing and governance hierarchy
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OU              = Organisational Unit; logical account grouping; SCPs attach at this level
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SCP             = Service Control Policy; max permission boundary for all IAM in attached accounts
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Preventive guardrail= SCP that blocks actions before IAM policy is evaluated; hard boundary
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Detective guardrail = Config rule that detects non-compliant resources after they exist
  </text>
  <text x="410" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Config recorder = Tracks configuration snapshots and changes for all or selected resource types
  </text>
  <text x="410" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Config rule     = Evaluates resource configs against defined conditions; managed or custom Lambda
  </text>
  <text x="410" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Remediation action= Auto-fix triggered by Config rule non-compliance; e.g. delete public S3 bucket
  </text>
  <text x="410" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Tag policy      = Organizations policy enforcing consistent tag keys/values across accounts
  </text>
  <text x="410" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Consolidated billing= Single bill for all accounts in org; volume discounts and RI sharing applies
  </text>
  <text x="410" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Account structure = Pattern of management/audit/log-archive/workload accounts following landing zone
  </text>
  <text x="410" y="705" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SCP allow-list   = Deny-all-except pattern; safer than deny-list; only permits explicitly listed
  </text>
  
  <rect x="0" y="710" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="730" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: AWS Governance Overview
  </text>
</svg>