<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Evergreen Lifecycle Timeline
  </text>
  <g transform="translate(20, 50)">
    <line x1="0" y1="10" x2="200" y2="10" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="200" y="0" width="300" height="20" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="210" y="15" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Year 0 ──&gt; Array installed, subscription starts
    </text>
    
    <line x1="250" y1="20" x2="250" y2="60" stroke="#455a64" stroke-width="1.5" />
    
    <line x1="0" y1="70" x2="200" y2="70" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="200" y="60" width="400" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="210" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Year 1 ──&gt; True Forward capacity reconciliation
    </text>
    <text x="210" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      (any additional capacity purchased at original unit rate)
    </text>
    
    <line x1="250" y1="100" x2="250" y2="140" stroke="#455a64" stroke-width="1.5" />
    
    <line x1="0" y1="150" x2="200" y2="150" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="200" y="140" width="300" height="20" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="210" y="155" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Year 2 ──&gt; Purity upgrades ongoing (NDU, no disruption)
    </text>
    
    <line x1="250" y1="160" x2="250" y2="200" stroke="#455a64" stroke-width="1.5" />
    
    <line x1="0" y1="210" x2="200" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="200" y="200" width="400" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="210" y="215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Year 3 ──&gt; Ever Modern controller refresh (Pure-executed)
    </text>
    <text x="210" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      NVMe shelves stay in place, controllers swapped
    </text>
    
    <line x1="250" y1="240" x2="250" y2="280" stroke="#455a64" stroke-width="1.5" />
    
    <line x1="0" y1="290" x2="200" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="200" y="280" width="300" height="20" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="210" y="295" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      Year 4-5 ──&gt; Continued operation on new controller gen
    </text>
    
    <line x1="250" y1="300" x2="250" y2="340" stroke="#455a64" stroke-width="1.5" />
    
    <line x1="0" y1="350" x2="200" y2="350" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <rect x="200" y="340" width="400" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="210" y="355" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      End ──&gt; Renew subscription or decommission
    </text>
    <text x="210" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      (drives cryptographically erased before return)
    </text>
  </g>
  <rect x="0" y="380" width="820" height="20" fill="#f5f7fa" />
  <text x="10" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Pure Storage Evergreen Lifecycle
  </text>
</svg>