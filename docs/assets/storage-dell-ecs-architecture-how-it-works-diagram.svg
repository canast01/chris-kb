<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Dell ECS — How It Works</text>
  
  <rect x="50" y="50" width="200" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="150" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">VDC</text>
  
  <line x1="150" y1="90" x2="150" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="100" y="110" width="300" height="160" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="250" y="135" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Namespace (multi-tenancy boundary)</text>
  
