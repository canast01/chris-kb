  <rect x="150" y="280" width="200" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="250" y="305" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">Bucket</text>
  
