<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">VMware Horizon — Capabilities Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Brokering · Desktop Pools · Protocol &amp; Experience</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Brokering</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Connection Servers · UAG · SSO</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Connection Servers (HA pair)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Unified Access Gateway (UAG)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">True SSO (Kerberos tickets)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Load Balancer (NSX / F5)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Horizon Client (all platforms)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Connection Server: broker sessions</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">UAG: external access no VPN</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">True SSO: smart card + cert</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">LB: NSX ALB or F5 in front</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">HTML Access: browser client</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Client: Win/Mac/Linux/iOS/Android</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Desktop Pools</text>
  <text x="410" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Instant Clone · RDSH · Apps</text>
  <rect x="295" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Instant Clone (stateless VDI)</text>
  <rect x="295" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Full Clone (persistent VDI)</text>
  <rect x="295" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">RDSH (published desktops)</text>
  <rect x="295" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">App Publishing (per-app launch)</text>
  <rect x="295" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Floating vs Dedicated pools</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">Instant clone: fast provision &lt; 1 min</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">Full clone: persistent user data</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">RDSH: multi-session Win Server</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">App publish: seamless window</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Floating: reset on logoff</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Dedicated: user always same VM</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
