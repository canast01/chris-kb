  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Blast · PCoIP · USB · Print</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Blast Extreme (H.264 / HEVC)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">PCoIP (legacy protocol)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">USB Redirection (per-device)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Printer Redirection (ThinPrint)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Dynamic Environment Manager (DEM)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">Blast: preferred; H.264 adaptive</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">PCoIP: UDP 4172 protocol</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">USB: smart card / storage / audio</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Print: virtual printer redirect</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">DEM: user profile + policy</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">Multi-monitor: up to 6 displays</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Horizon Deployment Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VDI (Instant Clone)</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VDI (Full Clone)</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">RDSH Published</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">VM per user</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">1 (stateless)</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">1 (persistent)</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">Shared sessions</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">Provision time</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">&lt; 1 minute</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">15–30 minutes</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">N/A (pre-built)</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">User data persist</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">✗ (reset on logoff)</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">✓ (user disk)</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">✓ (profile disk)</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">Storage efficiency</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">High (shared base)</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Low (full copy)</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Very high</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">Task workers</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">Power users</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">Shared apps</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">GPU support</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">✓ (vGPU)</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">✓ (vGPU)</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">✓ (vGPU RDS)</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware Horizon Reference · Connection Server · UAG · Blast · PCoIP · DEM · vGPU</text>
