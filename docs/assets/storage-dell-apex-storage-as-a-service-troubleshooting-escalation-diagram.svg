<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    APEX Storage as a Service — Escalation
  </text>
  
  <!-- Step 1 -->
  <rect x="10" y="50" width="800" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 1 — Open P1 SR via APEX Console or support.dell.com with multipath + SCG logs
  </text>
  
  <!-- Arrow to Step 2 -->
  <line x1="410" y1="100" x2="410" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Step 2 -->
  <rect x="10" y="120" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 2 — For P1: call Dell support phone immediately after opening the portal SR
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    (number on case confirmation page; 24×7 for P1)
  </text>
  
  <!-- Arrow to Step 3 -->
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Step 3 -->
  <rect x="10" y="190" width="800" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 3 — Dell T1 reviews case and determines whether issue is host-side or infrastructure-side
  </text>
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Host-side: Dell guides host reconfiguration (HBA, iSCSI, multipath settings)
  </text>
  <text x="20" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Infrastructure-side: Dell dispatches hardware engineer for on-site remediation
  </text>
  
  <!-- Arrow to Step 4 -->
  <line x1="410" y1="260" x2="410" y2="280" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Step 4 -->
  <rect x="10" y="280" width="800" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="20" y="305" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 4 — If no meaningful progress in 4 hours for P1 / 8 hours for P2:
  </text>
  <text x="20" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Add case update: "Requesting escalation — production storage offline since [time]"
  </text>
  <text x="20" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Contact your Dell account team to escalate to TAC manager
  </text>
  
  <!-- Arrow to Step 5 -->
  <line x1="410" y1="350" x2="410" y2="370" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Step 5 -->
  <rect x="10" y="370" width="800" height="70" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="20" y="395" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 5 — For P1 unresolved &gt; 4 hours:
  </text>
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Request executive escalation through Dell account team
  </text>
  <text x="20" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → Provide business impact: affected hosts, databases/applications offline, revenue impact
  </text>
  
  <!-- Arrow to Step 6 -->
  <line x1="410" y1="440" x2="410" y2="460" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Step 6 -->
  <rect x="10" y="460" width="800" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Step 6 — After resolution: request a written RCA (Root Cause Analysis) from Dell
  </text>
  <text x="20" y="500" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → RCA is standard for P1 events under ProSupport Plus
  </text>
  <text x="20" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    → RCA should include root cause, timeline, corrective action, and preventive measures
  </text>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Escalation Process
  </text>
</svg>