<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    OpenShift Troubleshooting
  </text>
  
  <rect x="10" y="50" width="800" height="80" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="410" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    OpenShift Troubleshooting Overview
  </text>
  <text x="410" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Three sub-sections: Common Issues, Diagnostics (must-gather), Escalation (Red Hat)
  </text>
  <text x="410" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    First step: oc get events -A and oc logs &lt;pod&gt; --previous; resolves 90% of issues
  </text>
  <text x="410" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Escalation: always attach must-gather; Sev 1 = call Red Hat after opening case
  </text>
  
  <line x1="205" y1="130" x2="205" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="130" x2="410" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="130" x2="615" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="170" width="310" height="130" fill="#e8f5e9" stroke="#2e7d32" rx="6" />
  <text x="205" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Common Issues
  </text>
  <text x="205" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    CrashLoopBackOff
  </text>
  <text x="205" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ImagePullBackOff
  </text>
  <text x="205" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Node NotReady
  </text>
  <text x="205" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OOMKilled
  </text>
  <text x="205" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Operator Degraded
  </text>
  
  <rect x="360" y="170" width="310" height="130" fill="#e8eaf6" stroke="#3949ab" rx="6" />
  <text x="515" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Diagnostics
  </text>
  <text x="515" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    must-gather bundle
  </text>
  <text x="515" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    oc adm inspect
  </text>
  <text x="515" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    etcd diagnostics
  </text>
  <text x="515" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Network debug
  </text>
  <text x="515" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Node crictl/kubelet
  </text>
  
  <rect x="670" y="170" width="310" height="130" fill="#fff8e1" stroke="#f57f17" rx="6" />
  <text x="825" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Escalation
  </text>
  <text x="825" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Sev 1–4 definitions
  </text>
  <text x="825" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SOS report per node
  </text>
  <text x="825" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Case data checklist
  </text>
  <text x="825" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    TAM escalation path
  </text>
  <text x="825" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    access.redhat.com
  </text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: OpenShift Troubleshooting
  </text>
</svg>