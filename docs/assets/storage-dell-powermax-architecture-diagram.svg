<svg xmlns="http://www.w3.org/2000/svg" width="820" height="830" viewBox="0 0 820 830">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell PowerMax — High-End AFA Architecture
  </text>
  <rect x="10" y="50" width="800" height="80" fill="#ffffff" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    All-NVMe all-flash array for mission-critical workloads; DirectPath I/O to NVMe;
  </text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SRDF replication (sync/async/Metro); TimeFinder snapshots; FICON for mainframe.
  </text>
  <rect x="20" y="140" width="370" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="35" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Platform
  </text>
  <text x="35" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    All-NVMe AFA (2500/8500)
  </text>
  <text x="35" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DirectPath I/O: host→NVMe
  </text>
  <text x="35" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NVMe-oF: fabric attachment
  </text>
  <text x="35" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FICON: mainframe FC support
  </text>
  <text x="35" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    5-nines: 99.9999% HA target
  </text>
  <rect x="410" y="140" width="370" height="130" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="425" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Data Services
  </text>
  <text x="425" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF: synchronous replication
  </text>
  <text x="425" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TimeFinder: snap + clone
  </text>
  <text x="425" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FAST VP: auto-tiering
  </text>
  <text x="425" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Inline dedup + compression
  </text>
  <text x="425" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Thin provisioning: dynamic
  </text>
  <text x="20" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SRDF/Metro enables active-active stretched clusters with zero RPO across two sites.
  </text>
  <line x1="205" y1="310" x2="205" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="310" x2="615" y2="330" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="20" y="340" width="370" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="35" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Replication Topologies
  </text>
  <text x="35" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF/S: sync; 0 RPO metro
  </text>
  <text x="35" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF/A: async; low RPO remote
  </text>
  <text x="35" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF/Metro: active-active
  </text>
  <text x="35" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Concurrent: SRDF/S + SRDF/A
  </text>
  <text x="35" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Cascade: 3-site protection
  </text>
  <rect x="410" y="340" width="370" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="425" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Management
  </text>
  <text x="425" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unisphere for PowerMax
  </text>
  <text x="425" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SYMCLI: command line
  </text>
  <text x="425" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    REST API: v100+
  </text>
  <text x="425" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerMax OS: embedded
  </text>
  <text x="425" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CloudIQ: AIOps analytics
  </text>
  <rect x="10" y="490" width="800" height="80" fill="#ffffff" />
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="20" y="525" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PowerMax 2500 (entry) or 8500 (enterprise); dual-engine active-active internally;
  </text>
  <text x="20" y="540" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FC/NVMe-oF SAN fabric connections; dedicated management network for Unisphere.
  </text>
  <rect x="10" y="580" width="800" height="90" fill="#ffffff" />
  <text x="20" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerMax       = Dell high-end AFA; successor to VMAX; mission-critical storage
  </text>
  <text x="20" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF           = Symmetrix Remote Data Facility; synchronous/async replication
  </text>
  <text x="20" y="645" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TimeFinder     = PowerMax snap (instant, no copy) and clone (full copy) tech
  </text>
  <text x="20" y="660" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF/Metro     = synchronous active-active; both sides serve IO simultaneously
  </text>
  <text x="20" y="675" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    NVMe-oF        = NVMe over Fabrics; FC-NVMe or RoCE; lower latency than SCSI
  </text>
  <text x="20" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DirectPath I/O = host OS bypasses storage controller; direct PCIe to NVMe
  </text>
  <text x="20" y="705" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FICON          = IBM mainframe FC protocol; PowerMax is mainframe-compatible
  </text>
  <text x="20" y="720" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    5-nines        = 99.9999% availability; ~32 seconds unplanned downtime per year
  </text>
  <text x="20" y="735" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FAST VP        = Fully Automated Storage Tiering; auto-moves data to right tier
  </text>
  <text x="20" y="750" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unisphere      = PowerMax web management UI; also manages multiple arrays
  </text>
  <text x="20" y="765" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SYMCLI         = command-line interface for PowerMax/VMAX operations
  </text>
  <text x="20" y="780" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Concurrent SRDF= same volume replicated to two different sites simultaneously
  </text>
  <rect x="0" y="790" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="810" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: PowerMax Architecture
  </text>
</svg>