<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">CyberArk PAM — Architecture Overview</text>

  <!-- Column 1: Core Vault Components (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Core Vault Components</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Digital Vault (Primary)</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">encrypted credential store</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">DR Vault</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">async replication replica</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PVWA (Password Vault Web Access)</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">web UI and REST API</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="250" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">CPM (Central Policy Manager)</text>
  <text x="145" y="262" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">automated password rotation</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="290" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PSM (Privileged Session Manager)</text>
  <text x="145" y="302" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">session proxy and recording</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="330" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">PSMP (SSH Proxy)</text>
  <text x="145" y="342" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Linux privileged access proxy</text>

  <!-- Column 2: AAM / Secrets Management (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Secrets &amp; AAM</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Application Access Manager (AAM)</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">secrets for applications</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="176" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">CCP (Credential Provider)</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Conjur (DevOps secrets)</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">REST API (credential checkout)</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Safe / Account management</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Dual Control / One-Time Pwd</text>

  <!-- Column 3: Integration & Audit (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Integration &amp; Audit</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SIEM Audit Stream (Syslog)</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">SNMP / Email Alerts</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">AD / LDAP Authentication</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">for PVWA login</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">RADIUS / MFA Integration</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Session Recording (PSM)</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">ServiceNow Ticketing</text>

  <!-- Component table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="145" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="380" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Role</text>
  <text x="640" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Typical Count</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Digital Vault</text>
  <text x="380" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Encrypted credential store, core engine</text>
  <text x="640" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">2 (primary + DR)</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CPM</text>
  <text x="380" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Automated password rotation</text>
  <text x="640" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">1–2 per site</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">PSM</text>
  <text x="380" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Session proxy, recording, isolation</text>
  <text x="640" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">2+ (load-balanced)</text>

  <rect x="20" y="498" width="783" height="26" fill="#ffffff"/>
  <text x="145" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">PVWA</text>
  <text x="380" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Web UI and REST API</text>
  <text x="640" y="515" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">2+ (load-balanced)</text>

  <rect x="20" y="524" width="783" height="26" fill="#f1f5f9"/>
  <text x="145" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">PSMP</text>
  <text x="380" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">SSH proxy for Linux access</text>
  <text x="640" y="541" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">1–2 per site</text>

  <!-- Network ports -->
  <rect x="20" y="572" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="592" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Key Network Ports</text>

  <rect x="20" y="602" width="250" height="26" fill="#f1f5f9"/>
  <text x="145" y="619" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Vault: 1858 (proprietary)</text>
  <rect x="287" y="602" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="619" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">PVWA: HTTPS 443</text>
  <rect x="553" y="602" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="619" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">PSM: RDP 3389 (proxy)</text>

  <rect x="20" y="628" width="250" height="26" fill="#ffffff"/>
  <text x="145" y="645" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">CPM → targets: SSH 22, RDP 3389</text>
  <rect x="287" y="628" width="250" height="26" fill="#f0fdf4"/>
  <text x="412" y="645" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">DR replication: 1858</text>
  <rect x="553" y="628" width="250" height="26" fill="#faf5ff"/>
  <text x="678" y="645" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Syslog (SIEM): 514 / 6514</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
