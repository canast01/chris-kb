<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <!-- Background -->
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Brocade Fabric OS — Architecture Overview</text>

  <!-- Column 1 header: Core OS Mechanisms (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CORE OS MECHANISMS</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Principal Switch Election</text>
  <text x="145" y="132" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">distributed fabric management</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Distributed Name Server (DNS)</text>
  <text x="145" y="172" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">WWN registration and login</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">WWN-Based Zoning</text>
  <text x="145" y="212" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">host-to-storage access control</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">ISL Trunking</text>
  <text x="145" y="252" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">aggregate inter-switch links</text>

  <rect x="20" y="286" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ADVANCED FEATURES</text>

  <rect x="20" y="332" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">NPIV (N_Port ID Virtualisation)</text>
  <text x="145" y="348" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">virtual HBAs for VMware/hypervisors</text>

  <rect x="20" y="372" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">Virtual Fabrics (FID)</text>
  <text x="145" y="388" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">partition switch into logical fabrics</text>

  <rect x="20" y="412" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="-2">MAPS (Monitoring and Alerting)</text>
  <text x="145" y="428" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle" dy="+9">threshold-based health monitoring</text>

  <!-- Column 2 header: Dual-Fabric Topology (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">DUAL-FABRIC TOPOLOGY</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Hosts — dual HBA paths</text>
  <text x="412" y="132" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">HBA0 → Fabric A, HBA1 → Fabric B</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Director A (Fabric A — primary)</text>
  <text x="412" y="172" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">G620 / G720 / X7-4 / X7-8</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">Director B (Fabric B — redundant)</text>
  <text x="412" y="212" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">independent failure domain</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">ISL Trunk (Fabric A → DR)</text>
  <text x="412" y="252" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">Director C — DR site extension</text>

  <rect x="287" y="286" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PLATFORM REFERENCE</text>

  <rect x="287" y="332" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="348" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">G620 — 64× 32G FC (fixed)</text>
  <text x="412" y="348" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">G720 — 64× 64G FC (fixed)</text>

  <rect x="287" y="372" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">X7-4 Director — up to 192 FC ports</text>
  <text x="412" y="388" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">4-slot, dual CP, non-disruptive upgrade</text>

  <rect x="287" y="412" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="-2">X7-8 Director — up to 384 FC ports</text>
  <text x="412" y="428" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle" dy="+9">8-slot, dual CP, non-disruptive upgrade</text>

  <!-- Column 3 header: Zoning and Management (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">ZONING &amp; MANAGEMENT</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">WWN Zoning (recommended)</text>
  <text x="678" y="132" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">device-based, port-independent</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Port Zoning</text>
  <text x="678" y="172" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">switch-port-based zones</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Zone Aliases</text>
  <text x="678" y="212" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">named WWN or port references</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">SANnav Management Portal</text>
  <text x="678" y="252" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">centralised GUI for Fabric OS switches</text>

  <rect x="553" y="286" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="309" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SECURITY &amp; RESILIENCE</text>

  <rect x="553" y="332" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">DCC (Device Connection Control)</text>
  <text x="678" y="348" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">restrict unauthorised device login</text>

  <rect x="553" y="372" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">SCC (Switch Connection Control)</text>
  <text x="678" y="388" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">trusted switch authentication via SSL</text>

  <rect x="553" y="412" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="-2">Dual CP (director) — HA control plane</text>
  <text x="678" y="428" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle" dy="+9">non-disruptive firmware upgrades</text>

  <!-- Comparison table -->
  <rect x="20" y="462" width="783" height="30" fill="#1e293b"/>
  <text x="110" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Platform</text>
  <text x="270" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Type</text>
  <text x="430" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Max Ports</text>
  <text x="640" y="482" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Notes</text>

  <rect x="20" y="492" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">G620</text>
  <text x="270" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Fixed</text>
  <text x="430" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">64× 32G FC</text>
  <text x="640" y="509" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Mid-range fixed</text>

  <rect x="20" y="518" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">G720</text>
  <text x="270" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Fixed</text>
  <text x="430" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">64× 64G FC</text>
  <text x="640" y="535" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">High-performance fixed</text>

  <rect x="20" y="544" width="783" height="26" fill="#f1f5f9"/>
  <text x="110" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">X7-4</text>
  <text x="270" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Director</text>
  <text x="430" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Up to 192 FC</text>
  <text x="640" y="561" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">4-slot, dual CP, NDU</text>

  <rect x="20" y="570" width="783" height="26" fill="#ffffff"/>
  <text x="110" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">X7-8</text>
  <text x="270" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Director</text>
  <text x="430" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Up to 384 FC</text>
  <text x="640" y="587" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">8-slot, dual CP, NDU</text>

  <!-- Key notes -->
  <rect x="20" y="608" width="783" height="26" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="410" y="625" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">Dual-fabric design is mandatory — each host HBA connects to an independent fabric for path redundancy</text>

  <rect x="20" y="640" width="783" height="26" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="410" y="657" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">ISL trunking aggregates multiple ISLs between directors — increases bandwidth and provides ISL redundancy</text>

  <rect x="20" y="672" width="783" height="26" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="410" y="689" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">NPIV allows VMware ESXi vHBAs — each VM can have a unique WWN without a dedicated physical HBA port</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
