<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Ceph — Distributed Storage Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">RADOS · OSD / MON / MGR · CRUSH Placement · RBD · CephFS · RGW</text>

  <!-- COLUMN 1: Core Daemons -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Core Daemons</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">RADOS foundation · quorum-based</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">OSD (Object Storage Daemon)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">MON (Monitor daemon)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">MGR (Manager daemon)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">MDS (Metadata Server — CephFS)</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">cephadm (orchestrator / deploy)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">OSD: one per disk; handles data + recovery</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">MON: 3+ for quorum; stores cluster maps</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">MGR: Dashboard + Prometheus metrics</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">MDS: CephFS only; not needed for RBD/RGW</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">cephadm: containerised deploy + upgrades</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">BlueStore: OSD backend (no filesystem)</text>
  <text x="145" y="390" text-anchor="middle" fill="#78909c" font-size="9">OSD heartbeats detect failed peers</text>
  <text x="145" y="408" text-anchor="middle" fill="#78909c" font-size="9">Active+standby MGR for HA</text>

  <!-- COLUMN 2: Client Protocols -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Client Protocols</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">RBD · CephFS · RGW / S3</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">RBD (RADOS Block Device)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">CephFS (POSIX distributed filesystem)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">RGW (RADOS Gateway — S3 / Swift)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Kubernetes CSI driver (RBD + CephFS)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">librbd / librados (client library)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">RBD: thin-provisioned; snapshots + clones</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">CephFS: POSIX; requires MDS; snapshots</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">RGW: stateless S3/Swift API frontend</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">CSI: provisions RBD/CephFS PVs in K8s</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">librbd: client-side; no kernel module needed</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">RBD: ReadWriteOnce; CephFS: ReadWriteMany</text>
  <text x="410" y="390" text-anchor="middle" fill="#78909c" font-size="9">RGW multisite: bucket replication across zones</text>
  <text x="410" y="408" text-anchor="middle" fill="#78909c" font-size="9">OpenStack: Cinder (RBD) + Swift (RGW)</text>

  <!-- COLUMN 3: Data Placement -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Data Placement</text>
  <text x="675" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">CRUSH · PG model · pool types</text>
  <rect x="560" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">CRUSH map (fault domain rules)</text>
  <rect x="560" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Placement Groups (PGs)</text>
  <rect x="560" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Replicated pool (3× default)</text>
  <rect x="560" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Erasure Coding pool (4+2 typical)</text>
  <rect x="560" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">OSD weight + CRUSH rebalance</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">CRUSH: clients compute placement directly</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">No metadata bottleneck at any scale</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">PG = logical shard; each PG maps to N OSDs</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">Replication 3×: 33% space efficiency</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">EC 4+2: 67% efficiency; higher CPU cost</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">CRUSH hierarchy: host → rack → AZ</text>
  <text x="675" y="390" text-anchor="middle" fill="#78909c" font-size="9">autoscale_mode: pg_num auto-adjusts</text>
  <text x="675" y="408" text-anchor="middle" fill="#78909c" font-size="9">Recovery: parallel across all OSDs</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Pool Type Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="110" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="295" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Replicated (3×)</text>
  <text x="480" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Erasure 4+2</text>
  <text x="660" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Erasure 8+3</text>
  <line x1="185" y1="516" x2="185" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="380" y1="516" x2="380" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="565" y1="516" x2="565" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="562" text-anchor="middle" fill="#455a64" font-size="9">Space efficiency</text>
  <text x="295" y="562" text-anchor="middle" fill="#546e7a" font-size="9">33% of raw</text>
  <text x="480" y="562" text-anchor="middle" fill="#546e7a" font-size="9">67% of raw</text>
  <text x="660" y="562" text-anchor="middle" fill="#546e7a" font-size="9">73% of raw</text>
  <text x="110" y="587" text-anchor="middle" fill="#455a64" font-size="9">Minimum OSDs</text>
  <text x="295" y="587" text-anchor="middle" fill="#546e7a" font-size="9">3</text>
  <text x="480" y="587" text-anchor="middle" fill="#546e7a" font-size="9">6</text>
  <text x="660" y="587" text-anchor="middle" fill="#546e7a" font-size="9">11</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="614" text-anchor="middle" fill="#455a64" font-size="9">Read performance</text>
  <text x="295" y="614" text-anchor="middle" fill="#546e7a" font-size="9">High (any replica)</text>
  <text x="480" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Moderate (decode)</text>
  <text x="660" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Moderate (decode)</text>
  <text x="110" y="639" text-anchor="middle" fill="#455a64" font-size="9">Write cost</text>
  <text x="295" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Low</text>
  <text x="480" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Encode overhead</text>
  <text x="660" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Encode overhead</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="110" y="665" text-anchor="middle" fill="#455a64" font-size="9">Best use case</text>
  <text x="295" y="665" text-anchor="middle" fill="#546e7a" font-size="9">RBD / hot data</text>
  <text x="480" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Bulk / warm object</text>
  <text x="660" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Cold archive</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Ceph Reference · RADOS · OSD/MON/MGR/MDS · CRUSH · RBD · CephFS · RGW · Erasure Coding</text>
</svg>
