<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">vSAN Deploy — Topology Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Physical Layer · vSAN Logical Layer · Management Plane</text>
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#37474f" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#37474f"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Physical Layer</text>
  <text x="145" y="111" text-anchor="middle" fill="#b0bec5" font-size="9">Hosts · Disks · Network</text>
  <rect x="30" y="126" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">ESXi hosts (≥3, HCL-listed)</text>
  <rect x="30" y="152" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">NVMe/SSD cache per host</text>
  <rect x="30" y="178" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">SSD/HDD capacity per host</text>
  <rect x="30" y="204" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">10GbE dedicated vSAN NIC</text>
  <rect x="30" y="230" width="230" height="22" fill="#eceff1" rx="3" stroke="#b0bec5" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#37474f" font-size="9" font-weight="700">TOR switch (MTU 9000, VLAN)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">Hosts: all in same vSAN cluster</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Cache: ≥ 10% of capacity tier</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">OSA: cache disk group + capacity</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">ESA: single NVMe pool (no groups)</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">10GbE: dedicated vmknic for vSAN</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Switch: jumbo frames + vSAN VLAN</text>
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">vSAN Logical Layer</text>
  <text x="410" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Datastore · Objects · CLOM</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSAN Datastore (cluster-wide)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Storage Objects (components)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">CLOM (object placement engine)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">DOM (data object manager)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Health Service (Skyline)</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">Datastore: single namespace all VMs</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">Objects: VM disk = witness + replicas</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">CLOM: places components per policy</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">DOM: handles read/write to objects</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Health: 170+ automated checks</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Rebalance: triggered at &gt;10% skew</text>
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Management Plane</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">vCenter · Aria · CLI</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter vSAN plugin (in VC)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Aria Operations adapter</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">esxcli vsan commands</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">PowerCLI (Get-VsanView)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vSAN Observer (on-demand trace)</text>
  <text x="675" y="282" text-anchor="middle" fill="#78909c" font-size="9">vCenter: health, disk mgmt, policies</text>
  <text x="675" y="300" text-anchor="middle" fill="#78909c" font-size="9">Aria Ops: capacity + alerts</text>
  <text x="675" y="318" text-anchor="middle" fill="#78909c" font-size="9">esxcli: low-level disk/net debug</text>
  <text x="675" y="336" text-anchor="middle" fill="#78909c" font-size="9">PowerCLI: bulk policy operations</text>
  <text x="675" y="354" text-anchor="middle" fill="#78909c" font-size="9">Observer: real-time perf trace</text>
  <text x="675" y="372" text-anchor="middle" fill="#78909c" font-size="9">RVC: Ruby vSphere Console (older)</text>
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">vSAN Network Requirements</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Requirement</text>
  <text x="320" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Minimum</text>
  <text x="520" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Recommended</text>
  <text x="700" y="535" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Notes</text>
  <line x1="240" y1="516" x2="240" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="435" y1="516" x2="435" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="530" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="544" text-anchor="middle" fill="#455a64" font-size="9">NIC bandwidth</text>
  <text x="320" y="544" text-anchor="middle" fill="#546e7a" font-size="9">1 GbE</text>
  <text x="520" y="544" text-anchor="middle" fill="#546e7a" font-size="9">10 GbE</text>
  <text x="700" y="544" text-anchor="middle" fill="#546e7a" font-size="9">25 GbE for ESA</text>
  <text x="120" y="570" text-anchor="middle" fill="#455a64" font-size="9">MTU</text>
  <text x="320" y="570" text-anchor="middle" fill="#546e7a" font-size="9">1500</text>
  <text x="520" y="570" text-anchor="middle" fill="#546e7a" font-size="9">9000 (jumbo frames)</text>
  <text x="700" y="570" text-anchor="middle" fill="#546e7a" font-size="9">Must match across switch</text>
  <rect x="20" y="582" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="596" text-anchor="middle" fill="#455a64" font-size="9">Latency (RTT)</text>
  <text x="320" y="596" text-anchor="middle" fill="#546e7a" font-size="9">&lt; 1 ms</text>
  <text x="520" y="596" text-anchor="middle" fill="#546e7a" font-size="9">&lt; 0.5 ms</text>
  <text x="700" y="596" text-anchor="middle" fill="#546e7a" font-size="9">Critical for OSA/ESA</text>
  <text x="120" y="622" text-anchor="middle" fill="#455a64" font-size="9">VLAN isolation</text>
  <text x="320" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Shared OK</text>
  <text x="520" y="622" text-anchor="middle" fill="#546e7a" font-size="9">Dedicated vSAN VLAN</text>
  <text x="700" y="622" text-anchor="middle" fill="#546e7a" font-size="9">QoS if shared</text>
  <rect x="20" y="634" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="648" text-anchor="middle" fill="#455a64" font-size="9">vmknic</text>
  <text x="320" y="648" text-anchor="middle" fill="#546e7a" font-size="9">1 per host</text>
  <text x="520" y="648" text-anchor="middle" fill="#546e7a" font-size="9">2 for redundancy</text>
  <text x="700" y="648" text-anchor="middle" fill="#546e7a" font-size="9">Both on same VLAN</text>
  <text x="120" y="674" text-anchor="middle" fill="#455a64" font-size="9">Witness bandwidth</text>
  <text x="320" y="674" text-anchor="middle" fill="#546e7a" font-size="9">100 Mbps</text>
  <text x="520" y="674" text-anchor="middle" fill="#546e7a" font-size="9">1 Gbps</text>
  <text x="700" y="674" text-anchor="middle" fill="#546e7a" font-size="9">2-node or stretched</text>
  <line x1="20" y1="702" x2="800" y2="702" stroke="#dde2ec" stroke-width="1"/>
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware vSAN Topology Reference · Disk Groups · ESA · CLOM · Skyline · MTU · HCL</text>
</svg>