<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Naming &amp; Configuration Standards
  </text>
  
  <rect x="10" y="40" width="800" height="130" fill="#e3f2fd" stroke="#1565c0" rx="6" />
  <text x="20" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Object
  </text>
  <text x="200" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Pattern
  </text>
  <text x="500" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Example
  </text>
  
  <text x="20" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Volume
  </text>
  <text x="200" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &lt;env&gt;-&lt;app&gt;-&lt;vol##&gt;
  </text>
  <text x="500" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    prod-oracle-vol01
  </text>
  
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Host
  </text>
  <text x="200" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &lt;hostname&gt; (exact)
  </text>
  <text x="500" y="100" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    esxi-prod-01
  </text>
  
  <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Host Group
  </text>
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &lt;env&gt;-&lt;cluster&gt;
  </text>
  <text x="500" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    prod-esxi-cluster
  </text>
  
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Snapshot
  </text>
  <text x="200" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &lt;volname&gt;.&lt;date&gt;
  </text>
  <text x="500" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    prod-oracle.2026-05
  </text>
  
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Prot. Group
  </text>
  <text x="200" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &lt;env&gt;-&lt;app&gt;-pg
  </text>
  <text x="500" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    prod-oracle-pg
  </text>
  
  <text x="20" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Pod
  </text>
  <text x="200" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    &lt;env&gt;-&lt;app&gt;-pod
  </text>
  <text x="500" y="180" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    prod-oracle-pod
  </text>
  
  <rect x="10" y="180" width="800" height="90" fill="#e8eaf6" stroke="#3949ab" rx="6" />
  <text x="20" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Host Configuration Baseline
  </text>
  <text x="20" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Multipath: ≥2 active paths per host
  </text>
  <text x="20" y="240" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FC zoning: single-initiator/target
  </text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    iSCSI: MTU 9000, dual-homed
  </text>
  <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Phonehome: TCP 443 confirmed open
  </text>
  
  <rect x="10" y="280" width="800" height="75" fill="#e8f5e9" stroke="#2e7d32" rx="6" />
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Protection Policies
  </text>
  <line x1="20" y1="320" x2="100" y2="320" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="110" y="325" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Tier-1 vols ──&gt; snapshot schedule + SafeMode
  </text>
  <line x1="20" y1="340" x2="100" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="110" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    RPO vols ──&gt; replication (async or ActiveCluster)
  </text>
  
  <rect x="0" y="440" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Pure Storage Evergreen//One Standards
  </text>
</svg>