<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Dell FOD — Features on Demand Architecture
  </text>
  
  <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Software feature licensing for PowerMax; activates SRDF, TimeFinder, and other features
  </text>
  <text x="10" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    without hardware changes; license key via ESRS or offline import in Unisphere.
  </text>

  <rect x="10" y="100" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Licensing Model
  </text>
  <text x="200" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Software-defined activation
  </text>
  <text x="200" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    License key: term or permanent
  </text>
  <text x="200" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    ESRS: online validation
  </text>
  <text x="200" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Offline: import license file
  </text>
  <text x="200" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    No hardware change needed
  </text>

  <rect x="410" y="100" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Available Features
  </text>
  <text x="600" y="140" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SRDF: synchronous replication
  </text>
  <text x="600" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    TimeFinder: snapshots+clones
  </text>
  <text x="600" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SRDF/Metro: active-active
  </text>
  <text x="600" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Analytics: AI-based recs
  </text>
  <text x="600" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Cloud tiering: to S3
  </text>

  <text x="10" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    SRDF and TimeFinder are most commonly licensed via FOD; both need ESRS for validation.
  </text>

  <line x1="200" y1="280" x2="200" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="280" x2="600" y2="300" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="310" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Activation Steps
  </text>
  <text x="200" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Order feature from Dell
  </text>
  <text x="200" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    License key sent by email
  </text>
  <text x="200" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Unisphere: System → FOD
  </text>
  <text x="200" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Import key → ESRS validates
  </text>
  <text x="200" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Feature active in minutes
  </text>

  <rect x="410" y="310" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    FOD vs COD
  </text>
  <text x="600" y="350" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FOD: software feature unlock
  </text>
  <text x="600" y="365" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    COD: raw capacity unlock
  </text>
  <text x="600" y="380" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Same ESRS channel for both
  </text>
  <text x="600" y="395" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Can combine on same array
  </text>
  <text x="600" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Both: PowerMax only
  </text>

  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    PowerMax array (all features physically capable but software-locked);
  </text>
  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    ESRS connectivity to esrs.dell.com on TCP 443 required for online activation.
  </text>

  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FOD = Features on Demand; PowerMax software feature licensing
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF = Symmetrix Remote Data Facility; PowerMax replication technology
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    TimeFinder = PowerMax snapshot and clone technology
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SRDF/Metro = synchronous active-active replication; zero RPO Metro stretch
  </text>
  <text x="10" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ESRS = EMC Secure Remote Services; Dell license validation channel
  </text>
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Unisphere = PowerMax web management UI; FOD license import location
  </text>
  <text x="10" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Term license = time-limited feature license; must be renewed
  </text>
  <text x="10" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Permanent license = one-time purchase; no renewal; tied to array serial number
  </text>
  <text x="10" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    COD = Capacity on Demand; capacity extension (different from FOD)
  </text>
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Feature lock = feature code in array firmware; FOD key unlocks it
  </text>
  <text x="10" y="695" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Offline import = load license file via USB/SFTP without ESRS connectivity
  </text>
  <text x="10" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    PowerMax = Dell high-end AFA; only platform supporting FOD
  </text>

  <rect x="0" y="730" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="750" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Flex on Demand — Architecture
  </text>
</svg>