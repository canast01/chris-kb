<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Pure FlashBlade — Architecture Overview</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Scale-Out Blades · Purity//FB · NFS · S3 · SMB · ActiveDR · AI/ML</text>

  <!-- ═ COLUMN 1: Hardware Platform ═ -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Hardware Platform</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Chassis · Blades · FMM · Internal Fabric</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FlashBlade//S (unified file+object)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">FlashBlade//E (capacity-optimised)</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Fabric Management Module (FMM)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">NVMe-oF internal blade fabric</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">10 / 25 / 100 GbE data ports</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Blade-level redundancy (no SPOF)</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">Scale from 7 to 150+ blades</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">Hot-add blades: no disruption</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">FMM: data + metadata management</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">//S: 10 GB/s+ bandwidth per blade</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">//E: high TB/blade, economy density</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">RAID across blades for data durability</text>

  <!-- ═ COLUMN 2: Data Services ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#00695c"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Protocols &amp; Data Services</text>
  <text x="410" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">NFS · S3 · SMB · ActiveDR · Object Lock</text>
  <rect x="295" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NFS v3 / v4.1 (pNFS)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">S3 Object (AWS SDK compatible)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SMB 2.0 / 3.0 (Windows)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ActiveDR (async replication)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Object Lock (WORM compliance)</text>
  <rect x="295" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SafeMode (immutable snapshots)</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">pNFS: parallel I/O across blades</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">S3: compatible with Veeam, Veritas</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">SMB multichannel + encryption</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">ActiveDR: pod-based replication</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Object Lock: compliance + governance</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">File system + bucket in same array</text>

  <!-- ═ COLUMN 3: Use Cases & Management ═ -->
