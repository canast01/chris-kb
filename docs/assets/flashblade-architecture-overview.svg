  <text x="540" y="562" text-anchor="middle" fill="#546e7a" font-size="9">REST API / S3 SDK</text>
  <text x="720" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Windows file share</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">Parallel access</text>
  <text x="340" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="587" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="587" text-anchor="middle" fill="#546e7a" font-size="9">SMB Multichannel</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Best for</text>
  <text x="340" y="613" text-anchor="middle" fill="#546e7a" font-size="9">AI/ML, HPC, Linux</text>
  <text x="540" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Backup target, analytics</text>
  <text x="720" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Windows home dirs</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">WORM / Object Lock</text>
  <text x="340" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="540" y="639" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="639" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Authentication</text>
  <text x="340" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Kerberos / NFSv4 ACLs</text>
  <text x="540" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Access keys / IAM-compatible</text>
  <text x="720" y="665" text-anchor="middle" fill="#546e7a" font-size="9">AD / Kerberos</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Snapshots</text>
  <text x="340" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="540" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="720" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
