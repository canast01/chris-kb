  <rect x="560" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Backup-to-disk target (S3 / NFS)</text>
  <rect x="560" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Analytics / data lake (Spark, Hadoop)</text>
  <rect x="560" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Genomics / HPC workloads</text>
  <rect x="560" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Pure1 (monitoring + capacity plan)</text>
  <rect x="560" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">REST API v2 (pureflash CLI)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">AI/ML: GPU nodes → NFS pNFS burst</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Backup: Veeam, Commvault S3 target</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Analytics: data lake with S3 access</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Pure1: health score, proactive support</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">FlashBlade//S: unified NFS + S3</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">HDFS: Hadoop without dedicated cluster</text>

  <!-- ═ COMPARISON TABLE ═ -->
