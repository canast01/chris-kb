<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    GitHub Actions — Event-Driven CI/CD Architecture
  </text>
  
  <rect x="10" y="50" width="380" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Workflow Triggers
  </text>
  <text x="200" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    push: branch/tag patterns
  </text>
  <text x="200" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    pull_request: PR events
  </text>
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    schedule: cron expression
  </text>
  <text x="200" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    workflow_dispatch: manual UI
  </text>
  <text x="200" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    repository_dispatch: API call
  </text>
  
  <rect x="410" y="50" width="380" height="120" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Job Execution
  </text>
  <text x="600" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Jobs: parallel by default
  </text>
  <text x="600" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    needs: serial dependency
  </text>
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    runs-on: hosted or self-host
  </text>
  <text x="600" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    matrix: fan-out test grid
  </text>
  <text x="600" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    concurrency: cancel prev run
  </text>
  
  <line x1="200" y1="170" x2="200" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="170" x2="600" y2="210" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="220" width="380" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Runners
  </text>
  <text x="200" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GitHub-hosted: ubuntu/win/mac
  </text>
  <text x="200" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Self-hosted: on-prem or cloud
  </text>
  <text x="200" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Self-hosted: labels for routing
  </text>
  <text x="200" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Larger runners: premium SKUs
  </text>
  <text x="200" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Runner groups: org-level RBAC
  </text>
  
  <rect x="410" y="220" width="380" height="120" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Artifacts and Outputs
  </text>
  <text x="600" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    upload-artifact: persist files
  </text>
  <text x="600" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    download-artifact: between jobs
  </text>
  <text x="600" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    outputs: string values
  </text>
  <text x="600" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    cache: restore/save keys
  </text>
  <text x="600" y="320" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    secrets: encrypted vault
  </text>
  
  <text x="410" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    GitHub.com infrastructure for hosted runners; self-hosted: any VM/bare-metal
  </text>
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    running the actions/runner agent with outbound HTTPS to api.github.com.
  </text>
  
  <text x="410" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="435" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Workflow = YAML file in .github/workflows/; one or more jobs
  </text>
  <text x="410" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Event = trigger: push, PR, schedule, dispatch, or repository event
  </text>
  <text x="410" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Job = set of steps running on one runner; isolated environment
  </text>
  <text x="410" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Step = shell command or action reference within a job
  </text>
  <text x="410" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Runner = compute that executes a job; ephemeral or persistent
  </text>
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Action = reusable unit; marketplace or local composite/JS/Docker
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    matrix = strategy for fanning out jobs across param combinations
  </text>
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    needs = job dependency; downstream job waits for upstream
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    concurrency = prevents duplicate runs; cancel-in-progress for PRs
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    artifact = file(s) persisted from a job; available for 90 days
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    OIDC = OpenID Connect; grant cloud access without stored secrets
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Secrets = encrypted repo/org values; injected as env vars at runtime
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Event-Driven CI/CD Architecture
  </text>
</svg>