<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Storage Platform Landscape</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Dell · NetApp ONTAP · Pure Storage · Ceph</text>

  <!-- COLUMN 1: Dell Storage -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="113" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Dell Storage</text>
  <text x="113" y="111" text-anchor="middle" fill="#90caf9" font-size="9">PowerStore · PowerMax</text>
  <rect x="28" y="126" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Dell PowerStore</text>
  <rect x="28" y="152" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Dell PowerMax / VMAX</text>
  <rect x="28" y="178" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Dell PowerScale (Isilon)</text>
  <rect x="28" y="204" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">ECS (object storage)</text>
  <rect x="28" y="230" width="169" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="113" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">PowerProtect DD (backup)</text>
  <text x="113" y="282" text-anchor="middle" fill="#78909c" font-size="9">PowerStore: mid-range AFA/HFA</text>
  <text x="113" y="300" text-anchor="middle" fill="#78909c" font-size="9">PowerMax: enterprise SRDF/Metro</text>
  <text x="113" y="318" text-anchor="middle" fill="#78909c" font-size="9">PowerScale: NAS scale-out HDFS</text>
  <text x="113" y="336" text-anchor="middle" fill="#78909c" font-size="9">SRDF: synchronous/async replication</text>
  <text x="113" y="354" text-anchor="middle" fill="#78909c" font-size="9">PowerStore T-model: converged node</text>
  <text x="113" y="372" text-anchor="middle" fill="#78909c" font-size="9">OneFS: distributed file system</text>
  <text x="113" y="390" text-anchor="middle" fill="#78909c" font-size="9">Unisphere: unified management UI</text>
  <text x="113" y="408" text-anchor="middle" fill="#78909c" font-size="9">DD: dedup + compression for backups</text>

  <!-- COLUMN 2: NetApp ONTAP -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#00695c"/>
  <text x="308" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">NetApp ONTAP</text>
  <text x="308" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">AFF · FAS · ONTAP S3</text>
  <rect x="223" y="126" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">AFF (all-flash FAS)</text>
  <rect x="223" y="152" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">FAS (hybrid flash)</text>
  <rect x="223" y="178" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">ONTAP Select (software)</text>
  <rect x="223" y="204" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Cloud Volumes ONTAP</text>
  <rect x="223" y="230" width="169" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="308" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SnapMirror (replication)</text>
  <text x="308" y="282" text-anchor="middle" fill="#78909c" font-size="9">SVM: storage virtual machine (tenant)</text>
  <text x="308" y="300" text-anchor="middle" fill="#78909c" font-size="9">Aggregate: RAID group pool of disks</text>
  <text x="308" y="318" text-anchor="middle" fill="#78909c" font-size="9">Snapshots: pointer-based, near-instant</text>
  <text x="308" y="336" text-anchor="middle" fill="#78909c" font-size="9">SnapMirror: async SVM DR replication</text>
  <text x="308" y="354" text-anchor="middle" fill="#78909c" font-size="9">FlexVol: flexible-size NFS/SMB/iSCSI</text>
  <text x="308" y="372" text-anchor="middle" fill="#78909c" font-size="9">ONTAP CLI: cluster / node / vserver</text>
  <text x="308" y="390" text-anchor="middle" fill="#78909c" font-size="9">NFS, SMB, iSCSI, FC, NVMe/FC</text>
  <text x="308" y="408" text-anchor="middle" fill="#78909c" font-size="9">System Manager: web-based ONTAP GUI</text>

  <!-- COLUMN 3: Pure Storage -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#6a1b9a"/>
  <text x="503" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Pure Storage</text>
  <text x="503" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">FlashArray · FlashBlade · Purity</text>
  <rect x="418" y="126" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">FlashArray//X (block/file)</text>
  <rect x="418" y="152" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">FlashArray//C (capacity tier)</text>
  <rect x="418" y="178" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">FlashBlade//S (object + file)</text>
  <rect x="418" y="204" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Purity//FA OS</text>
  <rect x="418" y="230" width="169" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="503" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">ActiveCluster (stretch / metro)</text>
  <text x="503" y="282" text-anchor="middle" fill="#78909c" font-size="9">Always-on dedup + compression</text>
  <text x="503" y="300" text-anchor="middle" fill="#78909c" font-size="9">Evergreen: non-disruptive controller swap</text>
  <text x="503" y="318" text-anchor="middle" fill="#78909c" font-size="9">ActiveCluster: sync rep + mediator</text>
  <text x="503" y="336" text-anchor="middle" fill="#78909c" font-size="9">Volumes: provisioned on FlashArray</text>
  <text x="503" y="354" text-anchor="middle" fill="#78909c" font-size="9">Protection groups: consistent snapshots</text>
  <text x="503" y="372" text-anchor="middle" fill="#78909c" font-size="9">Pure1: SaaS management + AI prediction</text>
  <text x="503" y="390" text-anchor="middle" fill="#78909c" font-size="9">FC, iSCSI, NVMe-oF, NFS, SMB</text>
  <text x="503" y="408" text-anchor="middle" fill="#78909c" font-size="9">SafeMode: immutable snapshots</text>

  <!-- COLUMN 4: Ceph -->
  <rect x="605" y="72" width="195" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="195" height="42" fill="#e65100" rx="6"/>
  <rect x="605" y="100" width="195" height="14" fill="#e65100"/>
  <text x="703" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Ceph</text>
  <text x="703" y="111" text-anchor="middle" fill="#ffab91" font-size="9">OSD · MON · RBD · CephFS · RGW</text>
  <rect x="613" y="126" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">RADOS (object storage layer)</text>
  <rect x="613" y="152" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">RBD (RADOS Block Device)</text>
  <rect x="613" y="178" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">CephFS (POSIX file system)</text>
  <rect x="613" y="204" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">RGW (S3/Swift object gateway)</text>
  <rect x="613" y="230" width="179" height="22" fill="#fbe9e7" rx="3" stroke="#ffab91" stroke-width="1"/>
  <text x="703" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">ODF / Rook-Ceph (K8s operator)</text>
  <text x="703" y="282" text-anchor="middle" fill="#78909c" font-size="9">RADOS: all data stored as objects in pools</text>
  <text x="703" y="300" text-anchor="middle" fill="#78909c" font-size="9">CRUSH: pseudo-random placement algorithm</text>
  <text x="703" y="318" text-anchor="middle" fill="#78909c" font-size="9">MON: maintain cluster map + quorum</text>
  <text x="703" y="336" text-anchor="middle" fill="#78909c" font-size="9">OSD: one daemon per disk + journal</text>
  <text x="703" y="354" text-anchor="middle" fill="#78909c" font-size="9">Replication: size=3 (3 copies default)</text>
  <text x="703" y="372" text-anchor="middle" fill="#78909c" font-size="9">BlueStore: default OSD backend</text>
  <text x="703" y="390" text-anchor="middle" fill="#78909c" font-size="9">ceph health detail: primary health CLI</text>
  <text x="703" y="408" text-anchor="middle" fill="#78909c" font-size="9">ODF: OpenShift Data Foundation</text>

  <!-- COMPARISON TABLE -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Storage Platform Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="80" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Feature</text>
  <text x="240" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Dell</text>
  <text x="390" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">NetApp</text>
  <text x="550" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Pure</text>
  <text x="710" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Ceph</text>
  <line x1="145" y1="516" x2="145" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="320" y1="516" x2="320" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="470" y1="516" x2="470" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="630" y1="516" x2="630" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="80" y="562" text-anchor="middle" fill="#455a64" font-size="9">Protocols</text>
  <text x="240" y="562" text-anchor="middle" fill="#546e7a" font-size="9">FC/iSCSI/NFS/SMB</text>
  <text x="390" y="562" text-anchor="middle" fill="#546e7a" font-size="9">FC/iSCSI/NFS/SMB/NVMe</text>
  <text x="550" y="562" text-anchor="middle" fill="#546e7a" font-size="9">FC/iSCSI/NVMe-oF/NFS</text>
  <text x="710" y="562" text-anchor="middle" fill="#546e7a" font-size="9">RBD/CephFS/S3</text>
  <text x="80" y="587" text-anchor="middle" fill="#455a64" font-size="9">DR / HA</text>
  <text x="240" y="587" text-anchor="middle" fill="#546e7a" font-size="9">SRDF Metro/Async</text>
  <text x="390" y="587" text-anchor="middle" fill="#546e7a" font-size="9">SnapMirror / MetroCluster</text>
  <text x="550" y="587" text-anchor="middle" fill="#546e7a" font-size="9">ActiveCluster</text>
  <text x="710" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Replication (async)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="80" y="614" text-anchor="middle" fill="#455a64" font-size="9">Target workload</text>
  <text x="240" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Enterprise / mission-critical</text>
  <text x="390" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Multi-protocol enterprise</text>
  <text x="550" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Performance / simplicity</text>
  <text x="710" y="614" text-anchor="middle" fill="#546e7a" font-size="9">Open-source / K8s</text>
  <text x="80" y="639" text-anchor="middle" fill="#455a64" font-size="9">Snapshot model</text>
  <text x="240" y="639" text-anchor="middle" fill="#546e7a" font-size="9">TimeFinder / SnapVX</text>
  <text x="390" y="639" text-anchor="middle" fill="#546e7a" font-size="9">ONTAP Snapshots</text>
  <text x="550" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Protection groups</text>
  <text x="710" y="639" text-anchor="middle" fill="#546e7a" font-size="9">RBD snapshots</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="80" y="665" text-anchor="middle" fill="#455a64" font-size="9">Management</text>
  <text x="240" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Unisphere / PowerStore Mgr</text>
  <text x="390" y="665" text-anchor="middle" fill="#546e7a" font-size="9">System Manager / CLI</text>
  <text x="550" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Pure1 SaaS / Purity CLI</text>
  <text x="710" y="665" text-anchor="middle" fill="#546e7a" font-size="9">ceph CLI / Dashboard</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">Storage Reference · Dell PowerStore/PowerMax · NetApp ONTAP · Pure FlashArray · Ceph RADOS</text>
</svg>
