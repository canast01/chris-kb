<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <rect width="820" height="750" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="60" fill="#1a2744"/>
  <text x="410" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Pure1 — Architecture Overview</text>

  <!-- Column 1: On-Premises Arrays (blue) -->
  <rect x="20" y="70" width="250" height="36" rx="4" fill="#2563eb"/>
  <text x="145" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Pure Storage Arrays</text>

  <rect x="20" y="116" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="130" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">FlashArray//X</text>
  <text x="145" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">all-NVMe block storage</text>

  <rect x="20" y="156" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="170" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">FlashArray//C</text>
  <text x="145" y="182" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">capacity-optimised block storage</text>

  <rect x="20" y="196" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="210" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">FlashBlade//S</text>
  <text x="145" y="222" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">scale-out NAS (NFS/S3)</text>

  <rect x="20" y="236" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="250" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">Purity OS</text>
  <text x="145" y="262" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">generates &amp; uploads telemetry</text>

  <rect x="20" y="276" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="296" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">HTTPS outbound (443) only</text>

  <rect x="20" y="316" width="250" height="32" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="145" y="336" font-family="Arial,sans-serif" font-size="11" fill="#1e3a5f" text-anchor="middle">No on-prem collector required</text>

  <!-- Column 2: Pure1 Cloud (green) -->
  <rect x="287" y="70" width="250" height="36" rx="4" fill="#15803d"/>
  <text x="412" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Pure1 SaaS Platform</text>

  <rect x="287" y="116" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="130" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Pure1 Cloud (SaaS)</text>
  <text x="412" y="142" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Pure-hosted global management</text>

  <rect x="287" y="156" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="170" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Pure1 Meta (AI/ML engine)</text>
  <text x="412" y="182" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">workload analytics &amp; anomaly detection</text>

  <rect x="287" y="196" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="216" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Health Score per Array</text>

  <rect x="287" y="236" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="256" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Capacity Forecasting</text>

  <rect x="287" y="276" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="296" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Performance Analytics</text>

  <rect x="287" y="316" width="250" height="32" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="336" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Fleet-wide Global View</text>

  <!-- Column 3: Integration & Support (purple) -->
  <rect x="553" y="70" width="250" height="36" rx="4" fill="#7c3aed"/>
  <text x="678" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Integration &amp; Support</text>

  <rect x="553" y="116" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="136" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Pure1 REST API v1/v2</text>

  <rect x="553" y="156" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="176" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Proactive Support (phone-home)</text>

  <rect x="553" y="196" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="210" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">Auto Support Case Creation</text>
  <text x="678" y="222" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">(hardware alerts)</text>

  <rect x="553" y="236" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="256" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Email Alert Notifications</text>

  <rect x="553" y="276" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">ServiceNow Integration</text>

  <rect x="553" y="316" width="250" height="32" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="678" y="336" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Mobile App (iOS / Android)</text>

  <!-- Component table -->
  <rect x="20" y="390" width="783" height="30" rx="3" fill="#1e293b"/>
  <text x="200" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Component</text>
  <text x="500" y="410" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Role</text>

  <rect x="20" y="420" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Pure1 Cloud</text>
  <text x="500" y="437" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">SaaS platform — health, capacity, performance, alerts, REST API</text>

  <rect x="20" y="446" width="783" height="26" fill="#ffffff"/>
  <text x="200" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Array Purity OS</text>
  <text x="500" y="463" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Generates and uploads telemetry to Pure1 via outbound HTTPS</text>

  <rect x="20" y="472" width="783" height="26" fill="#f1f5f9"/>
  <text x="200" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Pure1 Meta</text>
  <text x="500" y="489" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">AI/ML engine — workload analytics, anomaly detection, capacity forecasting</text>

  <!-- Highlights -->
  <rect x="20" y="520" width="783" height="30" rx="3" fill="#374151"/>
  <text x="410" y="540" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Pure1 Key Highlights</text>

  <rect x="20" y="550" width="250" height="40" fill="#f1f5f9"/>
  <text x="145" y="564" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Zero on-prem infrastructure</text>
  <text x="145" y="580" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">arrays connect directly to Pure1</text>

  <rect x="287" y="550" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="564" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">AI-driven forecasting</text>
  <text x="412" y="580" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Pure1 Meta predicts capacity exhaustion</text>

  <rect x="553" y="550" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="564" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Global fleet management</text>
  <text x="678" y="580" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">all arrays, all sites — single UI</text>

  <rect x="20" y="602" width="250" height="40" fill="#ffffff"/>
  <text x="145" y="616" font-family="Arial,sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">License model</text>
  <text x="145" y="632" font-family="Arial,sans-serif" font-size="10" fill="#1e3a5f" text-anchor="middle">included with Evergreen subscription</text>

  <rect x="287" y="602" width="250" height="40" fill="#f0fdf4"/>
  <text x="412" y="616" font-family="Arial,sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Data retention in Pure1</text>
  <text x="412" y="632" font-family="Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">up to 1 year of telemetry history</text>

  <rect x="553" y="602" width="250" height="40" fill="#faf5ff"/>
  <text x="678" y="616" font-family="Arial,sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Proactive support</text>
  <text x="678" y="632" font-family="Arial,sans-serif" font-size="10" fill="#4c1d95" text-anchor="middle">auto case filing on hardware events</text>

  <!-- Footer -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">chris-kb — infrastructure knowledge base</text>
</svg>
