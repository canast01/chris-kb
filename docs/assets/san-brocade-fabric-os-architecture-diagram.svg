<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720" viewBox="0 0 820 720">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Brocade Fabric OS — FC SAN Architecture
  </text>
  
  <text x="10" y="50" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Dual-fabric core-edge topology; principal switch election via highest domain ID;
  </text>
  <text x="10" y="65" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    WWN-based zoning, ISL trunks, Virtual Fabrics (FID), and MAPS monitoring.
  </text>

  <rect x="10" y="80" width="390" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Fabric Architecture
  </text>
  <text x="20" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dual-fabric: A + B independent
  </text>
  <text x="20" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Core: director-class switches
  </text>
  <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Edge: fixed-port switches
  </text>
  <text x="20" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Principal: elects domain IDs
  </text>
  <text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ISL: inter-switch link (trunk)
  </text>

  <rect x="420" y="80" width="390" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="430" y="100" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Zoning and Name Service
  </text>
  <text x="430" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WWN zoning: recommended
  </text>
  <text x="430" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Port zoning: for debugging
  </text>
  <text x="430" y="145" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Zone set: active + saved
  </text>
  <text x="430" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DNS: distributed name server
  </text>
  <text x="430" y="175" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FDMI: HBA attribute register
  </text>

  <text x="10" y="235" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Zoning enforced at login: initiator can only see targets in the same zone.
  </text>

  <line x1="205" y1="250" x2="205" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="615" y1="250" x2="615" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="10" y="280" width="390" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Virtual Fabrics (FID)
  </text>
  <text x="20" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Partition one switch: 2+ FIDs
  </text>
  <text x="20" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Each FID: own domain ID + zone
  </text>
  <text x="20" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Base fabric: management only
  </text>
  <text x="20" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Chassis context: cross-FID view
  </text>
  <text x="20" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Requires Advanced License
  </text>

  <rect x="420" y="280" width="390" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="430" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    MAPS Health Monitoring
  </text>
  <text x="430" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Rules: port, fabric, perf
  </text>
  <text x="430" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Policies: default + custom
  </text>
  <text x="430" y="345" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Actions: email/SNMP/fence
  </text>
  <text x="430" y="360" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dashboard: mapspoliccopy
  </text>
  <text x="430" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    CRC errors: key SAN metric
  </text>

  <text x="10" y="440" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="10" y="455" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Brocade G720 / G730 directors (bladed) or X7 fixed switches; dual power;
  </text>
  <text x="10" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    FC SFP+ optics (32G/64G); physical A/B fabric separation via separate cables.
  </text>

  <text x="10" y="500" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>

  <text x="10" y="515" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FOS = Fabric OS; Brocade/Broadcom FC switch operating system
  </text>
  <text x="10" y="530" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Principal switch = elects domain IDs for the fabric; highest WWN or priority
  </text>
  <text x="10" y="545" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Domain ID = 1-byte fabric-unique switch identifier; 1-239 range
  </text>
  <text x="10" y="560" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    WWN = World Wide Name; 64-bit unique ID for HBAs and switch ports
  </text>
  <text x="10" y="575" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Zone = access control group; one initiator + one or more targets
  </text>
  <text x="10" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Zone set = collection of zones activated on the fabric
  </text>
  <text x="10" y="605" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ISL = Inter-Switch Link; FC connection between switches
  </text>
  <text x="10" y="620" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Trunk = ISL trunk group; multiple ISLs load-balanced as one
  </text>
  <text x="10" y="635" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FID = Fabric ID; Virtual Fabric partition identifier
  </text>
  <text x="10" y="650" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    MAPS = Monitoring and Alerting Policy Suite; proactive health checks
  </text>
  <text x="10" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    DNS = Distributed Name Server; tracks WWNs logged in to fabric
  </text>
  <text x="10" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FDMI = Fabric Device Management Interface; HBA attributes
  </text>

  <rect x="0" y="690" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="710" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Brocade Fabric OS Architecture
  </text>
</svg>