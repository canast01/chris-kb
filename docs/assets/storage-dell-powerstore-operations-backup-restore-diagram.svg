<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Protection Layers (outer to inner)
  </text>
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="780" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      1. External Backup (Veeam / PPDM / Commvault)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Offsite copy; long-term retention; covers volume + data
    </text>
  </g>
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="780" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      2. Async Replication
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      DR site copy; RPO-based; recovers from site failure
    </text>
  </g>
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="780" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      3. Metro Volume (if deployed)
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Synchronous copy; zero RPO; covers node/site failure
    </text>
  </g>
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="780" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
      4. Native Snapshots
    </text>
    <text x="10" y="35" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
      Local; fastest restore; covers logical corruption / accidental deletion
    </text>
  </g>
  <rect x="0" y="280" width="820" height="40" fill="#f5f7fa" />
  <text x="10" y="305" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Backup &amp; Restore Protection Layers
  </text>
</svg>