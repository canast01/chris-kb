<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    FlashArray Authentication Flow
  </text>

  <!-- Human admin login -->
  <text x="10" y="55" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Human admin login:
  </text>
  <rect x="30" y="65" width="150" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Browser/SSH
  </text>
  <line x1="180" y1="85" x2="230" y2="85" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="225" y="122" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SAML SSO configured?
  </text>

  <line x1="230" y1="85" x2="230" y2="55" stroke="#455a64" stroke-width="1.5" />
  <line x1="230" y1="55" x2="280" y2="55" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="235" y="48" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">Yes</text>

  <line x1="230" y1="85" x2="230" y2="180" stroke="#455a64" stroke-width="1.5" />
  <line x1="230" y1="180" x2="280" y2="180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="235" y="173" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">No</text>

  <rect x="280" y="30" width="170" height="45" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="290" y="57" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    IdP (Okta/Azure AD)
  </text>
  <line x1="450" y1="52" x2="500" y2="52" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="460" y="46" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">
    MFA + SAML assertion
  </text>

  <rect x="280" y="155" width="170" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="290" y="187" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    AD/LDAP bind
  </text>
  <line x1="450" y1="182" x2="500" y2="182" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="505" y="186" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">
    group membership
  </text>

  <text x="40" y="236" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">Both paths fall back to local account</text>
  <text x="40" y="248" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">(pureuser) if SSO/LDAP unavailable</text>

  <!-- Automation login -->
  <text x="10" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Automation login:
  </text>
  <rect x="30" y="290" width="150" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="40" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Script
  </text>
  <line x1="180" y1="310" x2="280" y2="310" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="185" y="304" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">
    x-auth-token: &lt;api_token&gt;
  </text>

  <!-- Convergence into Purity RBAC -->
  <polyline points="450,65 470,65 470,360" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="330" y1="210" x2="330" y2="380" stroke="#455a64" stroke-width="1.5" />
  <line x1="330" y1="380" x2="380" y2="380" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <rect x="380" y="360" width="150" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="390" y="385" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Purity RBAC
  </text>

  <line x1="530" y1="375" x2="580" y2="375" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="540" y="369" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">
    role assigned
  </text>

  <line x1="455" y1="400" x2="455" y2="440" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="10" y="460" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f">
    all actions logged (pureaudit) → forwarded to SIEM via TLS syslog
  </text>

  <rect x="0" y="500" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="520" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Authentication Flow
  </text>
</svg>