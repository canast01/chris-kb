<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    CyberArk — Backup &amp; Restore
  </text>
  <rect x="20" y="50" width="780" height="200" fill="#ffffff" stroke="#455a64" stroke-width="1.5" rx="6" />
  <text x="40" y="80" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    &lt;Vault install path&gt;\PrivateArk\Server\
  </text>
  <line x1="40" y1="90" x2="40" y2="120" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="100" width="300" height="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="6" />
  <text x="70" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    server.key
  </text>
  <text x="370" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Server private key (AES-256 encrypted at rest)
  </text>
  <line x1="40" y1="130" x2="40" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="140" width="300" height="30" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5" rx="6" />
  <text x="70" y="160" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    recpub.key
  </text>
  <text x="370" y="160" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
