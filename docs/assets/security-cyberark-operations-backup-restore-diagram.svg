  </text>
  <line x1="40" y1="170" x2="40" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="180" width="300" height="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="6" />
  <text x="70" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    recprv.key
  </text>
  <text x="370" y="200" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Recovery private key (may be stored separately)
  </text>
  <line x1="40" y1="210" x2="40" y2="240" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <rect x="60" y="220" width="300" height="30" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5" rx="6" />
  <text x="70" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
