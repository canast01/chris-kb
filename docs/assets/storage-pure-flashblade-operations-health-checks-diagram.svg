<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FlashBlade Health Check Sequence</text>

  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purefb alert list</text>
    <text x="320" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Any active alerts?</text>
    <line x1="150" y1="40" x2="150" y2="60" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purefb blade list</text>
    <text x="320" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">All blades healthy (no failed/missing)?</text>
    <line x1="150" y1="40" x2="150" y2="60" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purefb hardware list</text>
    <text x="320" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Chassis / PSU / fans ok?</text>
    <line x1="150" y1="40" x2="150" y2="60" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purefb array list --space</text>
    <text x="320" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Capacity &lt; 80%?</text>
    <line x1="150" y1="40" x2="150" y2="60" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purefb replication list</text>
    <text x="320" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ActiveDR lag within RPO?</text>
    <line x1="150" y1="40" x2="150" y2="60" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <g transform="translate(20, 300)">
    <rect x="0" y="0" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Pure1 portal</text>
    <text x="320" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Fleet-level anomaly check</text>
  </g>

  <rect x="0" y="460" width="820" height="40" fill="#f5f7fa" />
  <text x="10" y="485" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: FlashBlade Health Check Sequence</text>
</svg>