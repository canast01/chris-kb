<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="410" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Pure Evergreen//One — Storage as a Service Architecture
  </text>
  
  <rect x="10" y="50" width="380" height="140" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="200" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Service Model
  </text>
  <text x="200" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FlashArray in customer rack
  </text>
  <text x="200" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure manages HW + Purity OS
  </text>
  <text x="200" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Non-disruptive controller swap
  </text>
  <text x="200" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Customer manages data + VMs
  </text>
  <text x="200" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Subscription: per TB/month
  </text>
  
  <rect x="410" y="50" width="380" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="600" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Underlying Platform
  </text>
  <text x="600" y="90" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FlashArray //X: block NVMe
  </text>
  <text x="600" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FlashBlade //S: file + obj
  </text>
  <text x="600" y="120" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    All-NVMe: no spinning disk
  </text>
  <text x="600" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SafeMode: immutable snaps
  </text>
  <text x="600" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure1: management portal
  </text>
  
  <line x1="200" y1="190" x2="200" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="600" y1="190" x2="600" y2="220" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="230" width="380" height="140" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="200" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    SLA and Guarantees
  </text>
  <text x="200" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Availability: 99.9999% SLA
  </text>
  <text x="200" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Performance: guaranteed IOPS
  </text>
  <text x="200" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Non-disruptive upgrade: always
  </text>
  <text x="200" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Capacity burst: elastic
  </text>
  <text x="200" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Energy efficiency included
  </text>
  
  <rect x="410" y="230" width="380" height="140" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="600" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Management
  </text>
  <text x="600" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure1: SaaS portal
  </text>
  <text x="600" y="285" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    REST API: automation
  </text>
  <text x="600" y="300" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure Support: proactive
  </text>
  <text x="600" y="315" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure1 AI: predictive alerts
  </text>
  <text x="600" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    MSP option: partner managed
  </text>
  
  <text x="410" y="390" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Physical Infrastructure (the hardware everything above runs on):
  </text>
  <text x="410" y="405" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure FlashArray //X or //C in customer rack; FC or iSCSI or NVMe-oF host connections;
  </text>
  <text x="410" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure1 cloud portal management; phone-home telemetry over TCP 443 to Pure cloud.
  </text>
  
  <text x="410" y="450" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744" text-anchor="middle">
    Key terms:
  </text>
  <text x="410" y="465" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Evergreen//One = Pure STaaS; hardware in your DC, Pure manages it, you consume it
  </text>
  <text x="410" y="480" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    STaaS = Storage as a Service; pay per TB used, not upfront CapEx
  </text>
  <text x="410" y="495" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Non-disruptive = controller upgrade without IO downtime; Pure guarantee
  </text>
  <text x="410" y="510" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    SafeMode = immutable Snapshot; cannot be deleted even by admin; ransomware
  </text>
  <text x="410" y="525" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Pure1 = Pure SaaS management and analytics portal; all arrays in one view
  </text>
  <text x="410" y="540" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FlashArray //X = Pure block storage array; NVMe; target for Evergreen//One block
  </text>
  <text x="410" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    FlashBlade //S = Pure scale-out file+object; target for Evergreen//One unstructured
  </text>
  <text x="410" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Purity OS = Pure storage OS; runs on FlashArray; managed by Pure under contract
  </text>
  <text x="410" y="585" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    99.9999% SLA = six nines; ~32 seconds total downtime per year
  </text>
  <text x="410" y="600" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Capacity burst = use more than committed; billed at overage rate automatically
  </text>
  <text x="410" y="615" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Proactive support = Pure1 AI detects issues and opens support cases before you do
  </text>
  <text x="410" y="630" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f" text-anchor="middle">
    Phone-home = telemetry from array to Pure cloud; required for managed service
  </text>
  
  <rect x="0" y="650" width="820" height="30" fill="#f5f7fa" />
  <text x="410" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">
    Diagram Type: Storage as a Service Architecture
  </text>
</svg>