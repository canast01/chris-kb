<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    Architecture — Network Design
  </text>
  
  <rect x="10" y="50" width="800" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Enterprise network design: spine-leaf topology, L3 segmentation, security zones, BGP
  </text>
  <text x="20" y="90" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Spine-leaf: no STP; any leaf to any leaf = 2 hops; ECMP for load distribution
  </text>
  <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Zones: untrusted → DMZ → internal → restricted; firewalls at zone boundaries
  </text>
  
  <line x1="410" y1="130" x2="410" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="130" x2="410" y2="160" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="50" y="170" width="320" height="160" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="60" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Topology
  </text>
  <text x="60" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Spine: 2+ core switches
  </text>
  <text x="60" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Leaf: ToR per rack
  </text>
  <text x="60" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ECMP load balancing
  </text>
  <text x="60" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    BGP for DC routing
  </text>
  <text x="60" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Dual uplinks per leaf
  </text>
  
  <rect x="450" y="170" width="320" height="160" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="460" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Segmentation
  </text>
  <text x="460" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    VLANs per function/zone
  </text>
  <text x="460" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    L3 boundary per zone
  </text>
  <text x="460" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    FW between zones
  </text>
  <text x="460" y="270" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Micro-seg (NSX)
  </text>
  <text x="460" y="290" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ACL on VLAN SVIs
  </text>
  
  <text x="20" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">
    Key terms:
  </text>
  <text x="20" y="370" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Spine-leaf = Two-tier DC fabric; spines interconnect all leaves; no STP; predictable latency
  </text>
  <text x="20" y="390" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ECMP = Equal-Cost Multi-Path; traffic distributed across multiple equal-cost paths
  </text>
  <text x="20" y="410" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    ToR = Top of Rack switch; leaf switch physically mounted at top of server rack
  </text>
  <text x="20" y="430" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    BGP = Border Gateway Protocol; used for DC internal routing and WAN peering
  </text>
  <text x="20" y="450" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    SVI = Switched Virtual Interface; L3 gateway for a VLAN; ACLs applied here
  </text>
  <text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">
    Micro-seg = Per-VM firewall rules (NSX DFW); east-west traffic control inside DC
  </text>
  
  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">
    Diagram Type: Network Design
  </text>
</svg>