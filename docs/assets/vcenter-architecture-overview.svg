<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">vCenter Server — Deployment Topologies</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Standard VCSA · vCenter HA (VCHA) · Enhanced Linked Mode · Cloud Gateway</text>

  <!-- ═ COLUMN 1: Standard VCSA ═ -->
  <rect x="20" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="185" height="42" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="185" height="14" fill="#1565c0"/>
  <text x="112" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Standard VCSA</text>
  <text x="112" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Single appliance · embedded DB</text>
  <rect x="30" y="126" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">VCSA Appliance (OVA)</text>
  <rect x="30" y="152" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Embedded PostgreSQL DB</text>
  <rect x="30" y="178" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Embedded PSC (SSO)</text>
  <rect x="30" y="204" width="165" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="112" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">vSphere Client (VAMI)</text>
  <text x="112" y="258" text-anchor="middle" fill="#78909c" font-size="9">Standard production topology</text>
  <text x="112" y="276" text-anchor="middle" fill="#78909c" font-size="9">All services on one appliance</text>
  <text x="112" y="294" text-anchor="middle" fill="#78909c" font-size="9">Single point of failure</text>
  <text x="112" y="312" text-anchor="middle" fill="#78909c" font-size="9">Protect with VCHA or snapshots</text>
  <text x="112" y="330" text-anchor="middle" fill="#78909c" font-size="9">Scale: up to 2000 hosts</text>

  <!-- ═ COLUMN 2: VCHA ═ -->
  <rect x="215" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="215" y="72" width="185" height="42" fill="#2e7d32" rx="6"/>
  <rect x="215" y="100" width="185" height="14" fill="#2e7d32"/>
  <text x="307" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">vCenter HA (VCHA)</text>
  <text x="307" y="111" text-anchor="middle" fill="#a5d6a7" font-size="9">Active / Passive / Witness</text>
  <rect x="225" y="126" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="307" y="141" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">Active Node (primary)</text>
  <rect x="225" y="152" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="307" y="167" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">Passive Node (hot standby)</text>
  <rect x="225" y="178" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="307" y="193" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">Witness Node (quorum)</text>
  <rect x="225" y="204" width="165" height="22" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/>
  <text x="307" y="219" text-anchor="middle" fill="#1b5e20" font-size="9" font-weight="700">HA Network (dedicated vNIC)</text>
  <text x="307" y="258" text-anchor="middle" fill="#78909c" font-size="9">Automatic failover ≈ 2 min</text>
  <text x="307" y="276" text-anchor="middle" fill="#78909c" font-size="9">DB replicated to Passive</text>
  <text x="307" y="294" text-anchor="middle" fill="#78909c" font-size="9">Witness only votes — no data</text>
  <text x="307" y="312" text-anchor="middle" fill="#78909c" font-size="9">Use when mgmt plane HA required</text>
  <text x="307" y="330" text-anchor="middle" fill="#78909c" font-size="9">All 3 nodes on separate ESXi hosts</text>

  <!-- ═ COLUMN 3: Enhanced Linked Mode ═ -->
  <rect x="410" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="410" y="72" width="185" height="42" fill="#e65100" rx="6"/>
  <rect x="410" y="100" width="185" height="14" fill="#e65100"/>
  <text x="502" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Enhanced Linked Mode</text>
  <text x="502" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Multiple vCenters · shared SSO</text>
  <rect x="420" y="126" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vCenter A (site 1)</text>
  <rect x="420" y="152" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">vCenter B (site 2)</text>
  <rect x="420" y="178" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Shared SSO domain</text>
  <rect x="420" y="204" width="165" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="502" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Single vSphere Client UI</text>
  <text x="502" y="258" text-anchor="middle" fill="#78909c" font-size="9">Search VMs across all vCenters</text>
  <text x="502" y="276" text-anchor="middle" fill="#78909c" font-size="9">Cross-vCenter vMotion</text>
  <text x="502" y="294" text-anchor="middle" fill="#78909c" font-size="9">Unified permissions model</text>
  <text x="502" y="312" text-anchor="middle" fill="#78909c" font-size="9">Use: multi-site, large scale</text>
  <text x="502" y="330" text-anchor="middle" fill="#78909c" font-size="9">Max 15 vCenters per SSO domain</text>

  <!-- ═ COLUMN 4: Cloud Gateway ═ -->
  <rect x="605" y="72" width="185" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="605" y="72" width="185" height="42" fill="#00695c" rx="6"/>
  <rect x="605" y="100" width="185" height="14" fill="#00695c"/>
  <text x="697" y="97" text-anchor="middle" fill="white" font-size="12" font-weight="700">Cloud Gateway</text>
  <text x="697" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">On-prem ↔ VMware Cloud</text>
  <rect x="615" y="126" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">On-prem VCSA</text>
  <rect x="615" y="152" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Cloud Gateway Appliance</text>
  <rect x="615" y="178" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">VMware Cloud on AWS SDDC</text>
  <rect x="615" y="204" width="165" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="697" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Hybrid Linked Mode</text>
  <text x="697" y="258" text-anchor="middle" fill="#78909c" font-size="9">Single UI for on-prem + cloud</text>
  <text x="697" y="276" text-anchor="middle" fill="#78909c" font-size="9">Cross-cloud vMotion</text>
  <text x="697" y="294" text-anchor="middle" fill="#78909c" font-size="9">Requires cloud SDDC subscription</text>
  <text x="697" y="312" text-anchor="middle" fill="#78909c" font-size="9">Use: hybrid cloud migrations</text>
  <text x="697" y="330" text-anchor="middle" fill="#78909c" font-size="9">Gateway VM deployed on-prem</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Topology Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="120" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Capability</text>
  <text x="305" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Standard</text>
  <text x="450" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">VCHA</text>
  <text x="597" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Linked Mode</text>
  <text x="742" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Cloud GW</text>
  <line x1="220" y1="516" x2="220" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="385" y1="516" x2="385" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="515" y1="516" x2="515" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="680" y1="516" x2="680" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="561" text-anchor="middle" fill="#455a64" font-size="9">Management plane HA</text>
  <text x="302" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="562" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="597" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="120" y="587" text-anchor="middle" fill="#455a64" font-size="9">Multi-site management</text>
  <text x="302" y="588" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="588" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="588" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="588" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="613" text-anchor="middle" fill="#455a64" font-size="9">Cross-vCenter vMotion</text>
  <text x="302" y="614" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="614" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="614" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="742" y="614" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="120" y="639" text-anchor="middle" fill="#455a64" font-size="9">vCenter instances</text>
  <text x="302" y="639" text-anchor="middle" fill="#546e7a" font-size="9">1</text>
  <text x="450" y="639" text-anchor="middle" fill="#546e7a" font-size="9">1 (+ 2 nodes)</text>
  <text x="597" y="639" text-anchor="middle" fill="#546e7a" font-size="9">2–15</text>
  <text x="742" y="639" text-anchor="middle" fill="#546e7a" font-size="9">1 + cloud SDDC</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="120" y="665" text-anchor="middle" fill="#455a64" font-size="9">Cloud integration</text>
  <text x="302" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="450" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="597" y="665" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="742" y="665" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="120" y="691" text-anchor="middle" fill="#455a64" font-size="9">Use case</text>
  <text x="302" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Standard prod</text>
  <text x="450" y="691" text-anchor="middle" fill="#546e7a" font-size="9">HA mgmt plane</text>
  <text x="597" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Large / multi-site</text>
  <text x="742" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Hybrid cloud</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware vCenter Reference · Standard VCSA · VCHA · Enhanced Linked Mode · Cloud Gateway</text>
</svg>
