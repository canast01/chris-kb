<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">vSAN Stretched Cluster Setup and Validation</text>
  
  <!-- SITE A (Preferred) -->
  <rect x="10" y="50" width="250" height="400" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SITE A (Preferred)</text>
  <rect x="30" y="90" width="190" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="40" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi-A01</text>
  <text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi-A02</text>
  <text x="40" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi-A03</text>
  <line x1="125" y1="170" x2="125" y2="200" stroke="#455a64" stroke-width="1.5" />
  <rect x="30" y="200" width="190" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="40" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vSAN Datastore</text>
  <text x="40" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(preferred)</text>
  <rect x="30" y="280" width="190" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="40" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vCenter (primary)</text>

  <!-- WITNESS SITE (3rd) -->
  <rect x="280" y="50" width="250" height="150" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="290" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">WITNESS SITE (3rd)</text>
  <rect x="300" y="90" width="190" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="310" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Witness Appliance</text>
  <text x="310" y="130" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(metadata)</text>

  <!-- SITE B (Secondary) -->
  <rect x="550" y="50" width="250" height="400" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="560" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">SITE B (Secondary)</text>
  <rect x="570" y="90" width="190" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="580" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi-B01</text>
  <text x="580" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi-B02</text>
  <text x="580" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">ESXi-B03</text>
  <line x1="665" y1="170" x2="665" y2="200" stroke="#455a64" stroke-width="1.5" />
  <rect x="570" y="200" width="190" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" />
  <text x="580" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vSAN Datastore</text>
  <text x="580" y="235" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(secondary)</text>
  <rect x="570" y="280" width="190" height="40" rx="6" fill="#fce4ec" stroke="#c62828" />
  <text x="580" y="300" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">VMs (dark standby)</text>

  <!-- Connections -->
  <line x1="220" y1="130" x2="300" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="260" y="120" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f" text-anchor="middle">Witness Traffic</text>
  <line x1="490" y1="130" x2="570" y2="130" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="530" y="120" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#37474f" text-anchor="middle">Witness Traffic</text>
  <line x1="220" y1="230" x2="570" y2="230" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <text x="350" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">Inter-site data path (RTT ≤ 5ms required)</text>

  <!-- Policy -->
  <rect x="10" y="470" width="800" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="490" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">vSAN STRETCHED CLUSTER POLICY (RAID-1 across sites):</text>
  <text x="20" y="510" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">VM Object → Component A (Site A) + Component B (Site B) + Witness Component (Witness Site) [metadata only]</text>

  <rect x="0" y="550" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="570" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: vSAN Stretched Cluster Setup</text>
</svg>