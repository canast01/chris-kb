<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Pure REST API Automation Flow</text>
  
  <rect x="10" y="50" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">1. Generate RS256 JWT</text>
  <text x="20" y="85" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(PURE1_APP_ID + private key)</text>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="420" y="105" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">POST /oauth2/token</text>
  
  <rect x="10" y="120" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Pure1 API — Bearer token</text>
  <text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">GET /subscriptions</text>
  <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">GET /subscription-assets</text>
  <text x="20" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">GET /metrics/history</text>
  
  <line x1="410" y1="180" x2="410" y2="200" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="10" y="210" width="800" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="20" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Parse &amp; Alert</text>
  <text x="20" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">consumed &gt; reserve</text>
  <text x="250" y="245" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">──► BURST alert / email</text>
  <text x="20" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">pct &gt; 90%</text>
  <text x="250" y="260" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">──► WARN in report</text>
  <text x="20" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">days_to_end &lt; 90</text>
  <text x="250" y="275" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">──► EXPIRY warn</text>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <text x="10" y="320" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Per-array: SSH ──► purearray list --space</text>
  <text x="10" y="335" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">purevol list --space</text>
  
  <rect x="0" y="470" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="490" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Automation Flow</text>
</svg>