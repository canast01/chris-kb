<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Aria Suite Lifecycle — Product Management Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">LCM Appliance · Managed Products · Infrastructure Dependencies</text>

  <!-- ═ COLUMN 1: LCM Appliance ═ (3-col: 250px) -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="49" fill="#1565c0" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">LCM Appliance</text>
  <text x="145" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Central orchestration · UI · Locker</text>
  <rect x="30" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Lifecycle Manager UI (port 443)</text>
  <rect x="30" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">REST API</text>
  <rect x="30" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Locker (credential vault)</text>
  <rect x="30" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Environment management</text>
  <rect x="30" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Upgrade workflows (LCM)</text>
  <rect x="30" y="256" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Certificate management</text>
  <text x="145" y="308" text-anchor="middle" fill="#78909c" font-size="9">OVA deployed on vSphere</text>
  <text x="145" y="326" text-anchor="middle" fill="#78909c" font-size="9">4 vCPU / 16 GB RAM / 250 GB disk</text>
  <text x="145" y="344" text-anchor="middle" fill="#78909c" font-size="9">Locker: passwords + certs + licenses</text>
  <text x="145" y="362" text-anchor="middle" fill="#78909c" font-size="9">Pre-check → snapshot → upgrade flow</text>
  <text x="145" y="380" text-anchor="middle" fill="#78909c" font-size="9">VIDM required for all managed products</text>
  <text x="145" y="398" text-anchor="middle" fill="#78909c" font-size="9">Easy Installer: bootstrap multi-product</text>

  <!-- ═ COLUMN 2: Managed Products ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="49" fill="#e65100" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#e65100"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Managed Products</text>
  <text x="410" y="111" text-anchor="middle" fill="#ffccbc" font-size="9">Full Aria Suite under LCM control</text>
  <rect x="295" y="126" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Aria Operations</text>
  <rect x="295" y="152" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Aria Operations for Logs</text>
  <rect x="295" y="178" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Aria Automation</text>
  <rect x="295" y="204" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Aria Operations for Networks</text>
  <rect x="295" y="230" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Workspace ONE Access (VIDM)</text>
  <rect x="295" y="256" width="230" height="22" fill="#fbe9e7" rx="3" stroke="#ffccbc" stroke-width="1"/>
  <text x="410" y="271" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">Aria Suite Lifecycle itself</text>
  <text x="410" y="308" text-anchor="middle" fill="#78909c" font-size="9">LCM deploys + upgrades all products</text>
  <text x="410" y="326" text-anchor="middle" fill="#78909c" font-size="9">VIDM = SSO for entire Aria suite</text>
  <text x="410" y="344" text-anchor="middle" fill="#78909c" font-size="9">Upgrade order: VIDM → Ops → Logs → AA</text>
  <text x="410" y="362" text-anchor="middle" fill="#78909c" font-size="9">LCM can manage itself (self-upgrade)</text>
  <text x="410" y="380" text-anchor="middle" fill="#78909c" font-size="9">Binary repo on NFS — offline capable</text>
  <text x="410" y="398" text-anchor="middle" fill="#78909c" font-size="9">Environments: dev / preprod / prod</text>

  <!-- ═ COLUMN 3: Infrastructure Dependencies ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="49" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Infrastructure Dependencies</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Must be ready before deployment</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter Server</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">DNS (forward + reverse all FQDNs)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NTP (skew &lt;5 s — mandatory)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NFS Share (binary repo + snapshots)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">SMTP (email notifications)</text>
  <rect x="560" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">LDAP / Active Directory (optional)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">DNS: all products must resolve FQDN</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">NFS: minimum 500 GB for binaries</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">NTP skew breaks certificate ops</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">Snapshot: stored on NFS before upgrade</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">AD: used by VIDM for SSO federation</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Static IPs required for all appliances</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">LCM Upgrade Workflow</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="100" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Phase</text>
  <text x="330" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">What LCM Does</text>
  <text x="570" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Rollback Option</text>
  <text x="730" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Duration</text>
  <line x1="180" y1="516" x2="180" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="470" y1="516" x2="470" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="660" y1="516" x2="660" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="100" y="562" text-anchor="middle" fill="#455a64" font-size="9">Pre-check</text>
  <text x="330" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Validates DNS, NTP, certs, space</text>
  <text x="570" y="562" text-anchor="middle" fill="#546e7a" font-size="9">Abort (no change made)</text>
  <text x="730" y="562" text-anchor="middle" fill="#546e7a" font-size="9">~5 min</text>
  <text x="100" y="587" text-anchor="middle" fill="#455a64" font-size="9">Snapshot</text>
  <text x="330" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Snaps VMs to NFS before patching</text>
  <text x="570" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Revert snapshot</text>
  <text x="730" y="587" text-anchor="middle" fill="#546e7a" font-size="9">~15 min</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="100" y="613" text-anchor="middle" fill="#455a64" font-size="9">Stage / Download</text>
  <text x="330" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Pulls .pak files to NFS repo</text>
  <text x="570" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Cancel (no downtime yet)</text>
  <text x="730" y="613" text-anchor="middle" fill="#546e7a" font-size="9">Variable</text>
  <text x="100" y="639" text-anchor="middle" fill="#455a64" font-size="9">Upgrade</text>
  <text x="330" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Applies patches — service downtime</text>
  <text x="570" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Snapshot revert</text>
  <text x="730" y="639" text-anchor="middle" fill="#546e7a" font-size="9">30–120 min</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="100" y="665" text-anchor="middle" fill="#455a64" font-size="9">Post-check</text>
  <text x="330" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Verifies services, APIs, certificates</text>
  <text x="570" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Snapshot revert</text>
  <text x="730" y="665" text-anchor="middle" fill="#546e7a" font-size="9">~5 min</text>
  <text x="100" y="691" text-anchor="middle" fill="#455a64" font-size="9">Cleanup</text>
  <text x="330" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Delete upgrade snapshots</text>
  <text x="570" y="691" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="730" y="691" text-anchor="middle" fill="#546e7a" font-size="9">~5 min</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware Aria Suite Lifecycle Reference · LCM Appliance · Locker · VIDM · Upgrade Workflow</text>
</svg>
