<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="750" fill="#f4f6f9"/>
  <!-- TITLE -->
  <rect x="0" y="0" width="820" height="58" fill="#1a2744"/>
  <text x="410" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Aria Automation — Service Architecture</text>
  <text x="410" y="52" text-anchor="middle" fill="#7a8fbb" font-size="11">Consumer Layer · Orchestration · IaaS Execution · Endpoint Integrations</text>

  <!-- ═ COLUMN 1: Consumer Layer ═ (3-col: 250px) -->
  <rect x="20" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="72" width="250" height="42" fill="#6a1b9a" rx="6"/>
  <rect x="20" y="100" width="250" height="14" fill="#6a1b9a"/>
  <text x="145" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Consumer Layer</text>
  <text x="145" y="111" text-anchor="middle" fill="#ce93d8" font-size="9">Self-service portal · catalog</text>
  <rect x="30" y="126" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="145" y="141" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Service Catalog (UI)</text>
  <rect x="30" y="152" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="145" y="167" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Cloud Template (YAML IaC)</text>
  <rect x="30" y="178" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="145" y="193" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Cloud Zone (placement targets)</text>
  <rect x="30" y="204" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="145" y="219" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Project (tenant isolation)</text>
  <rect x="30" y="230" width="230" height="22" fill="#f3e5f5" rx="3" stroke="#ce93d8" stroke-width="1"/>
  <text x="145" y="245" text-anchor="middle" fill="#4a148c" font-size="9" font-weight="700">Service Broker (request mgmt)</text>
  <text x="145" y="282" text-anchor="middle" fill="#78909c" font-size="9">End users request from catalog</text>
  <text x="145" y="300" text-anchor="middle" fill="#78909c" font-size="9">Admins define cloud templates</text>
  <text x="145" y="318" text-anchor="middle" fill="#78909c" font-size="9">Projects = RBAC boundaries</text>
  <text x="145" y="336" text-anchor="middle" fill="#78909c" font-size="9">REST API / CLI for automation</text>
  <text x="145" y="354" text-anchor="middle" fill="#78909c" font-size="9">Custom forms for request inputs</text>
  <text x="145" y="372" text-anchor="middle" fill="#78909c" font-size="9">Approval policies per catalog item</text>

  <!-- ═ COLUMN 2: Orchestration ═ -->
  <rect x="285" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="285" y="72" width="250" height="42" fill="#1565c0" rx="6"/>
  <rect x="285" y="100" width="250" height="14" fill="#1565c0"/>
  <text x="410" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Orchestration Engine</text>
  <text x="410" y="111" text-anchor="middle" fill="#90caf9" font-size="9">Workflows · Actions · Integrations</text>
  <rect x="295" y="126" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="141" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Aria Automation Orchestrator (vRO)</text>
  <rect x="295" y="152" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">ABX Actions (FaaS / extensibility)</text>
  <rect x="295" y="178" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="193" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Event Broker (event subscriptions)</text>
  <rect x="295" y="204" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="219" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Terraform Provider (IaC)</text>
  <rect x="295" y="230" width="230" height="22" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/>
  <text x="410" y="245" text-anchor="middle" fill="#1565c0" font-size="9" font-weight="700">Config Drift Detection</text>
  <text x="410" y="282" text-anchor="middle" fill="#78909c" font-size="9">vRO: GUI workflow editor (JS/TS)</text>
  <text x="410" y="300" text-anchor="middle" fill="#78909c" font-size="9">ABX: Node.js / Python / Go</text>
  <text x="410" y="318" text-anchor="middle" fill="#78909c" font-size="9">Event Broker: day 2 automation</text>
  <text x="410" y="336" text-anchor="middle" fill="#78909c" font-size="9">Terraform: state stored in project</text>
  <text x="410" y="354" text-anchor="middle" fill="#78909c" font-size="9">Extensibility points per lifecycle</text>
  <text x="410" y="372" text-anchor="middle" fill="#78909c" font-size="9">Plugin marketplace: ServiceNow, etc.</text>

  <!-- ═ COLUMN 3: Execution ═ -->
  <rect x="550" y="72" width="250" height="390" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="550" y="72" width="250" height="42" fill="#00695c" rx="6"/>
  <rect x="550" y="100" width="250" height="14" fill="#00695c"/>
  <text x="675" y="97" text-anchor="middle" fill="white" font-size="13" font-weight="700">Execution / Endpoints</text>
  <text x="675" y="111" text-anchor="middle" fill="#80cbc4" font-size="9">Where resources get provisioned</text>
  <rect x="560" y="126" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="141" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">vCenter (VM provisioning)</text>
  <rect x="560" y="152" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="167" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">NSX (network + security)</text>
  <rect x="560" y="178" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="193" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">AWS (EC2 / VPC / S3)</text>
  <rect x="560" y="204" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="219" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Azure (VMs / VNets)</text>
  <rect x="560" y="230" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="245" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">GCP (Compute Engine)</text>
  <rect x="560" y="256" width="230" height="22" fill="#e0f2f1" rx="3" stroke="#80cbc4" stroke-width="1"/>
  <text x="675" y="271" text-anchor="middle" fill="#004d40" font-size="9" font-weight="700">Kubernetes (vSphere / cloud)</text>
  <text x="675" y="308" text-anchor="middle" fill="#78909c" font-size="9">Cloud accounts define endpoints</text>
  <text x="675" y="326" text-anchor="middle" fill="#78909c" font-size="9">Cloud Zones map to clusters/regions</text>
  <text x="675" y="344" text-anchor="middle" fill="#78909c" font-size="9">Placement: tag-based constraints</text>
  <text x="675" y="362" text-anchor="middle" fill="#78909c" font-size="9">NSX: auto-create segments/groups</text>
  <text x="675" y="380" text-anchor="middle" fill="#78909c" font-size="9">Day 2 ops: resize, snapshot, delete</text>
  <text x="675" y="398" text-anchor="middle" fill="#78909c" font-size="9">Lease expiry = auto-decommission</text>

  <!-- ═ COMPARISON TABLE ═ -->
  <rect x="20" y="480" width="780" height="222" fill="#fff" rx="6" stroke="#dde2ec" stroke-width="1.2"/>
  <rect x="20" y="480" width="780" height="36" fill="#1a2744" rx="6"/>
  <rect x="20" y="504" width="780" height="12" fill="#1a2744"/>
  <text x="410" y="504" text-anchor="middle" fill="white" font-size="13" font-weight="700">Deployment Model Comparison</text>
  <rect x="20" y="516" width="780" height="28" fill="#eceff1"/>
  <text x="130" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">Attribute</text>
  <text x="380" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">SaaS (Cloud)</text>
  <text x="660" y="534" text-anchor="middle" fill="#37474f" font-size="10" font-weight="700">On-Premises Cluster</text>
  <line x1="255" y1="516" x2="255" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <line x1="510" y1="516" x2="510" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <rect x="20" y="544" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="562" text-anchor="middle" fill="#455a64" font-size="9">Infrastructure to manage</text>
  <text x="380" y="562" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="660" y="562" text-anchor="middle" fill="#546e7a" font-size="9">1 or 3 appliance cluster</text>
  <text x="130" y="587" text-anchor="middle" fill="#455a64" font-size="9">On-prem connectivity</text>
  <text x="380" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Cloud Extensibility Proxy</text>
  <text x="660" y="587" text-anchor="middle" fill="#546e7a" font-size="9">Direct (same network)</text>
  <rect x="20" y="596" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="613" text-anchor="middle" fill="#455a64" font-size="9">Air-gap support</text>
  <text x="380" y="613" text-anchor="middle" fill="#c62828" font-size="13" font-weight="700">✗</text>
  <text x="660" y="613" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <text x="130" y="639" text-anchor="middle" fill="#455a64" font-size="9">HA cluster option</text>
  <text x="380" y="639" text-anchor="middle" fill="#546e7a" font-size="9">Built-in (managed by VMware)</text>
  <text x="660" y="639" text-anchor="middle" fill="#546e7a" font-size="9">3-node cluster (manual)</text>
  <rect x="20" y="648" width="780" height="26" fill="#f7f9fb"/>
  <text x="130" y="665" text-anchor="middle" fill="#455a64" font-size="9">Upgrade responsibility</text>
  <text x="380" y="665" text-anchor="middle" fill="#546e7a" font-size="9">VMware (automated)</text>
  <text x="660" y="665" text-anchor="middle" fill="#546e7a" font-size="9">Customer (via LCM)</text>
  <text x="130" y="691" text-anchor="middle" fill="#455a64" font-size="9">Custom plugin support</text>
  <text x="380" y="691" text-anchor="middle" fill="#546e7a" font-size="9">Limited (cloud plugins)</text>
  <text x="660" y="691" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="700">✓</text>
  <line x1="20" y1="700" x2="800" y2="700" stroke="#dde2ec" stroke-width="1"/>
  <!-- FOOTER -->
  <rect x="0" y="720" width="820" height="30" fill="#1a2744"/>
  <text x="410" y="739" text-anchor="middle" fill="#7a8fbb" font-size="9">VMware Aria Automation Reference · Service Catalog · Orchestrator · IaaS · Cloud Endpoints</text>
</svg>
