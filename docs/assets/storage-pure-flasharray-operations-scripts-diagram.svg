<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Automation Architecture — FlashArray</text>
  
  <rect x="310" y="50" width="200" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="320" y="70" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Python / Bash / PowerShell / Ansible</text>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="310" y="110" width="200" height="140" rx="6" fill="#e8eaf6" stroke="#3949ab" />
  <text x="320" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Purity REST API (HTTPS/443)</text>
  <text x="320" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/api/2.x/arrays — array health + space</text>
  <text x="320" y="170" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/api/2.x/alerts — active alert list</text>
  <text x="320" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/api/2.x/drives — drive health</text>
  <text x="320" y="210" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/api/2.x/pods — ActiveCluster status</text>
  <text x="320" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">/api/2.x/volumes — volume inventory</text>
  
  <line x1="410" y1="250" x2="410" y2="270" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="310" y="270" width="200" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
  <text x="320" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">FlashArray (CT0 / CT1)</text>
  
  <rect x="0" y="360" width="820" height="40" fill="#f5f7fa" />
  <text x="10" y="385" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Automation Architecture</text>
</svg>