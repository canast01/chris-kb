<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="30" fill="#1a2744" />
  <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SnapCenter — Escalation Process</text>
  
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 1 — Open case at mysupport.netapp.com with support bundle attached</text>
  </g>
  
  <line x1="410" y1="90" x2="410" y2="110" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 110)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 2 — TSE (Technical Support Engineer) acknowledges and reviews the bundle</text>
    <text x="10" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">(P1: within 1 hour; P2: within 2 hours)</text>
  </g>
  
  <line x1="410" y1="170" x2="410" y2="190" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 190)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 3 — If no meaningful progress in 2 hours for P1 or 4 hours for P2:</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Reply in case: "Requesting escalation to SnapCenter Specialist or Escalation Engineer"</text>
    <text x="20" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ State: "[all backups failing / restore broken / 20 DBs unprotected]"</text>
  </g>
  
  <line x1="410" y1="270" x2="410" y2="290" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 290)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#fff8e1" stroke="#f57f17" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 4 — Application plugin specialist assigned if issue is in the SQL/Oracle/VMware plugin layer</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ They may request a TeamViewer/Teams session to the SnapCenter Server host</text>
    <text x="20" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Have SnapCenter GUI open and Windows Remote Desktop access ready</text>
  </g>
  
  <line x1="410" y1="370" x2="410" y2="390" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 390)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#fce4ec" stroke="#c62828" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 5 — If issue is a confirmed SnapCenter product bug:</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ TSE opens a bug ID and escalates to SnapCenter Engineering</text>
    <text x="20" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Engineering provides a targeted hotfix or recommends a patch build</text>
  </g>
  
  <line x1="410" y1="470" x2="410" y2="490" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <g transform="translate(10, 490)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" />
    <text x="10" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1a2744">Step 6 — For P1 unresolved after 2 hours:</text>
    <text x="20" y="45" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Call +1-888-463-8277 and request escalation to Support Duty Manager</text>
    <text x="20" y="65" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#37474f">→ Contact your NetApp Account Manager to engage executive escalation</text>
  </g>
  
  <rect x="0" y="560" width="820" height="30" fill="#f5f7fa" />
  <text x="10" y="580" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9e9e9e">Diagram Type: Escalation Process</text>
</svg>