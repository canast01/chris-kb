<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KB Search</title>
<style>
  :root {
    --primary: #1976d2;
    --primary-dark: #1565c0;
    --surface: #ffffff;
    --bg: #f5f5f5;
    --text: #212121;
    --muted: #757575;
    --border: #e0e0e0;
    --tag: #e3f2fd;
    --tag-text: #1565c0;
    --score-high: #2e7d32;
    --score-mid: #f57f17;
    --radius: 8px;
    --shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--primary);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }

  header h1 {
    color: #fff;
    font-size: 1.25rem;
    font-weight: 500;
    white-space: nowrap;
  }

  header a {
    color: rgba(255,255,255,.75);
    text-decoration: none;
    font-size: .85rem;
    margin-left: auto;
    white-space: nowrap;
  }

  header a:hover { color: #fff; }

  .search-wrap {
    background: var(--primary-dark);
    padding: 24px;
    display: flex;
    justify-content: center;
  }

  .search-box {
    position: relative;
    width: 100%;
    max-width: 720px;
  }

  .search-box input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    font-size: 1rem;
    border: none;
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    outline: none;
    box-shadow: 0 3px 12px rgba(0,0,0,.2);
  }

  .search-box input:focus {
    box-shadow: 0 3px 12px rgba(0,0,0,.3);
  }

  .search-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--primary);
    border: none;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    padding: 6px 10px;
    font-size: 1.1rem;
    line-height: 1;
    transition: background .15s;
  }

  .search-btn:hover { background: var(--primary-dark); }

  .spinner {
    display: none;
    position: absolute;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border: 2px solid #ddd;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }

  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .status {
    color: var(--muted);
    font-size: .85rem;
    margin-bottom: 16px;
    min-height: 20px;
  }

  .results { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: box-shadow .15s;
  }

  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    flex: 1;
    line-height: 1.4;
  }

  .card-title:hover { text-decoration: underline; }

  .score-badge {
    font-size: .7rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .score-high { background: #e8f5e9; color: var(--score-high); }
  .score-mid  { background: #fff8e1; color: var(--score-mid); }
  .score-low  { background: #f5f5f5; color: var(--muted); }

  .card-path {
    font-size: .75rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: "SFMono-Regular", Consolas, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-excerpt {
    font-size: .875rem;
    color: #424242;
    line-height: 1.6;
  }

  .card-footer {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    background: var(--tag);
    color: var(--tag-text);
    font-size: .7rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .open-link {
    margin-left: auto;
    font-size: .78rem;
    color: var(--primary);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .open-link:hover { text-decoration: underline; }

  .empty {
    text-align: center;
    padding: 48px 0;
    color: var(--muted);
  }

  .empty .icon { font-size: 3rem; margin-bottom: 12px; }

  .hint {
    margin-top: 32px;
    padding: 16px 20px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: .85rem;
    color: var(--muted);
    line-height: 1.7;
  }

  .hint strong { color: var(--text); }

  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e1e;
      --bg: #121212;
      --text: #e0e0e0;
      --muted: #9e9e9e;
      --border: #333;
      --tag: #1a237e;
      --tag-text: #90caf9;
    }
    .search-box input { background: #2a2a2a; color: #e0e0e0; }
    .card-excerpt { color: #bdbdbd; }
  }
</style>
</head>
<body>

<header>
  <h1>KB Search</h1>
  <a href="https://chrisanastasiadis.com" target="_blank">↗ Open KB</a>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input type="text" id="q" placeholder="Search the knowledge base…" autocomplete="off" autofocus>
    <div class="spinner" id="spinner"></div>
    <button class="search-btn" id="searchBtn" title="Search">⌕</button>
  </div>
</div>

<div class="main">
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
  <div class="hint" id="hint">
    <strong>Search tips:</strong> Use natural language — <em>"how to upgrade NSX-T"</em>,
    <em>"vSAN capacity planning"</em>, <em>"Pure FlashArray health check CLI"</em>,
    <em>"Nutanix Prism Central LDAP"</em>. Results are ranked by semantic similarity.
  </div>
</div>

<script>
const API = '/search';
let debounceTimer;

function scoreClass(s) {
  if (s >= 0.78) return 'score-high';
  if (s >= 0.65) return 'score-mid';
  return 'score-low';
}

function scoreLabel(s) {
  if (s >= 0.78) return '● High';
  if (s >= 0.65) return '◑ Good';
  return '○ Low';
}

function titleFromPath(path, header) {
  const parts = path.replace(/^docs\//, '').replace(/\/index\.md$/, '').replace(/\.md$/, '').split('/');
  const pageName = parts[parts.length - 1]
    .replace(/-/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
  if (header && header !== 'index') {
    return pageName + ' — ' + header.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  return pageName;
}

function sectionTag(path) {
  const parts = path.replace(/^docs\//, '').split('/');
  return parts[0].replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function render(results) {
  const container = document.getElementById('results');
  const hint = document.getElementById('hint');
  hint.style.display = 'none';

  if (!results.length) {
    container.innerHTML = '<div class="empty"><div class="icon">🔍</div>No results found. Try different keywords.</div>';
    return;
  }

  container.innerHTML = results.map(r => `
    <div class="card">
      <div class="card-header">
        <a class="card-title" href="${r.url}" target="_blank">${titleFromPath(r.path, r.header)}</a>
        <span class="score-badge ${scoreClass(r.score)}">${scoreLabel(r.score)}</span>
      </div>
      <div class="card-path">${r.path}</div>
      <div class="card-excerpt">${r.excerpt || '(no excerpt)'}</div>
      <div class="card-footer">
        <span class="tag">${sectionTag(r.path)}</span>
        <a class="open-link" href="${r.url}" target="_blank">Open page ↗</a>
      </div>
    </div>
  `).join('');
}

async function doSearch(q) {
  if (!q.trim()) return;
  const spinner = document.getElementById('spinner');
  const status  = document.getElementById('status');
  const hint    = document.getElementById('hint');
  hint.style.display = 'none';
  spinner.style.display = 'block';
  status.textContent = 'Searching…';

  try {
    const t0  = Date.now();
    const res = await fetch(`${API}?q=${encodeURIComponent(q)}&top_k=8`);
    const data = await res.json();
    const ms  = Date.now() - t0;
    const results = data.results || [];
    status.textContent = `${results.length} results · ${ms}ms`;
    render(results);
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    document.getElementById('results').innerHTML = '<div class="empty"><div class="icon">⚠️</div>API error — is the server running?</div>';
  } finally {
    spinner.style.display = 'none';
  }
}

document.getElementById('q').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  const val = e.target.value.trim();
  if (val.length < 3) return;
  debounceTimer = setTimeout(() => doSearch(val), 400);
});

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(debounceTimer); doSearch(e.target.value); }
});

document.getElementById('searchBtn').addEventListener('click', () => {
  doSearch(document.getElementById('q').value);
});
</script>
</body>
</html>
