ll="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="181" y="306.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="181" dy="0">Identify reverse zone</tspan><tspan x="181" dy="18.5">dig -x IP</tspan></text></g><g class="Uw=="><g class="shape" ><rect x="485" y="268" width="266" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="618" y="306.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="618" dy="0">Add PTR record to reverse zone</tspan><tspan x="618" dy="18.5">Verify delegated reverse zone</tspan></text></g><g class="RA=="><g class="shape" ><rect x="54" y="410" width="253" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180.5" y="448.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="180.5" dy="0">Record missing?</tspan><tspan x="180.5" dy="18.5">Check zone for A/AAAA record</tspan></text></g><g class="Rg=="><g class="shape" ><rect x="71" y="552" width="220" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="181" y="590.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="181" dy="0">Check zone file syntax</tspan><tspan x="181" dy="18.5">Reload zone: rndc reload</tspan></text></g><g class="Rw=="><g class="shape" ><rect x="67" y="694" width="228" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="181" y="732.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="181" dy="0">Record genuinely missing</tspan><tspan x="181" dy="18.5">Add DNS record</tspan></text></g><g class="SA=="><g class="shape" ><rect x="72" y="836" width="218" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="181" y="874.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="181" dy="0">Check DNS server health</tspan><tspan x="181" dy="18.5">systemctl status named</tspan></text></g><g class="Sg=="><g class="shape" ><rect x="0" y="978" width="361" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180.5" y="1016.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="180.5" dy="0">Start service</tspan><tspan x="180.5" dy="18.5">Check named.conf syntax: named-checkconf</tspan></text></g><g class="Sw=="><g class="shape" ><rect x="65" y="1120" width="231" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180.5" y="1158.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="180.5" dy="0">Check forwarder chain</tspan><tspan x="180.5" dy="18.5">dig @forwarder hostname</tspan></text></g><g class="TA=="><g class="shape" ><rect x="90" y="1262" width="181" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180.5" y="1300.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="180.5" dy="0">Verify UDP 53 open</tspan><tspan x="180.5" dy="18.5">nc -zu dnsserver 53</tspan></text></g><g class="Tg=="><g class="shape" ><rect x="70" y="1404" width="221" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180.5" y="1442.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="180.5" dy="0">Fix firewall rule</tspan><tspan x="180.5" dy="18.5">Check ACL on DNS server</tspan></text></g><g class="Tw=="><g class="shape" ><rect x="79" y="1546" width="203" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B