roke-width:2;" /></g><text x="477.5" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="477.5" dy="0">Dedicated T0 per tenant</tspan><tspan x="477.5" dy="18.5">Separate Edge cluster per tenant</tspan></text></g><g class="Rw=="><g class="shape" ><rect x="716" y="213" width="55" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="743.5" y="251.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">G</text></g><g class="SA=="><g class="shape" ><rect x="871" y="138" width="252" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="997" y="176.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="997" dy="0">Static routes on T0</tspan><tspan x="997" dy="18.5">No BGP · manual route config</tspan></text></g><g class="SQ=="><g class="shape" ><rect x="893" y="280" width="209" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="997.5" y="318.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="997.5" dy="0">eBGP on T0 uplinks</tspan><tspan x="997.5" dy="17.666667">Peer with ToR switches</tspan><tspan x="997.5" dy="17.666667">BFD for fast failover</tspan></text></g><g class="Sg=="><g class="shape" ><rect x="1223" y="296" width="52" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1249" y="334.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">J</text></g><g class="Sw=="><g class="shape" ><rect x="1408" y="138" width="171" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1493.5" y="176.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1493.5" dy="0">Edge VM — Small</tspan><tspan x="1493.5" dy="18.5">2 vCPU · 4 GB RAM</tspan></text></g><g class="TA=="><g class="shape" ><rect x="1404" y="280" width="179" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1493.5" y="318.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1493.5" dy="0">Edge VM — Large</tspan><tspan x="1493.5" dy="18.5">8 vCPU · 32 GB RAM</tspan></text></g><g class="TQ=="><g class="shape" ><rect x="1375" y="422" width="236" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1493" y="460.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1493" dy="0">Bare-metal Edge node</tspan><tspan x="1493" dy="18.5">DPDK · SR-IOV NIC required</tspan></text></g><g class="Tg=="><g class="shape" ><rect x="1711" y="359" width="54" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1738" y="397.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">N</text></g><g class="Tw=="><g class="shape" ><rect x="1878" y="264" width="224" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1990" y="302.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1990" dy="0">Active/Standby T0</tspan><tspan x="1990" dy="17.666667">One active Edge at a time</tspan><tspan x="1990" dy="17.666667">Fast failover via BFD</tspan></text></g><g class="UA=="><g class="shape" ><rect x="1865" y="422" width="250" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1990" y="460.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1990" dy="0">ECMP Active/Active</tspan><tspan x="1990" dy="17.666667">2–8 equal-cost paths</tspan><tspan x="1990" dy="17.666667">Requires BGP · stateless DFW</tspan></text></g><g class="QQ=="><g class="shape" ><rect x="0" y="339" width="239" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="119.5" y="377.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Start: Design NSX Topology</text></g><g class="KEIgLSZndDsgRClbMF0="><marker id="mk-d2-3833799864-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 149.5 41 C 260.700012 41 300.100006 41 340.5 41" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833799864-3488378134)" mask="url(#d2-3833799864)" /></g><g class="KEMgLSZndDsgRSlbMF0="><path d="M 149.310491 259.433794 C 260.700012 311.716003 304 325 360 325" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833799864-3488378134)" mask="url(#d2-3833799864)" /></g><g class="KEMgLSZndDsgRilbMF0="><path d="M 149.373082 235.262889 C 260.700012 193.591995 299 183 335 183" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833799864-3488378134)" mask="url(#d2-3833799864)" /></g><g class="KEUgLSZndDsgRylbMF0="><path d="M 593 325 C 651 325 676 314.799988 713.199714 276.856291" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833799864-3488378134)" mask="url(#d2-3833799864)" /></g><g class="KEYgLSZndDsgRylbMF0="><path d="M 618 183 C 656 183 676 191.199997 712.906929 221.463682" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833799864-3488378134)" mask="url(#d2-3833799864)" /></g><g class="KEcgL