site_name: Chris KB
site_description: Christos Anastasiadis — Infrastructure Engineering Knowledge Base
site_url: https://chrisanastasiadis.com
use_directory_urls: true
repo_url: https://github.com/canast01/chris-kb
repo_name: canast01/chris-kb
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  palette:
    - scheme: default
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.top
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - stylesheets/extra.css

not_in_nav: |
  offline/index.md
  site-quality.md
  usage-metrics.md
  stats/index.md
  includes/abbreviations.md

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences:
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - hooks/nav_titles.py
  - hooks/schema_org.py

plugins:
  - search:
      lang: en
      separator: '[\s\-\_]+'
  - tags:
  - social:
      cards_layout_options:
        background_color: "#1a1a2e"
        color: "#e2e8f0"
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - kroki:
      server_url: https://kroki.io
      fence_prefix: ""
      enable_mermaid: true
  - rss:
      feed_title: Chris KB — What's New
      feed_description: Recent additions and updates to the Infrastructure Engineering Knowledge Base.
      length: 30
      categories:
        - tags
      file_types:
        - svg

copyright: "© Christos Anastasiadis"

extra:
  generator: false

validation:
  omitted_files: ignore
