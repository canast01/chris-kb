site_name: Chris KB
site_description: Christos Anastasiadis — Infrastructure Engineering Knowledge Base
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  palette:
    - scheme: default
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Platforms:
      - Virtualization: virtualization/index.md
      - Storage: storage/index.md
      - SAN: san/index.md
      - Compute: compute/index.md
      - Cloud: cloud/index.md
      - Networking: networking/index.md
  - Site Map: site-map.md
  - About: about.html

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details

plugins:
  - search:
      lang: en
      separator: '[\s\-\_]+'

copyright: "© Christos Anastasiadis"

extra:
  generator: false

validation:
  omitted_files: ignore
