site_name: Chris KB
site_description: Christos Anastasiadis — Infrastructure Engineering Knowledge Base
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  palette:
    - scheme: default
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - stylesheets/extra.css

not_in_nav: |
  offline/index.md
  site-quality.md
  usage-metrics.md
  stats/index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details

hooks:
  - hooks/nav_titles.py

plugins:
  - search:
      lang: en
      separator: '[\s\-\_]+'

copyright: "© Christos Anastasiadis"

extra:
  generator: false

validation:
  omitted_files: ignore
