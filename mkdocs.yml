markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details

plugins:
  - search:
      lang: en
      separator: '[\s\-\_]+'

copyright: "© Christos Anastasiadis"

extra:
  generator: false

validation:
