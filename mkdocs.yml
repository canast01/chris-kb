site_name: Chris KB
site_description: Christos Anastasiadis — Infrastructure Engineering Knowledge Base
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Platforms:
      - Virtualization: virtualization/index.md
      - Storage: storage/index.md
      - SAN: san/index.md
      - Compute: compute/index.md
      - Cloud: cloud/index.md
      - Networking: networking/index.md
  - Operations:
      - Automation: automation/index.md
      - Security: security/index.md
      - Disaster Recovery: disaster-recovery/index.md
      - Data Protection: data-protection/index.md
      - Change Management: change-management/index.md
      - Runbooks: runbooks/index.md
      - Backup: backup/index.md
  - Reference:
      - Tools: tools/index.md
      - Inventory: inventory/index.md
      - Database: database/index.md
      - Performance: performance/index.md
  - Certifications:
      - Overview: certifications/index.md
      - AWS:
          - AWS: certifications/aws/index.md
          - Cloud Practitioner: certifications/aws/cloud-practitioner/index.md
          - Practice Notes: certifications/aws/practice-notes/index.md
          - Review Plan: certifications/aws/review-plan/index.md
          - Weak Areas: certifications/aws/weak-areas/index.md
          - Exam Tracking: certifications/aws/exam-tracking/index.md
      - Azure:
          - Azure: certifications/azure/index.md
          - Practice Notes: certifications/azure/practice-notes/index.md
          - Review Plan: certifications/azure/review-plan/index.md
          - Weak Areas: certifications/azure/weak-areas/index.md
          - Exam Tracking: certifications/azure/exam-tracking/index.md
      - VMware:
          - VMware: certifications/vmware/index.md
          - Practice Notes: certifications/vmware/practice-notes/index.md
          - Review Plan: certifications/vmware/review-plan/index.md
          - Weak Areas: certifications/vmware/weak-areas/index.md
          - Exam Tracking: certifications/vmware/exam-tracking/index.md
      - SAN:
          - SAN: certifications/san/index.md
          - Practice Notes: certifications/san/practice-notes/index.md
          - Review Plan: certifications/san/review-plan/index.md
      - Storage:
          - Storage: certifications/storage/index.md
          - Practice Notes: certifications/storage/practice-notes/index.md
          - Review Plan: certifications/storage/review-plan/index.md
      - AI:
          - AI: certifications/ai/index.md
          - Practice Notes: certifications/ai/practice-notes/index.md
          - Review Plan: certifications/ai/review-plan/index.md
  - Site Map: site-map.md
  - Site Admin:
      - Site Quality: site-quality.md
      - Usage Metrics: usage-metrics.md
  - About: about.html

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details

plugins:
  - search:
      lang: en
      separator: '[\s\-\_]+'

copyright: "© Christos Anastasiadis"

extra:
  generator: false

validation:
  omitted_files: ignore
