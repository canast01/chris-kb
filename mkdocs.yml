site_name: Chris KB
site_description: Christos Anastasiadis — Infrastructure Engineering Knowledge Base
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css
  - stylesheets/extra.css

